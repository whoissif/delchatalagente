003c/h3\u003e\n\u003cp\u003eUn harness tiene seis piezas. Las vais a reconocer todas en la pantalla dentro de un rato.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePieza\u003c/th\u003e\n\u003cth\u003eQué es, en palabras llanas\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eModelo\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEl motor. El que «piensa» y decide.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eHerramientas\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eLas manos. Lo que puede hacer de verdad.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eBucle\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEl ritmo de trabajo: piensa, actúa, mira el resultado, repite.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eContexto\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eLa mesa de trabajo. Todo lo que tiene delante ahora mismo.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003ePermisos\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eLos frenos. Qué puede hacer sin preguntar y qué no.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eInterfaz\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEl salpicadero. Donde tú ves lo que está pasando.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eEl bucle, despacio, porque es lo que más se malinterpreta.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEl modelo no ejecuta nada. El modelo propone.\u003c/strong\u003e Piensa «para resumir este informe tengo que leerlo», y pide al harness que lea el archivo. El harness lo lee y le devuelve el contenido. El modelo lo lee, piensa el resumen, y pide que se escriba un archivo nuevo. Y así. \u003cstrong\u003ePiensa, actúa, observa, repite.\u003c/strong\u003e Cien veces si hace falta.\u003c/p\u003e\n\u003cp\u003e¿Por qué importa? Porque significa que \u003cstrong\u003eel harness está en medio de todo\u003c/strong\u003e. Es quien decide qué se le permite al modelo, y es quien ejecuta. El modelo no es el que toca tu ordenador: el que toca tu ordenador es el harness, siguiendo las órdenes de un modelo que nunca ve tu disco directamente salvo por lo que el harness le enseña.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLas herramientas.\u003c/strong\u003e No hace falta memorizar la lista; lo que hace falta es saber que existe y saber mirarla:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLeer archivos del espacio de trabajo.\u003c/li\u003e\n\u003cli\u003eEscribir y modificar archivos.\u003c/li\u003e\n\u003cli\u003eEjecutar comandos en la terminal (esta es la más potente y la que más respeto merece).\u003c/li\u003e\n\u003cli\u003eBuscar y leer en internet.\u003c/li\u003e\n\u003cli\u003eLanzar tareas en segundo plano mientras sigue con otra cosa.\u003c/li\u003e\n\u003cli\u003ePreguntarte a ti cuando necesita decidir algo.\u003c/li\u003e\n\u003cli\u003eDelegar una parte del trabajo en otro agente.\u003c/li\u003e\n\u003cli\u003eLlevar una lista de tareas y marcar lo que va terminando.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEl contexto: la mesa de trabajo.\u003c/strong\u003e Aquí usa una imagen física: \u003cstrong\u003eimagina una mesa. Todo lo que el agente sabe en este momento está encima de la mesa: tu petición, los archivos que ha leído, lo que ha ido averiguando.\u003c/strong\u003e La mesa tiene un tamaño limitado. Cuando se llena de papeles, alguien tiene que recoger: se resume lo importante y se tira el resto. \u003cstrong\u003eEso significa que en tareas muy largas el agente puede «olvidar» detalles del principio.\u003c/strong\u003e No es que sea tonto, es que ya no están en la mesa.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eConsecuencia práctica que deben llevarse:\u003c/strong\u003e una tarea larga y enrevesada es mejor partirla en dos sesiones que forzarla en una.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLos permisos, solo el titular.\u003c/strong\u003e \u003cstrong\u003eEl becario trabaja dentro de una sala. Dentro hace lo que quiera. Para salir de la sala, te pide permiso.\u003c/strong\u003e Eso es todo por ahora; lo vais a provocar vosotros en el bloque 4.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLa interfaz.\u003c/strong\u003e Insiste en esto porque es donde más se aprovecha la herramienta: \u003cstrong\u003ela interfaz no te enseña solo la respuesta final, te enseña los pasos.\u003c/strong\u003e Cada vez que el agente usa una herramienta, lo ves. Eso es tu ventana para darte cuenta de que va por donde no debe. \u003cstrong\u003eSi no miras los pasos, te enteras de los errores cuando ya están hechos.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"demo-del-instructor-6-7-min\"\u003eDemo del instructor (6-7 min)\u003c/h3\u003e\n\u003cp\u003eHazlo tú, en pantalla grande, narrando. No lo expliques antes: que lo vean y luego lo comentáis.\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eAbre el harness en la carpeta de práctica de ejemplo.\u003c/li\u003e\n\u003cli\u003eEscribe una petición de dos o tres pasos, por ejemplo: \u003cem\u003e«Mira qué hay en esta carpeta y hazme un índice de los archivos, agrupados por tipo, en un archivo llamado INDICE.md.»\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMientras trabaja, ve señalando en voz alta:\u003c/strong\u003e «está mirando qué hay — esta es la herramienta de leer», «ahora está escribiendo el archivo», «está comprobando que se ha escrito bien».\u003c/li\u003e\n\u003cli\u003eAl terminar, abre el \u003ccode\u003eINDICE.md\u003c/code\u003e delante de todos. Se ha creado un archivo que no existía. Ese es el momento «ajá» de este bloque: \u003cstrong\u003e«Nadie ha copiado ni pegado nada. Mirad la carpeta.»\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"senales-de-que-ha-funcionado-2\"\u003eSeñales de que ha funcionado\u003c/h3\u003e\n\u003cp\u003ePreguntan por qué ha usado esa herramienta y no otra, o piden que lo repitas. Anota la duda y respóndela en el bloque 5.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"bloque-3-practica-1-primer-arranque-y-primer-encargo-20-min\"\u003eBloque 3 — Práctica 1: Primer arranque y primer encargo (20 min)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e que cada alumno tenga el harness funcionando y haya completado un encargo de principio a fin.\u003c/p\u003e\n\u003cp\u003eTrabaja con \u003ccode\u003e03_laboratorio.md\u003c/code\u003e delante. Reparte el documento o pide que lo abran.\u003c/p\u003e\n\u003ch3 id=\"secuencia\"\u003eSecuencia\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eDemuestra el arranque completo en tu portátil (4 min),\u003c/strong\u003e narrando cada paso: abrir la terminal, comprobar Node con \u003ccode\u003enode -v\u003c/code\u003e, arrancar con \u003ccode\u003enpx @deepseek-ai/dsh web\u003c/code\u003e, ver la dirección en pantalla, abrir el navegador, configurar el modelo en Ajustes → Modelos con la clave de API, elegir el espacio de trabajo, escribir el primer mensaje.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTodos a la vez (12 min).\u003c/strong\u003e Tú circulas. No te quedes con el primero que levante la mano: los que ya lo tienen, que ayuden al de al lado. Un alumno que explica arranca dos aprendizajes.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePuesta en común (4 min).\u003c/strong\u003e Pregunta al grupo: \u003cem\u003e«¿Qué herramientas ha usado vuestro agente para hacer el resumen?»\u003c/em\u003e. Que las nombren ellos.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"los-dos-tropiezos-que-vas-a-ver-seguro\"\u003eLos dos tropiezos que vas a ver seguro\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eEl cuadro de escribir mensajes está deshabilitado.\u003c/strong\u003e Casi siempre es que no han elegido espacio de trabajo. Antes de tocar nada, pregunta: \u003cem\u003e«¿Has elegido una carpeta de trabajo?»\u003c/em\u003e \u003cstrong\u003eHasta que no eliges espacio de trabajo, el agente no tiene dónde trabajar y no te deja escribir.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo hay clave de API o no es válida.\u003c/strong\u003e Ten la tuya de reserva. Y aprovecha para explicar que \u003cstrong\u003ela clave es como la tarjeta del motor: sin ella no arranca, y el uso se paga\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"que-decir-mientras-circulas\"\u003eQué decir mientras circulas\u003c/h3\u003e\n\u003cp\u003eNada de resolver por ellos con las manos en su teclado. Señala el botón y deja que lo pulse el alumno. \u003cstrong\u003eEl objetivo es que sepan hacerlo sin ti el lunes.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"senal-de-que-ha-funcionado\"\u003eSeñal de que ha funcionado\u003c/h3\u003e\n\u003cp\u003eTodos tienen una sesión con al menos un encargo terminado y un archivo nuevo en su carpeta.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"descanso-10-min\"\u003eDescanso (10 min)\u003c/h2\u003e\n\u003cp\u003eAntes de salir, avisa: \u003cstrong\u003e«Al volver vemos lo más importante de todo: los frenos. Y los vais a tocar vosotros.»\u003c/strong\u003e Que nadie se vaya pensando que lo bueno ya ha pasado.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"bloque-4-permisos-sandbox-y-aprobaciones-30-min\"\u003eBloque 4 — Permisos, sandbox y aprobaciones (30 min)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e que entiendan, y hayan sentido, qué se le permite al agente y quién decide.\u003c/p\u003e\n\u003cp\u003eEste bloque es la razón por la que el seminario existe. Los alumnos ya saben que un agente puede hacer cosas. Ahora tienen que aprender a dormir tranquilos mientras las hace.\u003c/p\u003e\n\u003ch3 id=\"parte-1-los-tres-conceptos-8-min\"\u003eParte 1 — Los tres conceptos (8 min)\u003c/h3\u003e\n\u003cp\u003eSon tres cosas distintas que la gente mezcla siempre. Escríbelas separadas en la pizarra:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eConcepto\u003c/th\u003e\n\u003cth\u003eQué es\u003c/th\u003e\n\u003cth\u003eAnalogía\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eSandbox\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eLa zona donde el agente puede moverse: normalmente, la carpeta de trabajo que elegiste.\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eLa sala donde trabaja el becario.\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003ePolítica de permisos\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEl ajuste general: qué se permite sin preguntar y qué no.\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eEl reglamento de la sala.\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eAprobación\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEl aviso puntual que aparece cuando algo se sale de lo permitido.\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eEl «¿seguro?» en la puerta.\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eDentro de la sala, el becario hace lo que quiera. Para salir de la sala, te pide permiso.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eY añade la pieza que casi nadie espera: \u003cstrong\u003etú puedes elegir el tamaño de la sala.\u003c/strong\u003e Cuanto más pequeña y más específica sea la carpeta de trabajo, menos avisos y menos riesgo. Esa decisión es tuya, y es la más importante que vas a tomar hoy.\u003c/p\u003e\n\u003ch3 id=\"parte-2-practica-2-provocar-una-aprobacion-10-min\"\u003eParte 2 — Práctica 2: Provocar una aprobación (10 min)\u003c/h3\u003e\n\u003cp\u003eQue lo hagan todos a la vez, con instrucciones exactas del laboratorio. El objetivo es \u003cstrong\u003ever el aviso y entender qué está pidiendo\u003c/strong\u003e, no aprobarlo rápido.\u003c/p\u003e\n\u003cp\u003eCuando aparezca el aviso, para la clase entera y léelo en voz alta, tú. Y lanza las tres preguntas:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e«¿Qué os está pidiendo exactamente?»\u003c/strong\u003e — Leer un archivo de fuera de la carpeta. Escribir en el escritorio. Ejecutar un comando. Que lo digan con sus palabras.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e«¿Qué pasaría si decís que sí?»\u003c/strong\u003e — Se hace, de verdad, ahora. No es una simulación ni una confirmación de cortesía.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e«¿Se puede acotar?»\u003c/strong\u003e — Casi siempre sí: pedirle que trabaje solo en tal carpeta, o que te enseñe antes lo que va a hacer.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eEl momento clave: «Permitir una vez» es solo esa vez.\u003c/strong\u003e No es un permiso permanente y no se recuerda. Di la frase completa:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e«Permitir una vez es permitir esa vez. La próxima te vuelve a preguntar. Es incómodo a propósito: ese pequeño fastidio es lo que te obliga a pensar si de verdad quieres que salga de la sala.»\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eAquí aparecen dos comportamientos que hay que desactivar ya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAprobar por inercia.\u003c/strong\u003e Si te descubres pulsando «permitir» sin leer, para. Estás firmando sin leer.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSubir el nivel de permiso para que deje de preguntar.\u003c/strong\u003e Es como quitar el freno porque el coche hace ruido al frenar. Si algo se repite mucho, la solución no es aprobar cien avisos: \u003cstrong\u003ees mover el trabajo dentro de la carpeta de trabajo\u003c/strong\u003e, donde no hace falta permiso.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eRegla de oro, y que la copien:\u003c/strong\u003e \u003cstrong\u003esi no entiendes qué te está pidiendo, no lo apruebes. Pídele que te lo explique con palabras, o que te diga qué va a tocar antes de tocarlo.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"parte-3-practica-3-cambiar-de-politica-8-min\"\u003eParte 3 — Práctica 3: Cambiar de política (8 min)\u003c/h3\u003e\n\u003cp\u003eLa misma tarea que antes, pero hecha dentro de la carpeta de trabajo. Todos la repiten y observan: \u003cstrong\u003eya no pregunta nada.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eQue saquen ellos la conclusión. Si no sale, dila tú:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e«El agente no es más listo ni más tonto. Habéis cambiado dónde trabaja, y con eso han desaparecido los avisos y ha bajado el riesgo. Diseñar bien la carpeta es la mitad del trabajo seguro.»\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"parte-4-cierre-del-bloque-4-min\"\u003eParte 4 — Cierre del bloque (4 min)\u003c/h3\u003e\n\u003cp\u003eTres ideas para que se queden:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eEl sandbox reduce el riesgo, no lo elimina.\u003c/strong\u003e Todo lo que está dentro de la sala autorizada, el agente lo puede tocar. Si dentro de la sala hay algo que no debería tocarse, el problema es lo que hay en la sala, no el agente.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLa aprobación es tuya, no del sistema.\u003c/strong\u003e El aviso no decide: te informa. La responsabilidad es de quien pulsa.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCopia de seguridad antes de empezar.\u003c/strong\u003e La regla es aburrida y por eso se salta: \u003cstrong\u003esi no tienes copia de algo, no lo pongas en la carpeta de trabajo.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"senales-de-que-ha-funcionado-3\"\u003eSeñales de que ha funcionado\u003c/h3\u003e\n\u003cp\u003eSabrán decirte, sin mirar, la diferencia entre sandbox y aprobación, y por qué «permitir una vez» no vale para siempre.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"bloque-5-herramientas-contexto-y-memoria-22-min\"\u003eBloque 5 — Herramientas, contexto y memoria (22 min)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e que sepan qué puede hacer su agente, qué hacer cuando la conversación se degrada, y cómo no repetirse.\u003c/p\u003e\n\u003ch3 id=\"parte-1-las-herramientas-con-calma-5-min\"\u003eParte 1 — Las herramientas, con calma (5 min)\u003c/h3\u003e\n\u003cp\u003eVuelve a la lista del bloque 2, ahora mirando la pantalla real: dónde se ve qué herramientas hay disponibles y qué está usando en cada paso. \u003cstrong\u003eLa conclusión que buscamos: no hace falta memorizar nada, hace falta mirar los pasos.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eY un aviso honesto: \u003cstrong\u003ela herramienta de terminal es la más potente de todas.\u003c/strong\u003e Es la que permite instalar programas, mover cosas y deshacer con la misma facilidad con la que rompe. Cuando el agente use la terminal, mira más despacio que cuando lee un archivo.\u003c/p\u003e\n\u003ch3 id=\"parte-2-el-contexto-en-la-practica-5-min\"\u003eParte 2 — El contexto, en la práctica (5 min)\u003c/h3\u003e\n\u003cp\u003eRetoma la mesa de trabajo. Señales de que se está llenando: el agente repite cosas que ya hizo, olvida instrucciones que le diste al principio, o da vueltas sobre el mismo problema. Qué se hace:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCerrar y abrir una conversación nueva\u003c/strong\u003e, diciendo en el primer mensaje lo que ya está hecho y dónde. Es más rápido que insistir.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDividir el trabajo\u003c/strong\u003e en trozos con un resultado claro cada uno.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo arrastrar\u003c/strong\u003e una conversación larga para una tarea nueva y distinta. Cada tarea, su conversación.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"parte-3-memoria-lo-que-sobrevive-5-min\"\u003eParte 3 — Memoria: lo que sobrevive (5 min)\u003c/h3\u003e\n\u003cp\u003eDos niveles, y la diferencia importa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eLa conversación\u003c/strong\u003e — se acaba. Si cierras y abres otra, el agente no se acuerda de nada.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLo permanente\u003c/strong\u003e — sobrevive a todo. Hay dos formas: las \u003cstrong\u003enotas\u003c/strong\u003e (archivo \u003ccode\u003eAGENTS.md\u003c/code\u003e) y los \u003cstrong\u003eprocedimientos guardados\u003c/strong\u003e (skills).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e\u003ccode\u003eAGENTS.md\u003c/code\u003e son las notas que dejas al becario antes de que empiece.\u003c/strong\u003e Si tienes una preferencia que se repite — «responde en español», «no toques la carpeta de facturas», «los informes van siempre en la carpeta \u003ccode\u003einformes\u003c/code\u003e» — no la repitas cada día: escríbela una vez. Hay notas \u003cstrong\u003eglobales\u003c/strong\u003e (para todos tus proyectos) y notas \u003cstrong\u003epor proyecto\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLas skills son procedimientos guardados, como recetas de cocina.\u003c/strong\u003e Cuando repites una tarea siempre igual, la escribes una vez con sus pasos y el agente la sigue cuando le dices «hazme el informe mensual». En este ordenador ya hay una de ejemplo: la de precios de gasolineras.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLección para que se la lleven:\u003c/strong\u003e \u003cstrong\u003esi te descubres explicando lo mismo por tercera vez, el problema no es el agente: es que no le has dejado notas.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"parte-4-practica-4-ensenarle-un-procedimiento-5-min\"\u003eParte 4 — Práctica 4: Enseñarle un procedimiento (5 min)\u003c/h3\u003e\n\u003cp\u003eQue cada alumno deje una instrucción permanente (una nota o una skill sencilla) y \u003cstrong\u003ecompruebe en una conversación nueva que se respeta\u003c/strong\u003e. El detalle que hay que subrayar: \u003cstrong\u003ehay que probarlo en una conversación nueva.\u003c/strong\u003e En la misma conversación no demuestra nada, porque se acuerda por el contexto.\u003c/p\u003e\n\u003ch3 id=\"parte-5-mcp-si-hay-tiempo-2-3-min\"\u003eParte 5 — MCP, si hay tiempo (2-3 min)\u003c/h3\u003e\n\u003cp\u003eSolo el concepto, sin tecnicismos: \u003cstrong\u003eMCP es un enchufe estándar, como el USB.\u003c/strong\u003e Existen muchísimos programas que ya saben hacer cosas — GitHub, bases de datos, gestores de incidencias, servicios de memoria — y gracias a ese enchufe común se pueden conectar al agente y aparecen como herramientas nuevas. \u003cstrong\u003eCuándo merece la pena: cuando la información que necesitas no está en archivos, sino en otro programa.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAviso de seguridad, obligatorio: \u003cstrong\u003ecada enchufe es una conexión nueva a tus cosas. Instalar un plugin o conectar un servidor es una decisión de confianza, igual que instalar un programa.\u003c/strong\u003e Si vas a conectar algo que toca datos reales de la empresa, consúltalo antes.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"bloque-6-practica-5-encargo-integrador-13-min\"\u003eBloque 6 — Práctica 5: Encargo integrador (13 min)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e que hagan solos un encargo completo, y sobre todo que \u003cstrong\u003everifiquen\u003c/strong\u003e.\u003c/p\u003e\n\u003ch3 id=\"que-decir-3\"\u003eQué decir\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eAquí ya no hay instrucciones mías. Piensa en una tarea pequeña y real tuya, que tenga que ver con archivos, y que puedas comprobar en dos minutos.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"el-patron-de-un-buen-encargo\"\u003eEl patrón de un buen encargo\u003c/h3\u003e\n\u003cp\u003eEscríbelo en la pizarra y que lo copien; es lo más útil que se llevan hoy:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e1. Qué quiero\u003c/strong\u003e (el objetivo, con un resultado concreto).\n\u003cstrong\u003e2. Dónde\u003c/strong\u003e (la carpeta exacta).\n\u003cstrong\u003e3. Qué NO tocar\u003c/strong\u003e (los límites, dichos explícitamente).\n\u003cstrong\u003e4. Cómo sabré que está bien\u003c/strong\u003e (tu criterio de éxito).\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eEjemplo completo, para que se vea el patrón entero:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e«En la carpeta \u003ccode\u003epractica/informes\u003c/code\u003e hay cinco informes en texto. Léelos y créame \u003ccode\u003eresumen_general.md\u003c/code\u003e con una tabla de tres columnas: tema, conclusión y nivel de urgencia. \u003cstrong\u003eNo modifiques ninguno de los cinco archivos originales.\u003c/strong\u003e Al terminar, dime qué archivos has leído y cuántas filas tiene la tabla.»\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"verificacion-obligatoria\"\u003eVerificación obligatoria\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eY ahora la parte que la gente se salta: abrid el resultado y comprobadlo.\u003c/strong\u003e No vale «tiene buena pinta». Cuenta las filas, mira si los cinco informes están, comprueba que los originales siguen intactos.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e«El agente no firma su trabajo. Lo firmas tú cuando dices que está bien.»\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"puesta-en-comun-si-vas-sobrado\"\u003ePuesta en común (si vas sobrado)\u003c/h3\u003e\n\u003cp\u003eTres voluntarios, un minuto cada uno: qué pidieron, qué les devolvió el agente y \u003cstrong\u003equé comprobaron\u003c/strong\u003e. Insiste en la tercera parte: lo interesante es lo que revisaron, no lo que pidieron.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"bloque-7-cierre-limites-y-evaluacion-10-min\"\u003eBloque 7 — Cierre, límites y evaluación (10 min)\u003c/h2\u003e\n\u003ch3 id=\"los-tres-errores-que-va-a-cometer-todo-el-mundo\"\u003eLos tres errores que va a cometer todo el mundo\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eAprobar por inercia.\u003c/strong\u003e El aviso se convierte en un clic automático y deja de protegerte.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConfiar sin verificar.\u003c/strong\u003e El resultado llega bien maquetado y con seguridad en el tono. Eso no es prueba de que sea correcto.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDarle lo que no debería ver.\u003c/strong\u003e Si arrastras una carpeta con datos de clientes «para probar», ya está dentro de la sala.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"limites-dichos-con-honestidad\"\u003eLímites, dichos con honestidad\u003c/h3\u003e\n\u003cp\u003eNo endulces esto. Es información que protege a la gente:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eEs software experimental, en fase de vistas previas de desarrollo.\u003c/strong\u003e Cambia rápido y habrá novedades que rompan lo anterior. No construyas nada crítico encima sin plan B.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo ha pasado una auditoría de seguridad.\u003c/strong\u003e No está pensado para ser seguro de serie.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEl sandbox y las aprobaciones reducen el riesgo, pero no garantizan aislamiento\u003c/strong\u003e y \u003cstrong\u003eno deben ser tu único control de seguridad\u003c/strong\u003e. Si el trabajo es delicado, la recomendación oficial es usar una máquina virtual o un entorno dedicado y desechable.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLo que sí está en tu mano:\u003c/strong\u003e trabajar con el mínimo privilegio necesario, tener copias de seguridad de lo que el agente puede tocar, no exponer credenciales, y revisar plugins y comandos antes de permitirlos.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"las-cuatro-reglas-para-el-lunes\"\u003eLas cuatro reglas para el lunes\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eCopia de seguridad\u003c/strong\u003e de la carpeta antes de empezar.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUna carpeta específica\u003c/strong\u003e para cada trabajo. Ni el escritorio entero ni, mucho menos, todo el disco.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNada confidencial ni sensible\u003c/strong\u003e en la carpeta de trabajo, salvo que aceptes el riesgo conscientemente.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRevisa antes de aprobar y verifica al terminar.\u003c/strong\u003e Siempre. Las dos veces.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"evaluacion-y-cierre-3-4-min\"\u003eEvaluación y cierre (3-4 min)\u003c/h3\u003e\n\u003cp\u003eReparte el cuestionario final de \u003ccode\u003e06_evaluacion.md\u003c/code\u003e y la encuesta de satisfacción. Recuerda que no es un examen.\u003c/p\u003e\n\u003cp\u003eCierra con dónde seguir y con la frase que resume el día:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e«Hoy no habéis aprendido a usar un programa. Habéis aprendido a dirigir a alguien que trabaja muy rápido, que no sabe lo que no sabe, y que tiene acceso a vuestros archivos. La herramienta os va a servir; los frenos os van a proteger.»\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eMaterial para seguir: el manual interactivo de DSH, el glosario y la chuleta de \u003ccode\u003e05_glosario_chuleta.md\u003c/code\u003e, y la documentación oficial del proyecto.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"anexo-chuleta-de-emergencia-del-instructor\"\u003eAnexo — Chuleta de emergencia del instructor\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePasa esto\u003c/th\u003e\n\u003cth\u003eDi esto\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eUn alumno no arranca y se queda atrás\u003c/td\u003e\n\u003ctd\u003e«Sigue conmigo sin arrancar, ahora paso y lo vemos. Mientras, apunta en qué paso se ha quedado.»\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLa interfaz va lenta y el grupo se impacienta\u003c/td\u003e\n\u003ctd\u003e«Está pensando y trabajando. Mirad el panel de pasos: eso es el agente haciendo su trabajo.»\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAlguien aprueba un aviso sin leer\u003c/td\u003e\n\u003ctd\u003e«Para. Léelo en voz alta. ¿Qué le estás dejando hacer?»\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl agente hace algo mal delante de todos\u003c/td\u003e\n\u003ctd\u003e«Perfecto, esto es material didáctico. Mirad los pasos y decidme en cuál se ha ido.»\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePreguntan algo que no sabes\u003c/td\u003e\n\u003ctd\u003e«No lo sé, lo apunto y te lo contesto.» Apúntalo de verdad.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSe cae la red\u003c/td\u003e\n\u003ctd\u003e«Pasamos al plan B: lo hago yo en pantalla y vosotros vais siguiendo.»\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAlguien quiere subir los permisos al máximo\u003c/td\u003e\n\u003ctd\u003e«Antes de eso, dime qué tarea es. Casi siempre se arregla moviendo la carpeta.»\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl grupo va muy rápido\u003c/td\u003e\n\u003ctd\u003e«Vale, entonces me adelanto: ¿qué creéis que pasa si dos personas trabajan en la misma carpeta a la vez?»\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n","texto":"23 min de lectura Documento 01 Guion del instructor — Del chat al agente: qué es un harness y cómo se usa Duración: 150 minutos de núcleo, ampliable a 180. Audiencia: usuarios corrientes de chat/bot. No programadores. Formato: sesión práctica. Cada alumno trabaja en su portátil. Herramienta: DeepSeek Harness ( dsh ), arrancado con npx @deepseek-ai/dsh web . Este guion está pensado para leerse en diagonal mientras se imparte. Lo que está en negrita dentro de las secciones «Qué decir» son las frases que conviene decir casi literalmente: son las que sostienen las analogías y evitan que el grupo se pierda. 1. Mapa de la sesión # Bloque Min. Acum. Tipo 0 Bienvenida, diagnóstico y promesa 8 8 Charla 1 Del chat al agente 17 25 Charla 2 Anatomía de un harness 20 45 Charla + demo 3 Práctica 1 — Primer arranque y primer encargo 20 65 Práctica — Descanso 10 75 — 4 Permisos, sandbox y aprobaciones (Prácticas 2 y 3) 30 105 Práctica 5 Herramientas, contexto y memoria (Práctica 4) 22 127 Práctica 6 Práctica 5 — Encargo integrador 13 140 Práctica 7 Cierre, límites y evaluación 10 150 Charla El bloque 4 es el corazón del seminario. Si vas mal de tiempo, recorta de cualquier sitio menos de ahí. Si vas con retraso Orden de recorte, de menos a más doloroso: Bloque 5: deja MCP para una diapositiva y una frase, sin demo. Bloque 6: reduce a un encargo guiado hecho por todos a la vez con el instructor. Bloque 2: acorta la demo del instructor a 3 minutos mostrando solo el panel de pasos. Nunca recortes: bloque 4 completo, la Práctica 1 y el cierre. Si vas sobrado (hasta 180) Orden de ampliación: Bloque 6: de 13 a 25 minutos, con puesta en común de tres voluntarios. Bloque 5: MCP con una demo real de conexión. Bloque 1: añade dos ejemplos más de tareas que el grupo reconozca. Añade 5-10 minutos de preguntas al final. 2. Materiales que hay que tener listos Proyector y letra grande en el terminal y en el navegador. La mitad del grupo no verá una terminal a tamaño normal. Una carpeta de práctica de ejemplo , sin datos sensibles, con 5-10 archivos variados (un texto, una hoja de cálculo, alguna imagen) y sus subcarpetas. Copia de seguridad de esa carpeta, en otro sitio. El agente va a modificarla delante de todos. Tu propia clave de API de reserva por si algún alumno no la consigue. El resto de documentos del paquete: 03_laboratorio.md (para los alumnos), 04_soluciones_y_errores.md (para ti, abierto en otra ventana), 05_glosario_chuleta.md , 06_evaluacion.md . Regletas y alargadores. Doce portátiles no caben en cuatro enchufes. Bloque 0 — Bienvenida, diagnóstico y promesa (8 min) Objetivo: bajar la ansiedad, saber de dónde parte el grupo y dejar claro qué se llevan. Qué decir Preséntate en un minuto y di a qué te dedicas con los agentes. Que se note que lo usas, no que lo has leído. Pregunta a mano alzada, tres preguntas rápidas: «¿Quién usa un chat de IA a diario?» , «¿Quién le ha pedido algo y ha acabado haciéndolo él mismo porque el chat solo te decía cómo?» , «¿Quién ha oído hablar de agentes y no tiene claro qué son?» . La tercera levanta casi todas las manos. Úsalo: «Perfecto. Ese es exactamente el punto de partida de hoy, y en tres horas esto va a estar claro.» Reparte el cuestionario inicial de 06_evaluacion.md . No se puntúa. Dilo explícitamente: «Esto no es un examen, es para que yo sepa por dónde empezar. Si no sabes una respuesta, escribe no lo sé y ya está.» (3 min) La promesa, en cuatro puntos: al terminar sabrás qué es un harness ; lo habrás arrancado en tu propio portátil ; sabrás qué permisos estás dando y por qué ; y sabrás qué no conviene dejarle hacer . Lo que NO vamos a hacer: no vamos a programar, no vamos a entrenar modelos, y no hace falta que sepas nada de informática más allá de usar el navegador y crear una carpeta. Regla de la sala: «Si te atascas más de tres minutos, levanta la mano. No hay nada que me haga perder más tiempo que diez personas atascadas en silencio.» Señales de que ha funcionado El grupo responde a mano alzada y alguien dice en voz alta que no entiende la diferencia entre chat y agente. Eso es bueno: es la pregunta que abre el bloque 1. Bloque 1 — Del chat al agente (17 min) Objetivo: que entiendan el cambio de fondo, no la jerga. Qué decir Punto de partida: lo que ya saben hacer. Todos sabéis usar un chat. Escribes una pregunta, te llega una respuesta de texto, y tú haces lo que haga falta con ella. Copias, pegas, abres el archivo, cambias el dato. El chat aconseja; el trabajo lo pones tú. La analogía que sostiene todo el seminario: Un chat es un consultor por teléfono: te dice qué hacer y lo haces tú. Un agente es un becario con acceso a tu ordenador: lo hace y tú revisas. Di las dos mitades despacio y déjalas escritas en la pizarra. Vas a volver a esta frase cuatro veces más. Tres diferencias, y solo tres: Tiene herramientas. Puede leer y escribir archivos, ejecutar comandos, buscar en internet. No solo habla: toca cosas. Trabaja en bucle. No da una respuesta y se calla. Da un paso, mira qué ha pasado, decide el siguiente. Diez pasos, cincuenta, los que hagan falta. Produce efectos reales. Esto es lo importante y lo peligroso: al terminar, hay archivos cambiados en tu ordenador. No es una conversación, es un trabajo hecho. El modelo y el harness. Aquí está la palabra del título. El modelo es el motor. El harness es el coche completo: el volante, los frenos, el salpicadero y las ruedas. El motor solo no te lleva a ningún sitio. Y fíjate en la consecuencia: un chat también es un coche, pero uno muy sencillo — motor, un volante y nada más. Un agente es un coche con frenos, espejos y cinturón. Ejemplo para que se vea la diferencia. Pide al grupo que imaginen un informe de veinte páginas en su escritorio. Con un chat: abres el documento, copias el texto, lo pegas en el chat, escribes «resúmeme esto», esperas, copias el resumen y lo pegas en otro archivo. Cuatro pasos tuyos. Con un agente: «Resume el informe que está en esta carpeta y guárdame el resumen al lado, en un archivo nuevo.» El agente abre el archivo, lo lee, escribe el resumen, te dice dónde lo ha dejado. Cero pasos tuyos, y un archivo nuevo que antes no existía. La consecuencia incómoda, y hay que decirla hoy. Un agente es como un becario muy motivado que trabaja a gran velocidad y no sabe lo que no sabe. Va a hacer lo que le pidas con una seguridad total, aunque se esté equivocando. Va a tocar archivos en segundos. Y si le has pedido algo mal, hará mal la cosa mala, rapidísimo. De ahí salen los frenos, y de ahí sale el bloque más importante de hoy. Comprobación de comprensión Pregunta a una persona concreta, no al aire: «Si le pido a un agente que me organice las fotos del móvil, ¿qué hace exactamente?» Busca que diga: mira los archivos, decide, mueve cosas. Si dice «me explica cómo hacerlo», vuelve a la analogía del teléfono. Señales de que ha funcionado Alguien pregunta «¿y si se equivoca?». Ya tienes el bloque 4 justificado: «Exacto. Guarda esa pregunta, la contesto dentro de veinte minutos y es la parte más útil del seminario.» Bloque 2 — Anatomía de un harness (20 min) Objetivo: que sepan nombrar las piezas. Sin esto, los permisos del bloque 4 son magia. Qué decir Un harness tiene seis piezas. Las vais a reconocer todas en la pantalla dentro de un rato. Pieza Qué es, en palabras llanas Modelo El motor. El que «piensa» y decide. Herramientas Las manos. Lo que puede hacer de verdad. Bucle El ritmo de trabajo: piensa, actúa, mira el resultado, repite. Contexto La mesa de trabajo. Todo lo que tiene delante ahora mismo. Permisos Los frenos. Qué puede hacer sin preguntar y qué no. Interfaz El salpicadero. Donde tú ves lo que está pasando. El bucle, despacio, porque es lo que más se malinterpreta. El modelo no ejecuta nada. El modelo propone. Piensa «para resumir este informe tengo que leerlo», y pide al harness que lea el archivo. El harness lo lee y le devuelve el contenido. El modelo lo lee, piensa el resumen, y pide que se escriba un archivo nuevo. Y así. Piensa, actúa, observa, repite. Cien veces si hace falta. ¿Por qué importa? Porque significa que el harness está en medio de todo . Es quien decide qué se le permite al modelo, y es quien ejecuta. El modelo no es el que toca tu ordenador: el que toca tu ordenador es el harness, siguiendo las órdenes de un modelo que nunca ve tu disco directamente salvo por lo que el harness le enseña. Las herramientas. No hace falta memorizar la lista; lo que hace falta es saber que existe y saber mirarla: Leer archivos del espacio de trabajo. Escribir y modificar archivos. Ejecutar comandos en la terminal (esta es la más potente y la que más respeto merece). Buscar y leer en internet. Lanzar tareas en segundo plano mientras sigue con otra cosa. Preguntarte a ti cuando necesita decidir algo. Delegar una parte del trabajo en otro agente. Llevar una lista de tareas y marcar lo que va terminando. El contexto: la mesa de trabajo. Aquí usa una imagen física: imagina una mesa. Todo lo que el agente sabe en este momento está encima de la mesa: tu petición, los archivos que ha leído, lo que ha ido averiguando. La mesa tiene un tamaño limitado. Cuando se llena de papeles, alguien tiene que recoger: se resume lo importante y se tira el resto. Eso significa que en tareas muy largas el agente puede «olvidar» detalles del principio. No es que sea tonto, es que ya no están en la mesa. Consecuencia práctica que deben llevarse: una tarea larga y enrevesada es mejor partirla en dos sesiones que forzarla en una. Los permisos, solo el titular. El becario trabaja dentro de una sala. Dentro hace lo que quiera. Para salir de la sala, te pide permiso. Eso es todo por ahora; lo vais a provocar vosotros en el bloque 4. La interfaz. Insiste en esto porque es donde más se aprovecha la herramienta: la interfaz no te enseña solo la respuesta final, te enseña los pasos. Cada vez que el agente usa una herramienta, lo ves. Eso es tu ventana para darte cuenta de que va por donde no debe. Si no miras los pasos, te enteras de los errores cuando ya están hechos. Demo del instructor (6-7 min) Hazlo tú, en pantalla grande, narrando. No lo expliques antes: que lo vean y luego lo comentáis. Abre el harness en la carpeta de práctica de ejemplo. Escribe una petición de dos o tres pasos, por ejemplo: «Mira qué hay en esta carpeta y hazme un índice de los archivos, agrupados por tipo, en un archivo llamado INDICE.md.» Mientras trabaja, ve señalando en voz alta: «está mirando qué hay — esta es la herramienta de leer», «ahora está escribiendo el archivo», «está comprobando que se ha escrito bien». Al terminar, abre el INDICE.md delante de todos. Se ha creado un archivo que no existía. Ese es el momento «ajá» de este bloque: «Nadie ha copiado ni pegado nada. Mirad la carpeta.» Señales de que ha funcionado Preguntan por qué ha usado esa herramienta y no otra, o piden que lo repitas. Anota la duda y respóndela en el bloque 5. Bloque 3 — Práctica 1: Primer arranque y primer encargo (20 min) Objetivo: que cada alumno tenga el harness funcionando y haya completado un encargo de principio a fin. Trabaja con 03_laboratorio.md delante. Reparte el documento o pide que lo abran. Secuencia Demuestra el arranque completo en tu portátil (4 min), narrando cada paso: abrir la terminal, comprobar Node con node -v , arrancar con npx @deepseek-ai/dsh web , ver la dirección en pantalla, abrir el navegador, configurar el modelo en Ajustes → Modelos con la clave de API, elegir el espacio de trabajo, escribir el primer mensaje. Todos a la vez (12 min). Tú circulas. No te quedes con el primero que levante la mano: los que ya lo tienen, que ayuden al de al lado. Un alumno que explica arranca dos aprendizajes. Puesta en común (4 min). Pregunta al grupo: «¿Qué herramientas ha usado vuestro agente para hacer el resumen?» . Que las nombren ellos. Los dos tropiezos que vas a ver seguro El cuadro de escribir mensajes está deshabilitado. Casi siempre es que no han elegido espacio de trabajo. Antes de tocar nada, pregunta: «¿Has elegido una carpeta de trabajo?» Hasta que no eliges espacio de trabajo, el agente no tiene dónde trabajar y no te deja escribir. No hay clave de API o no es válida. Ten la tuya de reserva. Y aprovecha para explicar que la clave es como la tarjeta del motor: sin ella no arranca, y el uso se paga . Qué decir mientras circulas Nada de resolver por ellos con las manos en su teclado. Señala el botón y deja que lo pulse el alumno. El objetivo es que sepan hacerlo sin ti el lunes. Señal de que ha funcionado Todos tienen una sesión con al menos un encargo terminado y un archivo nuevo en su carpeta. Descanso (10 min) Antes de salir, avisa: «Al volver vemos lo más importante de todo: los frenos. Y los vais a tocar vosotros.» Que nadie se vaya pensando que lo bueno ya ha pasado. Bloque 4 — Permisos, sandbox y aprobaciones (30 min) Objetivo: que entiendan, y hayan sentido, qué se le permite al agente y quién decide. Este bloque es la razón por la que el seminario existe. Los alumnos ya saben que un agente puede hacer cosas. Ahora tienen que aprender a dormir tranquilos mientras las hace. Parte 1 — Los tres conceptos (8 min) Son tres cosas distintas que la gente mezcla siempre. Escríbelas separadas en la pizarra: Concepto Qué es Analogía Sandbox La zona donde el agente puede moverse: normalmente, la carpeta de trabajo que elegiste. La sala donde trabaja el becario. Política de permisos El ajuste general: qué se permite sin preguntar y qué no. El reglamento de la sala. Aprobación El aviso puntual que aparece cuando algo se sale de lo permitido. El «¿seguro?» en la puerta. Dentro de la sala, el becario hace lo que quiera. Para salir de la sala, te pide permiso. Y añade la pieza que casi nadie espera: tú puedes elegir el tamaño de la sala. Cuanto más pequeña y más específica sea la carpeta de trabajo, menos avisos y menos riesgo. Esa decisión es tuya, y es la más importante que vas a tomar hoy. Parte 2 — Práctica 2: Provocar una aprobación (10 min) Que lo hagan todos a la vez, con instrucciones exactas del laboratorio. El objetivo es ver el aviso y entender qué está pidiendo , no aprobarlo rápido. Cuando aparezca el aviso, para la clase entera y léelo en voz alta, tú. Y lanza las tres preguntas: «¿Qué os está pidiendo exactamente?» — Leer un archivo de fuera de la carpeta. Escribir en el escritorio. Ejecutar un comando. Que lo digan con sus palabras. «¿Qué pasaría si decís que sí?» — Se hace, de verdad, ahora. No es una simulación ni una confirmación de cortesía. «¿Se puede acotar?» — Casi siempre sí: pedirle que trabaje solo en tal carpeta, o que te enseñe antes lo que va a hacer. El momento clave: «Permitir una vez» es solo esa vez. No es un permiso permanente y no se recuerda. Di la frase completa: «Permitir una vez es permitir esa vez. La próxima te vuelve a preguntar. Es incómodo a propósito: ese pequeño fastidio es lo que te obliga a pensar si de verdad quieres que salga de la sala.» Aquí aparecen dos comportamientos que hay que desactivar ya: Aprobar por inercia. Si te descubres pulsando «permitir» sin leer, para. Estás firmando sin leer. Subir el nivel de permiso para que deje de preguntar. Es como quitar el freno porque el coche hace ruido al frenar. Si algo se repite mucho, la solución no es aprobar cien avisos: es mover el trabajo dentro de la carpeta de trabajo , donde no hace falta permiso. Regla de oro, y que la copien: si no entiendes qué te está pidiendo, no lo apruebes. Pídele que te lo explique con palabras, o que te diga qué va a tocar antes de tocarlo. Parte 3 — Práctica 3: Cambiar de política (8 min) La misma tarea que antes, pero hecha dentro de la carpeta de trabajo. Todos la repiten y observan: ya no pregunta nada. Que saquen ellos la conclusión. Si no sale, dila tú: «El agente no es más listo ni más tonto. Habéis cambiado dónde trabaja, y con eso han desaparecido los avisos y ha bajado el riesgo. Diseñar bien la carpeta es la mitad del trabajo seguro.» Parte 4 — Cierre del bloque (4 min) Tres ideas para que se queden: El sandbox reduce el riesgo, no lo elimina. Todo lo que está dentro de la sala autorizada, el agente lo puede tocar. Si dentro de la sala hay algo que no debería tocarse, el problema es lo que hay en la sala, no el agente. La aprobación es tuya, no del sistema. El aviso no decide: te informa. La responsabilidad es de quien pulsa. Copia de seguridad antes de empezar. La regla es aburrida y por eso se salta: si no tienes copia de algo, no lo pongas en la carpeta de trabajo. Señales de que ha funcionado Sabrán decirte, sin mirar, la diferencia entre sandbox y aprobación, y por qué «permitir una vez» no vale para siempre. Bloque 5 — Herramientas, contexto y memoria (22 min) Objetivo: que sepan qué puede hacer su agente, qué hacer cuando la conversación se degrada, y cómo no repetirse. Parte 1 — Las herramientas, con calma (5 min) Vuelve a la lista del bloque 2, ahora mirando la pantalla real: dónde se ve qué herramientas hay disponibles y qué está usando en cada paso. La conclusión que buscamos: no hace falta memorizar nada, hace falta mirar los pasos. Y un aviso honesto: la herramienta de terminal es la más potente de todas. Es la que permite instalar programas, mover cosas y deshacer con la misma facilidad con la que rompe. Cuando el agente use la terminal, mira más despacio que cuando lee un archivo. Parte 2 — El contexto, en la práctica (5 min) Retoma la mesa de trabajo. Señales de que se está llenando: el agente repite cosas que ya hizo, olvida instrucciones que le diste al principio, o da vueltas sobre el mismo problema. Qué se hace: Cerrar y abrir una conversación nueva , diciendo en el primer mensaje lo que ya está hecho y dónde. Es más rápido que insistir. Dividir el trabajo en trozos con un resultado claro cada uno. No arrastrar una conversación larga para una tarea nueva y distinta. Cada tarea, su conversación. Parte 3 — Memoria: lo que sobrevive (5 min) Dos niveles, y la diferencia importa: La conversación — se acaba. Si cierras y abres otra, el agente no se acuerda de nada. Lo permanente — sobrevive a todo. Hay dos formas: las notas (archivo AGENTS.md ) y los procedimientos guardados (skills). AGENTS.md son las notas que dejas al becario antes de que empiece. Si tienes una preferencia que se repite — «responde en español», «no toques la carpeta de facturas», «los informes van siempre en la carpeta informes » — no la repitas cada día: escríbela una vez. Hay notas globales (para todos tus proyectos) y notas por proyecto . Las skills son procedimientos guardados, como recetas de cocina. Cuando repites una tarea siempre igual, la escribes una vez con sus pasos y el agente la sigue cuando le dices «hazme el informe mensual». En este ordenador ya hay una de ejemplo: la de precios de gasolineras. Lección para que se la lleven: si te descubres explicando lo mismo por tercera vez, el problema no es el agente: es que no le has dejado notas. Parte 4 — Práctica 4: Enseñarle un procedimiento (5 min) Que cada alumno deje una instrucción permanente (una nota o una skill sencilla) y compruebe en una conversación nueva que se respeta . El detalle que hay que subrayar: hay que probarlo en una conversación nueva. En la misma conversación no demuestra nada, porque se acuerda por el contexto. Parte 5 — MCP, si hay tiempo (2-3 min) Solo el concepto, sin tecnicismos: MCP es un enchufe estándar, como el USB. Existen muchísimos programas que ya saben hacer cosas — GitHub, bases de datos, gestores de incidencias, servicios de memoria — y gracias a ese enchufe común se pueden conectar al agente y aparecen como herramientas nuevas. Cuándo merece la pena: cuando la información que necesitas no está en archivos, sino en otro programa. Aviso de seguridad, obligatorio: cada enchufe es una conexión nueva a tus cosas. Instalar un plugin o conectar un servidor es una decisión de confianza, igual que instalar un programa. Si vas a conectar algo que toca datos reales de la empresa, consúltalo antes. Bloque 6 — Práctica 5: Encargo integrador (13 min) Objetivo: que hagan solos un encargo completo, y sobre todo que verifiquen . Qué decir Aquí ya no hay instrucciones mías. Piensa en una tarea pequeña y real tuya, que tenga que ver con archivos, y que puedas comprobar en dos minutos. El patrón de un buen encargo Escríbelo en la pizarra y que lo copien; es lo más útil que se llevan hoy: 1. Qué quiero (el objetivo, con un resultado concreto). 2. Dónde (la carpeta exacta). 3. Qué NO tocar (los límites, dichos explícitamente). 4. Cómo sabré que está bien (tu criterio de éxito). Ejemplo completo, para que se vea el patrón entero: «En la carpeta practica/informes hay cinco informes en texto. Léelos y créame resumen_general.md con una tabla de tres columnas: tema, conclusión y nivel de urgencia. No modifiques ninguno de los cinco archivos originales. Al terminar, dime qué archivos has leído y cuántas filas tiene la tabla.» Verificación obligatoria Y ahora la parte que la gente se salta: abrid el resultado y comprobadlo. No vale «tiene buena pinta». Cuenta las filas, mira si los cinco informes están, comprueba que los originales siguen intactos. «El agente no firma su trabajo. Lo firmas tú cuando dices que está bien.» Puesta en común (si vas sobrado) Tres voluntarios, un minuto cada uno: qué pidieron, qué les devolvió el agente y qué comprobaron . Insiste en la tercera parte: lo interesante es lo que revisaron, no lo que pidieron. Bloque 7 — Cierre, límites y evaluación (10 min) Los tres errores que va a cometer todo el mundo Aprobar por inercia. El aviso se convierte en un clic automático y deja de protegerte. Confiar sin verificar. El resultado llega bien maquetado y con seguridad en el tono. Eso no es prueba de que sea correcto. Darle lo que no debería ver. Si arrastras una carpeta con datos de clientes «para probar», ya está dentro de la sala. Límites, dichos con honestidad No endulces esto. Es información que protege a la gente: Es software experimental, en fase de vistas previas de desarrollo. Cambia rápido y habrá novedades que rompan lo anterior. No construyas nada crítico encima sin plan B. No ha pasado una auditoría de seguridad. No está pensado para ser seguro de serie. El sandbox y las aprobaciones reducen el riesgo, pero no garantizan aislamiento y no deben ser tu único control de seguridad . Si el trabajo es delicado, la recomendación oficial es usar una máquina virtual o un entorno dedicado y desechable. Lo que sí está en tu mano: trabajar con el mínimo privilegio necesario, tener copias de seguridad de lo que el agente puede tocar, no exponer credenciales, y revisar plugins y comandos antes de permitirlos. Las cuatro reglas para el lunes Copia de seguridad de la carpeta antes de empezar. Una carpeta específica para cada trabajo. Ni el escritorio entero ni, mucho menos, todo el disco. Nada confidencial ni sensible en la carpeta de trabajo, salvo que aceptes el riesgo conscientemente. Revisa antes de aprobar y verifica al terminar. Siempre. Las dos veces. Evaluación y cierre (3-4 min) Reparte el cuestionario final de 06_evaluacion.md y la encuesta de satisfacción. Recuerda que no es un examen. Cierra con dónde seguir y con la frase que resume el día: «Hoy no habéis aprendido a usar un programa. Habéis aprendido a dirigir a alguien que trabaja muy rápido, que no sabe lo que no sabe, y que tiene acceso a vuestros archivos. La herramienta os va a servir; los frenos os van a proteger.» Material para seguir: el manual interactivo de DSH, el glosario y la chuleta de 05_glosario_chuleta.md , y la documentación oficial del proyecto. Anexo — Chuleta de emergencia del instructor Pasa esto Di esto Un alumno no arranca y se queda atrás «Sigue conmigo sin arrancar, ahora paso y lo vemos. Mientras, apunta en qué paso se ha quedado.» La interfaz va lenta y el grupo se impacienta «Está pensando y trabajando. Mirad el panel de pasos: eso es el agente haciendo su trabajo.» Alguien aprueba un aviso sin leer «Para. Léelo en voz alta. ¿Qué le estás dejando hacer?» El agente hace algo mal delante de todos «Perfecto, esto es material didáctico. Mirad los pasos y decidme en cuál se ha ido.» Preguntan algo que no sabes «No lo sé, lo apunto y te lo contesto.» Apúntalo de verdad. Se cae la red «Pasamos al plan B: lo hago yo en pantalla y vosotros vais siguiendo.» Alguien quiere subir los permisos al máximo «Antes de eso, dime qué tarea es. Casi siempre se arregla moviendo la carpeta.» El grupo va muy rápido «Vale, entonces me adelanto: ¿qué creéis que pasa si dos personas trabajan en la misma carpeta a la vez?»"},{"id":"doc-04","grupo":"instructor","titulo":"Soluciones y errores frecuentes","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 21 min de lectura\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M6 3h8l4 4v14H6z\"/\u003e\u003cpath d=\"M14 3v5h5\"/\u003e\u003cpath d=\"M9 13h6M9 17h6\"/\u003e\u003c/svg\u003e Documento 04\u003c/span\u003e\n      \u003c/div\u003e\u003ch1 id=\"soluciones-y-errores-frecuentes\"\u003eSoluciones y errores frecuentes\u003c/h1\u003e\n\u003cp\u003eDocumento de apoyo para el instructor del seminario \u003cstrong\u003e&quot;Del chat al agente: qué es un harness y cómo se usa&quot;\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eHerramienta: \u003cstrong\u003eDeepSeek Harness (\u003ccode\u003edsh\u003c/code\u003e)\u003c/strong\u003e, el harness de agentes de DeepSeek AI.\nAudiencia: gente que usa la IA como chat y no programa.\u003c/p\u003e\n\u003ch2 id=\"como-usar-este-documento\"\u003eCómo usar este documento\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eTenlo abierto en una segunda ventana mientras la clase practica.\u003c/li\u003e\n\u003cli\u003eLocaliza la práctica en la que esté el grupo y busca en la tabla la fila que coincida con lo que ves en su pantalla.\u003c/li\u003e\n\u003cli\u003eLas señales de &quot;salió bien&quot; sirven para confirmar en voz alta que el alumno va por buen camino: dilo, refuerza.\u003c/li\u003e\n\u003cli\u003eSi el problema aparece en varios portátiles a la vez, ve directamente a \u003cstrong\u003eProblemas técnicos de sala\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eSi te quedas sin palabras delante de la clase, usa las \u003cstrong\u003eFrases de rescate\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eRecuerda las dos ideas que se repiten: \u003cstrong\u003eel sandbox es la zona de trabajo delimitada\u003c/strong\u003e y \u003cstrong\u003ela aprobación es el &quot;¿seguro?&quot;\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eRecordatorio de arranque\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSin instalar nada: \u003ccode\u003enpx @deepseek-ai/dsh web\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eCon instalación global: \u003ccode\u003enpm install -g @deepseek-ai/dsh\u003c/code\u003e y después \u003ccode\u003edsh web\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eLa interfaz se abre en \u003cstrong\u003e\u003ca href=\"http://127.0.0.1:3080\"\u003ehttp://127.0.0.1:3080\u003c/a\u003e\u003c/strong\u003e. La opción \u003ccode\u003e--no-open\u003c/code\u003e arranca sin abrir el navegador.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"practica-1-primer-arranque-y-primer-encargo\"\u003ePráctica 1 — Primer arranque y primer encargo\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e arrancar el harness, conectar el modelo, elegir espacio de trabajo y conseguir que el agente lea una carpeta propia y la resuma.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQué debería pasar\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eEl alumno lanza el harness desde la terminal y se abre la interfaz web en el navegador.\u003c/li\u003e\n\u003cli\u003eConfigura su clave de API y el modelo queda usable al momento, sin reiniciar el servidor.\u003c/li\u003e\n\u003cli\u003eElige una carpeta como espacio de trabajo; el cuadro de escribir mensajes se habilita.\u003c/li\u003e\n\u003cli\u003eEscribe una petición y el agente lee archivos reales de esa carpeta y responde con un resumen.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eCómo saber que salió bien\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLa interfaz carga en \u003cstrong\u003e\u003ca href=\"http://127.0.0.1:3080\"\u003ehttp://127.0.0.1:3080\u003c/a\u003e\u003c/strong\u003e y se ve el panel de conversación.\u003c/li\u003e\n\u003cli\u003eEl cuadro de escribir mensajes está \u003cstrong\u003ehabilitado\u003c/strong\u003e. Si está gris, no hay espacio de trabajo seleccionado.\u003c/li\u003e\n\u003cli\u003eEn Ajustes → Modelos aparece la clave guardada y el agente responde sin reiniciar nada.\u003c/li\u003e\n\u003cli\u003eEl resumen menciona \u003cstrong\u003enombres de archivos reales\u003c/strong\u003e de la carpeta elegida: ha leído, no ha inventado.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eSolución de referencia\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePetición del alumno:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eMira la carpeta que he elegido y dime qué hay dentro. Después hazme un resumen de una página con los temas principales de los documentos que encuentres, en español y en viñetas.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eQué haría el agente:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eLista el contenido de la carpeta del espacio de trabajo.\u003c/li\u003e\n\u003cli\u003eAbre los archivos de texto que encuentra.\u003c/li\u003e\n\u003cli\u003eDevuelve un resumen en viñetas, en español, y menciona qué archivos ha leído y cuáles ha ignorado.\u003c/li\u003e\n\u003cli\u003eSi algún archivo queda fuera del espacio de trabajo, pide aprobación antes de leerlo.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eErrores frecuentes\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eLo que se ve\u003c/th\u003e\n\u003cth\u003eQué está pasando\u003c/th\u003e\n\u003cth\u003eQué hacer\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eEl cuadro de mensajes está gris y no deja escribir\u003c/td\u003e\n\u003ctd\u003eNo hay espacio de trabajo seleccionado: es el primer tropiezo habitual\u003c/td\u003e\n\u003ctd\u003ePulsar \u003cstrong\u003eElegir espacio de trabajo\u003c/strong\u003e, añadir la carpeta y seleccionarla; el cuadro se habilita al momento\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl alumno escribe en la terminal y no pasa nada\u003c/td\u003e\n\u003ctd\u003eLa terminal solo arranca el servidor; el trabajo se hace en el navegador\u003c/td\u003e\n\u003ctd\u003eExplicar que la terminal es el motor encendido y el navegador es el volante\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl agente contesta en inglés o de forma muy genérica\u003c/td\u003e\n\u003ctd\u003eNo ha leído nada, solo ha conversado; o no se le pidió el idioma\u003c/td\u003e\n\u003ctd\u003ePedir explícitamente &quot;en español&quot; y &quot;mira los archivos de la carpeta&quot;\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e&quot;No puedo acceder a esa carpeta&quot;\u003c/td\u003e\n\u003ctd\u003eLa carpeta elegida no es la que el alumno cree\u003c/td\u003e\n\u003ctd\u003eComprobar la ruta en \u003cstrong\u003eElegir espacio de trabajo\u003c/strong\u003e y repetir la petición\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl agente ha usado una carpeta distinta de la esperada\u003c/td\u003e\n\u003ctd\u003eAl lanzar \u003ccode\u003edsh\u003c/code\u003e desde una carpeta, esa carpeta es el espacio de trabajo por defecto propuesto\u003c/td\u003e\n\u003ctd\u003eElegir la carpeta correcta antes de pedir nada\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eError al enviar el mensaje o respuesta vacía\u003c/td\u003e\n\u003ctd\u003eFalta la clave de API o no está guardada\u003c/td\u003e\n\u003ctd\u003eAjustes → Modelos → introducir o volver a guardar la clave de \u003cstrong\u003e\u003ca href=\"https://platform.deepseek.com/\"\u003ehttps://platform.deepseek.com/\u003c/a\u003e\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003ePlan B si no sale\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSi no arranca nada, comprueba Node.js y vuelve a lanzar el comando en una terminal nueva.\u003c/li\u003e\n\u003cli\u003eSi no consigue configurar la clave, pásale a un compañero que ya lo tenga funcionando y siga la práctica por parejas.\u003c/li\u003e\n\u003cli\u003eMientras se arregla, pídele que escriba en papel qué carpeta quiere resumir y qué le va a pedir al agente.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eSi alguien va muy rápido\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQue elija una carpeta con subcarpetas y pida un resumen por subcarpeta.\u003c/li\u003e\n\u003cli\u003eQue pida al agente que, a partir de los documentos, proponga una lista de tareas pendientes.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"practica-2-provocar-una-aprobacion\"\u003ePráctica 2 — Provocar una aprobación\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e entender qué es el sandbox, qué queda fuera de él y qué significa el aviso de aprobación.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQué debería pasar\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eEl alumno pide al agente que lea o cree algo \u003cstrong\u003efuera\u003c/strong\u003e de la zona de trabajo delimitada (por ejemplo, en su escritorio).\u003c/li\u003e\n\u003cli\u003eLa operación no se ejecuta sola: aparece el \u003cstrong\u003eaviso de aprobación\u003c/strong\u003e en la interfaz.\u003c/li\u003e\n\u003cli\u003eEl agente se queda esperando la decisión del alumno.\u003c/li\u003e\n\u003cli\u003eEl alumno decide: permitir una vez, o denegar. Y entiende qué acaba de pasar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eCómo saber que salió bien\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAparece el aviso de aprobación y el agente \u003cstrong\u003ese detiene\u003c/strong\u003e en vez de actuar.\u003c/li\u003e\n\u003cli\u003eEl aviso indica qué operación quiere hacer y sobre qué carpeta o archivo.\u003c/li\u003e\n\u003cli\u003eEl alumno sabe explicar en una frase qué es el sandbox y qué es la aprobación.\u003c/li\u003e\n\u003cli\u003eAl aprobar, la operación se completa; al denegar, el agente lo acepta y propone otra vía o te lo dice.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eSolución de referencia\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePetición del alumno:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eCrea un archivo llamado \u003ccode\u003eprueba.txt\u003c/code\u003e en mi escritorio con el texto &quot;hola desde el agente&quot;.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eQué haría el agente:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eDetecta que el escritorio está \u003cstrong\u003efuera\u003c/strong\u003e del espacio de trabajo.\u003c/li\u003e\n\u003cli\u003eMuestra el aviso de aprobación indicando la ruta exacta que quiere escribir.\u003c/li\u003e\n\u003cli\u003eEspera. No escribe nada hasta que el alumno decide.\u003c/li\u003e\n\u003cli\u003eCon &quot;Permitir una vez&quot;, escribe el archivo y termina. Si se deniega, explica que no puede y propone hacerlo dentro del espacio de trabajo.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eErrores frecuentes\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eLo que se ve\u003c/th\u003e\n\u003cth\u003eQué está pasando\u003c/th\u003e\n\u003cth\u003eQué hacer\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eEl agente crea el archivo sin preguntar nada\u003c/td\u003e\n\u003ctd\u003eLa carpeta de destino está dentro del espacio de trabajo, o la política es más permisiva de lo previsto\u003c/td\u003e\n\u003ctd\u003eElegir una ruta claramente externa (escritorio, carpeta personal) y revisar la política de permisos\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNo aparece ningún aviso y el agente dice &quot;no puedo&quot;\u003c/td\u003e\n\u003ctd\u003eLa política de permisos deniega directamente en vez de preguntar\u003c/td\u003e\n\u003ctd\u003eEs un resultado válido: hay modos de sandbox y política de aprobaciones; en ese modo no se pregunta, se niega\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl alumno aprueba a ciegas sin leer el aviso\u003c/td\u003e\n\u003ctd\u003eNo ha entendido la práctica\u003c/td\u003e\n\u003ctd\u003eParar y leer el aviso en voz alta: qué operación, qué ruta, qué riesgo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAparecen varios avisos seguidos y el alumno se agobia\u003c/td\u003e\n\u003ctd\u003eEl encargo toca varias cosas de golpe\u003c/td\u003e\n\u003ctd\u003eRecordar que \u003cstrong\u003e&quot;Permitir una vez&quot; es solo esa vez\u003c/strong\u003e; simplificar la petición a una sola acción\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDespués de aprobar, la operación falla igualmente\u003c/td\u003e\n\u003ctd\u003ePermisos del sistema operativo o antivirus bloqueando esa carpeta\u003c/td\u003e\n\u003ctd\u003eProbar con otra carpeta del usuario y revisar el antivirus\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003ePlan B si no sale\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSi el agente no pide permiso nunca, cambia la política a un modo más restrictivo y repite la petición.\u003c/li\u003e\n\u003cli\u003eSi el aviso no aparece porque el encargo es ambiguo, escribe tú la petición en la pizarra y que la copien.\u003c/li\u003e\n\u003cli\u003eAprovecha para la explicación teórica: el aviso incómodo es el objetivo, no un fallo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eSi alguien va muy rápido\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQue \u003cstrong\u003edeniegue\u003c/strong\u003e el permiso y observe cómo reacciona el agente. Es la mitad de la lección y casi nadie la hace.\u003c/li\u003e\n\u003cli\u003eQue intente lo mismo con dos rutas distintas y compare qué aviso aparece en cada caso.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"practica-3-cambiar-de-politica\"\u003ePráctica 3 — Cambiar de política\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e comprobar que la misma tarea deja de pedir permiso cuando se hace \u003cstrong\u003edentro\u003c/strong\u003e del espacio de trabajo, y entender qué cambia cada modo de permisos.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQué debería pasar\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eEl alumno repite una tarea equivalente a la de la Práctica 2, pero apuntando a una carpeta \u003cstrong\u003edentro\u003c/strong\u003e del espacio de trabajo.\u003c/li\u003e\n\u003cli\u003eEl agente la ejecuta sin mostrar el aviso de aprobación.\u003c/li\u003e\n\u003cli\u003eDespués se revisa la opción de política de permisos y, si procede, se cambia de modo para ver la diferencia.\u003c/li\u003e\n\u003cli\u003eEl alumno sale sabiendo que los permisos son un dial, no un interruptor.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eCómo saber que salió bien\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLa operación se completa \u003cstrong\u003esin aviso de aprobación\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eEl archivo o el resultado aparece realmente en la carpeta indicada.\u003c/li\u003e\n\u003cli\u003eEl alumno explica la diferencia entre las dos prácticas: fuera → aviso; dentro → sin aviso.\u003c/li\u003e\n\u003cli\u003eAl cambiar la política, el comportamiento cambia en consecuencia de forma observable.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eSolución de referencia\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePetición del alumno:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eDentro de la carpeta que te he dado, crea una subcarpeta llamada \u003ccode\u003enotas\u003c/code\u003e y dentro un archivo \u003ccode\u003eresumen.md\u003c/code\u003e con los tres puntos principales del resumen de antes.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eQué haría el agente:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eComprueba que la ruta está dentro del espacio de trabajo.\u003c/li\u003e\n\u003cli\u003eCrea la subcarpeta y el archivo sin pedir aprobación.\u003c/li\u003e\n\u003cli\u003eConfirma la ruta final y resume lo que ha escrito.\u003c/li\u003e\n\u003cli\u003eSi el alumno ha cambiado la política a solo lectura, se niega y lo explica: ese es el aprendizaje.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eErrores frecuentes\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eLo que se ve\u003c/th\u003e\n\u003cth\u003eQué está pasando\u003c/th\u003e\n\u003cth\u003eQué hacer\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eSigue pidiendo permiso aunque la ruta sea interna\u003c/td\u003e\n\u003ctd\u003eLa carpeta elegida no es la que se cree, o hay un acceso directo a otra ubicación\u003c/td\u003e\n\u003ctd\u003eComprobar la ruta del espacio de trabajo y evitar enlaces, accesos directos y unidades de red\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl alumno no encuentra el archivo creado\u003c/td\u003e\n\u003ctd\u003eLo ha creado en otra subcarpeta del espacio de trabajo\u003c/td\u003e\n\u003ctd\u003ePedir al agente la \u003cstrong\u003eruta completa\u003c/strong\u003e del archivo y abrirla\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTras cambiar la política, ya nada funciona\u003c/td\u003e\n\u003ctd\u003eSe ha pasado a un modo demasiado restrictivo (por ejemplo, solo lectura)\u003c/td\u003e\n\u003ctd\u003eVolver al modo anterior y explicar que la política se puede ajustar\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl alumno cambia la política sin saber qué modo elige\u003c/td\u003e\n\u003ctd\u003eNo ha leído las opciones\u003c/td\u003e\n\u003ctd\u003eLeer juntos la opción de política de permisos antes de tocarla\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl agente pide permiso para escribir \u003cstrong\u003ey\u003c/strong\u003e para ejecutar\u003c/td\u003e\n\u003ctd\u003eSon operaciones distintas, cada una con su aviso\u003c/td\u003e\n\u003ctd\u003eExplicar que cada tipo de acción se evalúa por separado\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003ePlan B si no sale\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eVuelve a la Práctica 2 y compara las dos pantallas, una al lado de la otra.\u003c/li\u003e\n\u003cli\u003eSi el espacio de trabajo es una unidad de red o una carpeta sincronizada, cambia a una carpeta local sencilla.\u003c/li\u003e\n\u003cli\u003eSi el grupo va perdido, escribe en la pizarra las tres ideas: dentro, fuera, aviso.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eSi alguien va muy rápido\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQue haga la misma tarea tres veces cambiando el modo de permisos y anote en una tabla qué pasa en cada caso.\u003c/li\u003e\n\u003cli\u003eAprovecha para introducir el \u003cstrong\u003emínimo privilegio\u003c/strong\u003e: el modo más abierto no es el mejor, es el más arriesgado.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"practica-4-ensenarle-un-procedimiento\"\u003ePráctica 4 — Enseñarle un procedimiento\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e dejar instrucciones permanentes (notas en el \u003cstrong\u003eAGENTS.md\u003c/strong\u003e o una \u003cstrong\u003eskill\u003c/strong\u003e guardada) y comprobar que el agente las respeta en una \u003cstrong\u003esesión nueva\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQué debería pasar\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eEl alumno escribe las instrucciones una sola vez: o bien como notas permanentes en el AGENTS.md, o como skill con su procedimiento.\u003c/li\u003e\n\u003cli\u003eEl agente propone dónde guardarlas y muestra el texto que va a escribir.\u003c/li\u003e\n\u003cli\u003eEl alumno abre una \u003cstrong\u003econversación nueva\u003c/strong\u003e y pide la tarea.\u003c/li\u003e\n\u003cli\u003eEl agente aplica el procedimiento sin que se lo repitan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eCómo saber que salió bien\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eEl AGENTS.md existe: el global en la carpeta de configuración del usuario (\u003ccode\u003eC:\\Users\\Usuario\\.dsh\u003c/code\u003e), o el del proyecto en la raíz del proyecto.\u003c/li\u003e\n\u003cli\u003eEn una sesión nueva, el agente sigue el formato o los pasos acordados \u003cstrong\u003esin recordatorio\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eSi se usa una skill, existe \u003ccode\u003e.dsh/skills/&lt;nombre&gt;/SKILL.md\u003c/code\u003e dentro del proyecto.\u003c/li\u003e\n\u003cli\u003eEl alumno compara: antes había que explicarlo cada vez, ahora no.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eSolución de referencia\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePetición del alumno:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eA partir de ahora, siempre que hagas un resumen, escríbelo en un archivo \u003ccode\u003e.md\u003c/code\u003e dentro de una carpeta llamada \u003ccode\u003eresumenes\u003c/code\u003e, con el título en negrita, tres secciones fijas (Contexto, Puntos clave, Próximos pasos) y sin más de 300 palabras. Guárdalo como instrucción permanente.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eQué haría el agente:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ePropone escribir esa instrucción en el \u003cstrong\u003eAGENTS.md\u003c/strong\u003e correspondiente, o crear una skill con el procedimiento.\u003c/li\u003e\n\u003cli\u003eMuestra el texto exacto que va a guardar: son &quot;las notas que se dejan al becario antes de que empiece&quot;.\u003c/li\u003e\n\u003cli\u003eEn una \u003cstrong\u003esesión nueva\u003c/strong\u003e, al pedir un resumen, aplica el formato y guarda el archivo donde toca.\u003c/li\u003e\n\u003cli\u003eSi algo no encaja, lo dice y propone corregir la instrucción, no improvisar cada vez.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eErrores frecuentes\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eLo que se ve\u003c/th\u003e\n\u003cth\u003eQué está pasando\u003c/th\u003e\n\u003cth\u003eQué hacer\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eEn la sesión nueva el agente ignora las instrucciones\u003c/td\u003e\n\u003ctd\u003eSe guardaron en un AGENTS.md que no corresponde al proyecto activo, o no se llegaron a guardar\u003c/td\u003e\n\u003ctd\u003eRevisar si es el global o el del proyecto, y la raíz del proyecto en uso\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl alumno cree que el agente &quot;recuerda&quot; la conversación anterior\u003c/td\u003e\n\u003ctd\u003eCada sesión es independiente; lo permanente vive en el AGENTS.md o en la skill\u003c/td\u003e\n\u003ctd\u003eExplicar la diferencia entre memoria permanente y contexto de la conversación\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInstrucciones contradictorias y resultado raro\u003c/td\u003e\n\u003ctd\u003eHay reglas viejas que chocan con las nuevas\u003c/td\u003e\n\u003ctd\u003eLeer el archivo y limpiar: menos reglas y más claras\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLa skill no se usa nunca\u003c/td\u003e\n\u003ctd\u003eRuta o nombre incorrectos: debe estar en \u003ccode\u003e.dsh/skills/&lt;nombre&gt;/SKILL.md\u003c/code\u003e dentro del proyecto\u003c/td\u003e\n\u003ctd\u003eComparar con el ejemplo ya existente \u003ccode\u003e.dsh/skills/precios-gasolineras/SKILL.md\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl agente guarda las notas en un sitio raro\u003c/td\u003e\n\u003ctd\u003eNo se le indicó la ruta y eligió una carpeta del espacio de trabajo\u003c/td\u003e\n\u003ctd\u003eIndicar explícitamente la carpeta de configuración del usuario o la raíz del proyecto\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003ePlan B si no sale\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSi la escritura del AGENTS.md se atasca, que dicte las instrucciones en voz alta y las guarde a mano en un archivo de texto.\u003c/li\u003e\n\u003cli\u003eSi no se atreve con skills, quédate con el AGENTS.md: cubre el mismo objetivo.\u003c/li\u003e\n\u003cli\u003eSi el grupo no tiene proyecto propio, usa la carpeta de ejemplo del seminario.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eSi alguien va muy rápido\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQue convierta un procedimiento largo (&quot;cómo preparo el informe semanal&quot;) en una skill con nombre propio y la pruebe en una sesión nueva desde cero.\u003c/li\u003e\n\u003cli\u003eQue escriba dos instrucciones y compruebe cuál gana cuando se co
