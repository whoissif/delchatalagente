.js instalado.\u003c/strong\u003e Es el único requisito previo; sin él, el arranque falla.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDecide la carpeta de trabajo\u003c/strong\u003e y comprueba que tiene dentro lo que necesitas. No trabajes sobre tu carpeta personal entera.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTen a mano la clave de API\u003c/strong\u003e de DeepSeek (\u003ca href=\"https://platform.deepseek.com/\"\u003ehttps://platform.deepseek.com/\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHaz una copia de seguridad\u003c/strong\u003e de lo que el agente vaya a tocar.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAsume que esto es developer preview:\u003c/strong\u003e cambiará y no ha pasado auditoría de seguridad.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"puesta-en-marcha-5-pasos\"\u003ePuesta en marcha (5 pasos)\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eInstala Node.js\u003c/strong\u003e si no lo tienes. Es el único requisito previo.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAbre la terminal en la carpeta que quieras usar como espacio de trabajo\u003c/strong\u003e y arranca: \u003ccode\u003enpx @deepseek-ai/dsh web\u003c/code\u003e. Así no instalas nada de forma permanente.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEspera a que se abra el navegador\u003c/strong\u003e en \u003ca href=\"http://127.0.0.1:3080\"\u003ehttp://127.0.0.1:3080\u003c/a\u003e. Si no se abre solo, escribe esa dirección a mano. Con \u003ccode\u003e--no-open\u003c/code\u003e arranca sin abrir el navegador.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConfigura el modelo:\u003c/strong\u003e Ajustes (Settings) → Modelos (Models) → pega tu clave de API de DeepSeek (se obtiene en \u003ca href=\"https://platform.deepseek.com/\"\u003ehttps://platform.deepseek.com/\u003c/a\u003e) → guardar. Queda usable al momento, sin reiniciar el servidor.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eElige el espacio de trabajo:\u003c/strong\u003e botón «Elegir espacio de trabajo» (Choose workspace) → añade la carpeta → selecciónala. Hasta que no lo hagas, el cuadro de escribir mensajes está deshabilitado.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cem\u003eAlternativa con instalación global:\u003c/em\u003e \u003ccode\u003enpm install -g @deepseek-ai/dsh\u003c/code\u003e y después \u003ccode\u003edsh web\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eLa carpeta desde la que lanzas \u003ccode\u003edsh\u003c/code\u003e es el espacio de trabajo que se te propone por defecto.\u003c/em\u003e\u003c/p\u003e\n\u003ch3 id=\"como-pedir-bien\"\u003eCómo pedir bien\u003c/h3\u003e\n\u003cp\u003eUna petición vaga se convierte en una petición con \u003cstrong\u003eobjetivo\u003c/strong\u003e, \u003cstrong\u003ealcance\u003c/strong\u003e y \u003cstrong\u003ecriterio de éxito\u003c/strong\u003e.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eEn vez de esto\u003c/th\u003e\n\u003cth\u003ePide esto\u003c/th\u003e\n\u003cth\u003ePor qué\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e«Resúmeme esto»\u003c/td\u003e\n\u003ctd\u003e«Lee los tres PDF de la carpeta \u003cem\u003efacturas\u003c/em\u003e y hazme una tabla con fecha, proveedor e importe total»\u003c/td\u003e\n\u003ctd\u003eLe das el objetivo, dónde mirar y en qué formato quieres la respuesta.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Arréglame la web»\u003c/td\u003e\n\u003ctd\u003e«En la carpeta \u003cem\u003eweb\u003c/em\u003e, dime primero qué enlaces del menú están rotos. No cambies nada todavía»\u003c/td\u003e\n\u003ctd\u003eSeparas el diagnóstico del cambio: primero información, luego decisiones.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Ordena mis archivos»\u003c/td\u003e\n\u003ctd\u003e«Mueve los \u003ccode\u003e.jpg\u003c/code\u003e de \u003cem\u003eDescargas\u003c/em\u003e a \u003cem\u003eFotos\u003c/em\u003e, no borres nada y dime cuántos has movido»\u003c/td\u003e\n\u003ctd\u003eAlcance cerrado y un número al final que puedes comprobar.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Hazme un informe de ventas»\u003c/td\u003e\n\u003ctd\u003e«Con \u003ccode\u003eventas.csv\u003c/code\u003e, escribe un informe de una página con tres conclusiones. No modifiques el csv»\u003c/td\u003e\n\u003ctd\u003eQueda claro qué debe entregar y qué no debe tocar.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Busca información sobre MCP»\u003c/td\u003e\n\u003ctd\u003e«Busca en internet qué es MCP y dame tres enlaces con la fecha de cada uno»\u003c/td\u003e\n\u003ctd\u003ePides fuentes: así puedes verificar de dónde sale cada dato.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Limpia este código»\u003c/td\u003e\n\u003ctd\u003e«Revisa el archivo y propón tres mejoras. Espera mi OK antes de editar»\u003c/td\u003e\n\u003ctd\u003eSi el trabajo toca lo tuyo, mejor ver el plan antes de que actúe.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Hazlo rápido y bien»\u003c/td\u003e\n\u003ctd\u003e«Antes de empezar, resúmeme en cinco líneas qué vas a hacer y qué necesitas de mí»\u003c/td\u003e\n\u003ctd\u003eUn plan corto evita media hora de trabajo en la dirección equivocada.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Revisa la hoja de cálculo»\u003c/td\u003e\n\u003ctd\u003e«Comprueba si el total de cada fila cuadra con sus importes y dime en qué filas no cuadra»\u003c/td\u003e\n\u003ctd\u003eLe das un criterio de éxito comprobable, no una opinión.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Cada semana quiero lo mismo»\u003c/td\u003e\n\u003ctd\u003e«Guarda este procedimiento como skill y repítelo tal cual cuando te lo pida»\u003c/td\u003e\n\u003ctd\u003eLo que se repite se escribe una vez y se reutiliza (ver \u003cstrong\u003eSkill\u003c/strong\u003e).\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«No sé, haz algo con esta carpeta»\u003c/td\u003e\n\u003ctd\u003e«Dime qué hay en la carpeta y tres cosas útiles que se podrían hacer. No cambies nada»\u003c/td\u003e\n\u003ctd\u003eExplorar primero, decidir después.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch3 id=\"frases-que-puedes-copiar-tal-cual\"\u003eFrases que puedes copiar tal cual\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e«Antes de tocar nada, dime qué has entendido y qué piensas hacer.»\u003c/li\u003e\n\u003cli\u003e«Trabaja solo dentro de esta carpeta. Si necesitas algo de fuera, pídemelo.»\u003c/li\u003e\n\u003cli\u003e«No borres ni sobrescribas nada sin avisarme antes.»\u003c/li\u003e\n\u003cli\u003e«Cuando termines, dime exactamente qué archivos has creado o modificado.»\u003c/li\u003e\n\u003cli\u003e«Cita la fuente de cada dato que me des.»\u003c/li\u003e\n\u003cli\u003e«Si algo no lo sabes con seguridad, dilo en vez de inventártelo.»\u003c/li\u003e\n\u003cli\u003e«Termina con un resumen de cinco líneas: qué has hecho y qué queda pendiente.»\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"que-hacer-cuando-pasa-esto\"\u003eQué hacer cuando pasa esto\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eSituación\u003c/th\u003e\n\u003cth\u003eQué significa\u003c/th\u003e\n\u003cth\u003eQué haces\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eAparece un aviso de aprobación\u003c/td\u003e\n\u003ctd\u003eEl agente quiere hacer algo que su política de permisos no le deja hacer solo. «Permitir una vez» es \u003cstrong\u003esolo esa vez\u003c/strong\u003e: no concede permiso permanente.\u003c/td\u003e\n\u003ctd\u003eLee con calma qué te pide. Si lo entiendes y tiene sentido, permite; si no, deniega y pídele otra vía. Es incómodo a propósito.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eQuiere escribir fuera de la carpeta\u003c/td\u003e\n\u003ctd\u003eSu escritura está limitada al espacio de trabajo y ha intentado salirse.\u003c/td\u003e\n\u003ctd\u003eMueve o copia lo necesario dentro de la carpeta de trabajo, o cambia de espacio de trabajo. No le des acceso total por comodidad.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl cuadro de mensajes está deshabilitado\u003c/td\u003e\n\u003ctd\u003eTodavía no hay espacio de trabajo elegido, así que el agente no sabe dónde trabajar.\u003c/td\u003e\n\u003ctd\u003eBotón «Elegir espacio de trabajo» (Choose workspace) → añade la carpeta → selecciónala.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl agente lleva mucho rato\u003c/td\u003e\n\u003ctd\u003eEstá encadenando pasos, esperando una aprobación tuya o tiene una tarea en segundo plano en marcha.\u003c/td\u003e\n\u003ctd\u003ePídele un resumen de en qué punto está. Si no avanza, deténlo y parte la tarea en trozos más pequeños.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSe equivoca y va a peor\u003c/td\u003e\n\u003ctd\u003eEstá iterando sobre un error y cada intento toca más cosas.\u003c/td\u003e\n\u003ctd\u003eDeténlo ya. Pídele que explique qué ha cambiado y cómo deshacerlo, y restaura desde tu copia de seguridad si hace falta.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eQuieres pararlo\u003c/td\u003e\n\u003ctd\u003eSe corta el trabajo en curso, pero lo que ya ha hecho se queda hecho.\u003c/td\u003e\n\u003ctd\u003eUsa el control de detener de la interfaz. Si no lo encuentras, escríbele «para» y espera a que termine el paso actual. Luego revisa lo que haya tocado.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eQuieres que recuerde algo para siempre\u003c/td\u003e\n\u003ctd\u003eEl contexto de la conversación no se conserva entre sesiones; la memoria escrita sí.\u003c/td\u003e\n\u003ctd\u003eEscríbelo en AGENTS.md: el global (en tu carpeta de configuración del usuario) vale para todo; el de la raíz del proyecto, solo para ese proyecto.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eQuieres que repita una tarea igual cada semana\u003c/td\u003e\n\u003ctd\u003eNecesitas un procedimiento guardado, no volver a explicarlo cada vez.\u003c/td\u003e\n\u003ctd\u003eConviértelo en skill: \u003ccode\u003e.dsh/skills/&lt;nombre&gt;/SKILL.md\u003c/code\u003e dentro del proyecto. Después pídeselo por su nombre.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl resultado parece correcto, pero quieres comprobarlo\u003c/td\u003e\n\u003ctd\u003e«Parece» no es «está»: el agente puede equivocarse con total seguridad.\u003c/td\u003e\n\u003ctd\u003ePídele las fuentes, el archivo exacto que ha tocado o el comando que ha usado, y compruébalo tú: abre el archivo y cuenta.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTe preocupa la privacidad de unos datos\u003c/td\u003e\n\u003ctd\u003eEl agente trabaja con lo que le des y con las herramientas que tengas conectadas.\u003c/td\u003e\n\u003ctd\u003eNo pegues credenciales ni datos personales si no hacen falta: usa datos de ejemplo o trabaja en local. Revisa qué servicios tienes conectados antes de empezar.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch3 id=\"checklist-de-30-segundos-antes-de-aprobar\"\u003eChecklist de 30 segundos antes de aprobar\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e¿Entiendo \u003cstrong\u003equé\u003c/strong\u003e quiere hacer exactamente?\u003c/li\u003e\n\u003cli\u003e¿Sobre \u003cstrong\u003equé carpeta o archivo\u003c/strong\u003e lo va a hacer, y está dentro de mi espacio de trabajo?\u003c/li\u003e\n\u003cli\u003e¿Podría \u003cstrong\u003edeshacerlo\u003c/strong\u003e si sale mal? ¿Tengo copia?\u003c/li\u003e\n\u003cli\u003e¿Hay \u003cstrong\u003ecredenciales o datos personales\u003c/strong\u003e de por medio?\u003c/li\u003e\n\u003cli\u003eSi dudo: \u003cstrong\u003edeniego\u003c/strong\u003e y le pido otra vía. «Permitir una vez» es solo esa vez.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"las-7-reglas-de-oro\"\u003eLas 7 reglas de oro\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eTrabaja dentro de tu espacio de trabajo.\u003c/strong\u003e Lo de fuera es la excepción, no la norma.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo apruebes lo que no entiendes.\u003c/strong\u003e El aviso de aprobación existe para que lo leas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePide el plan antes del cambio\u003c/strong\u003e cuando vaya a tocar tus archivos (modo plan).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCopia de seguridad antes\u003c/strong\u003e de cualquier cambio masivo. Sin copia no hay marcha atrás.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eExige pruebas:\u003c/strong\u003e fuente, archivo tocado y cómo comprobarlo. Y compruébalo tú.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePermiso mínimo:\u003c/strong\u003e ni acceso total ni credenciales que no hagan falta.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLa última palabra es tuya.\u003c/strong\u003e Revisa el resultado antes de darlo por bueno.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"limites-que-conviene-recordar\"\u003eLímites que conviene recordar\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eEl agente \u003cstrong\u003ese equivoca con seguridad\u003c/strong\u003e y puede \u003cstrong\u003eactuar rápido sobre cosas reales\u003c/strong\u003e: archivos de verdad, carpetas de verdad, datos de verdad.\u003c/li\u003e\n\u003cli\u003eEl \u003cstrong\u003esandbox y las aprobaciones reducen el riesgo, pero no lo eliminan\u003c/strong\u003e: no garantizan aislamiento y no deben ser tu único control de seguridad.\u003c/li\u003e\n\u003cli\u003eEl proyecto está en \u003cstrong\u003edeveloper preview\u003c/strong\u003e: itera rápido, habrá cambios que rompan compatibilidad y \u003cstrong\u003eno ha pasado auditoría de seguridad\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003ePor eso: \u003cstrong\u003emínimo privilegio\u003c/strong\u003e, mejor una \u003cstrong\u003emáquina virtual o un contenedor desechable\u003c/strong\u003e, \u003cstrong\u003ecopias de seguridad\u003c/strong\u003e, \u003cstrong\u003enada de credenciales a la vista\u003c/strong\u003e y \u003cstrong\u003erevisar plugins y comandos antes de permitirlos\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eY recuerda: \u003cstrong\u003ela responsabilidad de revisar es tuya\u003c/strong\u003e, no del agente.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"datos-de-referencia\"\u003eDatos de referencia\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eArranque sin instalar nada: \u003ccode\u003enpx @deepseek-ai/dsh web\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eInstalación global: \u003ccode\u003enpm install -g @deepseek-ai/dsh\u003c/code\u003e y después \u003ccode\u003edsh web\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eInterfaz web: \u003ca href=\"http://127.0.0.1:3080\"\u003ehttp://127.0.0.1:3080\u003c/a\u003e (\u003ccode\u003e--no-open\u003c/code\u003e arranca sin abrir el navegador)\u003c/li\u003e\n\u003cli\u003eConfiguración del usuario en Windows: \u003ccode\u003eC:\\Users\\Usuario\\.dsh\u003c/code\u003e (variable de entorno \u003ccode\u003eDSH_HOME\u003c/code\u003e), con las sesiones, los perfiles y el AGENTS.md global\u003c/li\u003e\n\u003cli\u003eMemoria permanente: AGENTS.md global en la carpeta de configuración del usuario y AGENTS.md en la raíz del proyecto\u003c/li\u003e\n\u003cli\u003eSkills del proyecto: \u003ccode\u003e.dsh/skills/&lt;nombre&gt;/SKILL.md\u003c/code\u003e (ejemplo: \u003ccode\u003e.dsh/skills/precios-gasolineras/SKILL.md\u003c/code\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n","texto":"19 min de lectura Documento 05 Glosario y chuleta — «Del chat al agente: qué es un harness y cómo se usa» Seminario práctico con DeepSeek Harness ( dsh ). La Parte 1 es el glosario; la Parte 2 , la chuleta para tener al lado del portátil. Parte 1 — Glosario Términos en orden alfabético, explicados en lenguaje llano y con un ejemplo corto. Cuando un concepto se apoya en otro, aparece marcado como (ver …) . Acceso total — El nivel de sandbox más permisivo: el agente puede leer y escribir en todo el ordenador. Se elige a conciencia, nunca por comodidad. En la práctica: tiene sentido en una máquina de pruebas o desechable; en tu ordenador de diario, casi nunca. Agente — Programa que, además de responderte, puede hacer cosas por su cuenta en tu ordenador: leer y escribir archivos, ejecutar comandos, buscar en internet. En la práctica: le dices «ordena las facturas de esta carpeta» y las ordena él; tú revisas el resultado después. AGENTS.md — Archivo de texto con las normas que quieres que el agente siga siempre. Puede ser global (en tu carpeta de configuración) o de un proyecto concreto (en la raíz del proyecto). En la práctica: «no borres archivos nunca; avísame antes de instalar nada». Alucinación — Cuando el modelo se inventa un dato, una cita o un comando con total seguridad. No miente a propósito: rellena huecos. En la práctica: te da un enlace que no existe. Por eso se piden fuentes y se comprueba todo (ver Verificación ). API — La puerta que usan los programas para hablar con un servicio por internet, sin pasar por una web ni por una persona. En la práctica: el harness usa la API de DeepSeek para pedirle respuestas al modelo. Aprobación — El aviso que aparece cuando el agente quiere hacer algo que no tiene permitido hacer solo, para que tú digas sí o no antes de que lo haga. En la práctica: quiere escribir en una carpeta que está fuera de su zona y te pide permiso (ver Sandbox ). Bucle agéntico — El ciclo de trabajo del agente: piensa un paso, usa una herramienta, mira el resultado y repite hasta acabar. En la práctica: buscar → leer → corregir → volver a buscar. Por eso tarda y da varios pasos aunque tú escribas una sola frase. Chat — Conversación en la que el modelo solo escribe texto y el trabajo lo haces tú después. Es un consultor por teléfono. En la práctica: te explica cómo ordenar tus fotos; las ordenas tú. Clave de API — Contraseña larga que identifica tu cuenta y autoriza el uso del servicio. Se guarda en Ajustes → Modelos y no se comparte con nadie. En la práctica: se obtiene en https://platform.deepseek.com/ y funciona como la llave de tu casa: quien la tenga, entra. Comando — Orden que se le da al ordenador escribiéndola, casi siempre en la terminal. En la práctica: npx @deepseek-ai/dsh web es un comando. Se copia, se pega y se pulsa Intro. Contenedor — Entorno aislado y desechable donde puedes ejecutar el agente sin tocar tu ordenador de verdad. En la práctica: si algo se rompe dentro, tu equipo no se entera. Es una de las formas recomendadas de probar. Contexto — Todo lo que el agente tiene delante en ese momento: tu petición, la conversación, los archivos que ha leído y las respuestas de las herramientas. Es su mesa de trabajo. En la práctica: si la mesa se llena de papeles, se pierde; conviene empezar una sesión nueva (ver Sesión ). Copia de seguridad — Duplicado de tus archivos, guardado aparte, para poder volver atrás si algo sale mal. En la práctica: antes de dejar que el agente toque 200 archivos, haz una copia. Es tu red de seguridad. Credencial — Cualquier dato que da acceso a algo tuyo: contraseñas, claves de API, tokens de acceso, datos de tarjeta. En la práctica: no las pegues en una petición si no son imprescindibles. Lo que escribes viaja al servicio. DeepSeek Harness (dsh) — El programa de este seminario: la aplicación que convierte un modelo en un agente, con interfaz web, herramientas y permisos. Se arranca con npx @deepseek-ai/dsh web . En la práctica: es el coche completo; el modelo es solo el motor (ver Harness , ver LLM ). Delegación — Pedirle al agente que encargue una parte del trabajo a otro agente y te devuelva el resultado. En la práctica: «que otro agente revise estos 40 archivos y me traiga un resumen». Tú sigues hablando con el primero. Detener (interrumpir) — Cortar el trabajo que el agente está haciendo ahora mismo. Lo que ya ha hecho se queda hecho. En la práctica: tras detenerlo, pídele la lista de archivos que ha tocado y revísalos. Espacio de trabajo (workspace) — La carpeta que le entregas al agente como su zona de trabajo. Lo que haga dentro es lo normal; lo de fuera pide permiso. En la práctica: si abres el harness desde la carpeta del proyecto, esa carpeta es la que se te propone como espacio de trabajo. Esfuerzo de razonamiento — Cuánto «piensa» el modelo antes de responder. Más esfuerzo suele dar mejores respuestas en tareas difíciles, pero tarda más y consume más. En la práctica: poco esfuerzo para un resumen rápido; más esfuerzo para revisar un contrato o comparar cifras. Harness — La aplicación que envuelve al modelo y le da manos, normas y mandos: herramientas, permisos, memoria e interfaz donde hablar con él. En la práctica: el modelo es el motor; el harness es el coche completo, con volante, frenos y salpicadero. Herramienta — Cada una de las capacidades que el agente puede usar para actuar: leer archivos, escribir o modificar archivos, ejecutar comandos en la terminal, buscar y leer en internet, lanzar tareas en segundo plano, preguntarte algo, delegar en otro agente, mantener una lista de tareas o abrir el modo plan. En la práctica: cuando el agente «abre» un archivo, está usando la herramienta de lectura. Interfaz web — La página del navegador donde escribes al agente y ves lo que va haciendo. En este harness se sirve en http://127.0.0.1:3080 y solo existe mientras el servidor está arrancado. En la práctica: si cierras la terminal donde arrancaste dsh , esa página deja de responder. Iteración — Cada vuelta del trabajo: probar, ver qué sale, corregir y volver a probar. El agente trabaja así, no de un tirón. En la práctica: escribe un borrador, lo lee, lo mejora. Por eso su primer resultado no siempre es el bueno. LLM (modelo) — El programa entrenado con muchísimo texto que sabe redactar y predecir lenguaje. Solo texto: no ve tus archivos ni ejecuta nada por sí mismo. En la práctica: ChatGPT, DeepSeek o Gemini son modelos (o servicios construidos alrededor de uno). Máquina virtual — Ordenador simulado dentro del tuyo, con sus propios archivos, que puedes borrar sin consecuencias. En la práctica: es el sitio recomendado para dejar trabajar a un agente en fase de pruebas. MCP — Estándar que permite conectar herramientas que ya existen (GitHub, bases de datos, gestores de incidencias, servicios de memoria) para que aparezcan como herramientas nuevas del agente. En la práctica: es un enchufe estándar, tipo USB: si la herramienta trae ese enchufe, el agente la puede usar. Memoria — Lo que el agente conserva entre sesiones, normalmente porque está escrito en un archivo que vuelve a leer al empezar. En la práctica: lo que pongas en AGENTS.md sigue ahí mañana; lo hablado en el chat, no (ver Contexto ). Modo plan (plan) — Forma de trabajar en la que el agente primero te cuenta qué piensa hacer y no toca nada hasta que le das el visto bueno. En la práctica: imprescindible antes de dejarle modificar 200 archivos. Node.js — Programa que hay que tener instalado en el ordenador para poder arrancar el harness. Es el requisito previo. En la práctica: si el comando de arranque se queja de que no encuentra Node, es justo esto lo que falta. Permiso — La regla que decide qué puede hacer el agente sin preguntar y qué no. Lo que queda fuera de lo permitido dispara un aviso de aprobación. En la práctica: puede leer en toda la carpeta de trabajo, pero escribir solo en una parte. Plugin — Pieza que se añade al harness para darle capacidades nuevas, a veces conectando servicios externos. En la práctica: un plugin puede añadir una herramienta que no venía de serie. No es lo mismo que el harness (ver Harness ). Política de permisos — El conjunto de ajustes que fija hasta dónde llega el agente y cuándo tiene que preguntar. Por defecto, pregunta. En la práctica: combina el nivel de acceso del sandbox con la política de aprobaciones (por defecto: preguntar). Prompt — El texto que le escribes al agente: tu petición, el encargo. Cuanto más claro el encargo, mejor el resultado. En la práctica: «resume este PDF en cinco puntos» funciona mucho mejor que «mírame esto». Proveedor — La empresa o servicio que pone el modelo a disposición de los programas. En la práctica: en este seminario, DeepSeek: te registras, sacas tu clave de API y el harness usa sus modelos. Ruta (ruta de archivo) — La dirección que indica dónde está un archivo o una carpeta dentro del ordenador. En la práctica: C:\\Users\\Usuario\\.dsh es una ruta: la carpeta de configuración del usuario en Windows. Sandbox — Zona de trabajo delimitada donde el agente puede moverse. Hay niveles: solo lectura; escritura limitada al espacio de trabajo; acceso total. En la práctica: dentro de la zona trabaja sin molestarte; fuera, salta el «¿seguro?». Sesión — Cada conversación con el agente, con su propio hilo y su propio contexto. Se guardan y puedes volver a ellas. En la práctica: si el contexto se llena, abres una sesión nueva y arrastras solo lo importante. Skill — Procedimiento guardado que el agente puede repetir cuando se lo pides. Vive en la carpeta .dsh/skills/ nombre /SKILL.md dentro del proyecto. En la práctica: son recetas de cocina: los pasos ya escritos, para no explicarlos cada vez. En el proyecto del seminario ya existe .dsh/skills/precios-gasolineras/SKILL.md . Tarea en segundo plano — Trabajo largo que el agente lanza y deja corriendo mientras sigue hablando contigo. Te avisa cuando termina. En la práctica: procesar 300 archivos mientras tú preparas el siguiente encargo. Terminal — La ventana de texto donde se le dan órdenes al ordenador escribiendo, en vez de haciendo clic. Es donde se arranca el harness. En la práctica: ahí escribes npx @deepseek-ai/dsh web y pulsas Intro. Token — Trozo pequeño de texto (una palabra, media palabra, un signo) con el que el modelo cuenta y procesa. El precio y los límites se miden en tokens. En la práctica: «gasolineras» puede ser dos o tres tokens. No son letras ni palabras exactas. Ventana de contexto — El tamaño máximo de contexto que cabe de una vez. Cuando se supera, lo más antiguo se cae o se resume. En la práctica: hilos muy largos con muchos archivos pegados acaban empujando fuera lo del principio. Verificación — Comprobar el resultado en lugar de creértelo: abrir el archivo, mirar la fuente, contar las filas, repetir el cálculo. En la práctica: el agente dice «he actualizado 12 filas»; tú abres el archivo y las cuentas. Palabras que se confunden Se parecen, pero no son lo mismo. Una frase para cada pareja: Modelo vs. harness — El modelo es el motor que redacta; el harness es el coche entero, con volante, frenos y salpicadero. Chat vs. agente — El chat es un consultor por teléfono (te dice qué hacer y lo haces tú); el agente es un becario con acceso a tu ordenador (lo hace y tú revisas). Contexto vs. memoria — El contexto es lo que tiene delante ahora mismo (la mesa de trabajo); la memoria es lo que queda guardado para la próxima vez. Permiso vs. aprobación — El permiso es la regla escrita; la aprobación es el «¿seguro?» que te llega cuando algo se sale de esa regla. Harness vs. plugin — El harness es la aplicación completa; un plugin es una pieza que le añades para darle una capacidad nueva. Sandbox vs. espacio de trabajo — El sandbox es el nivel de libertad (leer, escribir, acceso total); el espacio de trabajo es la carpeta concreta donde ese nivel se aplica. Parte 2 — Chuleta de una página Antes de empezar (cinco minutos) Node.js instalado. Es el único requisito previo; sin él, el arranque falla. Decide la carpeta de trabajo y comprueba que tiene dentro lo que necesitas. No trabajes sobre tu carpeta personal entera. Ten a mano la clave de API de DeepSeek ( https://platform.deepseek.com/ ). Haz una copia de seguridad de lo que el agente vaya a tocar. Asume que esto es developer preview: cambiará y no ha pasado auditoría de seguridad. Puesta en marcha (5 pasos) Instala Node.js si no lo tienes. Es el único requisito previo. Abre la terminal en la carpeta que quieras usar como espacio de trabajo y arranca: npx @deepseek-ai/dsh web . Así no instalas nada de forma permanente. Espera a que se abra el navegador en http://127.0.0.1:3080 . Si no se abre solo, escribe esa dirección a mano. Con --no-open arranca sin abrir el navegador. Configura el modelo: Ajustes (Settings) → Modelos (Models) → pega tu clave de API de DeepSeek (se obtiene en https://platform.deepseek.com/ ) → guardar. Queda usable al momento, sin reiniciar el servidor. Elige el espacio de trabajo: botón «Elegir espacio de trabajo» (Choose workspace) → añade la carpeta → selecciónala. Hasta que no lo hagas, el cuadro de escribir mensajes está deshabilitado. Alternativa con instalación global: npm install -g @deepseek-ai/dsh y después dsh web . La carpeta desde la que lanzas dsh es el espacio de trabajo que se te propone por defecto. Cómo pedir bien Una petición vaga se convierte en una petición con objetivo , alcance y criterio de éxito . En vez de esto Pide esto Por qué «Resúmeme esto» «Lee los tres PDF de la carpeta facturas y hazme una tabla con fecha, proveedor e importe total» Le das el objetivo, dónde mirar y en qué formato quieres la respuesta. «Arréglame la web» «En la carpeta web , dime primero qué enlaces del menú están rotos. No cambies nada todavía» Separas el diagnóstico del cambio: primero información, luego decisiones. «Ordena mis archivos» «Mueve los .jpg de Descargas a Fotos , no borres nada y dime cuántos has movido» Alcance cerrado y un número al final que puedes comprobar. «Hazme un informe de ventas» «Con ventas.csv , escribe un informe de una página con tres conclusiones. No modifiques el csv» Queda claro qué debe entregar y qué no debe tocar. «Busca información sobre MCP» «Busca en internet qué es MCP y dame tres enlaces con la fecha de cada uno» Pides fuentes: así puedes verificar de dónde sale cada dato. «Limpia este código» «Revisa el archivo y propón tres mejoras. Espera mi OK antes de editar» Si el trabajo toca lo tuyo, mejor ver el plan antes de que actúe. «Hazlo rápido y bien» «Antes de empezar, resúmeme en cinco líneas qué vas a hacer y qué necesitas de mí» Un plan corto evita media hora de trabajo en la dirección equivocada. «Revisa la hoja de cálculo» «Comprueba si el total de cada fila cuadra con sus importes y dime en qué filas no cuadra» Le das un criterio de éxito comprobable, no una opinión. «Cada semana quiero lo mismo» «Guarda este procedimiento como skill y repítelo tal cual cuando te lo pida» Lo que se repite se escribe una vez y se reutiliza (ver Skill ). «No sé, haz algo con esta carpeta» «Dime qué hay en la carpeta y tres cosas útiles que se podrían hacer. No cambies nada» Explorar primero, decidir después. Frases que puedes copiar tal cual «Antes de tocar nada, dime qué has entendido y qué piensas hacer.» «Trabaja solo dentro de esta carpeta. Si necesitas algo de fuera, pídemelo.» «No borres ni sobrescribas nada sin avisarme antes.» «Cuando termines, dime exactamente qué archivos has creado o modificado.» «Cita la fuente de cada dato que me des.» «Si algo no lo sabes con seguridad, dilo en vez de inventártelo.» «Termina con un resumen de cinco líneas: qué has hecho y qué queda pendiente.» Qué hacer cuando pasa esto Situación Qué significa Qué haces Aparece un aviso de aprobación El agente quiere hacer algo que su política de permisos no le deja hacer solo. «Permitir una vez» es solo esa vez : no concede permiso permanente. Lee con calma qué te pide. Si lo entiendes y tiene sentido, permite; si no, deniega y pídele otra vía. Es incómodo a propósito. Quiere escribir fuera de la carpeta Su escritura está limitada al espacio de trabajo y ha intentado salirse. Mueve o copia lo necesario dentro de la carpeta de trabajo, o cambia de espacio de trabajo. No le des acceso total por comodidad. El cuadro de mensajes está deshabilitado Todavía no hay espacio de trabajo elegido, así que el agente no sabe dónde trabajar. Botón «Elegir espacio de trabajo» (Choose workspace) → añade la carpeta → selecciónala. El agente lleva mucho rato Está encadenando pasos, esperando una aprobación tuya o tiene una tarea en segundo plano en marcha. Pídele un resumen de en qué punto está. Si no avanza, deténlo y parte la tarea en trozos más pequeños. Se equivoca y va a peor Está iterando sobre un error y cada intento toca más cosas. Deténlo ya. Pídele que explique qué ha cambiado y cómo deshacerlo, y restaura desde tu copia de seguridad si hace falta. Quieres pararlo Se corta el trabajo en curso, pero lo que ya ha hecho se queda hecho. Usa el control de detener de la interfaz. Si no lo encuentras, escríbele «para» y espera a que termine el paso actual. Luego revisa lo que haya tocado. Quieres que recuerde algo para siempre El contexto de la conversación no se conserva entre sesiones; la memoria escrita sí. Escríbelo en AGENTS.md: el global (en tu carpeta de configuración del usuario) vale para todo; el de la raíz del proyecto, solo para ese proyecto. Quieres que repita una tarea igual cada semana Necesitas un procedimiento guardado, no volver a explicarlo cada vez. Conviértelo en skill: .dsh/skills/ nombre /SKILL.md dentro del proyecto. Después pídeselo por su nombre. El resultado parece correcto, pero quieres comprobarlo «Parece» no es «está»: el agente puede equivocarse con total seguridad. Pídele las fuentes, el archivo exacto que ha tocado o el comando que ha usado, y compruébalo tú: abre el archivo y cuenta. Te preocupa la privacidad de unos datos El agente trabaja con lo que le des y con las herramientas que tengas conectadas. No pegues credenciales ni datos personales si no hacen falta: usa datos de ejemplo o trabaja en local. Revisa qué servicios tienes conectados antes de empezar. Checklist de 30 segundos antes de aprobar ¿Entiendo qué quiere hacer exactamente? ¿Sobre qué carpeta o archivo lo va a hacer, y está dentro de mi espacio de trabajo? ¿Podría deshacerlo si sale mal? ¿Tengo copia? ¿Hay credenciales o datos personales de por medio? Si dudo: deniego y le pido otra vía. «Permitir una vez» es solo esa vez. Las 7 reglas de oro Trabaja dentro de tu espacio de trabajo. Lo de fuera es la excepción, no la norma. No apruebes lo que no entiendes. El aviso de aprobación existe para que lo leas. Pide el plan antes del cambio cuando vaya a tocar tus archivos (modo plan). Copia de seguridad antes de cualquier cambio masivo. Sin copia no hay marcha atrás. Exige pruebas: fuente, archivo tocado y cómo comprobarlo. Y compruébalo tú. Permiso mínimo: ni acceso total ni credenciales que no hagan falta. La última palabra es tuya. Revisa el resultado antes de darlo por bueno. Límites que conviene recordar El agente se equivoca con seguridad y puede actuar rápido sobre cosas reales : archivos de verdad, carpetas de verdad, datos de verdad. El sandbox y las aprobaciones reducen el riesgo, pero no lo eliminan : no garantizan aislamiento y no deben ser tu único control de seguridad. El proyecto está en developer preview : itera rápido, habrá cambios que rompan compatibilidad y no ha pasado auditoría de seguridad . Por eso: mínimo privilegio , mejor una máquina virtual o un contenedor desechable , copias de seguridad , nada de credenciales a la vista y revisar plugins y comandos antes de permitirlos . Y recuerda: la responsabilidad de revisar es tuya , no del agente. Datos de referencia Arranque sin instalar nada: npx @deepseek-ai/dsh web Instalación global: npm install -g @deepseek-ai/dsh y después dsh web Interfaz web: http://127.0.0.1:3080 ( --no-open arranca sin abrir el navegador) Configuración del usuario en Windows: C:\\Users\\Usuario\\.dsh (variable de entorno DSH_HOME ), con las sesiones, los perfiles y el AGENTS.md global Memoria permanente: AGENTS.md global en la carpeta de configuración del usuario y AGENTS.md en la raíz del proyecto Skills del proyecto: .dsh/skills/ nombre /SKILL.md (ejemplo: .dsh/skills/precios-gasolineras/SKILL.md )"},{"id":"doc-00","grupo":"consulta","titulo":"Guía del paquete","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 8 min de lectura\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M6 3h8l4 4v14H6z\"/\u003e\u003cpath d=\"M14 3v5h5\"/\u003e\u003cpath d=\"M9 13h6M9 17h6\"/\u003e\u003c/svg\u003e Documento 00\u003c/span\u003e\n      \u003c/div\u003e\u003ch1 id=\"seminario-del-chat-al-agente-paquete-de-material-didactico\"\u003eSeminario «Del chat al agente» — Paquete de material didáctico\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003eTítulo:\u003c/strong\u003e Del chat al agente: qué es un harness y cómo se usa.\n\u003cstrong\u003eDuración:\u003c/strong\u003e 150 minutos de núcleo, ampliable a 180.\n\u003cstrong\u003eAudiencia:\u003c/strong\u003e usuarios corrientes de chat/bot. Gente que usa ChatGPT, DeepSeek o Gemini como chatbot y no ha programado nunca.\n\u003cstrong\u003eFormato:\u003c/strong\u003e sesión práctica, con el portátil delante. Cada alumno arranca el harness y lo usa.\n\u003cstrong\u003eHerramienta:\u003c/strong\u003e DeepSeek Harness (\u003ccode\u003edsh\u003c/code\u003e).\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"que-hay-en-esta-carpeta\"\u003eQué hay en esta carpeta\u003c/h2\u003e\n\u003cp\u003eEl paquete tiene \u003cstrong\u003etres capas\u003c/strong\u003e: los documentos fuente, los formatos para usarlos en clase y las herramientas para regenerarlos.\u003c/p\u003e\n\u003ch3 id=\"1-los-documentos-markdown-la-fuente-de-todo\"\u003e1. Los documentos (Markdown, la fuente de todo)\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eArchivo\u003c/th\u003e\n\u003cth\u003ePara quién\u003c/th\u003e\n\u003cth\u003ePara qué sirve\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e01_guion_instructor.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eInstructor\u003c/td\u003e\n\u003ctd\u003eEl guion de la sesión, minuto a minuto: qué decir, qué demostrar, qué recortar si vas con retraso y qué hacer si algo falla en directo.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e02_apuntes_alumno.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAlumno\u003c/td\u003e\n\u003ctd\u003eLos apuntes que se lleva. Escritos para entenderse \u003cstrong\u003esin\u003c/strong\u003e el instructor delante.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e03_laboratorio.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAlumno\u003c/td\u003e\n\u003ctd\u003eEl cuaderno de prácticas: cinco prácticas paso a paso, con comprobaciones y una hoja de registro.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e04_soluciones_y_errores.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eInstructor\u003c/td\u003e\n\u003ctd\u003eQué debería pasar en cada práctica, errores frecuentes con su solución, problemas técnicos de sala y frases de rescate.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e05_glosario_chuleta.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAlumno\u003c/td\u003e\n\u003ctd\u003eGlosario de unos 30 términos en lenguaje llano y una chuleta de una página para imprimir.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e06_evaluacion.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eInstructor\u003c/td\u003e\n\u003ctd\u003eCuestionario inicial de diagnóstico, cuestionario final con clave, rúbrica y encuesta de satisfacción.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e07_instalacion_previa.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eInstructor y alumno\u003c/td\u003e\n\u003ctd\u003eEl mensaje para enviar antes del seminario, la guía de instalación paso a paso y la lista de comprobación del instructor.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eOrden de lectura rápido:\u003c/strong\u003e si solo tienes diez minutos para prepararte, lee el archivo \u003ccode\u003e01\u003c/code\u003e y la tabla de problemas técnicos del \u003ccode\u003e04\u003c/code\u003e.\u003c/p\u003e\n\u003ch3 id=\"2-los-formatos-lo-que-se-usa-en-clase\"\u003e2. Los formatos (lo que se usa en clase)\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eFormato\u003c/th\u003e\n\u003cth\u003eDónde\u003c/th\u003e\n\u003cth\u003ePara qué\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003ePágina de entrada\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eindex.html\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePunto de partida: enlaza el curso, las diapositivas, los PDF y la carpeta de práctica. Se abre con doble clic.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eCurso interactivo\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ecurso/index.html\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eLos documentos organizados en 4 módulos y 27 lecciones, con búsqueda, progreso guardado en el navegador y los dos cuestionarios corregidos al momento. Sin servidor y sin conexión.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eDiapositivas\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eslides/diapositivas.html\u003c/code\u003e y \u003ccode\u003eslides/diapositivas.pdf\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e59 diapositivas para proyectar, con \u003cstrong\u003enotas del presentador\u003c/strong\u003e en todas ellas (tecla \u003ccode\u003eN\u003c/code\u003e). El PDF imprime una diapositiva por página.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003ePDF imprimibles\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003epdf/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eUn PDF por documento, más \u003ccode\u003ecompleto.pdf\u003c/code\u003e con los ocho en un volumen de 62 páginas.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eCarpeta de práctica\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003epractica_ejemplo/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e12 archivos con datos inventados para los ejercicios. Se elige como espacio de trabajo del agente.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eFuente Marp\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eslides/slides.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eLa presentación en Markdown de Marp, por si prefieres editarla en VS Code con la extensión Marp o exportarla con \u003ccode\u003emarp-cli\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch3 id=\"3-las-herramientas-build\"\u003e3. Las herramientas (\u003ccode\u003ebuild/\u003c/code\u003e)\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eScript\u003c/th\u003e\n\u003cth\u003eQué hace\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebuild/build.mjs\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGenera el curso y los HTML imprimibles a partir de los Markdown.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebuild/build_slides.mjs\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGenera la baraja de diapositivas a partir de \u003ccode\u003eslides.md\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebuild/hacer_pdf.py\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGenera los 10 PDF con fpdf2, sin navegador.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebuild/verificar_curso.mjs\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e33 comprobaciones del curso en un DOM simulado.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebuild/verificar_slides.mjs\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e25 comprobaciones de las diapositivas.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ebuild/verificar_pdf.py\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eComprueba páginas, texto extraíble, tildes y frases del original en cada PDF.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003eLas dependencias ya están instaladas dentro de \u003ccode\u003ebuild/\u003c/code\u003e, así que todo se regenera \u003cstrong\u003esin conexión\u003c/strong\u003e.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"como-se-usa-el-paquete\"\u003eCómo se usa el paquete\u003c/h2\u003e\n\u003ch3 id=\"antes-del-seminario-3-5-dias-antes\"\u003eAntes del seminario (3-5 días antes)\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eLee \u003ccode\u003e01_guion_instructor.md\u003c/code\u003e entero una vez, de principio a fin. Es el único imprescindible.\u003c/li\u003e\n\u003cli\u003eEnvía a los alumnos la Parte A de \u003ccode\u003e07_instalacion_previa.md\u003c/code\u003e. \u003cstrong\u003eEsto no es opcional:\u003c/strong\u003e si la mitad del grupo llega sin Node.js instalado, el primer bloque práctico se convierte en una clase de instalación y se pierde el seminario.\u003c/li\u003e\n\u003cli\u003eTrabaja la Parte C del \u003ccode\u003e07\u003c/code\u003e: la lista de comprobación del día anterior.\u003c/li\u003e\n\u003cli\u003ePrepara una carpeta de práctica de ejemplo, con archivos variados y \u003cstrong\u003esin nada sensible\u003c/strong\u003e, y haz una copia de seguridad aparte.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"durante-el-seminario\"\u003eDurante el seminario\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eGuion en pantalla o impreso (archivo \u003ccode\u003e01\u003c/code\u003e).\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e04_soluciones_y_errores.md\u003c/code\u003e abierto en otra ventana: es tu red de seguridad cuando alguien levanta la mano.\u003c/li\u003e\n\u003cli\u003eReparte \u003ccode\u003e02_apuntes_alumno.md\u003c/code\u003e y \u003ccode\u003e03_laboratorio.md\u003c/code\u003e al empezar, o pide que los abran en el portátil.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e06_evaluacion.md\u003c/code\u003e al principio (diagnóstico) y al final (evaluación y encuesta).\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e05_glosario_chuleta.md\u003c/code\u003e al final, como material de consulta para llevar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"despues\"\u003eDespués\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eEnvía por correo el paquete completo, incluida la chuleta.\u003c/li\u003e\n\u003cli\u003eRevisa las encuestas antes de la siguiente edición: el archivo \u003ccode\u003e06\u003c/code\u003e incluye una tabla de duración por bloque para que ajustes el ritmo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"las-analogias-del-paquete-no-las-cambies-a-la-ligera\"\u003eLas analogías del paquete (no las cambies a la ligera)\u003c/h2\u003e\n\u003cp\u003eTodo el material usa \u003cstrong\u003elas mismas ocho comparaciones\u003c/strong\u003e a propósito. Un alumno que solo ha usado chatbots necesita una imagen estable en la cabeza; si cada bloque usa una metáfora distinta, se pierde. Si adaptas el material, mantén estas:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eIdea\u003c/th\u003e\n\u003cth\u003eComparación\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eModelo y harness\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eEl modelo es el motor; el harness es el coche completo.\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eChat frente a agente\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eEl chat es un consultor por teléfono; el agente es un becario con acceso a tu ordenador.\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSandbox\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eLa sala donde trabaja el becario.\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAprobaciones\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eEl «¿seguro?» en la puerta.\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMCP\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eUn enchufe estándar, como el USB.\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSkills\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eProcedimientos guardados, como recetas de cocina.\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eContexto\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eLa mesa de trabajo: si se llena de papeles, hay que recoger.\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eAGENTS.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eLas notas que dejas al becario antes de que empiece.\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eLa frase que resume el seminario\u003c/strong\u003e y con la que conviene cerrar:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eHoy no has aprendido a usar un programa. Has aprendido a dirigir a alguien que trabaja muy rápido, que no sabe lo que no sabe, y que tiene acceso a tus archivos. La herramienta te va a servir; los frenos te van a proteger.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2 id=\"las-cinco-practicas\"\u003eLas cinco prácticas\u003c/h2\u003e\n\u003cp\u003eEl laboratorio gira alrededor de cinco prácticas, siempre con el mismo nombre en todos los documentos:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e#\u003c/th\u003e\n\u003cth\u003ePráctica\u003c/th\u003e\n\u003cth\u003eQué demuestra\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003ePrimer arranque y primer encargo\u003c/td\u003e\n\u003ctd\u003eQue funciona y que produce efectos reales.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2\u003c/td\u003e\n\u003ctd\u003eProvocar una aprobación\u003c/td\u003e\n\u003ctd\u003eQue hay un freno, y que decídelo tú.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e3\u003c/td\u003e\n\u003ctd\u003eCambiar de política\u003c/td\u003e\n\u003ctd\u003eQue tú eliges el tamaño de la sala.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e4\u003c/td\u003e\n\u003ctd\u003eEnseñarle un procedimiento\u003c/td\u003e\n\u003ctd\u003eQue la memoria permanente existe y se prueba en conversación nueva.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e5\u003c/td\u003e\n\u003ctd\u003eEncargo integrador\u003c/td\u003e\n\u003ctd\u003eQue el trabajo no acaba cuando el agente dice «hecho».\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eLa práctica 2 y la 3 son el corazón del seminario\u003c/strong\u003e, y su pareja es deliberada: la primera provoca el aviso, la segunda lo elimina cambiando \u003cstrong\u003edónde\u003c/strong\u003e trabaja el agente. Esa comparación es la que se llevan a casa.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"el-enfoque-didactico-en-cuatro-decisiones\"\u003eEl enfoque didáctico, en cuatro decisiones\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eLos frenos antes que las capacidades.\u003c/strong\u003e La mayoría de materiales empiezan por lo que el agente puede hacer. Aquí el bloque más largo es el de permisos, porque es lo que decide si la persona usa esto con tranquilidad o se lleva un susto.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCero jerga sin traducir.\u003c/strong\u003e Cada término técnico aparece con su explicación en la misma frase. El glosario (\u003ccode\u003e05\u003c/code\u003e) usa el mismo lenguaje llano.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVerificar se enseña como una destreza, no como un consejo.\u003c/strong\u003e La práctica 5 obliga a abrir el resultado y contarlo. No basta con decir «revisa lo que hace».\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLos límites se dicen enteros.\u003c/strong\u003e El material explica sin adornos que el proyecto está en fase de vistas previas, que no ha pasado una auditoría de seguridad y que el sandbox reduce el riesgo pero no garantiza aislamiento. Un seminario que oculta esto deja a los alumnos peor preparados que antes de venir.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2 id=\"material-complementario-que-ya-tienes\"\u003eMaterial complementario que ya tienes\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003emanual_dsh.html\u003c/code\u003e\u003c/strong\u003e (en la carpeta \u003ccode\u003emanual_dsh\u003c/code\u003e): manual interactivo y mucho más profundo, con secciones sobre la interfaz, los modos, las conversaciones, la configuración y los plugins. \u003cstrong\u003eEs el material de continuación natural para quien salga del seminario con ganas de más.\u003c/strong\u003e Este paquete no lo duplica: es la capa de impartición, más corta y orientada a la sesión.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLa skill \u003ccode\u003eprecios-gasolineras\u003c/code\u003e\u003c/strong\u003e (en \u003ccode\u003e.dsh/skills/\u003c/code\u003e): un ejemplo real de procedimiento guardado, útil si quieres enseñar una skill de verdad en lugar de una inventada para la práctica 4.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"antes-de-dar-el-seminario-personaliza-esto\"\u003eAntes de dar el seminario: personaliza esto\u003c/h2\u003e\n\u003cp\u003eEl material está escrito para ser usado tal cual, pero hay cuatro cosas que conviene adaptar:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eEl correo de preparación\u003c/strong\u003e (\u003ccode\u003e07\u003c/code\u003e, Parte A): pon tu nombre, la fecha, el lugar y un medio de contacto para dudas previas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLa clave de API de reserva:\u003c/strong\u003e ten una tuya para las demos y para el alumno que no consiga la suya.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEl ejemplo de la demostración\u003c/strong\u003e (\u003ccode\u003e01\u003c/code\u003e, bloque 2): cámbialo por algo del sector de tu audiencia. Funciona mucho mejor con archivos que reconozcan.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLa encuesta y el cuestionario:\u003c/strong\u003e añade o quita preguntas según lo que te interese medir.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2 id=\"advertencia-de-seguridad-que-conviene-repetir\"\u003eAdvertencia de seguridad que conviene repetir\u003c/h2\u003e\n\u003cp\u003eDeepSeek Harness está en \u003cstrong\u003efase de vistas previas de desarrollo\u003c/strong\u003e: cambia rápido, habrá novedades que rompan lo anterior y no ha pasado una auditoría de seguridad. Puede ejecutar código y órdenes generadas por el modelo, cargar extensiones de terceros y acceder a archivos, red y credenciales.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDurante un seminario esto se traduce en tres reglas de sala:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eLos alumnos practican con \u003cstrong\u003earchivos de ejemplo\u003c/strong\u003e, nunca con documentos reales de trabajo ni datos de clientes.\u003c/li\u003e\n\u003cli\u003eEl instructor \u003cstrong\u003eno aprueba permisos en el portátil de un alumno\u003c/strong\u003e. Se explica el aviso y decide el alumno.\u003c/li\u003e\n\u003cli\u003eEl sandbox y las aprobaciones \u003cstrong\u003ereducen el riesgo, no lo eliminan\u003c/strong\u003e, y no deben presentarse como una garantía de aislamiento.\u003c/li\u003e\n\u003c/ol\u003e\n","texto":"8 min de lectura Documento 00 Seminario «Del chat al agente» — Paquete de material didáctico Título: Del chat al agente: qué es un harness y cómo se usa. Duración: 150 minutos de núcleo, ampliable a 180. Audiencia: usuarios corrientes de chat/bot. Gente que usa ChatGPT, DeepSeek o Gemini como chatbot y no ha programado nunca. Formato: sesión práctica, con el portátil delante. Cada alumno arranca el harness y lo usa. Herramienta: DeepSeek Harness ( dsh ). Qué hay en esta carpeta El paquete tiene tres capas : los documentos fuente, los formatos para usarlos en clase y las herramientas para regenerarlos. 1. Los documentos (Markdown, la fuente de todo) Archivo Para quién Para qué sirve 01_guion_instructor.md Instructor El guion de la sesión, minuto a minuto: qué decir, qué demostrar, qué recortar si vas con retraso y qué hacer si algo falla en directo. 02_apuntes_alumno.md Alumno Los apuntes que se lleva. Escritos para entenderse sin el instructor delante. 03_laboratorio.md Alumno El cuaderno de prácticas: cinco prácticas paso a paso, con comprobaciones y una hoja de registro. 04_soluciones_y_errores.md Instructor Qué debería pasar en cada práctica, errores frecuentes con su solución, problemas técnicos de sala y frases de rescate. 05_glosario_chuleta.md Alumno Glosario de unos 30 términos en lenguaje llano y una chuleta de una página para imprimir. 06_evaluacion.md Instructor Cuestionario inicial de diagnóstico, cuestionario final con clave, rúbrica y encuesta de satisfacción. 07_instalacion_previa.md Instructor y alumno El mensaje para enviar antes del seminario, la guía de instalación paso a paso y la lista de comprobación del instructor. Orden de lectura rápido: si solo tienes diez minutos para prepararte, lee el archivo 01 y la tabla de problemas técnicos del 04 . 2. Los formatos (lo que se usa en clase) Formato Dónde Para qué Página de entrada index.html Punto de partida: enlaza el curso, las diapositivas, los PDF y la carpeta de práctica. Se abre con doble clic. Curso interactivo curso/index.html Los documentos organizados en 4 módulos y 27 lecciones, con búsqueda, progreso guardado en el navegador y los dos cuestionarios corregidos al momento. Sin servidor y sin conexión. Diapositivas slides/diapositivas.html y slides/diapositivas.pdf 59 diapositivas para proyectar, con notas del presentador en todas ellas (tecla N ). El PDF imprime una diapositiva por página. PDF imprimibles pdf/ Un PDF por documento, más completo.pdf con los ocho en un volumen de 62 páginas. Carpeta de práctica practica_ejemplo/ 12 archivos con datos inventados para los ejercicios. Se elige como espacio de trabajo del agente. Fuente Marp slides/slides.md La presentación en Markdown de Marp, por si prefieres editarla en VS Code con la extensión Marp o exportarla con marp-cli . 3. Las herramientas ( build/ ) Script Qué hace build/build.mjs Genera el curso y los HTML imprimibles a partir de los Markdown. build/build_slides.mjs Genera la baraja de diapositivas a partir de slides.md . build/hacer_pdf.py Genera los 10 PDF con fpdf2, sin navegador. build/verificar_curso.mjs 33 comprobaciones del curso en un DOM simulado. build/verificar_slides.mjs 25 comprobaciones de las diapositivas. build/verificar_pdf.py Comprueba páginas, texto extraíble, tildes y frases del original en cada PDF. Las dependencias ya están instaladas dentro de build/ , así que todo se regenera sin conexión . Cómo se usa el paquete Antes del seminario (3-5 días antes) Lee 01_guion_instructor.md entero una vez, de principio a fin. Es el único imprescindible. Envía a los alumnos la Parte A de 07_instalacion_previa.md . Esto no es opcional: si la mitad del grupo llega sin Node.js instalado, el primer bloque práctico se convierte en una clase de instalación y se pierde el seminario. Trabaja la Parte C del 07 : la lista de comprobación del día anterior. Prepara una carpeta de práctica de ejemplo, con archivos variados y sin nada sensible , y haz una copia de seguridad aparte. Durante el seminario Guion en pantalla o impreso (archivo 01 ). 04_soluciones_y_errores.md abierto en otra ventana: es tu red de seguridad cuando alguien levanta la mano. Reparte 02_apuntes_alumno.md y 03_laboratorio.md al empezar, o pide que los abran en el portátil. 06_evaluacion.md al principio (diagnóstico) y al final (evaluación y encuesta). 05_glosario_chuleta.md al final, como material de consulta para llevar. Después Envía por correo el paquete completo, incluida la chuleta. Revisa las encuestas antes de la siguiente edición: el archivo 06 incluye una tabla de duración por bloque para que ajustes el ritmo. Las analogías del paquete (no las cambies a la ligera) Todo el material usa las mismas ocho comparaciones a propósito. Un alumno que solo ha usado chatbots necesita una imagen estable en la cabeza; si cada bloque usa una metáfora distinta, se pierde. Si adaptas el material, mantén estas: Idea Comparación Modelo y harness El modelo es el motor; el harness es el coche completo. Chat frente a agente El chat es un consultor por teléfono; el agente es un becario con acceso a tu ordenador. Sandbox La sala donde trabaja el becario. Aprobaciones El «¿seguro?» en la puerta. MCP Un enchufe estándar, como el USB. Skills Procedimientos guardados, como recetas de cocina. Contexto La mesa de trabajo: si se llena de papeles, hay que recoger. AGENTS.md Las notas que dejas al becario antes de que empiece. La frase que resume el seminario y con la que conviene cerrar: Hoy no has aprendido a usar un programa. Has aprendido a dirigir a alguien que trabaja muy rápido, que no sabe lo que no sabe, y que tiene acceso a tus archivos. La herramienta te va a servir; los frenos te van a proteger. Las cinco prácticas El laboratorio gira alrededor de cinco prácticas, siempre con el mismo nombre en todos los documentos: # Práctica Qué demuestra 1 Primer arranque y primer encargo Que funciona y que produce efectos reales. 2 Provocar una aprobación Que hay un freno, y que decídelo tú. 3 Cambiar de política Que tú eliges el tamaño de la sala. 4 Enseñarle un procedimiento Que la memoria permanente existe y se prueba en conversación nueva. 5 Encargo integrador Que el trabajo no acaba cuando el agente dice «hecho». La práctica 2 y la 3 son el corazón del seminario , y su pareja es deliberada: la primera provoca el aviso, la segunda lo elimina cambiando dónde trabaja el agente. Esa comparación es la que se llevan a casa. El enfoque didáctico, en cuatro decisiones Los frenos antes que las capacidades. La mayoría de materiales empiezan por lo que el agente puede hacer. Aquí el bloque más largo es el de permisos, porque es lo que decide si la persona usa esto con tranquilidad o se lleva un susto. Cero jerga sin traducir. Cada término técnico aparece con su explicación en la misma frase. El glosario ( 05 ) usa el mismo lenguaje llano. Verificar se enseña como una destreza, no como un consejo. La práctica 5 obliga a abrir el resultado y contarlo. No basta con decir «revisa lo que hace». Los límites se dicen enteros. El material explica sin adornos que el proyecto está en fase de vistas previas, que no ha pasado una auditoría de seguridad y que el sandbox reduce el riesgo pero no garantiza aislamiento. Un seminario que oculta esto deja a los alumnos peor preparados que antes de venir. Material complementario que ya tienes manual_dsh.html (en la carpeta manual_dsh ): manual interactivo y mucho más profundo, con secciones sobre la interfaz, los modos, las conversaciones, la configuración y los plugins. Es el material de continuación natural para quien salga del seminario con ganas de más. Este paquete no lo duplica: es la capa de impartición, más corta y orientada a la sesión. La skill precios-gasolineras (en .dsh/skills/ ): un ejemplo real de procedimiento guardado, útil si quieres enseñar una skill de verdad en lugar de una inventada para la práctica 4. Antes de dar el seminario: personaliza esto El material está escrito para ser usado tal cual, pero hay cuatro cosas que conviene adaptar: El correo de preparación ( 07 , Parte A): pon tu nombre, la fecha, el lugar y un medio de contacto para dudas previas. La clave de API de reserva: ten una tuya para las demos y para el alumno que no consiga la suya. El ejemplo de la demostración ( 01 , bloque 2): cámbialo por algo del sector de tu audiencia. Funciona mucho mejor con archivos que reconozcan. La encuesta y el cuestionario: añade o quita preguntas según lo que te interese medir. Advertencia de seguridad que conviene repetir DeepSeek Harness está en fase de vistas previas de desarrollo : cambia rápido, habrá novedades que rompan lo anterior y no ha pasado una auditoría de seguridad. Puede ejecutar código y órdenes generadas por el modelo, cargar extensiones de terceros y acceder a archivos, red y credenciales. Durante un seminario esto se traduce en tres reglas de sala: Los alumnos practican con archivos de ejemplo , nunca con documentos reales de trabajo ni datos de clientes. El instructor no aprueba permisos en el portátil de un alumno . Se explica el aviso y decide el alumno. El sandbox y las aprobaciones reducen el riesgo, no lo eliminan , y no deben presentarse como una garantía de aislamiento."},{"id":"doc-01","grupo":"instructor","titulo":"Guion del instructor","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 23 min de lectura\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M6 3h8l4 4v14H6z\"/\u003e\u003cpath d=\"M14 3v5h5\"/\u003e\u003cpath d=\"M9 13h6M9 17h6\"/\u003e\u003c/svg\u003e Documento 01\u003c/span\u003e\n      \u003c/div\u003e\u003ch1 id=\"guion-del-instructor-del-chat-al-agente-que-es-un-harness-y-\"\u003eGuion del instructor — Del chat al agente: qué es un harness y cómo se usa\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003eDuración:\u003c/strong\u003e 150 minutos de núcleo, ampliable a 180.\n\u003cstrong\u003eAudiencia:\u003c/strong\u003e usuarios corrientes de chat/bot. No programadores.\n\u003cstrong\u003eFormato:\u003c/strong\u003e sesión práctica. Cada alumno trabaja en su portátil.\n\u003cstrong\u003eHerramienta:\u003c/strong\u003e DeepSeek Harness (\u003ccode\u003edsh\u003c/code\u003e), arrancado con \u003ccode\u003enpx @deepseek-ai/dsh web\u003c/code\u003e.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eEste guion está pensado para leerse en diagonal mientras se imparte. Lo que está en \u003cstrong\u003enegrita dentro de las secciones «Qué decir»\u003c/strong\u003e son las frases que conviene decir casi literalmente: son las que sostienen las analogías y evitan que el grupo se pierda.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2 id=\"1-mapa-de-la-sesion\"\u003e1. Mapa de la sesión\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e#\u003c/th\u003e\n\u003cth\u003eBloque\u003c/th\u003e\n\u003cth\u003eMin.\u003c/th\u003e\n\u003cth\u003eAcum.\u003c/th\u003e\n\u003cth\u003eTipo\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e0\u003c/td\u003e\n\u003ctd\u003eBienvenida, diagnóstico y promesa\u003c/td\u003e\n\u003ctd\u003e8\u003c/td\u003e\n\u003ctd\u003e8\u003c/td\u003e\n\u003ctd\u003eCharla\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eDel chat al agente\u003c/td\u003e\n\u003ctd\u003e17\u003c/td\u003e\n\u003ctd\u003e25\u003c/td\u003e\n\u003ctd\u003eCharla\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2\u003c/td\u003e\n\u003ctd\u003eAnatomía de un harness\u003c/td\u003e\n\u003ctd\u003e20\u003c/td\u003e\n\u003ctd\u003e45\u003c/td\u003e\n\u003ctd\u003eCharla + demo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e3\u003c/td\u003e\n\u003ctd\u003ePráctica 1 — Primer arranque y primer encargo\u003c/td\u003e\n\u003ctd\u003e20\u003c/td\u003e\n\u003ctd\u003e65\u003c/td\u003e\n\u003ctd\u003ePráctica\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eDescanso\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e10\u003c/td\u003e\n\u003ctd\u003e75\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e4\u003c/td\u003e\n\u003ctd\u003ePermisos, sandbox y aprobaciones (Prácticas 2 y 3)\u003c/td\u003e\n\u003ctd\u003e30\u003c/td\u003e\n\u003ctd\u003e105\u003c/td\u003e\n\u003ctd\u003ePráctica\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e5\u003c/td\u003e\n\u003ctd\u003eHerramientas, contexto y memoria (Práctica 4)\u003c/td\u003e\n\u003ctd\u003e22\u003c/td\u003e\n\u003ctd\u003e127\u003c/td\u003e\n\u003ctd\u003ePráctica\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e6\u003c/td\u003e\n\u003ctd\u003ePráctica 5 — Encargo integrador\u003c/td\u003e\n\u003ctd\u003e13\u003c/td\u003e\n\u003ctd\u003e140\u003c/td\u003e\n\u003ctd\u003ePráctica\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e7\u003c/td\u003e\n\u003ctd\u003eCierre, límites y evaluación\u003c/td\u003e\n\u003ctd\u003e10\u003c/td\u003e\n\u003ctd\u003e150\u003c/td\u003e\n\u003ctd\u003eCharla\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eEl bloque 4 es el corazón del seminario.\u003c/strong\u003e Si vas mal de tiempo, recorta de cualquier sitio menos de ahí.\u003c/p\u003e\n\u003ch3 id=\"si-vas-con-retraso\"\u003eSi vas con retraso\u003c/h3\u003e\n\u003cp\u003eOrden de recorte, de menos a más doloroso:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eBloque 5: deja MCP para una diapositiva y una frase, sin demo.\u003c/li\u003e\n\u003cli\u003eBloque 6: reduce a un encargo guiado hecho por todos a la vez con el instructor.\u003c/li\u003e\n\u003cli\u003eBloque 2: acorta la demo del instructor a 3 minutos mostrando solo el panel de pasos.\u003c/li\u003e\n\u003cli\u003eNunca recortes: bloque 4 completo, la Práctica 1 y el cierre.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"si-vas-sobrado-hasta-180\"\u003eSi vas sobrado (hasta 180)\u003c/h3\u003e\n\u003cp\u003eOrden de ampliación:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eBloque 6: de 13 a 25 minutos, con puesta en común de tres voluntarios.\u003c/li\u003e\n\u003cli\u003eBloque 5: MCP con una demo real de conexión.\u003c/li\u003e\n\u003cli\u003eBloque 1: añade dos ejemplos más de tareas que el grupo reconozca.\u003c/li\u003e\n\u003cli\u003eAñade 5-10 minutos de preguntas al final.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2 id=\"2-materiales-que-hay-que-tener-listos\"\u003e2. Materiales que hay que tener listos\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eProyector y \u003cstrong\u003eletra grande\u003c/strong\u003e en el terminal y en el navegador. La mitad del grupo no verá una terminal a tamaño normal.\u003c/li\u003e\n\u003cli\u003eUna \u003cstrong\u003ecarpeta de práctica de ejemplo\u003c/strong\u003e, sin datos sensibles, con 5-10 archivos variados (un texto, una hoja de cálculo, alguna imagen) y sus subcarpetas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCopia de seguridad\u003c/strong\u003e de esa carpeta, en otro sitio. El agente va a modificarla delante de todos.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTu propia clave de API\u003c/strong\u003e de reserva por si algún alumno no la consigue.\u003c/li\u003e\n\u003cli\u003eEl resto de documentos del paquete: \u003ccode\u003e03_laboratorio.md\u003c/code\u003e (para los alumnos), \u003ccode\u003e04_soluciones_y_errores.md\u003c/code\u003e (para ti, abierto en otra ventana), \u003ccode\u003e05_glosario_chuleta.md\u003c/code\u003e, \u003ccode\u003e06_evaluacion.md\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eRegletas y alargadores. Doce portátiles no caben en cuatro enchufes.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"bloque-0-bienvenida-diagnostico-y-promesa-8-min\"\u003eBloque 0 — Bienvenida, diagnóstico y promesa (8 min)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e bajar la ansiedad, saber de dónde parte el grupo y dejar claro qué se llevan.\u003c/p\u003e\n\u003ch3 id=\"que-decir\"\u003eQué decir\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ePreséntate en un minuto y di a qué te dedicas con los agentes. Que se note que lo usas, no que lo has leído.\u003c/li\u003e\n\u003cli\u003ePregunta a mano alzada, tres preguntas rápidas: \u003cem\u003e«¿Quién usa un chat de IA a diario?»\u003c/em\u003e, \u003cem\u003e«¿Quién le ha pedido algo y ha acabado haciéndolo él mismo porque el chat solo te decía cómo?»\u003c/em\u003e, \u003cem\u003e«¿Quién ha oído hablar de agentes y no tiene claro qué son?»\u003c/em\u003e. La tercera levanta casi todas las manos. Úsalo: \u003cstrong\u003e«Perfecto. Ese es exactamente el punto de partida de hoy, y en tres horas esto va a estar claro.»\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eReparte el cuestionario inicial de \u003ccode\u003e06_evaluacion.md\u003c/code\u003e. \u003cstrong\u003eNo se puntúa.\u003c/strong\u003e Dilo explícitamente: \u003cem\u003e«Esto no es un examen, es para que yo sepa por dónde empezar. Si no sabes una respuesta, escribe &quot;no lo sé&quot; y ya está.»\u003c/em\u003e (3 min)\u003c/li\u003e\n\u003cli\u003eLa promesa, en cuatro puntos: al terminar \u003cstrong\u003esabrás qué es un harness\u003c/strong\u003e; lo habrás \u003cstrong\u003earrancado en tu propio portátil\u003c/strong\u003e; sabrás \u003cstrong\u003equé permisos estás dando y por qué\u003c/strong\u003e; y sabrás \u003cstrong\u003equé no conviene dejarle hacer\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eLo que NO vamos a hacer: no vamos a programar, no vamos a entrenar modelos, y no hace falta que sepas nada de informática más allá de usar el navegador y crear una carpeta.\u003c/li\u003e\n\u003cli\u003eRegla de la sala: \u003cstrong\u003e«Si te atascas más de tres minutos, levanta la mano. No hay nada que me haga perder más tiempo que diez personas atascadas en silencio.»\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"senales-de-que-ha-funcionado\"\u003eSeñales de que ha funcionado\u003c/h3\u003e\n\u003cp\u003eEl grupo responde a mano alzada y alguien dice en voz alta que no entiende la diferencia entre chat y agente. Eso es bueno: es la pregunta que abre el bloque 1.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"bloque-1-del-chat-al-agente-17-min\"\u003eBloque 1 — Del chat al agente (17 min)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e que entiendan el cambio de fondo, no la jerga.\u003c/p\u003e\n\u003ch3 id=\"que-decir-1\"\u003eQué decir\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003ePunto de partida: lo que ya saben hacer.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTodos sabéis usar un chat. Escribes una pregunta, te llega una respuesta de texto, y \u003cstrong\u003etú\u003c/strong\u003e haces lo que haga falta con ella. Copias, pegas, abres el archivo, cambias el dato. El chat aconseja; el trabajo lo pones tú.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLa analogía que sostiene todo el seminario:\u003c/strong\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eUn chat es un consultor por teléfono: te dice qué hacer y lo haces tú. Un agente es un becario con acceso a tu ordenador: lo hace y tú revisas.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eDi las dos mitades despacio y déjalas escritas en la pizarra. Vas a volver a esta frase cuatro veces más.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTres diferencias, y solo tres:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eTiene herramientas.\u003c/strong\u003e Puede leer y escribir archivos, ejecutar comandos, buscar en internet. No solo habla: toca cosas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTrabaja en bucle.\u003c/strong\u003e No da una respuesta y se calla. Da un paso, mira qué ha pasado, decide el siguiente. Diez pasos, cincuenta, los que hagan falta.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eProduce efectos reales.\u003c/strong\u003e Esto es lo importante y lo peligroso: al terminar, hay archivos cambiados en tu ordenador. No es una conversación, es un trabajo hecho.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eEl modelo y el harness.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAquí está la palabra del título. \u003cstrong\u003eEl modelo es el motor. El harness es el coche completo: el volante, los frenos, el salpicadero y las ruedas.\u003c/strong\u003e El motor solo no te lleva a ningún sitio. Y fíjate en la consecuencia: un chat también es un coche, pero uno muy sencillo — motor, un volante y nada más. Un agente es un coche con frenos, espejos y cinturón.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo para que se vea la diferencia.\u003c/strong\u003e Pide al grupo que imaginen un informe de veinte páginas en su escritorio.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCon un chat: abres el documento, copias el texto, lo pegas en el chat, escribes «resúmeme esto», esperas, copias el resumen y lo pegas en otro archivo. Cuatro pasos tuyos.\u003c/li\u003e\n\u003cli\u003eCon un agente: \u003cstrong\u003e«Resume el informe que está en esta carpeta y guárdame el resumen al lado, en un archivo nuevo.»\u003c/strong\u003e El agente abre el archivo, lo lee, escribe el resumen, te dice dónde lo ha dejado. Cero pasos tuyos, y un archivo nuevo que antes no existía.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eLa consecuencia incómoda, y hay que decirla hoy.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eUn agente es como un becario muy motivado que trabaja a gran velocidad y no sabe lo que no sabe.\u003c/strong\u003e Va a hacer lo que le pidas con una seguridad total, aunque se esté equivocando. Va a tocar archivos en segundos. Y si le has pedido algo mal, hará mal la cosa mala, rapidísimo. De ahí salen los frenos, y de ahí sale el bloque más importante de hoy.\u003c/p\u003e\n\u003ch3 id=\"comprobacion-de-comprension\"\u003eComprobación de comprensión\u003c/h3\u003e\n\u003cp\u003ePregunta a una persona concreta, no al aire: \u003cem\u003e«Si le pido a un agente que me organice las fotos del móvil, ¿qué hace exactamente?»\u003c/em\u003e Busca que diga: mira los archivos, decide, mueve cosas. Si dice «me explica cómo hacerlo», vuelve a la analogía del teléfono.\u003c/p\u003e\n\u003ch3 id=\"senales-de-que-ha-funcionado-1\"\u003eSeñales de que ha funcionado\u003c/h3\u003e\n\u003cp\u003eAlguien pregunta «¿y si se equivoca?». Ya tienes el bloque 4 justificado: \u003cstrong\u003e«Exacto. Guarda esa pregunta, la contesto dentro de veinte minutos y es la parte más útil del seminario.»\u003c/strong\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"bloque-2-anatomia-de-un-harness-20-min\"\u003eBloque 2 — Anatomía de un harness (20 min)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e que sepan nombrar las piezas. Sin esto, los permisos del bloque 4 son magia.\u003c/p\u003e\n\u003ch3 id=\"que-decir-2\"\u003eQué decir\u
