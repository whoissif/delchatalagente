ntradicen: enseña a priorizar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"practica-5-encargo-integrador\"\u003ePráctica 5 — Encargo integrador\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eObjetivo:\u003c/strong\u003e realizar un encargo real de principio a fin, con \u003cstrong\u003evarias acciones encadenadas\u003c/strong\u003e, y verificar el resultado por parte del alumno.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQué debería pasar\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eEl alumno pide algo que requiere varios pasos: buscar información en los archivos, crear una carpeta y escribir uno o varios documentos.\u003c/li\u003e\n\u003cli\u003eEl agente encadena las acciones y pide aprobación solo si sale de la zona delimitada.\u003c/li\u003e\n\u003cli\u003eAl terminar, el agente resume qué ha leído y qué ha escrito, con rutas.\u003c/li\u003e\n\u003cli\u003eEl alumno \u003cstrong\u003eabre los archivos y comprueba\u003c/strong\u003e que el contenido se corresponde con lo pedido.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eCómo saber que salió bien\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eEl agente ha hecho \u003cstrong\u003emás de una acción\u003c/strong\u003e sin que se lo repitan paso a paso.\u003c/li\u003e\n\u003cli\u003eEl alumno abre los archivos generados y el contenido encaja con lo pedido.\u003c/li\u003e\n\u003cli\u003eHay un cierre del agente que lista qué archivos ha tocado y con qué resultado.\u003c/li\u003e\n\u003cli\u003eSi hubo avisos de aprobación, el alumno sabe decir por qué aparecieron.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eSolución de referencia\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ePetición del alumno:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eEn la carpeta del proyecto que te he dado: mira todos los documentos, crea una carpeta \u003ccode\u003einforme\u003c/code\u003e y dentro escribe un \u003ccode\u003einforme.md\u003c/code\u003e de dos páginas con un índice, los puntos clave, las contradicciones que encuentres entre documentos y una lista de 5 tareas pendientes. Al terminar, dime exactamente qué archivos has creado y qué has leído.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eQué haría el agente:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eLista y lee los documentos del espacio de trabajo.\u003c/li\u003e\n\u003cli\u003eCrea la carpeta \u003ccode\u003einforme\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eEscribe el archivo con la estructura pedida.\u003c/li\u003e\n\u003cli\u003eDevuelve un resumen: archivos leídos, archivo creado, ruta completa y qué partes son interpretación suya.\u003c/li\u003e\n\u003cli\u003eVerificación del alumno: abrir el archivo, comprobar el índice y leer al menos las contradicciones señaladas.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eErrores frecuentes\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eLo que se ve\u003c/th\u003e\n\u003cth\u003eQué está pasando\u003c/th\u003e\n\u003cth\u003eQué hacer\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eEl alumno acepta el resultado sin abrir nada\u003c/td\u003e\n\u003ctd\u003eConfunde &quot;el agente dice que lo ha hecho&quot; con &quot;está hecho&quot;\u003c/td\u003e\n\u003ctd\u003eRegla de la sala: \u003cstrong\u003eel que revisa es el humano\u003c/strong\u003e; abrir siempre el archivo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl informe incluye datos que no existen\u003c/td\u003e\n\u003ctd\u003eEl agente ha rellenado huecos; hay que verificar cada afirmación frente a la fuente\u003c/td\u003e\n\u003ctd\u003ePedir que cite de qué archivo sale cada punto, corregir y repetir\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl encargo no avanza y el agente da vueltas\u003c/td\u003e\n\u003ctd\u003eEl encargo es demasiado amplio o ambiguo para una sola petición\u003c/td\u003e\n\u003ctd\u003ePartirlo en dos encargos y decir formato, extensión y carpeta de destino\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSe disparan avisos de aprobación en cadena\u003c/td\u003e\n\u003ctd\u003eEl encargo sale del espacio de trabajo (escritorio, carpeta personal, unidad de red)\u003c/td\u003e\n\u003ctd\u003eMover el trabajo \u003cstrong\u003edentro\u003c/strong\u003e del espacio de trabajo: la solución no es aprobar cien avisos\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl resultado empeora hacia el final\u003c/td\u003e\n\u003ctd\u003eLa mesa de trabajo (el contexto) se ha llenado de papeles\u003c/td\u003e\n\u003ctd\u003eEmpezar una \u003cstrong\u003esesión nueva\u003c/strong\u003e y dejar por escrito lo esencial en el AGENTS.md o en una skill\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003ePlan B si no sale\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eReduce el encargo a dos pasos y déjalo ahí: es mejor terminar algo pequeño que no terminar nada.\u003c/li\u003e\n\u003cli\u003eSi el agente se pierde, que el alumno pida primero el índice y luego el contenido.\u003c/li\u003e\n\u003cli\u003eSi no hay tiempo, hazlo tú en pantalla grande mientras ellos dictan las instrucciones.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eSi alguien va muy rápido\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQue añada un paso de verificación: pedir al agente que revise su propio informe y señale sus tres puntos más débiles.\u003c/li\u003e\n\u003cli\u003eDespués, contrastar esa autocrítica con el archivo real: enseña que el agente se equivoca y se corrige.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"problemas-tecnicos-de-sala\"\u003eProblemas técnicos de sala\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eSíntoma\u003c/th\u003e\n\u003cth\u003eCausa probable\u003c/th\u003e\n\u003cth\u003eSolución\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eAl arrancar dice que el puerto 3080 está ocupado\u003c/td\u003e\n\u003ctd\u003eYa hay un harness u otro programa usando ese puerto\u003c/td\u003e\n\u003ctd\u003eCerrar la otra instancia; si no la encuentras, reiniciar el equipo y volver a arrancar\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003enode\u003c/code\u003e no se reconoce, o da errores de versión\u003c/td\u003e\n\u003ctd\u003eNode.js no está instalado o es demasiado antiguo\u003c/td\u003e\n\u003ctd\u003eInstalar o actualizar Node.js y \u003cstrong\u003eabrir una terminal nueva\u003c/strong\u003e para que tome el PATH\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003enpx\u003c/code\u003e no se reconoce como comando\u003c/td\u003e\n\u003ctd\u003eInstalación de Node.js incompleta, o terminal sin reiniciar\u003c/td\u003e\n\u003ctd\u003eReinstalar Node.js completo, cerrar y abrir la terminal\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLa interfaz no carga en el navegador\u003c/td\u003e\n\u003ctd\u003eSe abrió una dirección equivocada, o el navegador está desactualizado\u003c/td\u003e\n\u003ctd\u003eEscribir a mano \u003cstrong\u003e\u003ca href=\"http://127.0.0.1:3080\"\u003ehttp://127.0.0.1:3080\u003c/a\u003e\u003c/strong\u003e; probar con otro navegador\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl navegador no se abre solo\u003c/td\u003e\n\u003ctd\u003eSe arrancó con la opción de no abrir el navegador\u003c/td\u003e\n\u003ctd\u003eAbrir la dirección a mano; para que se abra sola, arrancar sin \u003ccode\u003e--no-open\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eError de modelo o respuesta vacía al enviar\u003c/td\u003e\n\u003ctd\u003eFalta la clave de API\u003c/td\u003e\n\u003ctd\u003eAjustes → Modelos → introducir la clave de \u003cstrong\u003e\u003ca href=\"https://platform.deepseek.com/\"\u003ehttps://platform.deepseek.com/\u003c/a\u003e\u003c/strong\u003e y guardar\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e&quot;Clave inválida&quot; o error de cuota\u003c/td\u003e\n\u003ctd\u003eClave mal copiada, caducada o \u003cstrong\u003esin saldo\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eVolver a copiar la clave completa y revisar el saldo en la plataforma\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNo aparece el cuadro para escribir mensajes\u003c/td\u003e\n\u003ctd\u003eNo hay espacio de trabajo seleccionado\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eElegir espacio de trabajo\u003c/strong\u003e → añadir la carpeta → seleccionarla\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl agente parece colgado o tarda mucho\u003c/td\u003e\n\u003ctd\u003eEstá pensando, esperando una aprobación o la red va lenta\u003c/td\u003e\n\u003ctd\u003eMirar si hay un aviso de aprobación pendiente; esperar; si sigue igual, abrir una sesión nueva\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eErrores de conexión, certificados o &quot;proxy&quot;\u003c/td\u003e\n\u003ctd\u003eRed corporativa o proxy que filtra la salida a internet\u003c/td\u003e\n\u003ctd\u003eProbar con otra red o con el móvil como punto de acceso; pedir al informático la configuración del proxy\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl firewall o el antivirus bloquean el programa\u003c/td\u003e\n\u003ctd\u003eBloqueo de ejecución o de conexión local\u003c/td\u003e\n\u003ctd\u003eAñadir una excepción para Node.js y para la dirección local; si no se puede, usar otro portátil\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e&quot;Permiso denegado&quot; al leer o escribir una carpeta\u003c/td\u003e\n\u003ctd\u003ePermisos del sistema operativo, carpeta sincronizada o de solo lectura\u003c/td\u003e\n\u003ctd\u003eUsar una carpeta propia y sencilla del usuario; evitar carpetas sincronizadas en la nube\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl agente dice que no puede escribir el archivo\u003c/td\u003e\n\u003ctd\u003eLa ruta está fuera del espacio de trabajo o el modo de permisos no lo permite\u003c/td\u003e\n\u003ctd\u003eMover la tarea dentro del espacio de trabajo y revisar la política de permisos\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLas respuestas empeoran o se vuelven repetitivas\u003c/td\u003e\n\u003ctd\u003eEl contexto se ha llenado: la mesa está llena de papeles\u003c/td\u003e\n\u003ctd\u003eAbrir una \u003cstrong\u003esesión nueva\u003c/strong\u003e y guardar lo importante en el AGENTS.md o en una skill\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl alumno cierra la terminal y el servidor se para\u003c/td\u003e\n\u003ctd\u003eEl servidor vive en esa terminal: cerrarla lo apaga\u003c/td\u003e\n\u003ctd\u003eVolver a arrancarlo con \u003ccode\u003enpx @deepseek-ai/dsh web\u003c/code\u003e, o \u003ccode\u003edsh web\u003c/code\u003e si está instalado globalmente\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eUn alumno no puede instalar nada\u003c/td\u003e\n\u003ctd\u003ePortátil corporativo o usuario restringido\u003c/td\u003e\n\u003ctd\u003eUsar el arranque sin instalar (\u003ccode\u003enpx @deepseek-ai/dsh web\u003c/code\u003e); si tampoco, práctica por parejas\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003chr\u003e\n\u003ch2 id=\"frases-de-rescate-para-el-instructor\"\u003eFrases de rescate para el instructor\u003c/h2\u003e\n\u003cp\u003eSirven para decir en voz alta cuando algo falla delante de la clase.\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e&quot;Esto es exactamente lo que veníamos a ver: por esto existe el «¿seguro?» antes de salir de la sala.&quot;\u003c/li\u003e\n\u003cli\u003e&quot;Tranquilo, esto le pasa a la mitad de la sala. Vamos a mirarlo entre los dos.&quot;\u003c/li\u003e\n\u003cli\u003e&quot;Fallar aquí no es un problema tuyo, es información: acabamos de aprender qué límite tiene el agente.&quot;\u003c/li\u003e\n\u003cli\u003e&quot;Mientras arreglamos esto, fíjate en lo que ya ha ido bien: ha leído tu carpeta.&quot;\u003c/li\u003e\n\u003cli\u003e&quot;Vamos a leer juntos el mensaje. Casi siempre dice lo que pasa.&quot;\u003c/li\u003e\n\u003cli\u003e&quot;Si en dos minutos no sale, seguimos con el compañero y volvemos a esto después.&quot;\u003c/li\u003e\n\u003cli\u003e&quot;El agente se equivoca y se corrige; la responsabilidad de revisar es nuestra.&quot;\u003c/li\u003e\n\u003cli\u003e&quot;No hace falta saber programar para esto, solo hace falta leer lo que te pide.&quot;\u003c/li\u003e\n\u003cli\u003e&quot;Guarda una captura del error: es un buen apunte para tu cuaderno.&quot;\u003c/li\u003e\n\u003cli\u003e&quot;Vamos al plan B: lo hacemos dentro del espacio de trabajo y lo vemos funcionando.&quot;\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2 id=\"criterios-de-evaluacion-de-las-practicas\"\u003eCriterios de evaluación de las prácticas\u003c/h2\u003e\n\u003cp\u003eSe evalúa el criterio, no la velocidad. Nadie tiene que terminar todas las prácticas.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eNivel\u003c/th\u003e\n\u003cth\u003eQué se observa\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eNo lo consigue\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eNo arranca el harness o no llega a enviar una petición. No distingue el chat del agente. Necesita que el instructor haga clic por él.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eLo consigue con ayuda\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eCompleta la práctica con pistas del instructor. Reconoce el aviso de aprobación pero no explica qué lo provoca. Confunde el espacio de trabajo con la carpeta de configuración.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eLo consigue solo\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eArranca, elige espacio de trabajo, formula la petición y verifica el resultado. Explica sandbox, aprobación y memoria permanente con sus propias palabras. Sabe qué hacer cuando algo falla.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eVa más allá\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eCambia la política de permisos a propósito y explica el efecto. Guarda un procedimiento en el AGENTS.md o como skill y lo prueba en sesión nueva. Razona sobre mínimo privilegio y datos sensibles.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eQué mirar en cada práctica\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePráctica 1:\u003c/strong\u003e ¿el cuadro de mensajes está habilitado? ¿el resumen menciona archivos reales de su carpeta?\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePráctica 2:\u003c/strong\u003e ¿aparece el aviso y el agente espera? ¿el alumno sabe qué está aprobando y por qué?\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePráctica 3:\u003c/strong\u003e ¿la misma tarea dentro del espacio de trabajo ya no pide permiso? ¿sabe explicar la diferencia?\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePráctica 4:\u003c/strong\u003e ¿las instrucciones están guardadas donde toca? ¿se respetan en una sesión nueva?\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePráctica 5:\u003c/strong\u003e ¿el alumno abre el archivo y verifica? ¿distingue lo que el agente ha leído de lo que ha interpretado?\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"que-no-debe-hacer-el-instructor\"\u003eQué NO debe hacer el instructor\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eNo aprobar permisos en el portátil de un alumno sin explicarlo.\u003c/strong\u003e Si lo haces tú, le enseñas a aprobar a ciegas. Lee el aviso en voz alta y deja que decida él.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo prometer que el agente nunca se equivoca.\u003c/strong\u003e Es &quot;developer preview&quot;, itera rápido y habrá cambios que rompan compatibilidad. La revisión humana es parte del método.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo usar datos reales sensibles en las demostraciones.\u003c/strong\u003e Ni nóminas, ni datos de salud, ni credenciales, ni contratos. Prepara una carpeta de ejemplo aburrida.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo culpar al alumno delante del grupo.\u003c/strong\u003e Un &quot;esto le pasa a muchos&quot; desatasca más que un &quot;te has saltado un paso&quot;.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo improvisar con datos de alumnos en pantalla compartida.\u003c/strong\u003e Nada de abrir su carpeta personal, su correo o sus archivos por muy rápido que sea.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo presentar el sandbox y las aprobaciones como una garantía.\u003c/strong\u003e Reducen el riesgo, no garantizan aislamiento y no deben ser el único control de seguridad. Recomienda mínimo privilegio, máquina virtual o contenedor desechable, copias de seguridad y revisar plugins y comandos antes de permitirlos.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo meter credenciales propias en el portátil de un alumno.\u003c/strong\u003e Que cada uno use su clave de API y su propia cuenta.\u003c/li\u003e\n\u003c/ol\u003e\n","texto":"21 min de lectura Documento 04 Soluciones y errores frecuentes Documento de apoyo para el instructor del seminario Del chat al agente: qué es un harness y cómo se usa . Herramienta: DeepSeek Harness ( dsh ) , el harness de agentes de DeepSeek AI. Audiencia: gente que usa la IA como chat y no programa. Cómo usar este documento Tenlo abierto en una segunda ventana mientras la clase practica. Localiza la práctica en la que esté el grupo y busca en la tabla la fila que coincida con lo que ves en su pantalla. Las señales de salió bien sirven para confirmar en voz alta que el alumno va por buen camino: dilo, refuerza. Si el problema aparece en varios portátiles a la vez, ve directamente a Problemas técnicos de sala . Si te quedas sin palabras delante de la clase, usa las Frases de rescate . Recuerda las dos ideas que se repiten: el sandbox es la zona de trabajo delimitada y la aprobación es el ¿seguro? . Recordatorio de arranque Sin instalar nada: npx @deepseek-ai/dsh web Con instalación global: npm install -g @deepseek-ai/dsh y después dsh web La interfaz se abre en http://127.0.0.1:3080 . La opción --no-open arranca sin abrir el navegador. Práctica 1 — Primer arranque y primer encargo Objetivo: arrancar el harness, conectar el modelo, elegir espacio de trabajo y conseguir que el agente lea una carpeta propia y la resuma. Qué debería pasar El alumno lanza el harness desde la terminal y se abre la interfaz web en el navegador. Configura su clave de API y el modelo queda usable al momento, sin reiniciar el servidor. Elige una carpeta como espacio de trabajo; el cuadro de escribir mensajes se habilita. Escribe una petición y el agente lee archivos reales de esa carpeta y responde con un resumen. Cómo saber que salió bien La interfaz carga en http://127.0.0.1:3080 y se ve el panel de conversación. El cuadro de escribir mensajes está habilitado . Si está gris, no hay espacio de trabajo seleccionado. En Ajustes → Modelos aparece la clave guardada y el agente responde sin reiniciar nada. El resumen menciona nombres de archivos reales de la carpeta elegida: ha leído, no ha inventado. Solución de referencia Petición del alumno: Mira la carpeta que he elegido y dime qué hay dentro. Después hazme un resumen de una página con los temas principales de los documentos que encuentres, en español y en viñetas. Qué haría el agente: Lista el contenido de la carpeta del espacio de trabajo. Abre los archivos de texto que encuentra. Devuelve un resumen en viñetas, en español, y menciona qué archivos ha leído y cuáles ha ignorado. Si algún archivo queda fuera del espacio de trabajo, pide aprobación antes de leerlo. Errores frecuentes Lo que se ve Qué está pasando Qué hacer El cuadro de mensajes está gris y no deja escribir No hay espacio de trabajo seleccionado: es el primer tropiezo habitual Pulsar Elegir espacio de trabajo , añadir la carpeta y seleccionarla; el cuadro se habilita al momento El alumno escribe en la terminal y no pasa nada La terminal solo arranca el servidor; el trabajo se hace en el navegador Explicar que la terminal es el motor encendido y el navegador es el volante El agente contesta en inglés o de forma muy genérica No ha leído nada, solo ha conversado; o no se le pidió el idioma Pedir explícitamente en español y mira los archivos de la carpeta No puedo acceder a esa carpeta La carpeta elegida no es la que el alumno cree Comprobar la ruta en Elegir espacio de trabajo y repetir la petición El agente ha usado una carpeta distinta de la esperada Al lanzar dsh desde una carpeta, esa carpeta es el espacio de trabajo por defecto propuesto Elegir la carpeta correcta antes de pedir nada Error al enviar el mensaje o respuesta vacía Falta la clave de API o no está guardada Ajustes → Modelos → introducir o volver a guardar la clave de https://platform.deepseek.com/ Plan B si no sale Si no arranca nada, comprueba Node.js y vuelve a lanzar el comando en una terminal nueva. Si no consigue configurar la clave, pásale a un compañero que ya lo tenga funcionando y siga la práctica por parejas. Mientras se arregla, pídele que escriba en papel qué carpeta quiere resumir y qué le va a pedir al agente. Si alguien va muy rápido Que elija una carpeta con subcarpetas y pida un resumen por subcarpeta. Que pida al agente que, a partir de los documentos, proponga una lista de tareas pendientes. Práctica 2 — Provocar una aprobación Objetivo: entender qué es el sandbox, qué queda fuera de él y qué significa el aviso de aprobación. Qué debería pasar El alumno pide al agente que lea o cree algo fuera de la zona de trabajo delimitada (por ejemplo, en su escritorio). La operación no se ejecuta sola: aparece el aviso de aprobación en la interfaz. El agente se queda esperando la decisión del alumno. El alumno decide: permitir una vez, o denegar. Y entiende qué acaba de pasar. Cómo saber que salió bien Aparece el aviso de aprobación y el agente se detiene en vez de actuar. El aviso indica qué operación quiere hacer y sobre qué carpeta o archivo. El alumno sabe explicar en una frase qué es el sandbox y qué es la aprobación. Al aprobar, la operación se completa; al denegar, el agente lo acepta y propone otra vía o te lo dice. Solución de referencia Petición del alumno: Crea un archivo llamado prueba.txt en mi escritorio con el texto hola desde el agente . Qué haría el agente: Detecta que el escritorio está fuera del espacio de trabajo. Muestra el aviso de aprobación indicando la ruta exacta que quiere escribir. Espera. No escribe nada hasta que el alumno decide. Con Permitir una vez , escribe el archivo y termina. Si se deniega, explica que no puede y propone hacerlo dentro del espacio de trabajo. Errores frecuentes Lo que se ve Qué está pasando Qué hacer El agente crea el archivo sin preguntar nada La carpeta de destino está dentro del espacio de trabajo, o la política es más permisiva de lo previsto Elegir una ruta claramente externa (escritorio, carpeta personal) y revisar la política de permisos No aparece ningún aviso y el agente dice no puedo La política de permisos deniega directamente en vez de preguntar Es un resultado válido: hay modos de sandbox y política de aprobaciones; en ese modo no se pregunta, se niega El alumno aprueba a ciegas sin leer el aviso No ha entendido la práctica Parar y leer el aviso en voz alta: qué operación, qué ruta, qué riesgo Aparecen varios avisos seguidos y el alumno se agobia El encargo toca varias cosas de golpe Recordar que Permitir una vez es solo esa vez ; simplificar la petición a una sola acción Después de aprobar, la operación falla igualmente Permisos del sistema operativo o antivirus bloqueando esa carpeta Probar con otra carpeta del usuario y revisar el antivirus Plan B si no sale Si el agente no pide permiso nunca, cambia la política a un modo más restrictivo y repite la petición. Si el aviso no aparece porque el encargo es ambiguo, escribe tú la petición en la pizarra y que la copien. Aprovecha para la explicación teórica: el aviso incómodo es el objetivo, no un fallo. Si alguien va muy rápido Que deniegue el permiso y observe cómo reacciona el agente. Es la mitad de la lección y casi nadie la hace. Que intente lo mismo con dos rutas distintas y compare qué aviso aparece en cada caso. Práctica 3 — Cambiar de política Objetivo: comprobar que la misma tarea deja de pedir permiso cuando se hace dentro del espacio de trabajo, y entender qué cambia cada modo de permisos. Qué debería pasar El alumno repite una tarea equivalente a la de la Práctica 2, pero apuntando a una carpeta dentro del espacio de trabajo. El agente la ejecuta sin mostrar el aviso de aprobación. Después se revisa la opción de política de permisos y, si procede, se cambia de modo para ver la diferencia. El alumno sale sabiendo que los permisos son un dial, no un interruptor. Cómo saber que salió bien La operación se completa sin aviso de aprobación . El archivo o el resultado aparece realmente en la carpeta indicada. El alumno explica la diferencia entre las dos prácticas: fuera → aviso; dentro → sin aviso. Al cambiar la política, el comportamiento cambia en consecuencia de forma observable. Solución de referencia Petición del alumno: Dentro de la carpeta que te he dado, crea una subcarpeta llamada notas y dentro un archivo resumen.md con los tres puntos principales del resumen de antes. Qué haría el agente: Comprueba que la ruta está dentro del espacio de trabajo. Crea la subcarpeta y el archivo sin pedir aprobación. Confirma la ruta final y resume lo que ha escrito. Si el alumno ha cambiado la política a solo lectura, se niega y lo explica: ese es el aprendizaje. Errores frecuentes Lo que se ve Qué está pasando Qué hacer Sigue pidiendo permiso aunque la ruta sea interna La carpeta elegida no es la que se cree, o hay un acceso directo a otra ubicación Comprobar la ruta del espacio de trabajo y evitar enlaces, accesos directos y unidades de red El alumno no encuentra el archivo creado Lo ha creado en otra subcarpeta del espacio de trabajo Pedir al agente la ruta completa del archivo y abrirla Tras cambiar la política, ya nada funciona Se ha pasado a un modo demasiado restrictivo (por ejemplo, solo lectura) Volver al modo anterior y explicar que la política se puede ajustar El alumno cambia la política sin saber qué modo elige No ha leído las opciones Leer juntos la opción de política de permisos antes de tocarla El agente pide permiso para escribir y para ejecutar Son operaciones distintas, cada una con su aviso Explicar que cada tipo de acción se evalúa por separado Plan B si no sale Vuelve a la Práctica 2 y compara las dos pantallas, una al lado de la otra. Si el espacio de trabajo es una unidad de red o una carpeta sincronizada, cambia a una carpeta local sencilla. Si el grupo va perdido, escribe en la pizarra las tres ideas: dentro, fuera, aviso. Si alguien va muy rápido Que haga la misma tarea tres veces cambiando el modo de permisos y anote en una tabla qué pasa en cada caso. Aprovecha para introducir el mínimo privilegio : el modo más abierto no es el mejor, es el más arriesgado. Práctica 4 — Enseñarle un procedimiento Objetivo: dejar instrucciones permanentes (notas en el AGENTS.md o una skill guardada) y comprobar que el agente las respeta en una sesión nueva . Qué debería pasar El alumno escribe las instrucciones una sola vez: o bien como notas permanentes en el AGENTS.md, o como skill con su procedimiento. El agente propone dónde guardarlas y muestra el texto que va a escribir. El alumno abre una conversación nueva y pide la tarea. El agente aplica el procedimiento sin que se lo repitan. Cómo saber que salió bien El AGENTS.md existe: el global en la carpeta de configuración del usuario ( C:\\Users\\Usuario\\.dsh ), o el del proyecto en la raíz del proyecto. En una sesión nueva, el agente sigue el formato o los pasos acordados sin recordatorio . Si se usa una skill, existe .dsh/skills/ nombre /SKILL.md dentro del proyecto. El alumno compara: antes había que explicarlo cada vez, ahora no. Solución de referencia Petición del alumno: A partir de ahora, siempre que hagas un resumen, escríbelo en un archivo .md dentro de una carpeta llamada resumenes , con el título en negrita, tres secciones fijas (Contexto, Puntos clave, Próximos pasos) y sin más de 300 palabras. Guárdalo como instrucción permanente. Qué haría el agente: Propone escribir esa instrucción en el AGENTS.md correspondiente, o crear una skill con el procedimiento. Muestra el texto exacto que va a guardar: son las notas que se dejan al becario antes de que empiece . En una sesión nueva , al pedir un resumen, aplica el formato y guarda el archivo donde toca. Si algo no encaja, lo dice y propone corregir la instrucción, no improvisar cada vez. Errores frecuentes Lo que se ve Qué está pasando Qué hacer En la sesión nueva el agente ignora las instrucciones Se guardaron en un AGENTS.md que no corresponde al proyecto activo, o no se llegaron a guardar Revisar si es el global o el del proyecto, y la raíz del proyecto en uso El alumno cree que el agente recuerda la conversación anterior Cada sesión es independiente; lo permanente vive en el AGENTS.md o en la skill Explicar la diferencia entre memoria permanente y contexto de la conversación Instrucciones contradictorias y resultado raro Hay reglas viejas que chocan con las nuevas Leer el archivo y limpiar: menos reglas y más claras La skill no se usa nunca Ruta o nombre incorrectos: debe estar en .dsh/skills/ nombre /SKILL.md dentro del proyecto Comparar con el ejemplo ya existente .dsh/skills/precios-gasolineras/SKILL.md El agente guarda las notas en un sitio raro No se le indicó la ruta y eligió una carpeta del espacio de trabajo Indicar explícitamente la carpeta de configuración del usuario o la raíz del proyecto Plan B si no sale Si la escritura del AGENTS.md se atasca, que dicte las instrucciones en voz alta y las guarde a mano en un archivo de texto. Si no se atreve con skills, quédate con el AGENTS.md: cubre el mismo objetivo. Si el grupo no tiene proyecto propio, usa la carpeta de ejemplo del seminario. Si alguien va muy rápido Que convierta un procedimiento largo ( cómo preparo el informe semanal ) en una skill con nombre propio y la pruebe en una sesión nueva desde cero. Que escriba dos instrucciones y compruebe cuál gana cuando se contradicen: enseña a priorizar. Práctica 5 — Encargo integrador Objetivo: realizar un encargo real de principio a fin, con varias acciones encadenadas , y verificar el resultado por parte del alumno. Qué debería pasar El alumno pide algo que requiere varios pasos: buscar información en los archivos, crear una carpeta y escribir uno o varios documentos. El agente encadena las acciones y pide aprobación solo si sale de la zona delimitada. Al terminar, el agente resume qué ha leído y qué ha escrito, con rutas. El alumno abre los archivos y comprueba que el contenido se corresponde con lo pedido. Cómo saber que salió bien El agente ha hecho más de una acción sin que se lo repitan paso a paso. El alumno abre los archivos generados y el contenido encaja con lo pedido. Hay un cierre del agente que lista qué archivos ha tocado y con qué resultado. Si hubo avisos de aprobación, el alumno sabe decir por qué aparecieron. Solución de referencia Petición del alumno: En la carpeta del proyecto que te he dado: mira todos los documentos, crea una carpeta informe y dentro escribe un informe.md de dos páginas con un índice, los puntos clave, las contradicciones que encuentres entre documentos y una lista de 5 tareas pendientes. Al terminar, dime exactamente qué archivos has creado y qué has leído. Qué haría el agente: Lista y lee los documentos del espacio de trabajo. Crea la carpeta informe . Escribe el archivo con la estructura pedida. Devuelve un resumen: archivos leídos, archivo creado, ruta completa y qué partes son interpretación suya. Verificación del alumno: abrir el archivo, comprobar el índice y leer al menos las contradicciones señaladas. Errores frecuentes Lo que se ve Qué está pasando Qué hacer El alumno acepta el resultado sin abrir nada Confunde el agente dice que lo ha hecho con está hecho Regla de la sala: el que revisa es el humano ; abrir siempre el archivo El informe incluye datos que no existen El agente ha rellenado huecos; hay que verificar cada afirmación frente a la fuente Pedir que cite de qué archivo sale cada punto, corregir y repetir El encargo no avanza y el agente da vueltas El encargo es demasiado amplio o ambiguo para una sola petición Partirlo en dos encargos y decir formato, extensión y carpeta de destino Se disparan avisos de aprobación en cadena El encargo sale del espacio de trabajo (escritorio, carpeta personal, unidad de red) Mover el trabajo dentro del espacio de trabajo: la solución no es aprobar cien avisos El resultado empeora hacia el final La mesa de trabajo (el contexto) se ha llenado de papeles Empezar una sesión nueva y dejar por escrito lo esencial en el AGENTS.md o en una skill Plan B si no sale Reduce el encargo a dos pasos y déjalo ahí: es mejor terminar algo pequeño que no terminar nada. Si el agente se pierde, que el alumno pida primero el índice y luego el contenido. Si no hay tiempo, hazlo tú en pantalla grande mientras ellos dictan las instrucciones. Si alguien va muy rápido Que añada un paso de verificación: pedir al agente que revise su propio informe y señale sus tres puntos más débiles. Después, contrastar esa autocrítica con el archivo real: enseña que el agente se equivoca y se corrige. Problemas técnicos de sala Síntoma Causa probable Solución Al arrancar dice que el puerto 3080 está ocupado Ya hay un harness u otro programa usando ese puerto Cerrar la otra instancia; si no la encuentras, reiniciar el equipo y volver a arrancar node no se reconoce, o da errores de versión Node.js no está instalado o es demasiado antiguo Instalar o actualizar Node.js y abrir una terminal nueva para que tome el PATH npx no se reconoce como comando Instalación de Node.js incompleta, o terminal sin reiniciar Reinstalar Node.js completo, cerrar y abrir la terminal La interfaz no carga en el navegador Se abrió una dirección equivocada, o el navegador está desactualizado Escribir a mano http://127.0.0.1:3080 ; probar con otro navegador El navegador no se abre solo Se arrancó con la opción de no abrir el navegador Abrir la dirección a mano; para que se abra sola, arrancar sin --no-open Error de modelo o respuesta vacía al enviar Falta la clave de API Ajustes → Modelos → introducir la clave de https://platform.deepseek.com/ y guardar Clave inválida o error de cuota Clave mal copiada, caducada o sin saldo Volver a copiar la clave completa y revisar el saldo en la plataforma No aparece el cuadro para escribir mensajes No hay espacio de trabajo seleccionado Elegir espacio de trabajo → añadir la carpeta → seleccionarla El agente parece colgado o tarda mucho Está pensando, esperando una aprobación o la red va lenta Mirar si hay un aviso de aprobación pendiente; esperar; si sigue igual, abrir una sesión nueva Errores de conexión, certificados o proxy Red corporativa o proxy que filtra la salida a internet Probar con otra red o con el móvil como punto de acceso; pedir al informático la configuración del proxy El firewall o el antivirus bloquean el programa Bloqueo de ejecución o de conexión local Añadir una excepción para Node.js y para la dirección local; si no se puede, usar otro portátil Permiso denegado al leer o escribir una carpeta Permisos del sistema operativo, carpeta sincronizada o de solo lectura Usar una carpeta propia y sencilla del usuario; evitar carpetas sincronizadas en la nube El agente dice que no puede escribir el archivo La ruta está fuera del espacio de trabajo o el modo de permisos no lo permite Mover la tarea dentro del espacio de trabajo y revisar la política de permisos Las respuestas empeoran o se vuelven repetitivas El contexto se ha llenado: la mesa está llena de papeles Abrir una sesión nueva y guardar lo importante en el AGENTS.md o en una skill El alumno cierra la terminal y el servidor se para El servidor vive en esa terminal: cerrarla lo apaga Volver a arrancarlo con npx @deepseek-ai/dsh web , o dsh web si está instalado globalmente Un alumno no puede instalar nada Portátil corporativo o usuario restringido Usar el arranque sin instalar ( npx @deepseek-ai/dsh web ); si tampoco, práctica por parejas Frases de rescate para el instructor Sirven para decir en voz alta cuando algo falla delante de la clase. Esto es exactamente lo que veníamos a ver: por esto existe el «¿seguro?» antes de salir de la sala. Tranquilo, esto le pasa a la mitad de la sala. Vamos a mirarlo entre los dos. Fallar aquí no es un problema tuyo, es información: acabamos de aprender qué límite tiene el agente. Mientras arreglamos esto, fíjate en lo que ya ha ido bien: ha leído tu carpeta. Vamos a leer juntos el mensaje. Casi siempre dice lo que pasa. Si en dos minutos no sale, seguimos con el compañero y volvemos a esto después. El agente se equivoca y se corrige; la responsabilidad de revisar es nuestra. No hace falta saber programar para esto, solo hace falta leer lo que te pide. Guarda una captura del error: es un buen apunte para tu cuaderno. Vamos al plan B: lo hacemos dentro del espacio de trabajo y lo vemos funcionando. Criterios de evaluación de las prácticas Se evalúa el criterio, no la velocidad. Nadie tiene que terminar todas las prácticas. Nivel Qué se observa No lo consigue No arranca el harness o no llega a enviar una petición. No distingue el chat del agente. Necesita que el instructor haga clic por él. Lo consigue con ayuda Completa la práctica con pistas del instructor. Reconoce el aviso de aprobación pero no explica qué lo provoca. Confunde el espacio de trabajo con la carpeta de configuración. Lo consigue solo Arranca, elige espacio de trabajo, formula la petición y verifica el resultado. Explica sandbox, aprobación y memoria permanente con sus propias palabras. Sabe qué hacer cuando algo falla. Va más allá Cambia la política de permisos a propósito y explica el efecto. Guarda un procedimiento en el AGENTS.md o como skill y lo prueba en sesión nueva. Razona sobre mínimo privilegio y datos sensibles. Qué mirar en cada práctica Práctica 1: ¿el cuadro de mensajes está habilitado? ¿el resumen menciona archivos reales de su carpeta? Práctica 2: ¿aparece el aviso y el agente espera? ¿el alumno sabe qué está aprobando y por qué? Práctica 3: ¿la misma tarea dentro del espacio de trabajo ya no pide permiso? ¿sabe explicar la diferencia? Práctica 4: ¿las instrucciones están guardadas donde toca? ¿se respetan en una sesión nueva? Práctica 5: ¿el alumno abre el archivo y verifica? ¿distingue lo que el agente ha leído de lo que ha interpretado? Qué NO debe hacer el instructor No aprobar permisos en el portátil de un alumno sin explicarlo. Si lo haces tú, le enseñas a aprobar a ciegas. Lee el aviso en voz alta y deja que decida él. No prometer que el agente nunca se equivoca. Es developer preview , itera rápido y habrá cambios que rompan compatibilidad. La revisión humana es parte del método. No usar datos reales sensibles en las demostraciones. Ni nóminas, ni datos de salud, ni credenciales, ni contratos. Prepara una carpeta de ejemplo aburrida. No culpar al alumno delante del grupo. Un esto le pasa a muchos desatasca más que un te has saltado un paso . No improvisar con datos de alumnos en pantalla compartida. Nada de abrir su carpeta personal, su correo o sus archivos por muy rápido que sea. No presentar el sandbox y las aprobaciones como una garantía. Reducen el riesgo, no garantizan aislamiento y no deben ser el único control de seguridad. Recomienda mínimo privilegio, máquina virtual o contenedor desechable, copias de seguridad y revisar plugins y comandos antes de permitirlos. No meter credenciales propias en el portátil de un alumno. Que cada uno use su clave de API y su propia cuenta."},{"id":"doc-06","grupo":"instructor","titulo":"Evaluación","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 16 min de lectura\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M6 3h8l4 4v14H6z\"/\u003e\u003cpath d=\"M14 3v5h5\"/\u003e\u003cpath d=\"M9 13h6M9 17h6\"/\u003e\u003c/svg\u003e Documento 06\u003c/span\u003e\n      \u003c/div\u003e\u003ch1 id=\"evaluacion-del-seminario-del-chat-al-agente-que-es-un-harnes\"\u003eEvaluación del seminario «Del chat al agente: qué es un harness y cómo se usa»\u003c/h1\u003e\n\u003ch2 id=\"1-como-usar-esta-evaluacion\"\u003e1. Cómo usar esta evaluación\u003c/h2\u003e\n\u003cp\u003eEste documento tiene dos partes que se usan en momentos distintos. El \u003cstrong\u003ecuestionario inicial\u003c/strong\u003e se rellena en los primeros cinco minutos y \u003cstrong\u003eno se puntúa\u003c/strong\u003e: sirve para saber de dónde parte el grupo y para que el instructor ajuste el ritmo, los ejemplos y el tiempo de cada práctica. El \u003cstrong\u003ecuestionario final\u003c/strong\u003e se rellena al terminar y sirve para comprobar qué se ha aprendido, \u003cstrong\u003eno para suspender a nadie\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eReparte el inicial en papel (o compártelo antes de empezar) y guarda el final junto con la encuesta de satisfacción para comentar los resultados en los últimos diez minutos. Compara lo que respondió cada persona al principio con lo que responde al final: ese salto es la información más útil del seminario.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"2-cuestionario-inicial-diagnostico\"\u003e2. Cuestionario inicial (diagnóstico)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003ePara el alumno:\u003c/strong\u003e responde con lo que creas \u003cstrong\u003eahora\u003c/strong\u003e, sin buscar información y sin mirar el de tu compañero. No hay respuestas malas y esto no se puntúa: solo sirve para que el seminario se adapte a ti. \u003cstrong\u003eTiempo: 5 minutos.\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eNombre y apellidos\u003c/th\u003e\n\u003cth\u003eFecha\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch3 id=\"opcion-multiple-marca-una-sola\"\u003eOpción múltiple (marca una sola)\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eI1.\u003c/strong\u003e Cuando hablamos del «modelo» y del «harness», ¿cómo lo describirías?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA)\u003c/strong\u003e Son lo mismo: el programa que instalas y la inteligencia que responde.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eB)\u003c/strong\u003e El modelo piensa y escribe; el harness es el programa que lo rodea y le da herramientas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eC)\u003c/strong\u003e El modelo es la interfaz web; el harness es el servidor donde se ejecuta.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eD)\u003c/strong\u003e El modelo es de pago y el harness es gratis.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eI2.\u003c/strong\u003e ¿Qué crees que puede hacer un agente que un chat normal no hace?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA)\u003c/strong\u003e Escribir textos más largos y con mejor estilo.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eB)\u003c/strong\u003e Actuar sobre tu ordenador: leer y modificar archivos, ejecutar comandos, y tú revisas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eC)\u003c/strong\u003e Contestarte sin conexión a internet.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eD)\u003c/strong\u003e Saber ya todo lo que hay en tu ordenador sin que se lo indiques.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eI3.\u003c/strong\u003e Cuando el agente te pide un permiso, ¿qué crees que está pasando?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA)\u003c/strong\u003e Va a hacer algo fuera de la zona delimitada y te pregunta antes de tocarlo.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eB)\u003c/strong\u003e Se ha quedado sin saldo en tu cuenta.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eC)\u003c/strong\u003e Ha encontrado un problema de seguridad en tu ordenador.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eD)\u003c/strong\u003e Te está pidiendo que escribas tú el comando en la terminal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eI4.\u003c/strong\u003e Si el agente se equivoca y cambia algo que no querías, ¿qué crees que ocurre?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA)\u003c/strong\u003e El harness lo revierte solo: no hay nada de lo que preocuparse.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eB)\u003c/strong\u003e Los cambios pueden ser difíciles de recuperar; conviene trabajar con copias de seguridad y permisos limitados.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eC)\u003c/strong\u003e Con la política de aprobaciones que viene por defecto es imposible que pase.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eD)\u003c/strong\u003e El agente detecta el error y lo corrige sin avisarte.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"preguntas-abiertas-cortas-una-o-dos-lineas\"\u003ePreguntas abiertas cortas (una o dos líneas)\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eI5.\u003c/strong\u003e ¿Qué te gustaría automatizar o quitarte de encima con un agente?\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eRespuesta:\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003eI6.\u003c/strong\u003e ¿Qué te da miedo que el agente toque o cambie?\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eRespuesta:\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"nota-para-el-instructor-que-patrones-observar-y-que-indican\"\u003eNota para el instructor: qué patrones observar y qué indican\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePatrón en las respuestas\u003c/th\u003e\n\u003cth\u003eQué indica\u003c/th\u003e\n\u003cth\u003eQué hacer en la sesión\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eConfunde el modelo con el producto («DeepSeek es la aplicación»)\u003c/td\u003e\n\u003ctd\u003eNo tiene separados el motor y el coche\u003c/td\u003e\n\u003ctd\u003eReforzar la analogía \u003cstrong\u003emotor / coche completo\u003c/strong\u003e al presentar el harness\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eElige I2-D («ya sabe lo que hay en mi ordenador»)\u003c/td\u003e\n\u003ctd\u003eConfunde memoria del modelo con leer archivos\u003c/td\u003e\n\u003ctd\u003eInsistir: el agente solo ve lo que lee con herramientas y con permisos\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCree que aprobar una vez vale para siempre\u003c/td\u003e\n\u003ctd\u003eNo ha visto el coste real de las aprobaciones\u003c/td\u003e\n\u003ctd\u003eDar tiempo a la \u003cstrong\u003epráctica 2\u003c/strong\u003e y a la \u003cstrong\u003epráctica 3\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCree que el harness deshace los errores (I4-A)\u003c/td\u003e\n\u003ctd\u003eFalsa red de seguridad\u003c/td\u003e\n\u003ctd\u003eHablar de copias de seguridad y de \u003cstrong\u003emínimo privilegio\u003c/strong\u003e antes de la práctica 5\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMiedo difuso a «que toque todo» (I6)\u003c/td\u003e\n\u003ctd\u003eBuen punto de partida, sin vocabulario\u003c/td\u003e\n\u003ctd\u003eResponder con el sandbox y la política de aprobaciones, en concreto\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEn I5 no se le ocurre ninguna tarea\u003c/td\u003e\n\u003ctd\u003eTodavía no ha pensado en tareas delegables\u003c/td\u003e\n\u003ctd\u003eDar ejemplos genéricos de tareas repetitivas de oficina y pedir uno propio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAcierta I1–I4 con soltura\u003c/td\u003e\n\u003ctd\u003ePuede ayudar a otros sin aburrirse\u003c/td\u003e\n\u003ctd\u003eProponerle hacer de apoyo durante las prácticas\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRespuestas muy largas en I5 e I6\u003c/td\u003e\n\u003ctd\u003eExpectativas altas o miedo alto\u003c/td\u003e\n\u003ctd\u003eAterrizar el alcance real y recordar los límites del developer preview\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eRespuestas esperadas en el inicial (referencia, no se puntúa):\u003c/strong\u003e I1-B, I2-B, I3-A, I4-B.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eNo corrijas en voz alta\u003c/strong\u003e el cuestionario inicial antes de explicar los conceptos: se comparan al final, y el contraste es parte del aprendizaje.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"3-cuestionario-final\"\u003e3. Cuestionario final\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003ePara el alumno:\u003c/strong\u003e marca \u003cstrong\u003euna sola\u003c/strong\u003e opción en cada pregunta de la Parte A y responde con tus palabras en la Parte B. Si dudas, elige lo que harías de verdad, no lo que suene mejor. \u003cstrong\u003eTiempo: 15 minutos.\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eNombre y apellidos\u003c/th\u003e\n\u003cth\u003eFecha\u003c/th\u003e\n\u003cth\u003eAciertos en la Parte A (solo para ti)\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch3 id=\"parte-a-opcion-multiple-12-preguntas\"\u003eParte A — Opción múltiple (12 preguntas)\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eF1.\u003c/strong\u003e ¿Qué aporta el harness frente al modelo por sí solo?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA)\u003c/strong\u003e Un modelo más potente y más rápido que el que usa el chat.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eB)\u003c/strong\u003e Un programa que rodea al modelo y le da herramientas, permisos, memoria y control sobre lo que hace.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eC)\u003c/strong\u003e Un traductor que pasa tus mensajes a un idioma que el modelo entiende.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eD)\u003c/strong\u003e Un intermediario que responde por el modelo cuando no hay conexión.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eF2.\u003c/strong\u003e El agente trabaja en un bucle de pensar, actuar y observar. ¿Qué significa «observar»?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA)\u003c/strong\u003e Que te pregunta a ti si el resultado le parece bien.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eB)\u003c/strong\u003e Que lee el resultado de lo que acaba de hacer y decide el siguiente paso.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eC)\u003c/strong\u003e Que guarda la conversación para que no se te olvide nada.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eD)\u003c/strong\u003e Que comprueba si tiene permiso de administrador en tu ordenador.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eF3.\u003c/strong\u003e ¿Qué es una «herramienta» para el agente?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA)\u003c/strong\u003e Un complemento que hay que comprar aparte.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eB)\u003c/strong\u003e Una capacidad concreta que puede usar: leer archivos, escribir archivos, ejecutar comandos, buscar en internet.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eC)\u003c/strong\u003e Un atajo de teclado de la interfaz web.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eD)\u003c/strong\u003e El menú de Ajustes donde se configura la clave de API.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eF4.\u003c/strong\u003e El contexto es la mesa de trabajo del agente. ¿Qué pasa cuando se llena de papeles?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA)\u003c/strong\u003e Nada: el contexto no tiene límite.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eB)\u003c/strong\u003e El agente se para y hay que reiniciar la aplicación.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eC)\u003c/strong\u003e Pierde precisión y olvida detalles anteriores; conviene resumir, dividir la tarea o empezar de nuevo.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eD)\u003c/strong\u003e Se borran los archivos que ya había creado en el espacio de trabajo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eF5.\u003c/strong\u003e Ante un aviso de aprobación eliges \u003cstrong\u003e«Permitir una vez»\u003c/strong\u003e. ¿Qué implica?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA)\u003c/strong\u003e Que autorizas esa acción concreta ahora; la próxima vez volverá a preguntar.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eB)\u003c/strong\u003e Que autorizas esa acción para siempre en este proyecto.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eC)\u003c/strong\u003e Que autorizas todas las acciones del agente durante el resto de la sesión.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eD)\u003c/strong\u003e Que el agente ya no necesita permisos para nada.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eF6.\u003c/strong\u003e Sobre el sandbox, ¿qué afirmación es correcta?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA)\u003c/strong\u003e Garantiza un aislamiento total: nada de lo que haga el agente puede afectar a tu ordenador.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eB)\u003c/strong\u003e Delimita dónde puede trabajar el agente y reduce el riesgo, pero no garantiza aislamiento.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eC)\u003c/strong\u003e Es una copia de seguridad automática de tus archivos.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eD)\u003c/strong\u003e Solo hace falta si trabajas con datos muy sensibles.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eF7.\u003c/strong\u003e ¿Qué es una skill y para qué sirve?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA)\u003c/strong\u003e Un procedimiento guardado que el agente sigue cuando la tarea encaja, como una receta de cocina.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eB)\u003c/strong\u003e Un permiso permanente que le das al agente.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eC)\u003c/strong\u003e Un modelo más rápido y más barato que el habitual.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eD)\u003c/strong\u003e Una carpeta donde el agente va dejando los resultados.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eF8.\u003c/strong\u003e ¿Para qué sirve el archivo AGENTS.md?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA)\u003c/strong\u003e Para guardar las conversaciones anteriores y poder volver a ellas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eB)\u003c/strong\u003e Para indicar qué modelo y qué clave de API debe usar el agente.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eC)\u003c/strong\u003e Para dejarle por escrito lo que debe saber siempre: cómo trabajas, tus normas y las rutas importantes.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eD)\u003c/strong\u003e Para declarar qué herramientas de terceros tiene permitidas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eF9.\u003c/strong\u003e ¿Qué es MCP?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA)\u003c/strong\u003e Un modelo de lenguaje especializado en programación.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eB)\u003c/strong\u003e Un estándar que permite conectar herramientas que ya existen (GitHub, bases de datos, gestores de incidencias) para que aparezcan como herramientas nuevas del agente.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eC)\u003c/strong\u003e Un modo de seguridad que bloquea la conexión a internet.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eD)\u003c/strong\u003e El formato de los documentos que el agente puede leer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eF10.\u003c/strong\u003e El agente se equivoca, lo corriges y empeora. ¿Qué es lo más sensato?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA)\u003c/strong\u003e Insistir con la misma instrucción y subir el tono.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eB)\u003c/strong\u003e Parar, revisar qué ha hecho, y si hace falta volver atrás o replantear la tarea en trozos más pequeños y con más contexto.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eC)\u003c/strong\u003e Darle acceso total para que se arregle solo.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eD)\u003c/strong\u003e Cerrar la aplicación: significa que el agente no sirve para esto.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eF11.\u003c/strong\u003e Vas a instalar un plugin de terceros. ¿Cuál es el riesgo principal?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA)\u003c/strong\u003e Que ocupe mucho espacio en el disco.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eB)\u003c/strong\u003e Que cambie el idioma de la interfaz.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eC)\u003c/strong\u003e Que ejecute código con los mismos permisos que el agente y llegue a tus datos o a tus credenciales.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eD)\u003c/strong\u003e Que solo funcione con la versión de pago del modelo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eF12.\u003c/strong\u003e El proyecto está en «developer preview». ¿Qué significa para ti?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eA)\u003c/strong\u003e Que es una versión en desarrollo: cambia rápido, puede romper compatibilidad y no hay auditoría de seguridad.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eB)\u003c/strong\u003e Que es gratis, pero con publicidad.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eC)\u003c/strong\u003e Que solo pueden usarlo programadores profesionales.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eD)\u003c/strong\u003e Que ya está terminado y estable, solo le faltan detalles estéticos.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"parte-b-preguntas-abiertas-3\"\u003eParte B — Preguntas abiertas (3)\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eF13.\u003c/strong\u003e Explica con tus palabras la diferencia entre un chat y un agente.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eRespuesta (3-5 líneas):\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003eF14.\u003c/strong\u003e Describe un aviso de aprobación que hayas visto durante las prácticas y por qué apareció.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eRespuesta (2-4 líneas):\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003eF15.\u003c/strong\u003e Propón una tarea de tu trabajo que le encargarías al agente y explica cómo comprobarías que el resultado es correcto.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eRespuesta (3-5 líneas):\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2 id=\"4-clave-de-respuestas-y-explicaciones\"\u003e4. Clave de respuestas y explicaciones\u003c/h2\u003e\n\u003ch3 id=\"parte-a-clave-cuestionario-final\"\u003eParte A — Clave (cuestionario final)\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePregunta\u003c/th\u003e\n\u003cth\u003eRespuesta correcta\u003c/th\u003e\n\u003cth\u003ePor qué\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eF1.\u003c/strong\u003e Qué aporta el harness frente al modelo\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eB\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEl modelo es el motor; el harness es el coche completo: volante, frenos y salpicadero. La opción A es tentadora porque el modelo es lo único que «se ve» en un chat, pero el modelo no tiene herramientas, permisos ni memoria de proyecto.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eF2.\u003c/strong\u003e Qué significa «observar»\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eB\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEl bucle es pensar, actuar y mirar el resultado para decidir el paso siguiente. La A es tentadora porque el agente a veces pregunta al usuario, pero eso es otra herramienta, no el paso de observar.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eF3.\u003c/strong\u003e Qué es una herramienta\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eB\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eLas herramientas son capacidades concretas que el agente puede invocar. La D es tentadora por confundir «herramienta» con la configuración, y la A porque muchos complementos de otros programas se pagan aparte.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eF4.\u003c/strong\u003e Qué pasa cuando el contexto se llena\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eC\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEl contexto es la mesa de trabajo: si se llena de papeles, hay que recoger, resumir o empezar una tarea nueva. La A es tentadora porque el chat parece recordar siempre, pero se le escapan los detalles.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eF5.\u003c/strong\u003e Qué significa «permitir una vez»\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eA\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eVale solo para esa vez: no concede permiso permanente, y esa incomodidad es intencionada. La B es el error más típico: creer que aprobar una vez vale para siempre.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eF6.\u003c/strong\u003e Qué hace y qué no hace el sandbox\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eB\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEl sandbox delimita la zona de trabajo y las aprobaciones son el «¿seguro?» antes de salir de ella, pero eso reduce el riesgo, no garantiza aislamiento. La A es tentadora porque suena a «modo seguro» y no lo es.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eF7.\u003c/strong\u003e Qué es una skill\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eA\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eLas skills son procedimientos guardados, como recetas: se escriben una vez y se reutilizan. La B la confunde con los permisos y la D con la carpeta de resultados.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eF8.\u003c/strong\u003e Para qué sirve AGENTS.md\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eC\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eAGENTS.md son las notas que dejas al becario antes de que empiece; hay uno global y otro por proyecto. La A lo confunde con el historial de sesiones y la B con los ajustes de modelo.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eF9.\u003c/strong\u003e Qué es MCP\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eB\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eMCP es un enchufe estándar, tipo USB, para conectar herramientas que ya existen sin escribir nada nuevo. La A lo confunde con un modelo y la D con un formato de archivo.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eF10.\u003c/strong\u003e Qué hacer cuando el agente se equivoca y empeora\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eB\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eParar, revisar lo hecho y replantear la tarea en trozos pequeños suele resolverlo. La C es tentadora porque parece que más permisos dan más capacidad, pero normalmente agrandan el problema; la A solo repite el error.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eF11.\u003c/strong\u003e Riesgo de un plugin de terceros\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eC\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eUn plugin corre con los permisos del agente, así que puede llegar a lo mismo que él. La A es tentadora porque es el riesgo fácil de imaginar, pero el daño real no es el espacio en disco.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eF12.\u003c/strong\u003e Qué significa developer preview\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eA\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEs una versión en desarrollo: iteración rápida, cambios que rompen compatibilidad y sin auditoría de seguridad. La D es tentadora porque la herramienta funciona bien en la demo, pero «funciona» no es «estable».\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch3 id=\"clave-del-cuestionario-inicial-solo-para-el-instructor-no-se\"\u003eClave del cuestionario inicial (solo para el instructor, no se puntúa)\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePregunta\u003c/th\u003e\n\u003cth\u003eRespuesta esperada\u003c/th\u003e\n\u003cth\u003eLectura rápida\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eI1\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eB\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eDistingue modelo de harness; si falla, insistir en motor y coche.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eI2\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eB\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEntiende que el agente actúa sobre el ordenador.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eI3\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eA\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEntiende la aprobación como control de salida de la zona delimitada.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eI4\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eB\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eAsume que los errores tienen consecuencias reales.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch3 id=\"criterios-de-correccion-de-las-preguntas-abiertas-f13-f14-f1\"\u003eCriterios de corrección de las preguntas abiertas (F13, F14, F15)\u003c/h3\u003e\n\u003cp\u003eNo hay una única respuesta válida: valora si aparecen las ideas clave.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eF13. Diferencia entre un chat y un agente\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eDebe aparecer:\u003c/strong\u003e que el chat solo conversa y te dice qué hacer, mientras que el agente actúa sobre tu ordenador y tú revisas; mención de herramientas, permisos o revisión del resultado.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBuena:\u003c/strong\u003e «El chat es como un consultor por teléfono: te explica qué hacer y lo haces tú. El agente es como un becario con acceso a mi ordenador: lo hace él, con las herramientas y permisos que le doy, y yo reviso lo que ha hecho».\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRegular:\u003c/strong\u003e «El agente es un chat más avanzado que puede hacer cosas». Recoge la idea de acción, pero sin herramientas, permisos ni revisión.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFloja:\u003c/strong\u003e «Son lo mismo, pero el agente responde mejor» o «el agente es el de pago».\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eF14. Un aviso de aprobación visto en las prácticas\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eDebe aparecer:\u003c/strong\u003e una acción concreta (por ejemplo, escribir o ejecutar un comando fuera del espacio de trabajo), el motivo de que apareciera y qué eligió.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBuena:\u003c/strong\u003e «Intentó crear un archivo en mi Escritorio, fuera de la carpeta de trabajo, y salió el aviso. Elegí &quot;Permitir una vez&quot; porque era justo lo que quería; si me lo pidiera cada vez, movería el trabajo dentro de la carpeta del proyecto».\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRegular:\u003c/strong\u003e «Salió un aviso y le di a permitir». Identifica el aviso, pero no explica por qué apareció.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFloja:\u003c/strong\u003e «No vi ninguno» o confundir el aviso con un error de la aplicación.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eF15. Tarea propia y cómo comprobar el resultado\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eDebe aparecer:\u003c/strong\u003e una tarea concreta y verificable, y un criterio de comprobación realista (leer el resultado, compararlo con el original, revisar los cambios antes de aceptarlos, pedir una lista de lo que ha tocado).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBuena:\u003c/strong\u003e «Le pediría renombrar y clasificar las facturas de un trimestre en carpetas por mes. Lo comprobaría abriendo la carpeta, contando que están todas y revisando que ningún nombre se ha quedado raro».\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRegular:\u003c/strong\u003e tarea adecuada, pero comprobación vaga («lo miraría por encima»).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFloja:\u003c/strong\u003e tarea sin criterio de comprobación («que lo haga todo y ya está») o algo que no se puede verificar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003ePreguntas que suelen fallar más.\u003c/strong\u003e Si al terminar hay que repasar algo en grupo, empieza por \u003cstrong\u003eF5\u003c/strong\u003e (creer que aprobar una vez vale para siempre), \u003cstrong\u003eF6\u003c/strong\u003e (creer que el sandbox aísla del todo) y \u003cstrong\u003eF10\u003c/strong\u003e (responder al error dando más permisos). Son los tres malentendidos que más problemas causan después, cuando la persona trabaja sola en su ordenador.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"5-interpretacion-de-resultados\"\u003e5. Interpretación de resultados\u003c/h2\u003e\n\u003cp\u003eCuenta los aciertos de las 12 preguntas de la Parte A y lee la banda correspondiente. Las abiertas y la encuesta se leen aparte, en positivo.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eAciertos\u003c/th\u003e\n\u003cth\u003eLectura\u003c/th\u003e\n\u003cth\u003eQué hacer\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10-12\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eConceptos sólidos, incluidos permisos y límites\u003c/td\u003e\n\u003ctd\u003eRecomendar profundizar en MCP y skills, y probar un encargo real en su trabajo esta semana\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e7-9\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eBase correcta, con algún punto flojo\u003c/td\u003e\n\u003ctd\u003eRepasar los fallos concretos: suele ser F5 (permitir una vez), F6 (sandbox) o F10 (qué hacer cuando empeora)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e4-6\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eSe han captado las ideas generales, no los detalles\u003c/td\u003e\n\u003ctd\u003eRepetir las prácticas 2 y 3 con más calma y volver a explicar la analogía motor/coche\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e0-3\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eLa sesión no ha llegado a asentarse\u003c/td\u003e\n\u003ctd\u003eSugerir repetir el seminario o empezar por un caso muy pequeño y guiado, sin culpar a nadie: el ritmo, no la persona, es lo que hay que ajustar\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eAdvertencia importante:\u003c/strong\u003e 12 preguntas \u003cstrong\u003eno miden dominio\u003c/strong\u003e, solo orientan. Una persona puede fallar dos y usar el agente con criterio, y otra acertar once y no saber qué hacer el lunes. Usa el resultado como pista para seguir acompañando, nunca como nota ni como etiqueta.\u003c/p\u003e\n\u003cp\u003eSi comparas el inicial con el final, fíjate sobre todo en \u003cstrong\u003eI3 frente a F5\u003c/strong\u003e y en \u003cstrong\u003eI4 frente a F6\u003c/strong\u003e: ahí está el cambio de mentalidad que buscamos (los permisos y los límites importan).\u003c/p\u003e\n\u003ch3 id=\"hoja-de-registro-del-instructor\"\u003eHoja de registro del instructor\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eAlumno\u003c/th\u003e\n\u003cth\u003ePatrón detectado en el inicial\u003c/th\u003e\n\u003cth\u003eAciertos en el final (Parte A)\u003c/th\u003e\n\u003cth\u003eSeguimiento sugerido\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003chr\u003e\n\u003ch2 id=\"6-encuesta-de-satisfaccion-breve\"\u003e6. Encuesta de satisfacción breve\u003c/h2\u003e\n\u003cp\u003eMarca de 1 a 5, donde \u003cstrong\u003e1 = nada / muy en desacuerdo\u003c/strong\u003e y \u003cstrong\u003e5 = mucho / muy de acuerdo\u003c/strong\u003e.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eNº\u003c/th\u003e\n\u003cth\u003ePregunta\u003c/th\u003e\n\u003cth\u003e1\u003c/th\u003e\n\u003cth\u003e2\u003c/th\u003e\n\u003cth\u003e3\u003c/th\u003e\n\u003cth\u003e4\u003c/th\u003e\n\u003cth\u003e5\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eEl seminario me ha ayudado a entender qué es un harness y en qué se diferencia de un chat\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2\u003c/td\u003e\n\u003ctd\u003eMe siento capaz de arrancar el harness y dejarlo listo (modelo y espacio de trabajo) por mi cuenta\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e3\u003c/td\u003e\n\u003ctd\u003eHe entendido para qué sirven los permisos y las aprobaciones\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e4\u003c/td\u003e\n\u003ctd\u003eEl ritmo de la sesión ha sido el adecuado para mí\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e5\u003c/td\u003e\n\u003ctd\u003eRecomendaría este seminario a un compañero\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eDuración de los bloques\u003c/strong\u003e (para ajustar la próxima edición). Marca una casilla por bloque:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eBloque\u003c/th\u003e\n\u003cth\u003eSe hizo largo\u003c/th\u003e\n\u003cth\u003eEstuvo bien\u003c/th\u003e\n\u003cth\u003eSe hizo corto\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eConceptos: qué es un harness y qué es un agente\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eConfiguración: modelo y espacio de trabajo\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePráctica 1 — Primer arranque y primer encargo\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePráctica 2 — Provocar una aprobación\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePráctica 3 — Cambiar de política\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePráctica 4 — Enseñarle un procedimiento\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePráctica 5 — Encargo integrador\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch3 id=\"preguntas-abiertas\"\u003ePreguntas abiertas\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eS1.\u003c/strong\u003e ¿Qué te ha servido más de la sesión?\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eRespuesta:\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003eS2.\u003c/strong\u003e ¿Qué falta o qué sobra?\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eRespuesta:\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"notas-del-instructor-para-la-proxima-edicion\"\u003eNotas del instructor (para la próxima edición)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eQué bloque hubo que recortar:\u003c/li\u003e\n\u003cli\u003eQué bloque hubo que ampliar:\u003c/li\u003e\n\u003cli\u003eQué ejemplo funcionó mejor:\u003c/li\u003e\n\u003cli\u003eQué duda se repitió más:\u003c/li\u003e\n\u003cli\u003eCambio concreto para la próxima edición:\u003c/li\u003e\n\u003c/ul\u003e\n","texto":"16 min de lectura Documento 06 Evaluación del seminario «Del chat al agente: qué es un harness y cómo
