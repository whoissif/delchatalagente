o no garantizan aislamiento , y no deberían ser tu único control de seguridad. Si el trabajo es delicado, lo recomendable es usar una máquina virtual o un entorno dedicado y desechable. La responsabilidad de revisar es tuya. Es la contrapartida de la comodidad. Lo que sí está en tu mano: Trabajar con el mínimo privilegio necesario . Ni uno más. Tener copias de seguridad de todo lo que el agente puede tocar. No exponer credenciales ni datos sensibles. Revisar plugins y comandos antes de permitirlos."},{"id":"02-las-cuatro-reglas-para-el-lunes","grupo":"modulo3","titulo":"Las cuatro reglas para el lunes","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M12 3 3 8l9 5 9-5z\"/\u003e\u003cpath d=\"M3 12l9 5 9-5\"/\u003e\u003cpath d=\"M3 16l9 5 9-5\"/\u003e\u003c/svg\u003e Trabajar sin sustos\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 1 min de lectura\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M6 3h8l4 4v14H6z\"/\u003e\u003cpath d=\"M14 3v5h5\"/\u003e\u003cpath d=\"M9 13h6M9 17h6\"/\u003e\u003c/svg\u003e Documento 02\u003c/span\u003e\n      \u003c/div\u003e\u003ch2 id=\"10-las-cuatro-reglas-para-el-lunes\"\u003e10. Las cuatro reglas para el lunes\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eCopia de seguridad\u003c/strong\u003e de la carpeta antes de empezar.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUna carpeta específica\u003c/strong\u003e para cada trabajo. Ni el escritorio entero ni, mucho menos, todo el disco.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNada confidencial\u003c/strong\u003e en la carpeta de trabajo, salvo que aceptes el riesgo a conciencia.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRevisa antes de aprobar y verifica al terminar.\u003c/strong\u003e Las dos cosas, siempre.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n","texto":"Trabajar sin sustos 1 min de lectura Documento 02 10. Las cuatro reglas para el lunes Copia de seguridad de la carpeta antes de empezar. Una carpeta específica para cada trabajo. Ni el escritorio entero ni, mucho menos, todo el disco. Nada confidencial en la carpeta de trabajo, salvo que aceptes el riesgo a conciencia. Revisa antes de aprobar y verifica al terminar. Las dos cosas, siempre."},{"id":"02-resumen-de-una-pagina","grupo":"modulo3","titulo":"Resumen de una página","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M12 3 3 8l9 5 9-5z\"/\u003e\u003cpath d=\"M3 12l9 5 9-5\"/\u003e\u003cpath d=\"M3 16l9 5 9-5\"/\u003e\u003c/svg\u003e Trabajar sin sustos\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 1 min de lectura\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M6 3h8l4 4v14H6z\"/\u003e\u003cpath d=\"M14 3v5h5\"/\u003e\u003cpath d=\"M9 13h6M9 17h6\"/\u003e\u003c/svg\u003e Documento 02\u003c/span\u003e\n      \u003c/div\u003e\u003ch2 id=\"11-resumen-de-una-pagina\"\u003e11. Resumen de una página\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eEl cambio de fondo\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eChat: te dice qué hacer y lo haces tú.\u003c/li\u003e\n\u003cli\u003eAgente: un becario con acceso a tu ordenador. Lo hace y tú revisas.\u003c/li\u003e\n\u003cli\u003eModelo = motor. Harness = el coche completo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eLas piezas\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eHerramientas (las manos), bucle (piensa-actúa-observa), contexto (la mesa de trabajo), permisos (los frenos), interfaz (el salpicadero).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eLos permisos\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eDentro de la sala, libertad. Para salir, te pide permiso.\u003c/li\u003e\n\u003cli\u003eTú eliges el tamaño de la sala. Cuanto más pequeña, mejor.\u003c/li\u003e\n\u003cli\u003e«Permitir una vez» = una vez.\u003c/li\u003e\n\u003cli\u003eSi no lo entiendes, no lo apruebes.\u003c/li\u003e\n\u003cli\u003eEl sandbox reduce el riesgo; no lo elimina.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEl trabajo diario\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eUn buen encargo dice: qué, dónde, qué no tocar, y cómo se comprueba.\u003c/li\u003e\n\u003cli\u003eVerifica siempre. El agente no firma su trabajo.\u003c/li\u003e\n\u003cli\u003eSi repites una explicación por tercera vez, escríbela (\u003ccode\u003eAGENTS.md\u003c/code\u003e o una skill).\u003c/li\u003e\n\u003cli\u003eSi la conversación se degrada, abre una nueva y resume lo hecho.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eLas cuatro reglas\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eCopia de seguridad.\u003c/li\u003e\n\u003cli\u003eUna carpeta específica por trabajo.\u003c/li\u003e\n\u003cli\u003eNada confidencial dentro.\u003c/li\u003e\n\u003cli\u003eRevisa antes de aprobar; verifica al terminar.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eHoy no has aprendido a usar un programa. Has aprendido a dirigir a alguien que trabaja muy rápido, que no sabe lo que no sabe, y que tiene acceso a tus archivos. La herramienta te va a servir; los frenos te van a proteger.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n","texto":"Trabajar sin sustos 1 min de lectura Documento 02 11. Resumen de una página El cambio de fondo Chat: te dice qué hacer y lo haces tú. Agente: un becario con acceso a tu ordenador. Lo hace y tú revisas. Modelo = motor. Harness = el coche completo. Las piezas Herramientas (las manos), bucle (piensa-actúa-observa), contexto (la mesa de trabajo), permisos (los frenos), interfaz (el salpicadero). Los permisos Dentro de la sala, libertad. Para salir, te pide permiso. Tú eliges el tamaño de la sala. Cuanto más pequeña, mejor. «Permitir una vez» = una vez. Si no lo entiendes, no lo apruebes. El sandbox reduce el riesgo; no lo elimina. El trabajo diario Un buen encargo dice: qué, dónde, qué no tocar, y cómo se comprueba. Verifica siempre. El agente no firma su trabajo. Si repites una explicación por tercera vez, escríbela ( AGENTS.md o una skill). Si la conversación se degrada, abre una nueva y resume lo hecho. Las cuatro reglas Copia de seguridad. Una carpeta específica por trabajo. Nada confidencial dentro. Revisa antes de aprobar; verifica al terminar. Hoy no has aprendido a usar un programa. Has aprendido a dirigir a alguien que trabaja muy rápido, que no sabe lo que no sabe, y que tiene acceso a tus archivos. La herramienta te va a servir; los frenos te van a proteger."},{"id":"doc-07","grupo":"modulo4","titulo":"Preparación previa","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M6 3h8l4 4v14H6z\"/\u003e\u003cpath d=\"M14 3v5h5\"/\u003e\u003cpath d=\"M9 13h6M9 17h6\"/\u003e\u003c/svg\u003e Antes de venir\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 14 min de lectura\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M6 3h8l4 4v14H6z\"/\u003e\u003cpath d=\"M14 3v5h5\"/\u003e\u003cpath d=\"M9 13h6M9 17h6\"/\u003e\u003c/svg\u003e Documento 07\u003c/span\u003e\n      \u003c/div\u003e\u003ch1 id=\"preparacion-previa-y-logistica-seminario-del-chat-al-agente-\"\u003ePreparación previa y logística — Seminario «Del chat al agente: qué es un harness y cómo se usa»\u003c/h1\u003e\n\u003cp\u003eEste documento tiene \u003cstrong\u003etres partes\u003c/strong\u003e y cada una es para un público distinto:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eParte A\u003c/strong\u003e — Mensaje listo para copiar y enviar a los alumnos 3-5 días antes.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eParte B\u003c/strong\u003e — Guía de instalación paso a paso, para tener a mano durante el seminario.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eParte C\u003c/strong\u003e — Lista de comprobación del instructor (día anterior y día del seminario).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLa herramienta del seminario es \u003cstrong\u003eDeepSeek Harness\u003c/strong\u003e (\u003ccode\u003edsh\u003c/code\u003e), un \u003cem\u003eharness\u003c/em\u003e de agentes de DeepSeek AI.\nUn \u003cstrong\u003eharness\u003c/strong\u003e es la pieza que convierte un chat en un agente: le da herramientas, permisos, memoria y una carpeta de trabajo.\nEstá en fase \u003cstrong\u003edeveloper preview\u003c/strong\u003e: funciona, pero es software experimental y cambia a menudo.\u003c/p\u003e\n\u003chr\u003e\n\u003ch1 id=\"parte-a-mensaje-para-enviar-a-los-alumnos-3-5-dias-antes\"\u003eParte A — Mensaje para enviar a los alumnos (3-5 días antes)\u003c/h1\u003e\n\u003ch2 id=\"asunto\"\u003eAsunto\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eSeminario «Del chat al agente»: trae el portátil listo (unos 15 minutos de preparación)\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"cuerpo-del-mensaje\"\u003eCuerpo del mensaje\u003c/h2\u003e\n\u003cp\u003eHola:\u003c/p\u003e\n\u003cp\u003eEl \u003cstrong\u003e[día]\u003c/strong\u003e hacemos el seminario \u003cstrong\u003e«Del chat al agente: qué es un harness y cómo se usa»\u003c/strong\u003e, de 2-3 horas, en \u003cstrong\u003e[lugar]\u003c/strong\u003e.\nVamos a pasar de usar la IA como un chat que solo responde texto a usarla como un \u003cstrong\u003eagente\u003c/strong\u003e que trabaja dentro de una carpeta de tu ordenador: lee archivos, los modifica y ejecuta comandos.\nNo hace falta saber programar: todo se hace desde una interfaz web, como una página del navegador.\nTe pedimos que llegues con la preparación hecha, porque son unos 15 minutos y así los dedicamos a practicar en vez de a instalar cosas.\u003c/p\u003e\n\u003ch3 id=\"1-requisitos-previos-hazlo-antes-de-venir\"\u003e1. Requisitos previos (hazlo antes de venir)\u003c/h3\u003e\n\u003cp\u003eVas a necesitar dos cosas: \u003cstrong\u003eNode.js\u003c/strong\u003e instalado y una \u003cstrong\u003eclave de API de DeepSeek\u003c/strong\u003e.\nNode.js es el programa que hace falta para poder arrancar la herramienta.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEn Windows:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eEntra en la web oficial de Node.js y descarga el instalador para Windows.\u003c/li\u003e\n\u003cli\u003eElige la versión marcada como \u003cstrong\u003eLTS\u003c/strong\u003e (es la versión estable y recomendada; evita la que pone «Current»).\u003c/li\u003e\n\u003cli\u003eEjecuta el instalador y ve dándole a \u003cstrong\u003eSiguiente\u003c/strong\u003e con las opciones que vienen por defecto.\u003c/li\u003e\n\u003cli\u003eAbre el \u003cstrong\u003emenú Inicio\u003c/strong\u003e, escribe \u003ccode\u003ePowerShell\u003c/code\u003e o \u003ccode\u003eTerminal\u003c/code\u003e y ábrelo.\u003c/li\u003e\n\u003cli\u003eEscribe \u003ccode\u003enode -v\u003c/code\u003e y pulsa \u003cstrong\u003eIntro\u003c/strong\u003e. Si aparece un número de versión, está bien instalado.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eEn macOS:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eEntra en la web oficial de Node.js y descarga el instalador para macOS.\u003c/li\u003e\n\u003cli\u003eElige la versión marcada como \u003cstrong\u003eLTS\u003c/strong\u003e (la estable; no la «Current»).\u003c/li\u003e\n\u003cli\u003eAbre el archivo descargado y completa el instalador con las opciones por defecto.\u003c/li\u003e\n\u003cli\u003ePulsa \u003cstrong\u003eCmd + Espacio\u003c/strong\u003e, escribe \u003ccode\u003eTerminal\u003c/code\u003e y ábrelo.\u003c/li\u003e\n\u003cli\u003eEscribe \u003ccode\u003enode -v\u003c/code\u003e y pulsa \u003cstrong\u003eIntro\u003c/strong\u003e. Si aparece un número de versión, está bien instalado.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eSi el paso 5 no muestra ninguna versión\u003c/strong\u003e, cierra la terminal, ábrela otra vez y repite. Si sigue sin funcionar, escríbeme antes del seminario.\u003c/p\u003e\n\u003ch3 id=\"2-consigue-tu-clave-de-api-de-deepseek\"\u003e2. Consigue tu clave de API de DeepSeek\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eEntra en \u003ca href=\"https://platform.deepseek.com/\"\u003ehttps://platform.deepseek.com/\u003c/a\u003e y \u003cstrong\u003eregístrate\u003c/strong\u003e con tu correo.\u003c/li\u003e\n\u003cli\u003eCrea una \u003cstrong\u003eclave de API\u003c/strong\u003e desde tu cuenta y cópiala en un sitio seguro.\u003c/li\u003e\n\u003cli\u003eTen en cuenta que el uso de la API \u003cstrong\u003etiene coste\u003c/strong\u003e (suele ser pequeño para una práctica, pero es de pago, no es gratis).\u003c/li\u003e\n\u003cli\u003eHazlo \u003cstrong\u003econ antelación\u003c/strong\u003e: a veces la plataforma pide verificar la cuenta y eso puede tardar un rato.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cblockquote\u003e\n\u003cp\u003eUna \u003cstrong\u003eclave de API\u003c/strong\u003e es como una contraseña larga que identifica tu cuenta. No la compartas con nadie ni la subas a internet.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"3-comprobacion-final-arranca-el-harness-y-cierralo\"\u003e3. Comprobación final: arranca el harness y ciérralo\u003c/h3\u003e\n\u003cp\u003eHazlo tú solo antes de venir. Sirve para confirmar que todo está en su sitio y para que no sea la primera vez delante del grupo.\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003eAbre la terminal (los pasos de arriba).\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eEscribe este comando y pulsa \u003cstrong\u003eIntro\u003c/strong\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003enpx @deepseek-ai/dsh web\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eLa primera vez tardará un poco: está \u003cstrong\u003edescargando\u003c/strong\u003e la herramienta. Es normal.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eCuando termine, \u003cstrong\u003ela interfaz se abre sola en tu navegador\u003c/strong\u003e, en la dirección \u003cstrong\u003e\u003ca href=\"http://127.0.0.1:3080\"\u003ehttp://127.0.0.1:3080\u003c/a\u003e\u003c/strong\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eSi no se abre sola, copia esa dirección en el navegador y pulsa Intro.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePara parar el servidor\u003c/strong\u003e, cierra la ventana de la terminal o pulsa \u003cstrong\u003eCtrl + C\u003c/strong\u003e en la terminal.\nSi cierras solo la pestaña del navegador, el servidor \u003cstrong\u003esigue funcionando\u003c/strong\u003e en segundo plano.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"que-traer\"\u003eQué traer\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePortátil con su cargador\u003c/strong\u003e (el seminario es práctico, no hay equipos de sobra).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePermisos de administrador\u003c/strong\u003e en el portátil, por si hay que instalar algo.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUna carpeta con archivos de ejemplo\u003c/strong\u003e con los que practicar: notas, textos, hojas de cálculo, algún PDF… lo que uses normalmente.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSin datos confidenciales\u003c/strong\u003e en esa carpeta. Nada de documentos de clientes, nóminas, historiales médicos ni cosas parecidas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLa clave de API a mano\u003c/strong\u003e, para no perder tiempo buscándola.\u003c/li\u003e\n\u003cli\u003eSi puedes, \u003cstrong\u003euna copia de seguridad\u003c/strong\u003e de la carpeta de práctica (una copia en el pendrive o en la nube).\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"si-algo-no-funciona\"\u003eSi algo no funciona\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eRespira: es lo más normal del mundo.\u003c/strong\u003e Un mensaje de error en la terminal casi nunca significa que hayas roto nada; significa que falta un paso o que hay que repetirlo.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCasi todo se arregla cerrando la terminal y volviendo a abrirla.\u003c/strong\u003e Si el comando no se reconoce, suele ser que Node.js no quedó bien instalado o que la terminal es la de antes de instalarlo.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEl primer arranque tarda.\u003c/strong\u003e Si parece que no pasa nada, espera un poco antes de tocar nada. La primera vez tiene que descargar la herramienta.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo te quedes atascado en silencio.\u003c/strong\u003e Escríbeme antes del seminario con lo que ves en pantalla (una foto o el texto del error vale) y lo miramos entre los dos. Es mucho mejor resolverlo por correo que perder la primera media hora del taller.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"aviso-importante-sobre-seguridad-leelo-en-serio\"\u003eAviso importante sobre seguridad (léelo, en serio)\u003c/h3\u003e\n\u003cp\u003eLa herramienta es \u003cstrong\u003esoftware experimental, en fase de desarrollo\u003c/strong\u003e. Eso tiene consecuencias prácticas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eEl agente \u003cstrong\u003eva a poder leer y modificar archivos de la carpeta de trabajo\u003c/strong\u003e que le indiques.\u003c/li\u003e\n\u003cli\u003eTambién \u003cstrong\u003eva a poder ejecutar comandos\u003c/strong\u003e en tu ordenador, dentro de los límites que le pongamos.\u003c/li\u003e\n\u003cli\u003eHay opciones de \u003cstrong\u003epermisos\u003c/strong\u003e: se puede limitar a solo leer, a escribir únicamente en la carpeta de trabajo, o darle acceso total; y por defecto \u003cstrong\u003ete pregunta antes\u003c/strong\u003e de hacer cosas sensibles. Lo veremos en el seminario.\u003c/li\u003e\n\u003cli\u003eAun así, \u003cstrong\u003eesas barreras reducen el riesgo, pero no lo eliminan\u003c/strong\u003e. No son una garantía de aislamiento.\u003c/li\u003e\n\u003cli\u003ePor eso: \u003cstrong\u003ehaz copia de seguridad de todo lo que uses en la práctica\u003c/strong\u003e y \u003cstrong\u003eno uses documentos confidenciales ni datos de clientes\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNos vemos el \u003cstrong\u003e[día]\u003c/strong\u003e. Si tienes cualquier duda, escríbeme sin problema.\u003c/p\u003e\n\u003cp\u003eUn saludo,\n\u003cstrong\u003e[nombre del instructor]\u003c/strong\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch1 id=\"parte-b-guia-de-instalacion-paso-a-paso\"\u003eParte B — Guía de instalación paso a paso\u003c/h1\u003e\n\u003cp\u003ePara usar durante el seminario. Sigue los pasos en orden. Si algo falla, no pasa nada: repite el paso y, si sigue fallando, avisa.\u003c/p\u003e\n\u003ch2 id=\"paso-0-que-es-la-terminal-en-una-frase\"\u003ePaso 0. Qué es «la terminal» (en una frase)\u003c/h2\u003e\n\u003cp\u003eLa \u003cstrong\u003eterminal\u003c/strong\u003e es una ventana donde escribes órdenes en texto en lugar de hacer clic en botones. Se usa porque muchas herramientas se arrancan escribiendo un comando. No hay que saber nada más que lo que pone aquí.\u003c/p\u003e\n\u003ch2 id=\"paso-1-abrir-la-terminal\"\u003ePaso 1. Abrir la terminal\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eEn Windows:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ePulsa la tecla \u003cstrong\u003eWindows\u003c/strong\u003e o haz clic en \u003cstrong\u003eInicio\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eEscribe \u003ccode\u003ePowerShell\u003c/code\u003e (o \u003ccode\u003eTerminal\u003c/code\u003e).\u003c/li\u003e\n\u003cli\u003eHaz clic en el resultado para abrirla.\u003c/li\u003e\n\u003cli\u003eSe abre una ventana con fondo oscuro y un texto que acaba en \u003ccode\u003e&gt;\u003c/code\u003e. Ese texto se llama \u003cstrong\u003eindicador\u003c/strong\u003e y significa «escríbeme».\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eEn macOS:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ePulsa \u003cstrong\u003eCmd + Espacio\u003c/strong\u003e para abrir Spotlight.\u003c/li\u003e\n\u003cli\u003eEscribe \u003ccode\u003eTerminal\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003ePulsa \u003cstrong\u003eIntro\u003c/strong\u003e para abrirla.\u003c/li\u003e\n\u003cli\u003eSe abre una ventana con fondo blanco o negro y un texto que acaba en \u003ccode\u003e$\u003c/code\u003e o \u003ccode\u003e%\u003c/code\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"paso-2-comprobar-que-nodejs-esta-instalado\"\u003ePaso 2. Comprobar que Node.js está instalado\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003eEn la terminal, escribe:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003enode -v\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePulsa \u003cstrong\u003eIntro\u003c/strong\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eDebe aparecer un número de versión (algo como \u003ccode\u003ev22.\u003c/code\u003e seguido de más números). \u003cstrong\u003eSi aparece el número, Node.js está listo.\u003c/strong\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eSi en su lugar sale un mensaje diciendo que el comando no se reconoce o no se encuentra, Node.js \u003cstrong\u003eno está instalado\u003c/strong\u003e o la terminal es antigua:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCierra la terminal.\u003c/li\u003e\n\u003cli\u003eInstala Node.js desde la web oficial eligiendo la versión \u003cstrong\u003eLTS\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eVuelve a abrir la terminal y repite \u003ccode\u003enode -v\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"paso-3-arrancar-el-harness\"\u003ePaso 3. Arrancar el harness\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003eDecide desde qué \u003cstrong\u003ecarpeta\u003c/strong\u003e vas a lanzarlo. Esa carpeta será el \u003cstrong\u003eespacio de trabajo propuesto\u003c/strong\u003e por defecto, así que lo más cómodo es situarse en la carpeta de práctica.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eEscribe el comando:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003enpx @deepseek-ai/dsh web\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003ePulsa \u003cstrong\u003eIntro\u003c/strong\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLa primera vez tarda\u003c/strong\u003e: está descargando la herramienta. Verás movimiento en pantalla. Espera.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eCuando termina, \u003cstrong\u003ese abre sola una pestaña del navegador\u003c/strong\u003e con la interfaz.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"paso-4-elegir-el-espacio-de-trabajo-el-primer-tropiezo\"\u003ePaso 4. Elegir el espacio de trabajo (el primer tropiezo)\u003c/h2\u003e\n\u003cp\u003eEste es el punto donde casi todo el mundo se atasca, así que ve con calma.\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eEn la interfaz, busca el botón \u003cstrong\u003e«Elegir espacio de trabajo»\u003c/strong\u003e (Choose workspace).\u003c/li\u003e\n\u003cli\u003ePulsa \u003cstrong\u003eañadir\u003c/strong\u003e y selecciona la \u003cstrong\u003ecarpeta del proyecto\u003c/strong\u003e con la que quieras trabajar.\u003c/li\u003e\n\u003cli\u003eSelecciona esa carpeta para dejarla activa.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eImportante:\u003c/strong\u003e hasta que no elijas un espacio de trabajo, \u003cstrong\u003eel cuadro donde se escriben los mensajes está deshabilitado\u003c/strong\u003e. No es un fallo: es que el agente todavía no sabe en qué carpeta trabajar.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"paso-5-configurar-el-modelo-y-la-clave-de-api\"\u003ePaso 5. Configurar el modelo y la clave de API\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eAbre \u003cstrong\u003eAjustes\u003c/strong\u003e (Settings).\u003c/li\u003e\n\u003cli\u003eEntra en \u003cstrong\u003eModelos\u003c/strong\u003e (Models).\u003c/li\u003e\n\u003cli\u003eIntroduce tu \u003cstrong\u003eclave de API de DeepSeek\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGuarda\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eNo hace falta reiniciar nada: queda usable al momento.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"paso-6-primer-mensaje-de-prueba\"\u003ePaso 6. Primer mensaje de prueba\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eComprueba que el \u003cstrong\u003ecuadro de mensajes está habilitado\u003c/strong\u003e (si no lo está, vuelve al Paso 4).\u003c/li\u003e\n\u003cli\u003eEscribe algo sencillo y sin riesgo, por ejemplo: \u003cem\u003e«Dime qué archivos hay en esta carpeta y resúmelos»\u003c/em\u003e.\u003c/li\u003e\n\u003cli\u003eEnvía y observa qué pasa. Si el agente pide permiso para algo, decide tú si lo autorizas.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"paso-7-parar-el-harness\"\u003ePaso 7. Parar el harness\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eOpción 1:\u003c/strong\u003e cierra la ventana de la terminal.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOpción 2:\u003c/strong\u003e haz clic en la terminal y pulsa \u003cstrong\u003eCtrl + C\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eCerrar solo la pestaña del navegador \u003cstrong\u003eno\u003c/strong\u003e para el servidor.\u003c/p\u003e\n\u003ch2 id=\"paso-8-volver-a-arrancarlo-si-se-cerro\"\u003ePaso 8. Volver a arrancarlo si se cerró\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003eAbre la terminal.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eVuelve a escribir:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003enpx @deepseek-ai/dsh web\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003ePulsa \u003cstrong\u003eIntro\u003c/strong\u003e. La segunda vez arranca mucho más rápido, porque ya está descargado.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eSi el navegador no se abre solo, entra en \u003cstrong\u003e\u003ca href=\"http://127.0.0.1:3080\"\u003ehttp://127.0.0.1:3080\u003c/a\u003e\u003c/strong\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"como-saber-que-esta-funcionando\"\u003eCómo saber que está funcionando\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eEn la terminal aparece la \u003cstrong\u003edirección local\u003c/strong\u003e (\u003ccode\u003e127.0.0.1:3080\u003c/code\u003e).\u003c/li\u003e\n\u003cli\u003eEl navegador muestra la \u003cstrong\u003einterfaz\u003c/strong\u003e del harness.\u003c/li\u003e\n\u003cli\u003ePuedes \u003cstrong\u003eescribir en el cuadro de mensajes\u003c/strong\u003e (después de elegir espacio de trabajo).\u003c/li\u003e\n\u003cli\u003eSi el agente responde, el modelo está bien configurado.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eCon esos cuatro puntos, todo está en orden.\u003c/p\u003e\n\u003ch2 id=\"que-significa-lo-que-ves-en-pantalla\"\u003eQué significa lo que ves en pantalla\u003c/h2\u003e\n\u003cp\u003eAl arrancar aparecen varias líneas que asustan a quien no está acostumbrado. Traducción al lenguaje llano:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eLo que ves\u003c/th\u003e\n\u003cth\u003eQué significa de verdad\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eLíneas que van apareciendo al principio\u003c/td\u003e\n\u003ctd\u003eEstá \u003cstrong\u003edescargando\u003c/strong\u003e la herramienta porque es la primera vez. Es normal, solo pasa la primera vez.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAvisos y mensajes de advertencia\u003c/td\u003e\n\u003ctd\u003eSuelen ser \u003cstrong\u003einformativos\u003c/strong\u003e. No son errores y no hay que hacer nada.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLa dirección \u003ccode\u003ehttp://127.0.0.1:3080\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eEs la \u003cstrong\u003edirección local\u003c/strong\u003e: \u003ccode\u003e127.0.0.1\u003c/code\u003e significa «este mismo ordenador». Es la página que acabas de abrir.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLa terminal se queda «parada», sin devolverte el indicador\u003c/td\u003e\n\u003ctd\u003eEs lo correcto: el servidor está \u003cstrong\u003efuncionando\u003c/strong\u003e y ocupando esa ventana.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAparece un texto en rojo\u003c/td\u003e\n\u003ctd\u003ePuede ser un error real, pero normalmente dice \u003cstrong\u003equé falta\u003c/strong\u003e. Cópialo y avisa.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eIdea clave:\u003c/strong\u003e mientras la terminal esté ocupada con el servidor, no puedes escribir otros comandos ahí. Abre otra ventana de terminal si necesitas una.\u003c/p\u003e\n\u003ch2 id=\"alternativa-instalacion-permanente\"\u003eAlternativa: instalación permanente\u003c/h2\u003e\n\u003cp\u003eEn lugar de usar \u003ccode\u003enpx\u003c/code\u003e cada vez, puedes instalar la herramienta en el ordenador:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003eEscribe:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003enpm install -g @deepseek-ai/dsh\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003ePulsa \u003cstrong\u003eIntro\u003c/strong\u003e y espera a que termine.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eA partir de ahí, para arrancar basta con:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003edsh web\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eDiferencias entre las dos formas:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCon \u003cstrong\u003e\u003ccode\u003enpx @deepseek-ai/dsh web\u003c/code\u003e\u003c/strong\u003e no instalas nada de forma permanente: se descarga y se ejecuta cuando lo pides. Es lo recomendado para el seminario, porque no toca tu sistema.\u003c/li\u003e\n\u003cli\u003eCon \u003cstrong\u003e\u003ccode\u003enpm install -g\u003c/code\u003e\u003c/strong\u003e la instalación se queda en el ordenador, así que arrancar después es más rápido y el comando es más corto (\u003ccode\u003edsh web\u003c/code\u003e). A cambio, actualizarla luego es cosa tuya.\u003c/li\u003e\n\u003cli\u003eEn un equipo \u003cstrong\u003eajeno o prestado\u003c/strong\u003e, usa \u003ccode\u003enpx\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"verificacion-final-antes-de-seguir\"\u003eVerificación final antes de seguir\u003c/h2\u003e\n\u003cp\u003eConfirma estos seis puntos antes de continuar con la práctica:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e \u003cstrong\u003eNode.js presente\u003c/strong\u003e: \u003ccode\u003enode -v\u003c/code\u003e muestra un número de versión.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e \u003cstrong\u003eServidor arrancado\u003c/strong\u003e: el comando ha terminado y la terminal está ocupada con el servidor.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e \u003cstrong\u003eInterfaz abierta\u003c/strong\u003e: ves la interfaz en el navegador, en \u003ca href=\"http://127.0.0.1:3080\"\u003ehttp://127.0.0.1:3080\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e \u003cstrong\u003eClave de API guardada\u003c/strong\u003e: Ajustes → Modelos, con la clave introducida y guardada.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e \u003cstrong\u003eEspacio de trabajo elegido\u003c/strong\u003e: has añadido y seleccionado tu carpeta.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e \u003cstrong\u003eCuadro de mensajes habilitado\u003c/strong\u003e: puedes escribir y enviar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSi los seis están marcados, estás listo. Si falla el quinto, es el tropiezo habitual: vuelve al Paso 4.\u003c/p\u003e\n\u003chr\u003e\n\u003ch1 id=\"parte-c-lista-de-comprobacion-del-instructor\"\u003eParte C — Lista de comprobación del instructor\u003c/h1\u003e\n\u003ch2 id=\"el-dia-anterior\"\u003eEl día anterior\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eTarea\u003c/th\u003e\n\u003cth\u003eHecho\u003c/th\u003e\n\u003cth\u003eNotas\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eConfirmar asistentes y la versión de sistema operativo de cada uno (Windows o macOS)\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003eSaber cuántos son de cada sistema cambia las explicaciones.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEnviar el mensaje de la Parte A a todos los asistentes\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003eIdealmente 3-5 días antes; nunca más tarde del día anterior.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePreparar una carpeta de práctica de ejemplo, con archivos de prueba y sin datos sensibles\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003eTextos, notas y algún documento sin información real.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHacer una copia de seguridad de esa carpeta\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003eEs la red de seguridad si el agente modifica algo en la demo.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eComprobar la red de la sala y si hay proxy o cortafuegos corporativo\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003eUn proxy puede impedir la descarga inicial de la herramienta.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eReservar y probar el puerto \u003cstrong\u003e3080\u003c/strong\u003e en el equipo del instructor\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003eSi está ocupado por otro programa, el arranque falla.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTener una clave de API propia de reserva para las demos\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003eEvita que una demo dependa de la clave de un alumno.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePreparar el plan B sin conexión: capturas de pantalla o un vídeo corto\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003eCubre el caso de que la red de la sala falle.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePreparar la encuesta de satisfacción (enlace o papel)\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003eMejor tenerla lista que improvisarla al final.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch2 id=\"el-dia-del-seminario\"\u003eEl día del seminario\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eTarea\u003c/th\u003e\n\u003cth\u003eHecho\u003c/th\u003e\n\u003cth\u003eNotas\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eProbar la demo completa de principio a fin en el equipo que se va a usar\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003eCon la clave de reserva, no con la tuya personal.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLlevar alargadores y regletas\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003eLos portátiles no aguantan 3 horas sin corriente.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eComprobar el proyector y el tamaño de letra\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003eSube el tamaño: en la terminal pequeña nadie lee nada.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTener el material y los ejercicios en la nube o en un pendrive\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003eDos vías, no una.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDecidir qué hacer con quien no consiga arrancar: emparejarlo con alguien que sí\u003c/td\u003e\n\u003ctd\u003e☐\u003c/td\u003e\n\u003ctd\u003eNo dejar a nadie parado media hora mirando la pantalla.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch2 id=\"plan-b-si-la-sala-se-cae\"\u003ePlan B: si la sala se cae\u003c/h2\u003e\n\u003cp\u003eOrdenado de menos a más grave. Se aplica el primero que resuelva el problema:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eUn alumno no arranca, los demás sí.\u003c/strong\u003e Se le empareja con un compañero que ya lo tiene funcionando y sigue mirando por encima del hombro. Tú no te paras.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLa red de la sala falla o va muy lenta.\u003c/strong\u003e Se pasa a \u003cstrong\u003edemo guiada por el instructor\u003c/strong\u003e: tú haces los pasos en tu equipo y el grupo sigue y pregunta; la práctica se hace después en casa.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNadie consigue arrancar\u003c/strong\u003e (red caída, proxy, cortafuegos). Se usa el \u003cstrong\u003eplan B sin conexión\u003c/strong\u003e: capturas o el vídeo preparado, y se dedica el tiempo a entender \u003cstrong\u003equé es un harness\u003c/strong\u003e, sus permisos, sus herramientas y el MCP.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFallo total\u003c/strong\u003e (sin proyector, sin red, sin equipos). Se convierte en \u003cstrong\u003esesión de conceptos\u003c/strong\u003e: qué cambia entre un chat y un agente, qué son los permisos y los modos de sandbox, y qué se conecta con MCP. La instalación y la práctica quedan como \u003cstrong\u003etarea para casa\u003c/strong\u003e, con el mensaje de la Parte A y esta guía.\u003c/li\u003e\n\u003c/ol\u003e\n","texto":"Antes de venir 14 min de lectura Documento 07 Preparación previa y logística — Seminario «Del chat al agente: qué es un harness y cómo se usa» Este documento tiene tres partes y cada una es para un público distinto: Parte A — Mensaje listo para copiar y enviar a los alumnos 3-5 días antes. Parte B — Guía de instalación paso a paso, para tener a mano durante el seminario. Parte C — Lista de comprobación del instructor (día anterior y día del seminario). La herramienta del seminario es DeepSeek Harness ( dsh ), un harness de agentes de DeepSeek AI. Un harness es la pieza que convierte un chat en un agente: le da herramientas, permisos, memoria y una carpeta de trabajo. Está en fase developer preview : funciona, pero es software experimental y cambia a menudo. Parte A — Mensaje para enviar a los alumnos (3-5 días antes) Asunto Seminario «Del chat al agente»: trae el portátil listo (unos 15 minutos de preparación) Cuerpo del mensaje Hola: El [día] hacemos el seminario «Del chat al agente: qué es un harness y cómo se usa» , de 2-3 horas, en [lugar] . Vamos a pasar de usar la IA como un chat que solo responde texto a usarla como un agente que trabaja dentro de una carpeta de tu ordenador: lee archivos, los modifica y ejecuta comandos. No hace falta saber programar: todo se hace desde una interfaz web, como una página del navegador. Te pedimos que llegues con la preparación hecha, porque son unos 15 minutos y así los dedicamos a practicar en vez de a instalar cosas. 1. Requisitos previos (hazlo antes de venir) Vas a necesitar dos cosas: Node.js instalado y una clave de API de DeepSeek . Node.js es el programa que hace falta para poder arrancar la herramienta. En Windows: Entra en la web oficial de Node.js y descarga el instalador para Windows. Elige la versión marcada como LTS (es la versión estable y recomendada; evita la que pone «Current»). Ejecuta el instalador y ve dándole a Siguiente con las opciones que vienen por defecto. Abre el menú Inicio , escribe PowerShell o Terminal y ábrelo. Escribe node -v y pulsa Intro . Si aparece un número de versión, está bien instalado. En macOS: Entra en la web oficial de Node.js y descarga el instalador para macOS. Elige la versión marcada como LTS (la estable; no la «Current»). Abre el archivo descargado y completa el instalador con las opciones por defecto. Pulsa Cmd + Espacio , escribe Terminal y ábrelo. Escribe node -v y pulsa Intro . Si aparece un número de versión, está bien instalado. Si el paso 5 no muestra ninguna versión , cierra la terminal, ábrela otra vez y repite. Si sigue sin funcionar, escríbeme antes del seminario. 2. Consigue tu clave de API de DeepSeek Entra en https://platform.deepseek.com/ y regístrate con tu correo. Crea una clave de API desde tu cuenta y cópiala en un sitio seguro. Ten en cuenta que el uso de la API tiene coste (suele ser pequeño para una práctica, pero es de pago, no es gratis). Hazlo con antelación : a veces la plataforma pide verificar la cuenta y eso puede tardar un rato. Una clave de API es como una contraseña larga que identifica tu cuenta. No la compartas con nadie ni la subas a internet. 3. Comprobación final: arranca el harness y ciérralo Hazlo tú solo antes de venir. Sirve para confirmar que todo está en su sitio y para que no sea la primera vez delante del grupo. Abre la terminal (los pasos de arriba). Escribe este comando y pulsa Intro : npx @deepseek-ai/dsh web La primera vez tardará un poco: está descargando la herramienta. Es normal. Cuando termine, la interfaz se abre sola en tu navegador , en la dirección http://127.0.0.1:3080 . Si no se abre sola, copia esa dirección en el navegador y pulsa Intro. Para parar el servidor , cierra la ventana de la terminal o pulsa Ctrl + C en la terminal. Si cierras solo la pestaña del navegador, el servidor sigue funcionando en segundo plano. Qué traer Portátil con su cargador (el seminario es práctico, no hay equipos de sobra). Permisos de administrador en el portátil, por si hay que instalar algo. Una carpeta con archivos de ejemplo con los que practicar: notas, textos, hojas de cálculo, algún PDF… lo que uses normalmente. Sin datos confidenciales en esa carpeta. Nada de documentos de clientes, nóminas, historiales médicos ni cosas parecidas. La clave de API a mano , para no perder tiempo buscándola. Si puedes, una copia de seguridad de la carpeta de práctica (una copia en el pendrive o en la nube). Si algo no funciona Respira: es lo más normal del mundo. Un mensaje de error en la terminal casi nunca significa que hayas roto nada; significa que falta un paso o que hay que repetirlo. Casi todo se arregla cerrando la terminal y volviendo a abrirla. Si el comando no se reconoce, suele ser que Node.js no quedó bien instalado o que la terminal es la de antes de instalarlo. El primer arranque tarda. Si parece que no pasa nada, espera un poco antes de tocar nada. La primera vez tiene que descargar la herramienta. No te quedes atascado en silencio. Escríbeme antes del seminario con lo que ves en pantalla (una foto o el texto del error vale) y lo miramos entre los dos. Es mucho mejor resolverlo por correo que perder la primera media hora del taller. Aviso importante sobre seguridad (léelo, en serio) La herramienta es software experimental, en fase de desarrollo . Eso tiene consecuencias prácticas: El agente va a poder leer y modificar archivos de la carpeta de trabajo que le indiques. También va a poder ejecutar comandos en tu ordenador, dentro de los límites que le pongamos. Hay opciones de permisos : se puede limitar a solo leer, a escribir únicamente en la carpeta de trabajo, o darle acceso total; y por defecto te pregunta antes de hacer cosas sensibles. Lo veremos en el seminario. Aun así, esas barreras reducen el riesgo, pero no lo eliminan . No son una garantía de aislamiento. Por eso: haz copia de seguridad de todo lo que uses en la práctica y no uses documentos confidenciales ni datos de clientes . Nos vemos el [día] . Si tienes cualquier duda, escríbeme sin problema. Un saludo, [nombre del instructor] Parte B — Guía de instalación paso a paso Para usar durante el seminario. Sigue los pasos en orden. Si algo falla, no pasa nada: repite el paso y, si sigue fallando, avisa. Paso 0. Qué es «la terminal» (en una frase) La terminal es una ventana donde escribes órdenes en texto en lugar de hacer clic en botones. Se usa porque muchas herramientas se arrancan escribiendo un comando. No hay que saber nada más que lo que pone aquí. Paso 1. Abrir la terminal En Windows: Pulsa la tecla Windows o haz clic en Inicio . Escribe PowerShell (o Terminal ). Haz clic en el resultado para abrirla. Se abre una ventana con fondo oscuro y un texto que acaba en . Ese texto se llama indicador y significa «escríbeme». En macOS: Pulsa Cmd + Espacio para abrir Spotlight. Escribe Terminal . Pulsa Intro para abrirla. Se abre una ventana con fondo blanco o negro y un texto que acaba en $ o % . Paso 2. Comprobar que Node.js está instalado En la terminal, escribe: node -v Pulsa Intro . Debe aparecer un número de versión (algo como v22. seguido de más números). Si aparece el número, Node.js está listo. Si en su lugar sale un mensaje diciendo que el comando no se reconoce o no se encuentra, Node.js no está instalado o la terminal es antigua: Cierra la terminal. Instala Node.js desde la web oficial eligiendo la versión LTS . Vuelve a abrir la terminal y repite node -v . Paso 3. Arrancar el harness Decide desde qué carpeta vas a lanzarlo. Esa carpeta será el espacio de trabajo propuesto por defecto, así que lo más cómodo es situarse en la carpeta de práctica. Escribe el comando: npx @deepseek-ai/dsh web Pulsa Intro . La primera vez tarda : está descargando la herramienta. Verás movimiento en pantalla. Espera. Cuando termina, se abre sola una pestaña del navegador con la interfaz. Paso 4. Elegir el espacio de trabajo (el primer tropiezo) Este es el punto donde casi todo el mundo se atasca, así que ve con calma. En la interfaz, busca el botón «Elegir espacio de trabajo» (Choose workspace). Pulsa añadir y selecciona la carpeta del proyecto con la que quieras trabajar. Selecciona esa carpeta para dejarla activa. Importante: hasta que no elijas un espacio de trabajo, el cuadro donde se escriben los mensajes está deshabilitado . No es un fallo: es que el agente todavía no sabe en qué carpeta trabajar. Paso 5. Configurar el modelo y la clave de API Abre Ajustes (Settings). Entra en Modelos (Models). Introduce tu clave de API de DeepSeek . Guarda . No hace falta reiniciar nada: queda usable al momento. Paso 6. Primer mensaje de prueba Comprueba que el cuadro de mensajes está habilitado (si no lo está, vuelve al Paso 4). Escribe algo sencillo y sin riesgo, por ejemplo: «Dime qué archivos hay en esta carpeta y resúmelos» . Envía y observa qué pasa. Si el agente pide permiso para algo, decide tú si lo autorizas. Paso 7. Parar el harness Opción 1: cierra la ventana de la terminal. Opción 2: haz clic en la terminal y pulsa Ctrl + C . Cerrar solo la pestaña del navegador no para el servidor. Paso 8. Volver a arrancarlo si se cerró Abre la terminal. Vuelve a escribir: npx @deepseek-ai/dsh web Pulsa Intro . La segunda vez arranca mucho más rápido, porque ya está descargado. Si el navegador no se abre solo, entra en http://127.0.0.1:3080 . Cómo saber que está funcionando En la terminal aparece la dirección local ( 127.0.0.1:3080 ). El navegador muestra la interfaz del harness. Puedes escribir en el cuadro de mensajes (después de elegir espacio de trabajo). Si el agente responde, el modelo está bien configurado. Con esos cuatro puntos, todo está en orden. Qué significa lo que ves en pantalla Al arrancar aparecen varias líneas que asustan a quien no está acostumbrado. Traducción al lenguaje llano: Lo que ves Qué significa de verdad Líneas que van apareciendo al principio Está descargando la herramienta porque es la primera vez. Es normal, solo pasa la primera vez. Avisos y mensajes de advertencia Suelen ser informativos . No son errores y no hay que hacer nada. La dirección http://127.0.0.1:3080 Es la dirección local : 127.0.0.1 significa «este mismo ordenador». Es la página que acabas de abrir. La terminal se queda «parada», sin devolverte el indicador Es lo correcto: el servidor está funcionando y ocupando esa ventana. Aparece un texto en rojo Puede ser un error real, pero normalmente dice qué falta . Cópialo y avisa. Idea clave: mientras la terminal esté ocupada con el servidor, no puedes escribir otros comandos ahí. Abre otra ventana de terminal si necesitas una. Alternativa: instalación permanente En lugar de usar npx cada vez, puedes instalar la herramienta en el ordenador: Escribe: npm install -g @deepseek-ai/dsh Pulsa Intro y espera a que termine. A partir de ahí, para arrancar basta con: dsh web Diferencias entre las dos formas: Con npx @deepseek-ai/dsh web no instalas nada de forma permanente: se descarga y se ejecuta cuando lo pides. Es lo recomendado para el seminario, porque no toca tu sistema. Con npm install -g la instalación se queda en el ordenador, así que arrancar después es más rápido y el comando es más corto ( dsh web ). A cambio, actualizarla luego es cosa tuya. En un equipo ajeno o prestado , usa npx . Verificación final antes de seguir Confirma estos seis puntos antes de continuar con la práctica: Node.js presente : node -v muestra un número de versión. Servidor arrancado : el comando ha terminado y la terminal está ocupada con el servidor. Interfaz abierta : ves la interfaz en el navegador, en http://127.0.0.1:3080 . Clave de API guardada : Ajustes → Modelos, con la clave introducida y guardada. Espacio de trabajo elegido : has añadido y seleccionado tu carpeta. Cuadro de mensajes habilitado : puedes escribir y enviar. Si los seis están marcados, estás listo. Si falla el quinto, es el tropiezo habitual: vuelve al Paso 4. Parte C — Lista de comprobación del instructor El día anterior Tarea Hecho Notas Confirmar asistentes y la versión de sistema operativo de cada uno (Windows o macOS) ☐ Saber cuántos son de cada sistema cambia las explicaciones. Enviar el mensaje de la Parte A a todos los asistentes ☐ Idealmente 3-5 días antes; nunca más tarde del día anterior. Preparar una carpeta de práctica de ejemplo, con archivos de prueba y sin datos sensibles ☐ Textos, notas y algún documento sin información real. Hacer una copia de seguridad de esa carpeta ☐ Es la red de seguridad si el agente modifica algo en la demo. Comprobar la red de la sala y si hay proxy o cortafuegos corporativo ☐ Un proxy puede impedir la descarga inicial de la herramienta. Reservar y probar el puerto 3080 en el equipo del instructor ☐ Si está ocupado por otro programa, el arranque falla. Tener una clave de API propia de reserva para las demos ☐ Evita que una demo dependa de la clave de un alumno. Preparar el plan B sin conexión: capturas de pantalla o un vídeo corto ☐ Cubre el caso de que la red de la sala falle. Preparar la encuesta de satisfacción (enlace o papel) ☐ Mejor tenerla lista que improvisarla al final. El día del seminario Tarea Hecho Notas Probar la demo completa de principio a fin en el equipo que se va a usar ☐ Con la clave de reserva, no con la tuya personal. Llevar alargadores y regletas ☐ Los portátiles no aguantan 3 horas sin corriente. Comprobar el proyector y el tamaño de letra ☐ Sube el tamaño: en la terminal pequeña nadie lee nada. Tener el material y los ejercicios en la nube o en un pendrive ☐ Dos vías, no una. Decidir qué hacer con quien no consiga arrancar: emparejarlo con alguien que sí ☐ No dejar a nadie parado media hora mirando la pantalla. Plan B: si la sala se cae Ordenado de menos a más grave. Se aplica el primero que resuelva el problema: Un alumno no arranca, los demás sí. Se le empareja con un compañero que ya lo tiene funcionando y sigue mirando por encima del hombro. Tú no te paras. La red de la sala falla o va muy lenta. Se pasa a demo guiada por el instructor : tú haces los pasos en tu equipo y el grupo sigue y pregunta; la práctica se hace después en casa. Nadie consigue arrancar (red caída, proxy, cortafuegos). Se usa el plan B sin conexión : capturas o el vídeo preparado, y se dedica el tiempo a entender qué es un harness , sus permisos, sus herramientas y el MCP. Fallo total (sin proyector, sin red, sin equipos). Se convierte en sesión de conceptos : qué cambia entre un chat y un agente, qué son los permisos y los modos de sandbox, y qué se conecta con MCP. La instalación y la práctica quedan como tarea para casa , con el mensaje de la Parte A y esta guía."},{"id":"quiz-diagnostico","grupo":"evaluacion","titulo":"Diagnóstico inicial","tipo":"quiz","quiz":"diagnostico","html":"","texto":"Diagnóstico inicial"},{"id":"quiz-final","grupo":"evaluacion","titulo":"Evaluación final","tipo":"quiz","quiz":"final","html":"","texto":"Evaluación final"},{"id":"recursos","grupo":"recursos","titulo":"Recursos y enlaces oficiales","tipo":"doc","html":"\u003ch1\u003eRecursos y enlaces oficiales\u003c/h1\u003e\n\u003cp\u003ePara profundizar, estas son las fuentes del propio proyecto. El resto del curso es material de elaboración propia,\npero aquí está siempre la verdad de referencia, sobre todo porque la herramienta está en \u003cstrong\u003edeveloper preview\u003c/strong\u003e y cambia rápido.\u003c/p\u003e\n\u003cdiv class=\"recursos\"\u003e\n\u003ca class=\"recurso\" href=\"https://deepseek-harness.github.io/deepseek-harness/\" target=\"_blank\" rel=\"noopener\"\u003e\n  \u003cspan class=\"recurso-icono\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M5 12h14\"/\u003e\u003cpath d=\"M13 6l6 6-6 6\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n  \u003cspan class=\"recurso-cuerpo\"\u003e\n    \u003cspan class=\"recurso-etq\"\u003eDocs\u003c/span\u003e\n    \u003cspan class=\"recurso-titulo\"\u003eDocumentación oficial\u003c/span\u003e\n    \u003cspan class=\"recurso-detalle\"\u003eGuías de usuario y del desarrollador del proyecto.\u003c/span\u003e\n  \u003c/span\u003e\n  \u003cspan class=\"recurso-abrir\"\u003e↗\u003c/span\u003e\n\u003c/a\u003e\n\u003ca class=\"recurso\" href=\"https://github.com/deepseek-ai/deepseek-harness\" target=\"_blank\" rel=\"noopener\"\u003e\n  \u003cspan class=\"recurso-icono\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M5 12h14\"/\u003e\u003cpath d=\"M13 6l6 6-6 6\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n  \u003cspan class=\"recurso-cuerpo\"\u003e\n    \u003cspan class=\"recurso-etq\"\u003eGitHub\u003c/span\u003e\n    \u003cspan class=\"recurso-titulo\"\u003eRepositorio en GitHub\u003c/span\u003e\n    \u003cspan class=\"recurso-detalle\"\u003eCódigo, novedades y el aviso de que está en developer preview.\u003c/span\u003e\n  \u003c/span\u003e\n  \u003cspan class=\"recurso-abrir\"\u003e↗\u003c/span\u003e\n\u003c/a\u003e\n\u003ca class=\"recurso\" href=\"https://github.com/deepseek-ai/DeepSeek-Harness/blob/master/SAFETY.md\" target=\"_blank\" rel=\"noopener\"\u003e\n  \u003cspan class=\"recurso-icono\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M5 12h14\"/\u003e\u003cpath d=\"M13 6l6 6-6 6\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n  \u003cspan class=\"recurso-cuerpo\"\u003e\n    \u003cspan class=\"recurso-etq\"\u003eSeguridad\u003c/span\u003e\n    \u003cspan class=\"recurso-titulo\"\u003eAviso de seguridad\u003c/span\u003e\n    \u003cspan class=\"recurso-detalle\"\u003eLímites del sandbox y recomendaciones de uso responsable.\u003c/span\u003e\n  \u003c/span\u003e\n  \u003cspan class=\"recurso-abrir\"\u003e↗\u003c/span\u003e\n\u003c/a\u003e\n\u003ca class=\"recurso\" href=\"https://github.com/deepseek-ai/DeepSeek-Harness/blob/master/docs/user/guide/index.md\" target=\"_blank\" rel=\"noopener\"\u003e\n  \u003cspan class=\"recurso-icono\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M5 12h14\"/\u003e\u003cpath d=\"M13 6l6 6-6 6\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n  \u003cspan class=\"recurso-cuerpo\"\u003e\n    \u003cspan class=\"recurso-etq\"\u003eGuía\u003c/span\u003e\n    \u003cspan class=\"recurso-titulo\"\u003eGuía rápida de la interfaz web\u003c/span\u003e\n    \u003cspan class=\"recurso-detalle\"\u003eConfigurar el modelo y elegir el espacio de trabajo, paso a paso.\u003c/span\u003e\n  \u003c/span\u003e\n  \u003cspan class=\"recurso-abrir\"\u003e↗\u003c/span\u003e\n\u003c/a\u003e\n\u003ca class=\"recurso\" href=\"https://platform.deepseek.com/\" target=\"_blank\" rel=\"noopener\"\u003e\n  \u003cspan class=\"recurso-icono\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M5 12h14\"/\u003e\u003cpath d=\"M13 6l6 6-6 6\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n  \u003cspan class=\"recurso-cuerpo\"\u003e\n    \u003cspan class=\"recurso-etq\"\u003eAPI\u003c/span\u003e\n    \u003cspan class=\"recurso-titulo\"\u003ePlataforma de la API de DeepSeek\u003c/span\u003e\n    \u003cspan class=\"recurso-detalle\"\u003eDonde se crea la clave de API que necesita el agente.\u003c/span\u003e\n  \u003c/span\u003e\n  \u003cspan class=\"recurso-abrir\"\u003e↗\u003c/span\u003e\n\u003c/a\u003e\n\u003ca class=\"recurso\" href=\"https://discord.gg/Ycq5dCaS4\" target=\"_blank\" rel=\"noopener\"\u003e\n  \u003cspan class=\"recurso-icono\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M5 12h14\"/\u003e\u003cpath d=\"M13 6l6 6-6 6\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n  \u003cspan class=\"recurso-cuerpo\"\u003e\n    \u003cspan class=\"recurso-etq\"\u003eComunidad\u003c/span\u003e\n    \u003cspan class=\"recurso-titulo\"\u003eComunidad en Discord\u003c/span\u003e\n    \u003cspan class=\"recurso-detalle\"\u003eAyuda y novedades de la comunidad (enlace del README oficial).\u003c/span\u003e\n  \u003c/span\u003e\n  \u003cspan class=\"recurso-abrir\"\u003e↗\u003c/span\u003e\n\u003c/a\u003e\n\u003c/div\u003e\n\u003cp class=\"pista\"\u003eTodos los enlaces se abren en una pestaña nueva. Si algo del curso ya no coincide con lo que ves en la herramienta,\nmira primero aquí: la documentación oficial manda.\u003c/p\u003e","texto":"Recursos y enlaces oficiales Para profundizar, estas son las fuentes del propio proyecto. El resto del curso es material de elaboración propia, pero aquí está siempre la verdad de referencia, sobre todo porque la herramienta está en developer preview y cambia rápido. Docs Documentación oficial Guías de usuario y del desarrollador del proyecto. ↗ GitHub Repositorio en GitHub Código, novedades y el aviso de que está en developer preview. ↗ Seguridad Aviso de seguridad Límites del sandbox y recomendaciones de uso responsable. ↗ Guía Guía rápida de la interfaz web Configurar el modelo y elegir el espacio de trabajo, paso a paso. ↗ API Plataforma de la API de DeepSeek Donde se crea la clave de API que necesita el agente. ↗ Comunidad Comunidad en Discord Ayuda y novedades de la comunidad (enlace del README oficial). ↗ Todos los enlaces se abren en una pestaña nueva. Si algo del curso ya no coincide con lo que ves en la herramienta, mira primero aquí: la documentación oficial manda."},{"id":"doc-05","grupo":"consulta","titulo":"Glosario y chuleta","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 19 min de lectura\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M6 3h8l4 4v14H6z\"/\u003e\u003cpath d=\"M14 3v5h5\"/\u003e\u003cpath d=\"M9 13h6M9 17h6\"/\u003e\u003c/svg\u003e Documento 05\u003c/span\u003e\n      \u003c/div\u003e\u003ch1 id=\"glosario-y-chuleta-del-chat-al-agente-que-es-un-harness-y-co\"\u003eGlosario y chuleta — «Del chat al agente: qué es un harness y cómo se usa»\u003c/h1\u003e\n\u003cp\u003eSeminario práctico con \u003cstrong\u003eDeepSeek Harness\u003c/strong\u003e (\u003ccode\u003edsh\u003c/code\u003e). La \u003cstrong\u003eParte 1\u003c/strong\u003e es el glosario; la \u003cstrong\u003eParte 2\u003c/strong\u003e, la chuleta para tener al lado del portátil.\u003c/p\u003e\n\u003ch2 id=\"parte-1-glosario\"\u003eParte 1 — Glosario\u003c/h2\u003e\n\u003cp\u003eTérminos en orden alfabético, explicados en lenguaje llano y con un ejemplo corto. Cuando un concepto se apoya en otro, aparece marcado como \u003cstrong\u003e(ver …)\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAcceso total\u003c/strong\u003e — El nivel de sandbox más permisivo: el agente puede leer y escribir en todo el ordenador. Se elige a conciencia, nunca por comodidad.\n\u003cem\u003eEn la práctica:\u003c/em\u003e tiene sentido en una máquina de pruebas o desechable; en tu ordenador de diario, casi nunca.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAgente\u003c/strong\u003e — Programa que, además de responderte, puede hacer cosas por su cuenta en tu ordenador: leer y escribir archivos, ejecutar comandos, buscar en internet.\n\u003cem\u003eEn la práctica:\u003c/em\u003e le dices «ordena las facturas de esta carpeta» y las ordena él; tú revisas el resultado después.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAGENTS.md\u003c/strong\u003e — Archivo de texto con las normas que quieres que el agente siga siempre. Puede ser global (en tu carpeta de configuración) o de un proyecto concreto (en la raíz del proyecto).\n\u003cem\u003eEn la práctica:\u003c/em\u003e «no borres archivos nunca; avísame antes de instalar nada».\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAlucinación\u003c/strong\u003e — Cuando el modelo se inventa un dato, una cita o un comando con total seguridad. No miente a propósito: rellena huecos.\n\u003cem\u003eEn la práctica:\u003c/em\u003e te da un enlace que no existe. Por eso se piden fuentes y se comprueba todo (ver \u003cstrong\u003eVerificación\u003c/strong\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAPI\u003c/strong\u003e — La puerta que usan los programas para hablar con un servicio por internet, sin pasar por una web ni por una persona.\n\u003cem\u003eEn la práctica:\u003c/em\u003e el harness usa la API de DeepSeek para pedirle respuestas al modelo.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAprobación\u003c/strong\u003e — El aviso que aparece cuando el agente quiere hacer algo que no tiene permitido hacer solo, para que tú digas sí o no antes de que lo haga.\n\u003cem\u003eEn la práctica:\u003c/em\u003e quiere escribir en una carpeta que está fuera de su zona y te pide permiso (ver \u003cstrong\u003eSandbox\u003c/strong\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBucle agéntico\u003c/strong\u003e — El ciclo de trabajo del agente: piensa un paso, usa una herramienta, mira el resultado y repite hasta acabar.\n\u003cem\u003eEn la práctica:\u003c/em\u003e buscar → leer → corregir → volver a buscar. Por eso tarda y da varios pasos aunque tú escribas una sola frase.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChat\u003c/strong\u003e — Conversación en la que el modelo solo escribe texto y el trabajo lo haces tú después. Es un consultor por teléfono.\n\u003cem\u003eEn la práctica:\u003c/em\u003e te explica cómo ordenar tus fotos; las ordenas tú.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eClave de API\u003c/strong\u003e — Contraseña larga que identifica tu cuenta y autoriza el uso del servicio. Se guarda en Ajustes → Modelos y no se comparte con nadie.\n\u003cem\u003eEn la práctica:\u003c/em\u003e se obtiene en \u003ca href=\"https://platform.deepseek.com/\"\u003ehttps://platform.deepseek.com/\u003c/a\u003e y funciona como la llave de tu casa: quien la tenga, entra.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eComando\u003c/strong\u003e — Orden que se le da al ordenador escribiéndola, casi siempre en la terminal.\n\u003cem\u003eEn la práctica:\u003c/em\u003e \u003ccode\u003enpx @deepseek-ai/dsh web\u003c/code\u003e es un comando. Se copia, se pega y se pulsa Intro.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContenedor\u003c/strong\u003e — Entorno aislado y desechable donde puedes ejecutar el agente sin tocar tu ordenador de verdad.\n\u003cem\u003eEn la práctica:\u003c/em\u003e si algo se rompe dentro, tu equipo no se entera. Es una de las formas recomendadas de probar.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContexto\u003c/strong\u003e — Todo lo que el agente tiene delante en ese momento: tu petición, la conversación, los archivos que ha leído y las respuestas de las herramientas. Es su mesa de trabajo.\n\u003cem\u003eEn la práctica:\u003c/em\u003e si la mesa se llena de papeles, se pierde; conviene empezar una sesión nueva (ver \u003cstrong\u003eSesión\u003c/strong\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCopia de seguridad\u003c/strong\u003e — Duplicado de tus archivos, guardado aparte, para poder volver atrás si algo sale mal.\n\u003cem\u003eEn la práctica:\u003c/em\u003e antes de dejar que el agente toque 200 archivos, haz una copia. Es tu red de seguridad.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCredencial\u003c/strong\u003e — Cualquier dato que da acceso a algo tuyo: contraseñas, claves de API, tokens de acceso, datos de tarjeta.\n\u003cem\u003eEn la práctica:\u003c/em\u003e no las pegues en una petición si no son imprescindibles. Lo que escribes viaja al servicio.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDeepSeek Harness (dsh)\u003c/strong\u003e — El programa de este seminario: la aplicación que convierte un modelo en un agente, con interfaz web, herramientas y permisos. Se arranca con \u003ccode\u003enpx @deepseek-ai/dsh web\u003c/code\u003e.\n\u003cem\u003eEn la práctica:\u003c/em\u003e es el coche completo; el modelo es solo el motor (ver \u003cstrong\u003eHarness\u003c/strong\u003e, ver \u003cstrong\u003eLLM\u003c/strong\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDelegación\u003c/strong\u003e — Pedirle al agente que encargue una parte del trabajo a otro agente y te devuelva el resultado.\n\u003cem\u003eEn la práctica:\u003c/em\u003e «que otro agente revise estos 40 archivos y me traiga un resumen». Tú sigues hablando con el primero.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDetener (interrumpir)\u003c/strong\u003e — Cortar el trabajo que el agente está haciendo ahora mismo. Lo que ya ha hecho se queda hecho.\n\u003cem\u003eEn la práctica:\u003c/em\u003e tras detenerlo, pídele la lista de archivos que ha tocado y revísalos.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEspacio de trabajo (workspace)\u003c/strong\u003e — La carpeta que le entregas al agente como su zona de trabajo. Lo que haga dentro es lo normal; lo de fuera pide permiso.\n\u003cem\u003eEn la práctica:\u003c/em\u003e si abres el harness desde la carpeta del proyecto, esa carpeta es la que se te propone como espacio de trabajo.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEsfuerzo de razonamiento\u003c/strong\u003e — Cuánto «piensa» el modelo antes de responder. Más esfuerzo suele dar mejores respuestas en tareas difíciles, pero tarda más y consume más.\n\u003cem\u003eEn la práctica:\u003c/em\u003e poco esfuerzo para un resumen rápido; más esfuerzo para revisar un contrato o comparar cifras.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHarness\u003c/strong\u003e — La aplicación que envuelve al modelo y le da manos, normas y mandos: herramientas, permisos, memoria e interfaz donde hablar con él.\n\u003cem\u003eEn la práctica:\u003c/em\u003e el modelo es el motor; el harness es el coche completo, con volante, frenos y salpicadero.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHerramienta\u003c/strong\u003e — Cada una de las capacidades que el agente puede usar para actuar: leer archivos, escribir o modificar archivos, ejecutar comandos en la terminal, buscar y leer en internet, lanzar tareas en segundo plano, preguntarte algo, delegar en otro agente, mantener una lista de tareas o abrir el modo plan.\n\u003cem\u003eEn la práctica:\u003c/em\u003e cuando el agente «abre» un archivo, está usando la herramienta de lectura.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eInterfaz web\u003c/strong\u003e — La página del navegador donde escribes al agente y ves lo que va haciendo. En este harness se sirve en \u003ca href=\"http://127.0.0.1:3080\"\u003ehttp://127.0.0.1:3080\u003c/a\u003e y solo existe mientras el servidor está arrancado.\n\u003cem\u003eEn la práctica:\u003c/em\u003e si cierras la terminal donde arrancaste \u003ccode\u003edsh\u003c/code\u003e, esa página deja de responder.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIteración\u003c/strong\u003e — Cada vuelta del trabajo: probar, ver qué sale, corregir y volver a probar. El agente trabaja así, no de un tirón.\n\u003cem\u003eEn la práctica:\u003c/em\u003e escribe un borrador, lo lee, lo mejora. Por eso su primer resultado no siempre es el bueno.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLLM (modelo)\u003c/strong\u003e — El programa entrenado con muchísimo texto que sabe redactar y predecir lenguaje. Solo texto: no ve tus archivos ni ejecuta nada por sí mismo.\n\u003cem\u003eEn la práctica:\u003c/em\u003e ChatGPT, DeepSeek o Gemini son modelos (o servicios construidos alrededor de uno).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMáquina virtual\u003c/strong\u003e — Ordenador simulado dentro del tuyo, con sus propios archivos, que puedes borrar sin consecuencias.\n\u003cem\u003eEn la práctica:\u003c/em\u003e es el sitio recomendado para dejar trabajar a un agente en fase de pruebas.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMCP\u003c/strong\u003e — Estándar que permite conectar herramientas que ya existen (GitHub, bases de datos, gestores de incidencias, servicios de memoria) para que aparezcan como herramientas nuevas del agente.\n\u003cem\u003eEn la práctica:\u003c/em\u003e es un enchufe estándar, tipo USB: si la herramienta trae ese enchufe, el agente la puede usar.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMemoria\u003c/strong\u003e — Lo que el agente conserva entre sesiones, normalmente porque está escrito en un archivo que vuelve a leer al empezar.\n\u003cem\u003eEn la práctica:\u003c/em\u003e lo que pongas en AGENTS.md sigue ahí mañana; lo hablado en el chat, no (ver \u003cstrong\u003eContexto\u003c/strong\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eModo plan (plan)\u003c/strong\u003e — Forma de trabajar en la que el agente primero te cuenta qué piensa hacer y no toca nada hasta que le das el visto bueno.\n\u003cem\u003eEn la práctica:\u003c/em\u003e imprescindible antes de dejarle modificar 200 archivos.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eNode.js\u003c/strong\u003e — Programa que hay que tener instalado en el ordenador para poder arrancar el harness. Es el requisito previo.\n\u003cem\u003eEn la práctica:\u003c/em\u003e si el comando de arranque se queja de que no encuentra Node, es justo esto lo que falta.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePermiso\u003c/strong\u003e — La regla que decide qué puede hacer el agente sin preguntar y qué no. Lo que queda fuera de lo permitido dispara un aviso de aprobación.\n\u003cem\u003eEn la práctica:\u003c/em\u003e puede leer en toda la carpeta de trabajo, pero escribir solo en una parte.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePlugin\u003c/strong\u003e — Pieza que se añade al harness para darle capacidades nuevas, a veces conectando servicios externos.\n\u003cem\u003eEn la práctica:\u003c/em\u003e un plugin puede añadir una herramienta que no venía de serie. No es lo mismo que el harness (ver \u003cstrong\u003eHarness\u003c/strong\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePolítica de permisos\u003c/strong\u003e — El conjunto de ajustes que fija hasta dónde llega el agente y cuándo tiene que preguntar. Por defecto, pregunta.\n\u003cem\u003eEn la práctica:\u003c/em\u003e combina el nivel de acceso del sandbox con la política de aprobaciones (por defecto: preguntar).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePrompt\u003c/strong\u003e — El texto que le escribes al agente: tu petición, el encargo. Cuanto más claro el encargo, mejor el resultado.\n\u003cem\u003eEn la práctica:\u003c/em\u003e «resume este PDF en cinco puntos» funciona mucho mejor que «mírame esto».\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eProveedor\u003c/strong\u003e — La empresa o servicio que pone el modelo a disposición de los programas.\n\u003cem\u003eEn la práctica:\u003c/em\u003e en este seminario, DeepSeek: te registras, sacas tu clave de API y el harness usa sus modelos.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eRuta (ruta de archivo)\u003c/strong\u003e — La dirección que indica dónde está un archivo o una carpeta dentro del ordenador.\n\u003cem\u003eEn la práctica:\u003c/em\u003e \u003ccode\u003eC:\\Users\\Usuario\\.dsh\u003c/code\u003e es una ruta: la carpeta de configuración del usuario en Windows.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSandbox\u003c/strong\u003e — Zona de trabajo delimitada donde el agente puede moverse. Hay niveles: solo lectura; escritura limitada al espacio de trabajo; acceso total.\n\u003cem\u003eEn la práctica:\u003c/em\u003e dentro de la zona trabaja sin molestarte; fuera, salta el «¿seguro?».\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSesión\u003c/strong\u003e — Cada conversación con el agente, con su propio hilo y su propio contexto. Se guardan y puedes volver a ellas.\n\u003cem\u003eEn la práctica:\u003c/em\u003e si el contexto se llena, abres una sesión nueva y arrastras solo lo importante.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSkill\u003c/strong\u003e — Procedimiento guardado que el agente puede repetir cuando se lo pides. Vive en la carpeta \u003ccode\u003e.dsh/skills/&lt;nombre&gt;/SKILL.md\u003c/code\u003e dentro del proyecto.\n\u003cem\u003eEn la práctica:\u003c/em\u003e son recetas de cocina: los pasos ya escritos, para no explicarlos cada vez. En el proyecto del seminario ya existe \u003ccode\u003e.dsh/skills/precios-gasolineras/SKILL.md\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTarea en segundo plano\u003c/strong\u003e — Trabajo largo que el agente lanza y deja corriendo mientras sigue hablando contigo. Te avisa cuando termina.\n\u003cem\u003eEn la práctica:\u003c/em\u003e procesar 300 archivos mientras tú preparas el siguiente encargo.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTerminal\u003c/strong\u003e — La ventana de texto donde se le dan órdenes al ordenador escribiendo, en vez de haciendo clic. Es donde se arranca el harness.\n\u003cem\u003eEn la práctica:\u003c/em\u003e ahí escribes \u003ccode\u003enpx @deepseek-ai/dsh web\u003c/code\u003e y pulsas Intro.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eToken\u003c/strong\u003e — Trozo pequeño de texto (una palabra, media palabra, un signo) con el que el modelo cuenta y procesa. El precio y los límites se miden en tokens.\n\u003cem\u003eEn la práctica:\u003c/em\u003e «gasolineras» puede ser dos o tres tokens. No son letras ni palabras exactas.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVentana de contexto\u003c/strong\u003e — El tamaño máximo de contexto que cabe de una vez. Cuando se supera, lo más antiguo se cae o se resume.\n\u003cem\u003eEn la práctica:\u003c/em\u003e hilos muy largos con muchos archivos pegados acaban empujando fuera lo del principio.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVerificación\u003c/strong\u003e — Comprobar el resultado en lugar de creértelo: abrir el archivo, mirar la fuente, contar las filas, repetir el cálculo.\n\u003cem\u003eEn la práctica:\u003c/em\u003e el agente dice «he actualizado 12 filas»; tú abres el archivo y las cuentas.\u003c/p\u003e\n\u003ch3 id=\"palabras-que-se-confunden\"\u003ePalabras que se confunden\u003c/h3\u003e\n\u003cp\u003eSe parecen, pero no son lo mismo. Una frase para cada pareja:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eModelo vs. harness\u003c/strong\u003e — El modelo es el motor que redacta; el harness es el coche entero, con volante, frenos y salpicadero.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChat vs. agente\u003c/strong\u003e — El chat es un consultor por teléfono (te dice qué hacer y lo haces tú); el agente es un becario con acceso a tu ordenador (lo hace y tú revisas).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContexto vs. memoria\u003c/strong\u003e — El contexto es lo que tiene delante ahora mismo (la mesa de trabajo); la memoria es lo que queda guardado para la próxima vez.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePermiso vs. aprobación\u003c/strong\u003e — El permiso es la regla escrita; la aprobación es el «¿seguro?» que te llega cuando algo se sale de esa regla.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHarness vs. plugin\u003c/strong\u003e — El harness es la aplicación completa; un plugin es una pieza que le añades para darle una capacidad nueva.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSandbox vs. espacio de trabajo\u003c/strong\u003e — El sandbox es el nivel de libertad (leer, escribir, acceso total); el espacio de trabajo es la carpeta concreta donde ese nivel se aplica.\u003c/p\u003e\n\u003ch2 id=\"parte-2-chuleta-de-una-pagina\"\u003eParte 2 — Chuleta de una página\u003c/h2\u003e\n\u003ch3 id=\"antes-de-empezar-cinco-minutos\"\u003eAntes de empezar (cinco minutos)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eNode
