03e\n\u003cblockquote\u003e\n\u003cp\u003eCrea un archivo llamado \u003ccode\u003eprueba_agente2.txt\u003c/code\u003e en el escritorio.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003eTe va a volver a preguntar.\u003c/strong\u003e Esta vez pulsa \u003cstrong\u003eDenegar\u003c/strong\u003e y mira qué hace: el agente se para y no lo intenta por otro camino.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e«Permitir una vez» es permitir esa vez. No vale para siempre.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eEs incómodo \u003cstrong\u003ea propósito\u003c/strong\u003e: ese pequeño fastidio es lo que te obliga a pensar si de verdad quieres que el agente salga de su zona. Un permiso que se diera «para siempre» con un clic sería más cómodo y mucho más peligroso.\u003c/p\u003e\n\u003ch3 id=\"paso-6-limpia\"\u003ePaso 6 — Limpia\u003c/h3\u003e\n\u003cp\u003eBorra el archivo de prueba que has creado en el escritorio, \u003ccode\u003eprueba_agente.txt\u003c/code\u003e.\u003c/p\u003e\n\u003ch3 id=\"comprobacion\"\u003e✅ Comprobación\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e He visto aparecer un aviso de aprobación.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e He leído el aviso \u003cstrong\u003eantes\u003c/strong\u003e de aprobarlo.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e Sé explicar con mis palabras qué me estaba pidiendo.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e He comprobado que al repetir la petición \u003cstrong\u003evuelve a preguntar\u003c/strong\u003e, y he visto qué pasa al denegar.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e He borrado los archivos de prueba.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"los-dos-malos-habitos-que-ya-puedes-reconocer\"\u003eLos dos malos hábitos que ya puedes reconocer\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAprobar por inercia:\u003c/strong\u003e después del aviso número veinte, pulsas «permitir» sin leer. En ese momento el aviso ha dejado de protegerte.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSubir el nivel de permiso para que deje de preguntar:\u003c/strong\u003e es como quitar el freno porque el coche hace ruido al frenar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eRegla de oro:\u003c/strong\u003e si no entiendes qué te está pidiendo, \u003cstrong\u003eno lo apruebes\u003c/strong\u003e. Pídele que te lo explique con palabras o que te diga qué va a tocar antes de tocarlo.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n","texto":"Manos a la obra 3 min de lectura Práctica 2 — Provocar una aprobación Tiempo: unos 10 minutos. Objetivo: ver con tus ojos qué pasa cuando el agente intenta salir de su zona, y entender qué te está pidiendo exactamente. Esta es la práctica más importante del curso. Léela entera antes de empezar. Paso 1 — Pídele algo que está fuera de su zona Asegúrate de que estás en una sesión del proyecto practica_agente . Ahora pídele algo que ocurra fuera de ella, por ejemplo en el escritorio: Crea un archivo llamado prueba_agente.txt en el escritorio de mi usuario, con el texto «prueba». Paso 2 — Para y mira No apruebes nada todavía. Va a aparecer un aviso «Permiso requerido» : Acceder a archivos fuera del directorio del proyecto , con la ruta de tu escritorio debajo. Lee el aviso entero, despacio, antes de tocar nada. Tiene tres botones: Denegar , Permitir siempre y Permitir una vez . ⚠️ Otros agentes no siempre preguntan. En algunos, como Claude Code en modo Auto , otra IA decide por ti si la acción es arriesgada y un archivo inofensivo en el escritorio suele pasar sin aviso. Sin aviso, el freno de «leer antes de aprobar» desaparece. Cuando uses otra herramienta, comprueba primero cómo pregunta. Si usas Claude Code o Codex (carril B): el aviso tiene otro aspecto y otras palabras, pero las opciones son equivalentes: sí esta vez, sí a partir de ahora, o no. En Claude Code, trabaja en el modo normal (el de serie), no en modo Auto. En Codex, deja el modo de serie, que permite trabajar dentro de la carpeta y pide permiso para salir de ella. Las tres preguntas del paso 3 son exactamente las mismas. Paso 3 — Hazte las tres preguntas Antes de decidir, contesta por escrito: ¿Qué me está pidiendo exactamente? (¿leer un archivo? ¿escribir uno nuevo? ¿ejecutar una orden? ¿dónde?) ¿Qué pasaría si digo que sí? (Piensa en algo concreto: qué archivo aparecería, dónde, y qué cambiaría en tu ordenador.) ¿Puedo acotarlo? (¿Podrías pedirle que lo haga dentro de la carpeta de trabajo en vez de en el escritorio?) Paso 4 — Decide, conscientemente Ahora sí: pulsa Permitir una vez . Y observa lo que pasa. Paso 5 — El detalle que hay que entender Repite la petición otra vez: Crea un archivo llamado prueba_agente2.txt en el escritorio. Te va a volver a preguntar. Esta vez pulsa Denegar y mira qué hace: el agente se para y no lo intenta por otro camino. «Permitir una vez» es permitir esa vez. No vale para siempre. Es incómodo a propósito : ese pequeño fastidio es lo que te obliga a pensar si de verdad quieres que el agente salga de su zona. Un permiso que se diera «para siempre» con un clic sería más cómodo y mucho más peligroso. Paso 6 — Limpia Borra el archivo de prueba que has creado en el escritorio, prueba_agente.txt . ✅ Comprobación He visto aparecer un aviso de aprobación. He leído el aviso antes de aprobarlo. Sé explicar con mis palabras qué me estaba pidiendo. He comprobado que al repetir la petición vuelve a preguntar , y he visto qué pasa al denegar. He borrado los archivos de prueba. Los dos malos hábitos que ya puedes reconocer Aprobar por inercia: después del aviso número veinte, pulsas «permitir» sin leer. En ese momento el aviso ha dejado de protegerte. Subir el nivel de permiso para que deje de preguntar: es como quitar el freno porque el coche hace ruido al frenar. Regla de oro: si no entiendes qué te está pidiendo, no lo apruebes . Pídele que te lo explique con palabras o que te diga qué va a tocar antes de tocarlo."},{"id":"03-practica-3-cambiar-de-politica","grupo":"modulo2","titulo":"Práctica 3 — Cambiar de política","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M8 5.5v13l11-6.5z\"/\u003e\u003c/svg\u003e Manos a la obra\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 3 min de lectura\u003c/span\u003e\n      \u003c/div\u003e\u003ch2 id=\"practica-3-cambiar-de-politica\"\u003ePráctica 3 — Cambiar de política\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eTiempo:\u003c/strong\u003e unos 8 minutos.\n\u003cstrong\u003eObjetivo:\u003c/strong\u003e comprobar que dentro de la sala no pregunta, y que \u003cstrong\u003etú puedes cambiar la política\u003c/strong\u003e para que pregunte también ahí.\u003c/p\u003e\n\u003ch3 id=\"paso-1-la-misma-tarea-pero-dentro\"\u003ePaso 1 — La misma tarea, pero dentro\u003c/h3\u003e\n\u003cp\u003ePide lo mismo que antes, esta vez \u003cstrong\u003edentro\u003c/strong\u003e de tu carpeta de trabajo:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eCrea un archivo llamado \u003ccode\u003eprueba_dentro.txt\u003c/code\u003e en la carpeta de trabajo, con el texto «prueba».\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"paso-2-observa\"\u003ePaso 2 — Observa\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eNo ha preguntado nada.\u003c/strong\u003e Lo ha hecho y punto. Es la política que trae opencode de serie: \u003cstrong\u003edentro de la carpeta puede leer, escribir y ejecutar órdenes sin preguntar\u003c/strong\u003e; solo pide permiso para salir.\u003c/p\u003e\n\u003ch3 id=\"paso-3-cambia-la-politica\"\u003ePaso 3 — Cambia la política\u003c/h3\u003e\n\u003cp\u003eLa política se guarda en un archivo, \u003ccode\u003eopencode.json\u003c/code\u003e, en la raíz de tu carpeta. Pídeselo al propio agente:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eCrea en la raíz de esta carpeta un archivo \u003ccode\u003eopencode.json\u003c/code\u003e con exactamente este contenido: \u003ccode\u003e{&quot;$schema&quot;: &quot;https://opencode.ai/config.json&quot;, &quot;permission&quot;: {&quot;edit&quot;: &quot;ask&quot;, &quot;bash&quot;: &quot;ask&quot;}}\u003c/code\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eLo que dice: antes de \u003cstrong\u003eeditar\u003c/strong\u003e cualquier archivo (\u003ccode\u003eedit\u003c/code\u003e) o \u003cstrong\u003eejecutar\u003c/strong\u003e cualquier orden (\u003ccode\u003ebash\u003c/code\u003e), pregunta (\u003ccode\u003eask\u003c/code\u003e).\u003c/p\u003e\n\u003ch3 id=\"paso-4-reinicia-opencode\"\u003ePaso 4 — Reinicia opencode\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eLa política se lee al arrancar.\u003c/strong\u003e Si pruebas ahora, seguirá sin preguntar. Así que:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eVe a la terminal y pulsa \u003cstrong\u003eCtrl + C\u003c/strong\u003e para apagar opencode.\u003c/li\u003e\n\u003cli\u003eVuelve a arrancarlo con \u003ccode\u003eopencode web\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eAbre una \u003cstrong\u003eNueva sesión\u003c/strong\u003e en tu proyecto.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"paso-5-repite-la-prueba\"\u003ePaso 5 — Repite la prueba\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003eCrea un archivo llamado \u003ccode\u003eprueba_dentro2.txt\u003c/code\u003e en la carpeta de trabajo, con el texto «prueba».\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003eAhora sí pregunta\u003c/strong\u003e, aunque sea dentro de la sala: \u003cem\u003eModificar archivos mediante ediciones, escrituras y parches\u003c/em\u003e. Pulsa \u003cstrong\u003ePermitir una vez\u003c/strong\u003e.\u003c/p\u003e\n\u003ch3 id=\"paso-6-saca-la-conclusion\"\u003ePaso 6 — Saca la conclusión\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eEl agente no es más listo ni más tonto. Has cambiado sus reglas.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eHay dos palancas, y las dos son tuyas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eDónde trabaja\u003c/strong\u003e (la carpeta): cuanto más pequeña, menos riesgo.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eQué puede hacer sin preguntar\u003c/strong\u003e (la política): más avisos, más control; menos avisos, más velocidad.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eSi una tarea te obliga a aprobar cien avisos, el problema no es el agente: es dónde está trabajando o qué política le has puesto. Mueve el trabajo dentro de la carpeta y ajusta la política; no apruebes a ciegas.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"paso-7-dejalo-como-estaba\"\u003ePaso 7 — Déjalo como estaba\u003c/h3\u003e\n\u003cp\u003ePara las prácticas siguientes, \u003cstrong\u003eborra \u003ccode\u003eopencode.json\u003c/code\u003e\u003c/strong\u003e y reinicia opencode (Ctrl + C y \u003ccode\u003eopencode web\u003c/code\u003e). Si prefieres seguir aprobando cada cambio, déjalo: solo tendrás más avisos.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eSi usas Claude Code o Codex\u003c/strong\u003e (carril B): la prueba es la misma, pero la política de serie es distinta, así que puede que los resultados sean los contrarios.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eClaude Code\u003c/strong\u003e pregunta de serie antes de editar un archivo, también dentro de la carpeta. Pulsa \u003cstrong\u003eMayús + Tab\u003c/strong\u003e hasta ver \u003cem\u003eaccept edits\u003c/em\u003e (aceptar ediciones) y repite: verás que deja de preguntar. Vuelve al modo normal con Mayús + Tab. La política fija se guarda en \u003ccode\u003e.claude/settings.json\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCodex\u003c/strong\u003e: escribe \u003ccode\u003e/permissions\u003c/code\u003e y elige un modo más estricto (por ejemplo, solo lectura). Repite la prueba y vuelve después al modo de serie.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLa conclusión no cambia: \u003cstrong\u003elas reglas las pones tú\u003c/strong\u003e.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"comprobacion\"\u003e✅ Comprobación\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e El archivo \u003ccode\u003eprueba_dentro.txt\u003c/code\u003e se creó \u003cstrong\u003esin\u003c/strong\u003e pedir aprobación.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e Con \u003ccode\u003eopencode.json\u003c/code\u003e y tras reiniciar, \u003ccode\u003eprueba_dentro2.txt\u003c/code\u003e \u003cstrong\u003esí\u003c/strong\u003e pidió aprobación.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e Sé explicar la diferencia entre la carpeta y la política en una frase.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"y-no-lo-olvides\"\u003eY no lo olvides\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eLa carpeta reduce el riesgo, no lo elimina.\u003c/strong\u003e Con la política de serie, todo lo que está \u003cstrong\u003edentro\u003c/strong\u003e de la carpeta el agente lo puede tocar sin preguntar, incluidas las órdenes de terminal. opencode detecta cuándo una orden apunta fuera de la carpeta y te pregunta, pero \u003cstrong\u003eno es un sandbox\u003c/strong\u003e: no aísla el programa del resto del ordenador. Si dentro hay algo que no debería tocarse, el problema es lo que hay en la carpeta.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n","texto":"Manos a la obra 3 min de lectura Práctica 3 — Cambiar de política Tiempo: unos 8 minutos. Objetivo: comprobar que dentro de la sala no pregunta, y que tú puedes cambiar la política para que pregunte también ahí. Paso 1 — La misma tarea, pero dentro Pide lo mismo que antes, esta vez dentro de tu carpeta de trabajo: Crea un archivo llamado prueba_dentro.txt en la carpeta de trabajo, con el texto «prueba». Paso 2 — Observa No ha preguntado nada. Lo ha hecho y punto. Es la política que trae opencode de serie: dentro de la carpeta puede leer, escribir y ejecutar órdenes sin preguntar ; solo pide permiso para salir. Paso 3 — Cambia la política La política se guarda en un archivo, opencode.json , en la raíz de tu carpeta. Pídeselo al propio agente: Crea en la raíz de esta carpeta un archivo opencode.json con exactamente este contenido: { $schema : https://opencode.ai/config.json , permission : { edit : ask , bash : ask }} Lo que dice: antes de editar cualquier archivo ( edit ) o ejecutar cualquier orden ( bash ), pregunta ( ask ). Paso 4 — Reinicia opencode La política se lee al arrancar. Si pruebas ahora, seguirá sin preguntar. Así que: Ve a la terminal y pulsa Ctrl + C para apagar opencode. Vuelve a arrancarlo con opencode web . Abre una Nueva sesión en tu proyecto. Paso 5 — Repite la prueba Crea un archivo llamado prueba_dentro2.txt en la carpeta de trabajo, con el texto «prueba». Ahora sí pregunta , aunque sea dentro de la sala: Modificar archivos mediante ediciones, escrituras y parches . Pulsa Permitir una vez . Paso 6 — Saca la conclusión El agente no es más listo ni más tonto. Has cambiado sus reglas. Hay dos palancas, y las dos son tuyas: Dónde trabaja (la carpeta): cuanto más pequeña, menos riesgo. Qué puede hacer sin preguntar (la política): más avisos, más control; menos avisos, más velocidad. Si una tarea te obliga a aprobar cien avisos, el problema no es el agente: es dónde está trabajando o qué política le has puesto. Mueve el trabajo dentro de la carpeta y ajusta la política; no apruebes a ciegas. Paso 7 — Déjalo como estaba Para las prácticas siguientes, borra opencode.json y reinicia opencode (Ctrl + C y opencode web ). Si prefieres seguir aprobando cada cambio, déjalo: solo tendrás más avisos. Si usas Claude Code o Codex (carril B): la prueba es la misma, pero la política de serie es distinta, así que puede que los resultados sean los contrarios. Claude Code pregunta de serie antes de editar un archivo, también dentro de la carpeta. Pulsa Mayús + Tab hasta ver accept edits (aceptar ediciones) y repite: verás que deja de preguntar. Vuelve al modo normal con Mayús + Tab. La política fija se guarda en .claude/settings.json . Codex : escribe /permissions y elige un modo más estricto (por ejemplo, solo lectura). Repite la prueba y vuelve después al modo de serie. La conclusión no cambia: las reglas las pones tú . ✅ Comprobación El archivo prueba_dentro.txt se creó sin pedir aprobación. Con opencode.json y tras reiniciar, prueba_dentro2.txt sí pidió aprobación. Sé explicar la diferencia entre la carpeta y la política en una frase. Y no lo olvides La carpeta reduce el riesgo, no lo elimina. Con la política de serie, todo lo que está dentro de la carpeta el agente lo puede tocar sin preguntar, incluidas las órdenes de terminal. opencode detecta cuándo una orden apunta fuera de la carpeta y te pregunta, pero no es un sandbox : no aísla el programa del resto del ordenador. Si dentro hay algo que no debería tocarse, el problema es lo que hay en la carpeta."},{"id":"03-practica-4-ensenarle-un-procedimiento","grupo":"modulo2","titulo":"Práctica 4 — Enseñarle un procedimiento","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M8 5.5v13l11-6.5z\"/\u003e\u003c/svg\u003e Manos a la obra\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 3 min de lectura\u003c/span\u003e\n      \u003c/div\u003e\u003ch2 id=\"practica-4-ensenarle-un-procedimiento\"\u003ePráctica 4 — Enseñarle un procedimiento\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eTiempo:\u003c/strong\u003e unos 5 minutos (más si te animas).\n\u003cstrong\u003eObjetivo:\u003c/strong\u003e dejar una instrucción permanente y comprobar que sobrevive a cerrar la conversación.\u003c/p\u003e\n\u003ch3 id=\"la-idea\"\u003eLa idea\u003c/h3\u003e\n\u003cp\u003eHasta ahora, cada vez que quieres algo tienes que explicárselo. Si tienes una preferencia que se repite, \u003cstrong\u003eno la repitas cada día: escríbela una vez.\u003c/strong\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e\u003ccode\u003eAGENTS.md\u003c/code\u003e son las notas que dejas al becario antes de que empiece.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"paso-1-pide-que-cree-sus-propias-notas\"\u003ePaso 1 — Pide que cree sus propias notas\u003c/h3\u003e\n\u003cp\u003eLo más fácil es pedírselo al propio agente:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eCrea en la raíz de esta carpeta de trabajo un archivo \u003ccode\u003eAGENTS.md\u003c/code\u003e con estas instrucciones para ti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eResponde siempre en español.\u003c/li\u003e\n\u003cli\u003eSi creas un archivo de informe, guárdalo en la carpeta \u003ccode\u003einformes\u003c/code\u003e. Si solo respondes en el chat, no crees archivos.\u003c/li\u003e\n\u003cli\u003eNunca modifiques ni borres los archivos originales: si necesitas cambiarlos, crea una copia.\u003c/li\u003e\n\u003cli\u003eAl terminar cualquier tarea, dime qué archivos has tocado.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cem\u003e(Si prefieres escribirlo tú a mano, crea el archivo \u003ccode\u003eAGENTS.md\u003c/code\u003e en la raíz de la carpeta de trabajo y pega esas mismas líneas.)\u003c/em\u003e\u003c/p\u003e\n\u003ch3 id=\"paso-2-el-detalle-que-hace-que-esto-sea-una-prueba-de-verdad\"\u003ePaso 2 — El detalle que hace que esto sea una prueba de verdad\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eAbre una conversación nueva.\u003c/strong\u003e No sigas en la misma.\u003c/p\u003e\n\u003cp\u003eEn la misma conversación no demuestra nada: el agente se acuerda de lo que le has dicho porque lo tiene delante, en su mesa de trabajo. \u003cstrong\u003eLa prueba de verdad es empezar de cero.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"paso-3-comprueba-que-las-respeta\"\u003ePaso 3 — Comprueba que las respeta\u003c/h3\u003e\n\u003cp\u003eEn la conversación nueva, pídele algo normal, por ejemplo:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eHazme un resumen de los archivos de la carpeta \u003ccode\u003einformes\u003c/code\u003e.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eY observa si cumple las notas: ¿responde en español?, ¿guarda el resultado en \u003ccode\u003einformes\u003c/code\u003e?, ¿te dice qué archivos ha tocado?\u003c/p\u003e\n\u003ch3 id=\"comprobacion\"\u003e✅ Comprobación\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e Existe el archivo \u003ccode\u003eAGENTS.md\u003c/code\u003e en la raíz de mi carpeta de trabajo.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e He abierto una \u003cstrong\u003econversación nueva\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e El agente ha respetado las instrucciones \u003cstrong\u003esin que se las repita\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e Sé explicar la diferencia entre lo que dura una conversación y lo que es permanente.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"si-te-sobra-tiempo-un-procedimiento-guardado-skill\"\u003eSi te sobra tiempo: un procedimiento guardado (skill)\u003c/h3\u003e\n\u003cp\u003eLas notas son preferencias. Los \u003cstrong\u003eprocedimientos guardados\u003c/strong\u003e (skills) son para tareas que repites siempre igual:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eLas skills son procedimientos guardados, como recetas de cocina.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePídele al agente que te cree una:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eCrea una skill llamada \u003ccode\u003eresumen-informes\u003c/code\u003e que consista en: leer todos los archivos de la carpeta \u003ccode\u003einformes\u003c/code\u003e, crear un archivo \u003ccode\u003eresumen_general.md\u003c/code\u003e con una tabla de tres columnas (archivo, tema, conclusión) y no modificar los originales.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eopencode la guarda en \u003ccode\u003e.opencode/skills/resumen-informes/SKILL.md\u003c/code\u003e. \u003cstrong\u003eLas skills se cargan al arrancar\u003c/strong\u003e: apaga opencode (Ctrl + C), vuelve a arrancarlo con \u003ccode\u003eopencode web\u003c/code\u003e y, en una sesión nueva, pídele «hazme el resumen de informes». Comprueba que sigue la receta: debe crear \u003ccode\u003eresumen_general.md\u003c/code\u003e con la tabla. Si no reinicias, responderá en el chat sin usarla.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eSi usas Claude Code o Codex\u003c/strong\u003e (carril B):\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCodex\u003c/strong\u003e lee \u003ccode\u003eAGENTS.md\u003c/code\u003e directamente. Guarda las skills en \u003ccode\u003e.agents/skills/&lt;nombre&gt;/SKILL.md\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eClaude Code\u003c/strong\u003e lee \u003ccode\u003eCLAUDE.md\u003c/code\u003e, no \u003ccode\u003eAGENTS.md\u003c/code\u003e. Pídele: «Crea un \u003ccode\u003eCLAUDE.md\u003c/code\u003e que contenga solo la línea \u003ccode\u003e@AGENTS.md\u003c/code\u003e». Así los dos agentes comparten las mismas notas. Guarda las skills en \u003ccode\u003e.claude/skills/&lt;nombre&gt;/SKILL.md\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eEn los dos casos, si no reconoce la skill, abre una sesión nueva. El archivo \u003ccode\u003eSKILL.md\u003c/code\u003e es el mismo formato: una skill escrita en opencode te sirve copiándola a la carpeta correspondiente.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"la-leccion-para-llevartela\"\u003eLa lección, para llevártela\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eSi te descubres explicando lo mismo por tercera vez, el problema no es el agente: es que no le has dejado notas.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n","texto":"Manos a la obra 3 min de lectura Práctica 4 — Enseñarle un procedimiento Tiempo: unos 5 minutos (más si te animas). Objetivo: dejar una instrucción permanente y comprobar que sobrevive a cerrar la conversación. La idea Hasta ahora, cada vez que quieres algo tienes que explicárselo. Si tienes una preferencia que se repite, no la repitas cada día: escríbela una vez. AGENTS.md son las notas que dejas al becario antes de que empiece. Paso 1 — Pide que cree sus propias notas Lo más fácil es pedírselo al propio agente: Crea en la raíz de esta carpeta de trabajo un archivo AGENTS.md con estas instrucciones para ti: Responde siempre en español. Si creas un archivo de informe, guárdalo en la carpeta informes . Si solo respondes en el chat, no crees archivos. Nunca modifiques ni borres los archivos originales: si necesitas cambiarlos, crea una copia. Al terminar cualquier tarea, dime qué archivos has tocado. (Si prefieres escribirlo tú a mano, crea el archivo AGENTS.md en la raíz de la carpeta de trabajo y pega esas mismas líneas.) Paso 2 — El detalle que hace que esto sea una prueba de verdad Abre una conversación nueva. No sigas en la misma. En la misma conversación no demuestra nada: el agente se acuerda de lo que le has dicho porque lo tiene delante, en su mesa de trabajo. La prueba de verdad es empezar de cero. Paso 3 — Comprueba que las respeta En la conversación nueva, pídele algo normal, por ejemplo: Hazme un resumen de los archivos de la carpeta informes . Y observa si cumple las notas: ¿responde en español?, ¿guarda el resultado en informes ?, ¿te dice qué archivos ha tocado? ✅ Comprobación Existe el archivo AGENTS.md en la raíz de mi carpeta de trabajo. He abierto una conversación nueva . El agente ha respetado las instrucciones sin que se las repita . Sé explicar la diferencia entre lo que dura una conversación y lo que es permanente. Si te sobra tiempo: un procedimiento guardado (skill) Las notas son preferencias. Los procedimientos guardados (skills) son para tareas que repites siempre igual: Las skills son procedimientos guardados, como recetas de cocina. Pídele al agente que te cree una: Crea una skill llamada resumen-informes que consista en: leer todos los archivos de la carpeta informes , crear un archivo resumen_general.md con una tabla de tres columnas (archivo, tema, conclusión) y no modificar los originales. opencode la guarda en .opencode/skills/resumen-informes/SKILL.md . Las skills se cargan al arrancar : apaga opencode (Ctrl + C), vuelve a arrancarlo con opencode web y, en una sesión nueva, pídele «hazme el resumen de informes». Comprueba que sigue la receta: debe crear resumen_general.md con la tabla. Si no reinicias, responderá en el chat sin usarla. Si usas Claude Code o Codex (carril B): Codex lee AGENTS.md directamente. Guarda las skills en .agents/skills/ nombre /SKILL.md . Claude Code lee CLAUDE.md , no AGENTS.md . Pídele: «Crea un CLAUDE.md que contenga solo la línea @AGENTS.md ». Así los dos agentes comparten las mismas notas. Guarda las skills en .claude/skills/ nombre /SKILL.md . En los dos casos, si no reconoce la skill, abre una sesión nueva. El archivo SKILL.md es el mismo formato: una skill escrita en opencode te sirve copiándola a la carpeta correspondiente. La lección, para llevártela Si te descubres explicando lo mismo por tercera vez, el problema no es el agente: es que no le has dejado notas."},{"id":"03-practica-5-encargo-integrador","grupo":"modulo2","titulo":"Práctica 5 — Encargo integrador","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M8 5.5v13l11-6.5z\"/\u003e\u003c/svg\u003e Manos a la obra\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 2 min de lectura\u003c/span\u003e\n      \u003c/div\u003e\u003ch2 id=\"practica-5-encargo-integrador\"\u003ePráctica 5 — Encargo integrador\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eTiempo:\u003c/strong\u003e unos 13 minutos.\n\u003cstrong\u003eObjetivo:\u003c/strong\u003e hacer un encargo completo tú solo, y \u003cstrong\u003everificarlo\u003c/strong\u003e. Aquí ya no hay instrucciones que copiar.\u003c/p\u003e\n\u003ch3 id=\"paso-1-piensa-una-tarea-real-tuya\"\u003ePaso 1 — Piensa una tarea real tuya\u003c/h3\u003e\n\u003cp\u003ePequeña, que tenga que ver con archivos, y que puedas comprobar en dos minutos. Por ejemplo: ordenar archivos por tipo, sacar un listado, resumir varios documentos, extraer datos repetidos, unificar notas sueltas.\u003c/p\u003e\n\u003ch3 id=\"paso-2-redacta-el-encargo-con-las-cuatro-partes\"\u003ePaso 2 — Redacta el encargo con las cuatro partes\u003c/h3\u003e\n\u003cp\u003eEste patrón es lo más útil que te llevas hoy. Cópialo de aquí en adelante:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e1. Qué quiero\u003c/strong\u003e — el objetivo, con un resultado concreto.\n\u003cstrong\u003e2. Dónde\u003c/strong\u003e — la carpeta exacta.\n\u003cstrong\u003e3. Qué NO tocar\u003c/strong\u003e — los límites, dichos explícitamente.\n\u003cstrong\u003e4. Cómo sabré que está bien\u003c/strong\u003e — tu criterio de éxito.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo completo:\u003c/strong\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e«En la carpeta \u003ccode\u003epractica_agente/informes\u003c/code\u003e hay cinco informes en texto. Léelos y créame \u003ccode\u003eresumen_general.md\u003c/code\u003e con una tabla de tres columnas: tema, conclusión y nivel de urgencia.\n\u003cstrong\u003eNo modifiques ninguno de los cinco archivos originales.\u003c/strong\u003e\nAl terminar, dime qué archivos has leído y cuántas filas tiene la tabla.»\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003eMi encargo:\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e1. Qué quiero: ______________________________________________\n2. Dónde: ___________________________________________________\n3. Qué NO tocar: ____________________________________________\n4. Cómo lo comprobaré: ______________________________________\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"paso-3-lanzalo-y-mira-los-pasos\"\u003ePaso 3 — Lánzalo y mira los pasos\u003c/h3\u003e\n\u003cp\u003eNo te vayas a por un café. \u003cstrong\u003eMira cómo trabaja.\u003c/strong\u003e Cada paso te dice qué herramienta está usando. Ahí es donde te darás cuenta si va por donde no debe.\u003c/p\u003e\n\u003ch3 id=\"paso-4-verifica-esta-es-la-parte-importante\"\u003ePaso 4 — Verifica. Esta es la parte importante\u003c/h3\u003e\n\u003cp\u003eCuando diga «hecho», \u003cstrong\u003eno está hecho: está propuesto.\u003c/strong\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eEl agente no firma su trabajo. Lo firmas tú cuando dices que está bien.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e He \u003cstrong\u003eabierto\u003c/strong\u003e el archivo resultante (no vale «tiene buena pinta»).\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e He \u003cstrong\u003econtado\u003c/strong\u003e: ¿están todos los elementos?, ¿las filas que debería?\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e He comprobado que \u003cstrong\u003elos archivos que no debía tocar siguen intactos\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e Le he preguntado \u003cstrong\u003equé archivos ha tocado\u003c/strong\u003e, y la respuesta cuadra con lo que veo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"comprobacion\"\u003e✅ Comprobación\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e He escrito un encargo con las cuatro partes.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e El agente ha producido un resultado.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e He verificado el resultado abriéndolo y contando.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e He comprobado que lo que no debía tocarse no se ha tocado.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e Sé decir \u003cstrong\u003euna cosa que revisaría mejor la próxima vez\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ \u003cstrong\u003eCuidado con esta trampa:\u003c/strong\u003e el resultado llega \u003cstrong\u003ebien escrito, bien maquetado y con tono seguro\u003c/strong\u003e. Eso no significa que sea correcto. Un agente puede equivocarse con una seguridad perfecta.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n","texto":"Manos a la obra 2 min de lectura Práctica 5 — Encargo integrador Tiempo: unos 13 minutos. Objetivo: hacer un encargo completo tú solo, y verificarlo . Aquí ya no hay instrucciones que copiar. Paso 1 — Piensa una tarea real tuya Pequeña, que tenga que ver con archivos, y que puedas comprobar en dos minutos. Por ejemplo: ordenar archivos por tipo, sacar un listado, resumir varios documentos, extraer datos repetidos, unificar notas sueltas. Paso 2 — Redacta el encargo con las cuatro partes Este patrón es lo más útil que te llevas hoy. Cópialo de aquí en adelante: 1. Qué quiero — el objetivo, con un resultado concreto. 2. Dónde — la carpeta exacta. 3. Qué NO tocar — los límites, dichos explícitamente. 4. Cómo sabré que está bien — tu criterio de éxito. Ejemplo completo: «En la carpeta practica_agente/informes hay cinco informes en texto. Léelos y créame resumen_general.md con una tabla de tres columnas: tema, conclusión y nivel de urgencia. No modifiques ninguno de los cinco archivos originales. Al terminar, dime qué archivos has leído y cuántas filas tiene la tabla.» Mi encargo: 1. Qué quiero: ______________________________________________ 2. Dónde: ___________________________________________________ 3. Qué NO tocar: ____________________________________________ 4. Cómo lo comprobaré: ______________________________________ Paso 3 — Lánzalo y mira los pasos No te vayas a por un café. Mira cómo trabaja. Cada paso te dice qué herramienta está usando. Ahí es donde te darás cuenta si va por donde no debe. Paso 4 — Verifica. Esta es la parte importante Cuando diga «hecho», no está hecho: está propuesto. El agente no firma su trabajo. Lo firmas tú cuando dices que está bien. He abierto el archivo resultante (no vale «tiene buena pinta»). He contado : ¿están todos los elementos?, ¿las filas que debería? He comprobado que los archivos que no debía tocar siguen intactos . Le he preguntado qué archivos ha tocado , y la respuesta cuadra con lo que veo. ✅ Comprobación He escrito un encargo con las cuatro partes. El agente ha producido un resultado. He verificado el resultado abriéndolo y contando. He comprobado que lo que no debía tocarse no se ha tocado. Sé decir una cosa que revisaría mejor la próxima vez . ⚠️ Cuidado con esta trampa: el resultado llega bien escrito, bien maquetado y con tono seguro . Eso no significa que sea correcto. Un agente puede equivocarse con una seguridad perfecta."},{"id":"03-practica-6-datos-y-modelo-avanzada-opcional","grupo":"modulo2","titulo":"Práctica 6 — Datos y modelo (avanzada, opcional)","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M8 5.5v13l11-6.5z\"/\u003e\u003c/svg\u003e Manos a la obra\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 3 min de lectura\u003c/span\u003e\n      \u003c/div\u003e\u003ch2 id=\"practica-6-datos-y-modelo-avanzada-opcional\"\u003ePráctica 6 — Datos y modelo (avanzada, opcional)\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eTiempo:\u003c/strong\u003e unos 20 minutos. Hazla si vas sobrado, o en casa.\n\u003cstrong\u003eObjetivo:\u003c/strong\u003e encargar un análisis de datos y un modelo sencillo, y \u003cstrong\u003erevisar el programa, no solo el número\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eEn la carpeta está \u003ccode\u003electuras_energia_diarias.csv\u003c/code\u003e: el consumo eléctrico diario de la planta ficticia durante las cuatro semanas del informe \u003ccode\u003einforme_04_energia_mayo.txt\u003c/code\u003e, con las unidades producidas y las horas de operación. El informe dice que la semana 3 consumió más y sospecha del compresor por la noche. Vamos a comprobarlo.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eNo necesitas instalar nada más.\u003c/strong\u003e El agente puede escribir el script en Python, si lo tienes, o en JavaScript con el Node.js que ya instalaste. Si tienes Python pero le faltan librerías (pandas, matplotlib), el agente te propondrá instalarlas: piénsalo antes de aceptar, o pídele que lo haga sin ellas.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"paso-1-el-encargo\"\u003ePaso 1 — El encargo\u003c/h3\u003e\n\u003cp\u003eCopia este encargo tal cual (tiene las cuatro partes):\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e«En \u003ccode\u003epractica_agente\u003c/code\u003e está \u003ccode\u003electuras_energia_diarias.csv\u003c/code\u003e. Quiero:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eAntes de calcular nada, dime cuántas filas hay, qué columnas, en qué unidades crees que está cada una y si ves valores vacíos o raros.\u003c/li\u003e\n\u003cli\u003eEscribe un script en \u003ccode\u003eanalisis/energia.py\u003c/code\u003e (o \u003ccode\u003e.js\u003c/code\u003e) que calcule el consumo total y por semana, y que ajuste un modelo lineal sencillo: kWh diarios en función de las unidades terminadas.\u003c/li\u003e\n\u003cli\u003eUsa el modelo para decir qué semana consume más de lo que le corresponde por su producción, y guarda un gráfico en \u003ccode\u003eanalisis/\u003c/code\u003e.\n\u003cstrong\u003eNo modifiques el CSV original.\u003c/strong\u003e Si corriges algún dato, hazlo en el script y dime cuál y por qué.\nAl terminar, dime el consumo total y compáralo con los 32.400 kWh del informe de energía.»\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"paso-2-mira-antes-de-que-calcule\"\u003ePaso 2 — Mira antes de que calcule\u003c/h3\u003e\n\u003cp\u003eFíjate en la respuesta al punto 1. Hay \u003cstrong\u003edos trampas\u003c/strong\u003e puestas a propósito en los datos. ¿Las ha encontrado el agente antes de calcular? Si no, pregúntale: «¿Todas las lecturas de \u003ccode\u003ekwh_total\u003c/code\u003e están en las mismas unidades?».\u003c/p\u003e\n\u003ch3 id=\"paso-3-revisa-el-programa-no-solo-el-numero\"\u003ePaso 3 — Revisa el programa, no solo el número\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eAbre el script. No hace falta entenderlo todo: busca \u003cstrong\u003edónde lee el archivo\u003c/strong\u003e, \u003cstrong\u003equé filas descarta o corrige\u003c/strong\u003e y \u003cstrong\u003equé fórmula ajusta\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003ePregúntale: «¿Has usado los mismos datos para ajustar el modelo y para evaluarlo? ¿Qué pasa si quitas la semana 3 al ajustar?».\u003c/li\u003e\n\u003cli\u003ePregúntale: «¿Para qué rango de producción vale este modelo?».\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"paso-4-totales-de-control\"\u003ePaso 4 — Totales de control\u003c/h3\u003e\n\u003cp\u003eComprueba \u003cstrong\u003etú\u003c/strong\u003e dos números contra el informe original:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e El consumo total sale \u003cstrong\u003e32.400 kWh\u003c/strong\u003e (si sale unos 31.650, hay una lectura mal sumada).\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e Las unidades terminadas suman \u003cstrong\u003e17.820\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"comprobacion\"\u003e✅ Comprobación\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e El agente ha descrito los datos \u003cstrong\u003eantes\u003c/strong\u003e de calcular.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e Ha detectado (solo o con tu pregunta) la lectura en otras unidades y el valor vacío.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e El CSV original está intacto y el script está guardado para repetirlo.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e El total cuadra con el informe.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e Sé decir qué semana se sale del modelo y \u003cstrong\u003equé dato lo confirma\u003c/strong\u003e (pista: hay una columna que no está en el informe).\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e He revisado las \u003cstrong\u003eunidades\u003c/strong\u003e de lo que me dice: ¿kWh al día o en toda la semana? Los modelos a veces aciertan el número y se equivocan en la unidad.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ \u003cstrong\u003eLa lección:\u003c/strong\u003e un modelo dice qué es raro; no dice por qué. Que el compresor sea la causa es una hipótesis para comprobar en la planta, no una conclusión del agente.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n","texto":"Manos a la obra 3 min de lectura Práctica 6 — Datos y modelo (avanzada, opcional) Tiempo: unos 20 minutos. Hazla si vas sobrado, o en casa. Objetivo: encargar un análisis de datos y un modelo sencillo, y revisar el programa, no solo el número . En la carpeta está lecturas_energia_diarias.csv : el consumo eléctrico diario de la planta ficticia durante las cuatro semanas del informe informe_04_energia_mayo.txt , con las unidades producidas y las horas de operación. El informe dice que la semana 3 consumió más y sospecha del compresor por la noche. Vamos a comprobarlo. No necesitas instalar nada más. El agente puede escribir el script en Python, si lo tienes, o en JavaScript con el Node.js que ya instalaste. Si tienes Python pero le faltan librerías (pandas, matplotlib), el agente te propondrá instalarlas: piénsalo antes de aceptar, o pídele que lo haga sin ellas. Paso 1 — El encargo Copia este encargo tal cual (tiene las cuatro partes): «En practica_agente está lecturas_energia_diarias.csv . Quiero: Antes de calcular nada, dime cuántas filas hay, qué columnas, en qué unidades crees que está cada una y si ves valores vacíos o raros. Escribe un script en analisis/energia.py (o .js ) que calcule el consumo total y por semana, y que ajuste un modelo lineal sencillo: kWh diarios en función de las unidades terminadas. Usa el modelo para decir qué semana consume más de lo que le corresponde por su producción, y guarda un gráfico en analisis/ . No modifiques el CSV original. Si corriges algún dato, hazlo en el script y dime cuál y por qué. Al terminar, dime el consumo total y compáralo con los 32.400 kWh del informe de energía.» Paso 2 — Mira antes de que calcule Fíjate en la respuesta al punto 1. Hay dos trampas puestas a propósito en los datos. ¿Las ha encontrado el agente antes de calcular? Si no, pregúntale: «¿Todas las lecturas de kwh_total están en las mismas unidades?». Paso 3 — Revisa el programa, no solo el número Abre el script. No hace falta entenderlo todo: busca dónde lee el archivo , qué filas descarta o corrige y qué fórmula ajusta . Pregúntale: «¿Has usado los mismos datos para ajustar el modelo y para evaluarlo? ¿Qué pasa si quitas la semana 3 al ajustar?». Pregúntale: «¿Para qué rango de producción vale este modelo?». Paso 4 — Totales de control Comprueba tú dos números contra el informe original: El consumo total sale 32.400 kWh (si sale unos 31.650, hay una lectura mal sumada). Las unidades terminadas suman 17.820 . ✅ Comprobación El agente ha descrito los datos antes de calcular. Ha detectado (solo o con tu pregunta) la lectura en otras unidades y el valor vacío. El CSV original está intacto y el script está guardado para repetirlo. El total cuadra con el informe. Sé decir qué semana se sale del modelo y qué dato lo confirma (pista: hay una columna que no está en el informe). He revisado las unidades de lo que me dice: ¿kWh al día o en toda la semana? Los modelos a veces aciertan el número y se equivocan en la unidad. ⚠️ La lección: un modelo dice qué es raro; no dice por qué. Que el compresor sea la causa es una hipótesis para comprobar en la planta, no una conclusión del agente."},{"id":"03-hoja-de-registro","grupo":"modulo2","titulo":"Hoja de registro","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M8 5.5v13l11-6.5z\"/\u003e\u003c/svg\u003e Manos a la obra\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 1 min de lectura\u003c/span\u003e\n      \u003c/div\u003e\u003ch2 id=\"hoja-de-registro\"\u003eHoja de registro\u003c/h2\u003e\n\u003cp\u003eRellénala sobre la marcha. Te sirve para el cuestionario final y para acordarte de lo que has hecho.\u003c/p\u003e\n\u003cp\u003eEn las dos últimas columnas, apunta cuántos minutos calculas que te costaría hacerlo \u003cstrong\u003ecopiando y pegando en un chat\u003c/strong\u003e y cuántos te ha costado \u003cstrong\u003econ el agente\u003c/strong\u003e. Fíjate sobre todo en la Práctica 5: es una tarea tuya.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePráctica\u003c/th\u003e\n\u003cth\u003eQué pedí\u003c/th\u003e\n\u003cth\u003eQué pasó\u003c/th\u003e\n\u003cth\u003eQué comprobé\u003c/th\u003e\n\u003cth\u003eMin. con chat\u003c/th\u003e\n\u003cth\u003eMin. con agente\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e1 — Primer arranque\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2 — Provocar una aprobación\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e3 — Cambiar de política\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e4 — Enseñarle un procedimiento\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e5 — Encargo integrador\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e6 — Datos y modelo (opcional)\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eCarril que he usado\u003c/strong\u003e (opencode, Claude Code, Codex u otro):\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e\u003cstrong\u003eLo que me ha sorprendido:\u003c/strong\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e\u003cstrong\u003eLo que no dejaría que hiciera sin mirar:\u003c/strong\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e\u003cstrong\u003eLa primera tarea que le voy a encargar el lunes:\u003c/strong\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003chr\u003e\n","texto":"Manos a la obra 1 min de lectura Hoja de registro Rellénala sobre la marcha. Te sirve para el cuestionario final y para acordarte de lo que has hecho. En las dos últimas columnas, apunta cuántos minutos calculas que te costaría hacerlo copiando y pegando en un chat y cuántos te ha costado con el agente . Fíjate sobre todo en la Práctica 5: es una tarea tuya. Práctica Qué pedí Qué pasó Qué comprobé Min. con chat Min. con agente 1 — Primer arranque 2 — Provocar una aprobación 3 — Cambiar de política 4 — Enseñarle un procedimiento 5 — Encargo integrador 6 — Datos y modelo (opcional) Carril que he usado (opencode, Claude Code, Codex u otro): Lo que me ha sorprendido: Lo que no dejaría que hiciera sin mirar: La primera tarea que le voy a encargar el lunes:"},{"id":"02-como-pedir-bien","grupo":"modulo3","titulo":"Cómo pedir bien","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M12 3 3 8l9 5 9-5z\"/\u003e\u003cpath d=\"M3 12l9 5 9-5\"/\u003e\u003cpath d=\"M3 16l9 5 9-5\"/\u003e\u003c/svg\u003e Trabajar sin sustos\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 3 min de lectura\u003c/span\u003e\n      \u003c/div\u003e\u003ch2 id=\"9-como-pedir-bien\"\u003e9. Cómo pedir bien\u003c/h2\u003e\n\u003cp\u003eUn buen encargo tiene cuatro partes. Cópialas, funcionan:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e1. Qué quiero\u003c/strong\u003e — el objetivo, con un resultado concreto.\n\u003cstrong\u003e2. Dónde\u003c/strong\u003e — la carpeta exacta.\n\u003cstrong\u003e3. Qué NO tocar\u003c/strong\u003e — los límites, dichos explícitamente.\n\u003cstrong\u003e4. Cómo sabré que está bien\u003c/strong\u003e — tu criterio de éxito.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003eComparación real:\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e❌ Así no\u003c/th\u003e\n\u003cth\u003e✅ Así sí\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e«Ordena mis archivos»\u003c/td\u003e\n\u003ctd\u003e«En la carpeta \u003ccode\u003epractica/informes\u003c/code\u003e hay archivos sueltos. Muévelos a subcarpetas por año. \u003cstrong\u003eNo borres nada\u003c/strong\u003e y dime cuántos has movido.»\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Resume esto»\u003c/td\u003e\n\u003ctd\u003e«Lee los cinco archivos de esta carpeta y créame \u003ccode\u003eresumen.md\u003c/code\u003e con una tabla: tema, conclusión, urgencia. \u003cstrong\u003eNo modifiques los originales.\u003c/strong\u003e»\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eEl cuarto punto es el que todo el mundo se salta y es el más útil.\u003c/strong\u003e Si tú no sabes cómo vas a comprobar que el resultado está bien, el agente tampoco.\u003c/p\u003e\n\u003ch3 id=\"91-una-plantilla-para-tu-chat-o-bot\"\u003e9.1 Una plantilla para tu chat o bot\u003c/h3\u003e\n\u003cp\u003eSi usas a menudo un chat para el mismo tipo de trabajo, no repitas las reglas en cada conversación: ponlas en las \u003cstrong\u003einstrucciones permanentes\u003c/strong\u003e (un \u003cem\u003eProyecto\u003c/em\u003e en Claude, un GPT personalizado o un proyecto en ChatGPT). Es el \u003ccode\u003eAGENTS.md\u003c/code\u003e del chat. Un ejemplo para análisis técnico, listo para adaptar:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eEres un analista técnico de planta. Respondes en español.\nAntes de calcular: describe filas, columnas, unidades y valores raros.\nSepara siempre HECHOS (con archivo y dato de origen) de HIPÓTESIS.\nNo extrapoles fuera del rango de los datos; dilo si te lo piden.\nPara cualquier cálculo, muestra la fórmula y un total de control.\nNo redactes correos ni pedidos a terceros salvo que te lo pida explícitamente.\nTermina con: qué has usado y qué no has podido comprobar.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"92-ahorrar-tokens-y-dinero\"\u003e9.2 Ahorrar tokens (y dinero)\u003c/h3\u003e\n\u003cp\u003eCada palabra que el agente lee o escribe cuesta \u003cem\u003etokens\u003c/em\u003e, y con ellos tiempo y dinero. Lo que más ahorra:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eHábito\u003c/th\u003e\n\u003cth\u003ePor qué ahorra\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eLeer lo justo.\u003c/strong\u003e «Mira solo las cabeceras», «busca la palabra X» en lugar de «lee todo».\u003c/td\u003e\n\u003ctd\u003ePara hacer un índice bastan cuatro líneas por archivo.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eScripts antes que pegar datos.\u003c/strong\u003e Que el agente escriba un programa que calcule, en vez de leerse la tabla entera.\u003c/td\u003e\n\u003ctd\u003eEl modelo lee el resultado, no las miles de filas. Y el cálculo se puede repetir.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eAgrupar tareas parecidas en la misma conversación\u003c/strong\u003e, y abrir una nueva solo al cambiar de tema.\u003c/td\u003e\n\u003ctd\u003eCada conversación nueva tiene una carga fija de arranque (instrucciones y herramientas). En las pruebas de este curso, dos conversaciones nuevas para tareas pequeñas consumieron unos 60.000 tokens cada una, casi todo de esa carga.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eEl modelo más barato que haga bien la tarea.\u003c/strong\u003e El más capaz, para razonar; uno pequeño, para lo mecánico.\u003c/td\u003e\n\u003ctd\u003eUn modelo pequeño cuesta varias veces menos y para un resumen sencillo basta.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eSkills en lugar de explicaciones repetidas.\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEl agente solo lee el nombre y la descripción hasta que la receta hace falta.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eNotas cortas.\u003c/strong\u003e \u003ccode\u003eAGENTS.md\u003c/code\u003e y las instrucciones permanentes se leen en cada mensaje.\u003c/td\u003e\n\u003ctd\u003eDiez líneas claras rinden más que dos páginas.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003chr\u003e\n","texto":"Trabajar sin sustos 3 min de lectura 9. Cómo pedir bien Un buen encargo tiene cuatro partes. Cópialas, funcionan: 1. Qué quiero — el objetivo, con un resultado concreto. 2. Dónde — la carpeta exacta. 3. Qué NO tocar — los límites, dichos explícitamente. 4. Cómo sabré que está bien — tu criterio de éxito. Comparación real: ❌ Así no ✅ Así sí «Ordena mis archivos» «En la carpeta practica/informes hay archivos sueltos. Muévelos a subcarpetas por año. No borres nada y dime cuántos has movido.» «Resume esto» «Lee los cinco archivos de esta carpeta y créame resumen.md con una tabla: tema, conclusión, urgencia. No modifiques los originales. » El cuarto punto es el que todo el mundo se salta y es el más útil. Si tú no sabes cómo vas a comprobar que el resultado está bien, el agente tampoco. 9.1 Una plantilla para tu chat o bot Si usas a menudo un chat para el mismo tipo de trabajo, no repitas las reglas en cada conversación: ponlas en las instrucciones permanentes (un Proyecto en Claude, un GPT personalizado o un proyecto en ChatGPT). Es el AGENTS.md del chat. Un ejemplo para análisis técnico, listo para adaptar: Eres un analista técnico de planta. Respondes en español. Antes de calcular: describe filas, columnas, unidades y valores raros. Separa siempre HECHOS (con archivo y dato de origen) de HIPÓTESIS. No extrapoles fuera del rango de los datos; dilo si te lo piden. Para cualquier cálculo, muestra la fórmula y un total de control. No redactes correos ni pedidos a terceros salvo que te lo pida explícitamente. Termina con: qué has usado y qué no has podido comprobar. 9.2 Ahorrar tokens (y dinero) Cada palabra que el agente lee o escribe cuesta tokens , y con ellos tiempo y dinero. Lo que más ahorra: Hábito Por qué ahorra Leer lo justo. «Mira solo las cabeceras», «busca la palabra X» en lugar de «lee todo». Para hacer un índice bastan cuatro líneas por archivo. Scripts antes que pegar datos. Que el agente escriba un programa que calcule, en vez de leerse la tabla entera. El modelo lee el resultado, no las miles de filas. Y el cálculo se puede repetir. Agrupar tareas parecidas en la misma conversación , y abrir una nueva solo al cambiar de tema. Cada conversación nueva tiene una carga fija de arranque (instrucciones y herramientas). En las pruebas de este curso, dos conversaciones nuevas para tareas pequeñas consumieron unos 60.000 tokens cada una, casi todo de esa carga. El modelo más barato que haga bien la tarea. El más capaz, para razonar; uno pequeño, para lo mecánico. Un modelo pequeño cuesta varias veces menos y para un resumen sencillo basta. Skills en lugar de explicaciones repetidas. El agente solo lee el nombre y la descripción hasta que la receta hace falta. Notas cortas. AGENTS.md y las instrucciones permanentes se leen en cada mensaje. Diez líneas claras rinden más que dos páginas."},{"id":"02-verificar-tu-trabajo-no-acaba-cuando-el-agente-termina","grupo":"modulo3","titulo":"Verificar: tu trabajo no acaba cuando el agente termina","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M12 3 3 8l9 5 9-5z\"/\u003e\u003cpath d=\"M3 12l9 5 9-5\"/\u003e\u003cpath d=\"M3 16l9 5 9-5\"/\u003e\u003c/svg\u003e Trabajar sin sustos\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 1 min de lectura\u003c/span\u003e\n      \u003c/div\u003e\u003ch2 id=\"10-verificar-tu-trabajo-no-acaba-cuando-el-agente-termina\"\u003e10. Verificar: tu trabajo no acaba cuando el agente termina\u003c/h2\u003e\n\u003cp\u003eCuando el agente dice «hecho», \u003cstrong\u003eno está hecho\u003c/strong\u003e. Está \u003cem\u003epropuesto\u003c/em\u003e.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eEl agente no firma su trabajo. Lo firmas tú cuando dices que está bien.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eY ojo con esto, porque es una trampa real: el resultado llega \u003cstrong\u003ebien escrito, bien maquetado y con tono seguro\u003c/strong\u003e. Eso no significa que sea correcto. Un agente puede equivocarse con una seguridad perfecta.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCómo verificar en dos minutos:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAbre el archivo y \u003cstrong\u003emíralo\u003c/strong\u003e. No «tiene buena pinta»: ábrelo.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCuenta:\u003c/strong\u003e ¿están todos los elementos? ¿las filas que debería?\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eComprueba que lo que no debía tocarse sigue intacto.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003ePregúntale al agente \u003cstrong\u003equé ha hecho y qué archivos ha tocado\u003c/strong\u003e. Te lo dirá, y a veces la respuesta te sorprende.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n","texto":"Trabajar sin sustos 1 min de lectura 10. Verificar: tu trabajo no acaba cuando el agente termina Cuando el agente dice «hecho», no está hecho . Está propuesto . El agente no firma su trabajo. Lo firmas tú cuando dices que está bien. Y ojo con esto, porque es una trampa real: el resultado llega bien escrito, bien maquetado y con tono seguro . Eso no significa que sea correcto. Un agente puede equivocarse con una seguridad perfecta. Cómo verificar en dos minutos: Abre el archivo y míralo . No «tiene buena pinta»: ábrelo. Cuenta: ¿están todos los elementos? ¿las filas que debería? Comprueba que lo que no debía tocarse sigue intacto. Pregúntale al agente qué ha hecho y qué archivos ha tocado . Te lo dirá, y a veces la respuesta te sorprende."},{"id":"02-limites-dichos-con-honestidad","grupo":"modulo3","titulo":"Límites, dichos con honestidad","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M12 3 3 8l9 5 9-5z\"/\u003e\u003cpath d=\"M3 12l9 5 9-5\"/\u003e\u003cpath d=\"M3 16l9 5 9-5\"/\u003e\u003c/svg\u003e Trabajar sin sustos\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 1 min de lectura\u003c/span\u003e\n      \u003c/div\u003e\u003ch2 id=\"11-limites-dichos-con-honestidad\"\u003e11. Límites, dichos con honestidad\u003c/h2\u003e\n\u003cp\u003eEsto no es para asustarte: es para que no te lleves un susto.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eopencode cambia muy rápido.\u003c/strong\u003e Saca versiones casi cada semana y los modelos gratuitos van y vienen («gratis por tiempo limitado»). Lo que ves hoy puede cambiar mañana: no construyas nada crítico encima sin un plan B.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLos modelos gratuitos tienen letra pequeña.\u003c/strong\u003e Algunos usan lo que les envías para mejorar el modelo. Para trabajo real, usa un proveedor con contrato y política de datos que tu organización haya aprobado.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDe serie confía mucho.\u003c/strong\u003e Dentro de la carpeta lee, escribe y ejecuta órdenes sin preguntar, y no tiene sandbox. Los productos comerciales (Claude Code, Codex, Cowork, ChatGPT Work) están más maduros, pero sus fabricantes repiten la misma advertencia: \u003cstrong\u003eningún agente es inmune a la inyección de instrucciones.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLa carpeta, el sandbox y las aprobaciones reducen el riesgo, pero no garantizan aislamiento\u003c/strong\u003e, y no deberían ser tu único control de seguridad. Si el trabajo es delicado, lo recomendable es usar una máquina virtual o un entorno dedicado y desechable.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLa responsabilidad de revisar es tuya.\u003c/strong\u003e Es la contrapartida de la comodidad.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eLo que sí está en tu mano:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTrabajar con \u003cstrong\u003eel mínimo privilegio necesario\u003c/strong\u003e. Ni uno más.\u003c/li\u003e\n\u003cli\u003eTener \u003cstrong\u003ecopias de seguridad\u003c/strong\u003e de todo lo que el agente puede tocar.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo exponer credenciales\u003c/strong\u003e ni datos sensibles.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRevisar plugins y comandos\u003c/strong\u003e antes de permitirlos.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n","texto":"Trabajar sin sustos 1 min de lectura 11. Límites, dichos con honestidad Esto no es para asustarte: es para que no te lleves un susto. opencode cambia muy rápido. Saca versiones casi cada semana y los modelos gratuitos van y vienen («gratis por tiempo limitado»). Lo que ves hoy puede cambiar mañana: no construyas nada crítico encima sin un plan B. Los modelos gratuitos tienen letra pequeña. Algunos usan lo que les envías para mejorar el modelo. Para trabajo real, usa un proveedor con contrato y política de datos que tu organización haya aprobado. De serie confía mucho. Dentro de la carpeta lee, escribe y ejecuta órdenes sin preguntar, y no tiene sandbox. Los productos comerciales (Claude Code, Codex, Cowork, ChatGPT Work) están más maduros, pero sus fabricantes repiten la misma advertencia: ningún agente es inmune a la inyección de instrucciones. La carpeta, el sandbox y las aprobaciones reducen el riesgo, pero no garantizan aislamiento , y no deberían ser tu único control de seguridad. Si el trabajo es delicado, lo recomendable es usar una máquina virtual o un entorno dedicado y desechable. La responsabilidad de revisar es tuya. Es la contrapartida de la comodidad. Lo que sí está en tu mano: Trabajar con el mínimo privilegio necesario . Ni uno más. Tener copias de seguridad de todo lo que el agente puede tocar. No exponer credenciales ni datos sensibles. Revisar plugins y comandos antes de permitirlos."},{"id":"02-las-cuatro-reglas-para-el-lunes","grupo":"modulo3","titulo":"Las cuatro reglas para el lunes","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M12 3 3 8l9 5 9-5z\"/\u003e\u003cpath d=\"M3 12l9 5 9-5\"/\u003e\u003cpath d=\"M3 16l9 5 9-5\"/\u003e\u003c/svg\u003e Trabajar sin sustos\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 1 min de lectura\u003c/span\u003e\n      \u003c/div\u003e\u003ch2 id=\"12-las-cuatro-reglas-para-el-lunes\"\u003e12. Las cuatro reglas para el lunes\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eCopia de seguridad\u003c/strong\u003e de la carpeta antes de empezar.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUna carpeta específica\u003c/strong\u003e para cada trabajo. Ni el escritorio entero ni, mucho menos, todo el disco.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNada confidencial\u003c/strong\u003e en la carpeta de trabajo, salvo que aceptes el riesgo a conciencia.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRevisa antes de aprobar y verifica al terminar.\u003c/strong\u003e Las dos cosas, siempre.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n","texto":"Trabajar sin sustos 1 min de lectura 12. Las cuatro reglas para el lunes Copia de seguridad de la carpeta antes de empezar. Una carpeta específica para cada trabajo. Ni el escritorio entero ni, mucho menos, todo el disco. Nada confidencial en la carpeta de trabajo, salvo que aceptes el riesgo a conciencia. Revisa antes de aprobar y verifica al terminar. Las dos cosas, siempre."},{"id":"02-resumen-de-una-pagina","grupo":"modulo3","titulo":"Resumen de una página","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M12 3 3 8l9 5 9-5z\"/\u003e\u003cpath d=\"M3 12l9 5 9-5\"/\u003e\u003cpath d=\"M3 16l9 5 9-5\"/\u003e\u003c/svg\u003e Trabajar sin sustos\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 2 min de lectura\u003c/span\u003e\n      \u003c/div\u003e\u003ch2 id=\"13-resumen-de-una-pagina\"\u003e13. Resumen de una página\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eEl cambio de fondo\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eChat: te dice qué hacer y lo haces tú.\u003c/li\u003e\n\u003cli\u003eAgente: un becario con acceso a tu ordenador. Lo hace y tú revisas.\u003c/li\u003e\n\u003cli\u003eModelo = motor. Harness = el coche completo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eLas piezas\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eHerramientas (las manos), bucle (piensa-actúa-observa), contexto (la mesa de trabajo), permisos (los frenos), interfaz (el salpicadero).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eLos permisos\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eDentro de la sala, libertad. Para salir, te pide permiso.\u003c/li\u003e\n\u003cli\u003eTú eliges el tamaño de la sala. Cuanto más pequeña, mejor.\u003c/li\u003e\n\u003cli\u003e«Permitir una vez» = una vez.\u003c/li\u003e\n\u003cli\u003eSi no lo entiendes, no lo apruebes.\u003c/li\u003e\n\u003cli\u003eEl sandbox reduce el riesgo; no lo elimina.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEl trabajo diario\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eUn buen encargo dice: qué, dónde, qué no tocar, y cómo se comprueba.\u003c/li\u003e\n\u003cli\u003eVerifica siempre. El agente no firma su trabajo.\u003c/li\u003e\n\u003cli\u003eSi repites una explicación por tercera vez, escríbela (\u003ccode\u003eAGENTS.md\u003c/code\u003e o una skill).\u003c/li\u003e\n\u003cli\u003eSi la conversación se degrada, abre una nueva y resume lo hecho.\u003c/li\u003e\n\u003cli\u003eAhorra tokens: lee lo justo, calcula con scripts y usa el modelo más barato que haga bien la tarea.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eSeguridad\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLo que el agente lee de fuera puede traer órdenes escondidas (inyección de instrucciones).\u003c/li\u003e\n\u003cli\u003eNunca juntes datos privados, contenido de fuera y salida a internet: quita al menos una.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eDatos, modelos e ingeniería\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eEl agente no te da un número: te da un programa que lo calcula. Revisa el programa.\u003c/li\u003e\n\u003cli\u003eTotales de control, unidades y filas descartadas, siempre.\u003c/li\u003e\n\u003cli\u003eUn modelo señala lo raro; no explica la causa. Y el cálculo lo firma una persona.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEl ecosistema\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eClaude Code, Cowork, Codex o ChatGPT Work: mismas piezas, otro salpicadero.\u003c/li\u003e\n\u003cli\u003eMCP, \u003ccode\u003eAGENTS.md\u003c/code\u003e y las skills son estándares abiertos: lo que escribas te sirve al cambiar de herramienta.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eLas cuatro reglas\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eCopia de seguridad.\u003c/li\u003e\n\u003cli\u003eUna carpeta específica por trabajo.\u003c/li\u003e\n\u003cli\u003eNada confidencial dentro.\u003c/li\u003e\n\u003cli\u003eRevisa antes de aprobar; verifica al terminar.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eHoy no has aprendido a usar un programa. Has aprendido a dirigir a alguien que trabaja muy rápido, que no sabe lo que no sabe, y que tiene acceso a tus archivos. La herramienta te va a servir; los frenos te van a proteger.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n","texto":"Trabajar sin sustos 2 min de lectura 13. Resumen de una página El cambio de fondo Chat: te dice qué hacer y lo haces tú. Agente: un becario con acceso a tu ordenador. Lo hace y tú revisas. Modelo = motor. Harness = el coche completo. Las piezas Herramientas (las manos), bucle (piensa-actúa-observa), contexto (la mesa de trabajo), permisos (los frenos), interfaz (el salpicadero). Los permisos Dentro de la sala, libertad. Para salir, te pide permiso. Tú eliges el tamaño de la sala. Cuanto más pequeña, mejor. «Permitir una vez» = una vez. Si no lo entiendes, no lo apruebes. El sandbox reduce el riesgo; no lo elimina. El trabajo diario Un buen encargo dice: qué, dónde, qué no tocar, y cómo se comprueba. Verifica siempre. El agente no firma su trabajo. Si repites una explicación por tercera vez, escríbela ( AGENTS.md o una skill). Si la conversación se degrada, abre una nueva y resume lo hecho. Ahorra tokens: lee lo justo, calcula con scripts y usa el modelo más barato que haga bien la tarea. Seguridad Lo que el agente lee de fuera puede traer órdenes escondidas (inyección de instrucciones). Nunca juntes datos privados, contenido de fuera y salida a internet: quita al menos una. Datos, modelos e ingeniería El agente no te da un número: te da un programa que lo calcula. Revisa el programa. Totales de control, unidades y filas descartadas, siempre. Un modelo señala lo raro; no explica la causa. Y el cálculo lo firma una persona. El ecosistema Claude Code, Cowork, Codex o ChatGPT Work: mismas piezas, otro salpicadero. MCP, AGENTS.md y las skills son estándares abiertos: lo que escribas te sirve al cambiar de herramienta. Las cuatro reglas Copia de seguridad. Una carpeta específica por trabajo. Nada confidencial dentro. Revisa antes de aprobar; verifica al terminar. Hoy no has aprendido a usar un programa. Has aprendido a dirigir a alguien que trabaja muy rápido, que no sabe lo que no sabe, y que tiene acceso a tus archivos. La herramienta te va a servir; los frenos te van a proteger."},{"id":"quiz-final","grupo":"evaluacion","titulo":"Evaluación final","tipo":"quiz","quiz":"final","html":"","texto":"Evaluación final"},{"id":"recursos","grupo":"recursos","titulo":"Recursos y enlaces oficiales","tipo":"doc","html":"\u003ch1\u003eRecursos y enlaces oficiales\u003c/h1\u003e\n\u003cp\u003ePara profundizar, estas son las fuentes del propio proyecto. El resto del curso es material de elaboración propia,\npero aquí está siempre la verdad de referencia, sobre todo porque la herramienta y sus modelos gratuitos \u003cstrong\u003ecambian muy rápido\u003c/strong\u003e.\u003c/p\u003e\n\u003cdiv class=\"recursos\"\u003e\n\u003ca class=\"recurso\" href=\"https://opencode.ai/docs/\" target=\"_blank\" rel=\"noopener\"\u003e\n  \u003cspan class=\"recurso-icono\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M5 12h14\"/\u003e\u003cpath d=\"M13 6l6 6-6 6\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n  \u003cspan class=\"recurso-cuerpo\"\u003e\n    \u003cspan class=\"recurso-etq\"\u003eDocs\u003c/span\u003e\n    \u003cspan class=\"recurso-titulo\"\u003eDocumentación oficial\u003c/span\u003e\n    \u003cspan class=\"recurso-detalle\"\u003eInstalación, uso y configuración de opencode.\u003c/span\u003e lor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M5 12h14\"/\u003e\u003cpath d=\"M13 6l6 6-6 6\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n  \u003cspan class=\"recurso-cuerpo\"\u003e\n    \u003cspan class=\"recurso-etq\"\u003eGuía\u003c/span\u003e\n    \u003cspan class=\"recurso-titulo\"\u003eInterfaz web\u003c/span\u003e\n    \u003cspan class=\"recurso-detalle\"\u003eArrancar opencode web, abrir proyectos y sesiones.\u003c/span\u003e\n  \u003c/span\u003e\n  \u003cspan class=\"recurso-abrir\"\u003e↗\u003c/span\u003e\n\u003c/a\u003e\n\u003ca class=\"recurso\" href=\"https://opencode.ai/docs/zen/\" target=\"_blank\" rel=\"noopener\"\u003e\n  \u003cspan class=\"recurso-icono\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M5 12h14\"/\u003e\u003cpath d=\"M13 6l6 6-6 6\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n  \u003cspan class=\"recurso-cuerpo\"\u003e\n    \u003cspan class=\"recurso-etq\"\u003eModelos\u003c/span\u003e\n    \u003cspan class=\"recurso-titulo\"\u003eModelos y privacidad\u003c/span\u003e\n    \u003cspan class=\"recurso-detalle\"\u003eQué modelos son gratuitos y qué hace cada proveedor con tus datos.\u003c/span\u003e\n  \u003c/span\u003e\n  \u003cspan class=\"recurso-abrir\"\u003e↗\u003c/span\u003e\n\u003c/a\u003e\n\u003ca class=\"recurso\" href=\"https://opencode.ai/discord\" target=\"_blank\" rel=\"noopener\"\u003e\n  \u003cspan class=\"recurso-icono\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M5 12h14\"/\u003e\u003cpath d=\"M13 6l6 6-6 6\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n  \u003cspan class=\"recurso-cuerpo\"\u003e\n    \u003cspan class=\"recurso-etq\"\u003eComunidad\u003c/span\u003e\n    \u003c
