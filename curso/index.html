<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Curso y seminario sobre qué es un harness de IA y cómo usar un agente, para usuarios de chat sin conocimientos de programación.">
<title>Del chat al agente — Curso interactivo</title>
<style>
:root{
  --fondo:#f6f7fb;
  --fondo-2:#eef0f7;
  --superficie:#ffffff;
  --superficie-2:#f1f3f9;
  --borde:#e3e6ef;
  --borde-fuerte:#c9d0e0;
  --texto:#1a2133;
  --texto-suave:#5a6478;
  --texto-tenue:#8b94a8;
  --primario:#2f4bd8;
  --primario-2:#1e3aa8;
  --primario-suave:#e9edff;
  --acento:#0f8a7e;
  --acento-suave:#e3f5f1;
  --aviso:#b45309;
  --aviso-suave:#fdf3e3;
  --peligro:#b3261e;
  --peligro-suave:#fdecea;
  --ok:#15803d;
  --ok-suave:#e8f6ed;
  --sombra:0 1px 2px rgba(20,26,45,.05), 0 12px 32px -18px rgba(20,26,45,.28);
  --sombra-fuerte:0 10px 40px -12px rgba(20,26,45,.35);
  --radio:16px;
  --radio-sm:10px;
  --lateral:316px;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,'Liberation Mono',monospace;
}
html[data-tema="oscuro"]{
  --fondo:#0d1017;
  --fondo-2:#12161f;
  --superficie:#161b26;
  --superficie-2:#1d2330;
  --borde:#252c3c;
  --borde-fuerte:#333c4e;
  --texto:#e7eaf2;
  --texto-suave:#a6aec2;
  --texto-tenue:#7b859c;
  --primario:#8fa4ff;
  --primario-2:#aabaff;
  --primario-suave:#1b2440;
  --acento:#4ecdc0;
  --acento-suave:#122f2a;
  --aviso:#f0b45e;
  --aviso-suave:#322611;
  --peligro:#f08a82;
  --peligro-suave:#381b18;
  --ok:#6ddc95;
  --ok-suave:#10291b;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 12px 34px -18px rgba(0,0,0,.75);
  --sombra-fuerte:0 12px 44px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:
    radial-gradient(1100px 500px at 85% -10%, var(--primario-suave), transparent 60%),
    radial-gradient(900px 460px at -10% 12%, var(--acento-suave), transparent 55%),
    var(--fondo);
  color:var(--texto);font-family:var(--sans);font-size:16.5px;line-height:1.7;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
::selection{background:var(--primario);color:#fff}

.app{display:flex;min-height:100vh}
.lateral{
  width:var(--lateral);flex:0 0 var(--lateral);background:color-mix(in srgb,var(--superficie) 92%,transparent);
  backdrop-filter:blur(8px);border-right:1px solid var(--borde);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
}
.marca{padding:24px 22px 18px;border-bottom:1px solid var(--borde)}
.marca .logo{
  width:40px;height:40px;border-radius:12px;margin-bottom:12px;
  background:linear-gradient(135deg,var(--primario),var(--acento));color:#fff;
  display:grid;place-items:center;box-shadow:var(--sombra);
}
.marca .logo svg{width:22px;height:22px}
.marca h1{margin:0;font-size:1.05rem;letter-spacing:-.01em;line-height:1.3}
.marca p{margin:5px 0 0;font-size:.76rem;color:var(--texto-tenue);text-transform:uppercase;letter-spacing:.09em}

.buscador{padding:14px 16px;border-bottom:1px solid var(--borde);position:relative}
.buscador input{
  width:100%;padding:10px 13px 10px 35px;border:1px solid var(--borde-fuerte);
  border-radius:11px;background:var(--superficie-2);color:var(--texto);
  font-size:.88rem;font-family:inherit;transition:box-shadow .15s,border-color .15s;
}
.buscador input:focus{outline:none;border-color:var(--primario);box-shadow:0 0 0 3px var(--primario-suave);background:var(--superficie)}
.buscador svg{position:absolute;left:27px;top:24px;width:15px;height:15px;stroke:var(--texto-tenue);fill:none;stroke-width:2}
.buscador kbd{
  position:absolute;right:26px;top:23px;font-size:.66rem;font-family:var(--mono);
  color:var(--texto-tenue);border:1px solid var(--borde-fuerte);border-radius:5px;padding:1px 6px;background:var(--superficie);
}

nav{overflow-y:auto;padding:10px 10px 26px;flex:1}
nav .grupo{margin-bottom:4px}
nav .grupo-titulo{
  font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--texto-tenue);
  padding:15px 12px 6px;font-weight:700;
}
nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 11px;border:0;border-radius:11px;background:transparent;
  color:var(--texto-suave);font:inherit;font-size:.885rem;cursor:pointer;line-height:1.35;
  transition:background .13s,color .13s;
}
nav button:hover{background:var(--superficie-2);color:var(--texto)}
nav button[aria-current="true"]{background:var(--primario-suave);color:var(--primario);font-weight:640}
nav button .num{
  flex:0 0 22px;height:22px;border-radius:7px;background:var(--superficie-2);
  display:grid;place-items:center;font-size:.68rem;font-family:var(--mono);color:var(--texto-tenue);
  transition:background .13s,color .13s;
}
nav button[aria-current="true"] .num{background:var(--primario);color:#fff}
nav button .marca-ok{margin-left:auto;color:var(--ok);font-size:.85rem;opacity:0;transition:opacity .15s}
nav button.hecho .marca-ok{opacity:1}
nav button.hecho{color:var(--texto-tenue)}
.lateral-pie{padding:13px 16px;border-top:1px solid var(--borde);font-size:.74rem;color:var(--texto-tenue)}

.principal{flex:1;min-width:0;display:flex;flex-direction:column}
.barra{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--fondo) 82%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--borde);
  padding:11px 30px;display:flex;align-items:center;gap:18px;
}
.barra .migas{font-size:.82rem;color:var(--texto-tenue);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra .migas b{color:var(--texto-suave);font-weight:600}
.barra-acciones{display:flex;align-items:center;gap:8px}
.medidor{display:flex;align-items:center;gap:9px;font-size:.76rem;color:var(--texto-suave);font-variant-numeric:tabular-nums}
.medidor .pista{width:100px;height:7px;border-radius:99px;background:var(--superficie-2);overflow:hidden}
.medidor .relleno{height:100%;width:0;background:linear-gradient(90deg,var(--primario),var(--acento));border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.icono{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--borde-fuerte);
  background:var(--superficie);color:var(--texto-suave);cursor:pointer;
  display:grid;place-items:center;font-size:1rem;transition:background .13s,color .13s,transform .1s;
}
.icono:hover{background:var(--superficie-2);color:var(--texto)}
.icono:active{transform:scale(.96)}
.lienzo{flex:1;padding:34px 30px 96px;display:flex;justify-content:center}
.hoja{width:100%;max-width:860px}

/* ---------- Tipografía del contenido ---------- */
.contenido{font-size:1.01rem}
.contenido h1{font-size:2.1rem;line-height:1.15;letter-spacing:-.024em;margin:0 0 8px;font-weight:800}
.contenido h1 + p{color:var(--texto-suave);font-size:1.06rem;margin-top:0}
.contenido h2{
  font-size:1.44rem;letter-spacing:-.016em;margin:2.7em 0 .5em;padding-top:.7em;
  border-top:1px solid var(--borde);font-weight:750;scroll-margin-top:84px;line-height:1.25;
}
.contenido h2:first-of-type{border-top:0;padding-top:0;margin-top:1.5em}
.contenido h3{font-size:1.14rem;margin:2em 0 .4em;font-weight:680;scroll-margin-top:84px;letter-spacing:-.01em}
.contenido h4{font-size:.99rem;margin:1.6em 0 .3em;font-weight:670;color:var(--texto-suave)}
.contenido p{margin:.9em 0}
.contenido a{color:var(--primario);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--primario) 35%,transparent)}
.contenido a:hover{border-bottom-color:var(--primario)}
.contenido strong{font-weight:690;color:var(--texto)}
.contenido hr{border:0;border-top:1px solid var(--borde);margin:2.4em 0}
.contenido ul,.contenido ol{margin:.8em 0;padding-left:1.4em}
.contenido li{margin:.4em 0}
.contenido li::marker{color:var(--primario)}
.contenido code{
  font-family:var(--mono);font-size:.855em;background:var(--superficie-2);
  border:1px solid var(--borde);border-radius:6px;padding:.12em .38em;color:var(--texto);
}
.contenido pre{
  background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);
  padding:16px 18px;overflow-x:auto;box-shadow:var(--sombra);margin:1.2em 0;
}
.contenido pre code{background:none;border:0;padding:0;font-size:.84rem;line-height:1.62}

.contenido blockquote{
  margin:1.4em 0;padding:15px 19px 15px 52px;border-radius:var(--radio);position:relative;
  background:var(--primario-suave);border:1px solid color-mix(in srgb,var(--primario) 22%,transparent);
}
.contenido blockquote::before{
  content:'\201C';position:absolute;left:15px;top:6px;font-size:2.4rem;line-height:1;
  color:var(--primario);font-family:Georgia,serif;opacity:.6;
}
.contenido blockquote p{margin:.3em 0}
.contenido blockquote p:first-child{margin-top:0}
.contenido blockquote p:last-child{margin-bottom:0}

.contenido table{
  width:100%;border-collapse:separate;border-spacing:0;margin:1.4em 0;font-size:.9rem;
  border:1px solid var(--borde);border-radius:var(--radio);overflow:hidden;display:block;overflow-x:auto;
  box-shadow:var(--sombra);
}
.contenido thead th{
  text-align:left;background:var(--superficie-2);font-weight:690;font-size:.77rem;
  text-transform:uppercase;letter-spacing:.05em;color:var(--texto-suave);
  padding:11px 14px;border-bottom:1px solid var(--borde-fuerte);white-space:nowrap;
}
.contenido tbody td{padding:11px 14px;border-bottom:1px solid var(--borde);vertical-align:top}
.contenido tbody tr:nth-child(even){background:var(--superficie-2)}
.contenido tbody tr:last-child td{border-bottom:0}
.contenido table input[type=checkbox]{accent-color:var(--ok)}

/* ---------- Portada ---------- */
.portada .hero{
  display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:center;
  background:linear-gradient(130deg,#0f1733 0%,#1c2f6b 52%,#0d5a52 100%);
  border-radius:24px;padding:38px 38px 34px;color:#fff;overflow:hidden;
  box-shadow:var(--sombra-fuerte);position:relative;
}
.portada .hero::after{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle at 15% 20%, rgba(255,255,255,.10) 0, transparent 40%),
    radial-gradient(circle at 90% 90%, rgba(127,227,214,.14) 0, transparent 42%);
}
.portada .hero>*{position:relative;z-index:1}
.hero-etq{
  display:inline-flex;align-items:center;gap:7px;font-size:.72rem;letter-spacing:.11em;
  text-transform:uppercase;font-weight:700;color:#a9e7dd;background:rgba(127,227,214,.14);
  border:1px solid rgba(127,227,214,.3);padding:5px 12px;border-radius:99px;
}
.portada .hero h1{font-size:2.75rem;margin:16px 0 10px;letter-spacing:-.032em;line-height:1.05;font-weight:800;color:#fff}
.hero-sub{font-size:1.13rem;line-height:1.55;color:#c6d0ec;max-width:44ch;margin:0}
.hero-cta{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.boton-cta{
  display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:12px;
  background:#fff;color:#14204a;font-weight:680;font-size:.95rem;text-decoration:none;
  border:1px solid transparent;transition:transform .13s,box-shadow .13s;
}
.boton-cta:hover{transform:translateY(-2px);box-shadow:0 10px 26px -10px rgba(0,0,0,.45)}
.boton-cta svg{width:16px;height:16px}
.boton-cta.secundario{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.boton-cta.secundario:hover{background:rgba(255,255,255,.2)}
.hero-figura .figura{margin:0;background:#0f1733;border-color:rgba(255,255,255,.14)}
.hero-figura .figura figcaption{color:#8fa0c8}

.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:26px 0 8px}
.tarjeta{
  background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);
  padding:18px 20px;box-shadow:var(--sombra);
}
.tarjeta .cifra{font-size:1.85rem;font-weight:800;letter-spacing:-.02em;color:var(--primario);line-height:1.05}
.tarjeta .titulo{font-size:.92rem;font-weight:680;margin-top:6px}
.tarjeta .detalle{font-size:.82rem;color:var(--texto-tenue);margin-top:3px;line-height:1.5}

.seccion-titulo{font-size:1.28rem;letter-spacing:-.014em;margin:36px 0 16px;font-weight:750}
.modulos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:0 0 10px}
.modulo{
  display:flex;flex-direction:column;gap:8px;padding:20px 20px;border:1px solid var(--borde);
  border-radius:var(--radio);background:var(--superficie);text-decoration:none;color:inherit;
  box-shadow:var(--sombra);transition:transform .15s,border-color .15s,box-shadow .15s;
}
.modulo:hover{transform:translateY(-4px);border-color:var(--primario);box-shadow:var(--sombra-fuerte)}
.modulo-icono{
  width:42px;height:42px;border-radius:12px;background:var(--primario-suave);color:var(--primario);
  display:grid;place-items:center;margin-bottom:6px;
}
.modulo-icono svg{width:21px;height:21px}
.modulo h3{margin:0;font-size:1.02rem;letter-spacing:-.01em}
.modulo p{margin:0;font-size:.86rem;color:var(--texto-suave);line-height:1.5}
.modulo .num-lecciones{font-size:.74rem;color:var(--texto-tenue);margin-top:auto;padding-top:8px;font-variant-numeric:tabular-nums}

.pista{color:var(--texto-tenue);font-size:.9rem;margin:14px 0 0}
.pista kbd{font-family:var(--mono);font-size:.8em;background:var(--superficie-2);border:1px solid var(--borde);border-radius:5px;padding:1px 6px}

/* ---------- Metadatos y figuras de lección ---------- */
.leccion-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;
  padding:4px 11px;border-radius:99px;background:var(--superficie-2);
  color:var(--texto-suave);border:1px solid var(--borde);
}
.chip svg{width:12px;height:12px}
.chip.modulo{background:var(--primario-suave);color:var(--primario);border-color:transparent}

.figura{
  background:#f7f9ff;border:1px solid var(--borde);border-radius:18px;padding:12px;margin:1.6em 0;
  box-shadow:var(--sombra);
}
html[data-tema="oscuro"] .figura{background:#131722}
.figura svg{width:100%;height:auto;display:block;border-radius:10px;aspect-ratio:var(--ar,16/9)}
.figura figcaption{font-size:.82rem;color:var(--texto-tenue);padding:10px 8px 2px;text-align:center;line-height:1.5}

/* ---------- Recursos ---------- */
.recursos{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:13px;margin:1.6em 0}
.recurso{
  display:flex;align-items:flex-start;gap:13px;padding:17px 18px;border:1px solid var(--borde);
  border-radius:var(--radio);background:var(--superficie);text-decoration:none;color:inherit;
  box-shadow:var(--sombra);transition:transform .15s,border-color .15s,box-shadow .15s;
}
.recurso:hover{transform:translateY(-3px);border-color:var(--primario);box-shadow:var(--sombra-fuerte)}
.recurso-icono{
  flex:0 0 38px;height:38px;border-radius:11px;background:var(--acento-suave);color:var(--acento);
  display:grid;place-items:center;
}
.recurso-icono svg{width:18px;height:18px}
.recurso-cuerpo{display:flex;flex-direction:column;gap:3px;min-width:0}
.recurso-etq{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--texto-tenue);font-weight:700}
.recurso-titulo{font-size:.95rem;font-weight:680;color:var(--texto)}
.recurso-detalle{font-size:.82rem;color:var(--texto-suave);line-height:1.5}
.recurso-abrir{margin-left:auto;color:var(--texto-tenue);font-size:1.05rem}

/* ---------- Piezas interactivas ---------- */
.marcar{
  display:flex;align-items:center;gap:11px;margin:2.8em 0 0;padding:16px 19px;
  background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);box-shadow:var(--sombra);
}
.marcar label{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.92rem;color:var(--texto-suave);flex:1}
.marcar input{width:19px;height:19px;accent-color:var(--ok);cursor:pointer;flex:0 0 auto}
.marcar.hecho{background:var(--ok-suave);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.marcar.hecho label{color:var(--ok);font-weight:640}
.navegacion{display:flex;gap:12px;margin:32px 0 0;padding-top:22px;border-top:1px solid var(--borde)}
.navegacion button{
  flex:1;padding:14px 17px;border:1px solid var(--borde);background:var(--superficie);
  border-radius:var(--radio);cursor:pointer;font:inherit;font-size:.87rem;color:var(--texto-suave);
  text-align:left;transition:border-color .13s,box-shadow .13s,transform .13s;
}
.navegacion button:hover:not(:disabled){border-color:var(--primario);box-shadow:var(--sombra);transform:translateY(-2px)}
.navegacion button:disabled{opacity:.4;cursor:default}
.navegacion button b{display:block;color:var(--texto);font-size:.94rem;margin-top:2px;font-weight:660}
.navegacion button.siguiente{text-align:right}
.navegacion .etq{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--texto-tenue);font-weight:700}

/* ---------- Cuestionario ---------- */
.cuestionario{max-width:780px}
.cuestionario .cabecera{margin-bottom:26px}
.cuestionario .cabecera h1{font-size:2rem}
.opcion{
  display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
  padding:14px 17px;margin:9px 0;border:1px solid var(--borde);border-radius:var(--radio);
  background:var(--superficie);cursor:pointer;font:inherit;font-size:.94rem;color:var(--texto);
  transition:border-color .13s,background .13s,transform .1s,box-shadow .13s;
}
.opcion:hover:not(:disabled){border-color:var(--primario);transform:translateX(3px);box-shadow:var(--sombra)}
.opcion:disabled{cursor:default}
.opcion .letra{
  flex:0 0 28px;height:28px;border-radius:8px;background:var(--superficie-2);
  display:grid;place-items:center;font-size:.8rem;font-weight:720;font-family:var(--mono);color:var(--texto-suave);
}
.opcion.elegida{border-color:var(--primario);background:var(--primario-suave)}
.opcion.elegida .letra{background:var(--primario);color:#fff}
.opcion.acierto{border-color:var(--ok);background:var(--ok-suave)}
.opcion.acierto .letra{background:var(--ok);color:#fff}
.opcion.fallo{border-color:var(--peligro);background:var(--peligro-suave)}
.opcion.fallo .letra{background:var(--peligro);color:#fff}
.explica{
  margin:6px 0 22px;padding:14px 17px;border-radius:var(--radio);font-size:.88rem;
  background:var(--superficie-2);border-left:3px solid var(--texto-tenue);color:var(--texto-suave);line-height:1.55;
}
.explica.bien{border-left-color:var(--ok);background:var(--ok-suave);color:var(--texto)}
.explica.mal{border-left-color:var(--peligro);background:var(--peligro-suave);color:var(--texto)}
.pregunta{margin:0 0 30px}
.pregunta .enunciado{font-size:1.03rem;font-weight:650;margin:0 0 13px;display:flex;gap:12px}
.pregunta .enunciado .num{
  flex:0 0 30px;color:var(--primario);font-family:var(--mono);font-size:.86rem;font-weight:700;padding-top:2px;
}
.resultado{
  padding:24px 26px;border-radius:var(--radio);background:linear-gradient(135deg,var(--primario-suave),var(--superficie));
  border:1px solid var(--borde);box-shadow:var(--sombra);margin:28px 0;
}
.resultado .nota{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--primario)}
.resultado .titulo{font-size:1.08rem;font-weight:700;margin-top:8px}
.resultado .texto{font-size:.9rem;color:var(--texto-suave);margin-top:5px;line-height:1.55}
.boton{
  padding:12px 21px;border-radius:11px;border:1px solid var(--primario);
  background:var(--primario);color:#fff;font:inherit;font-size:.9rem;font-weight:650;
  cursor:pointer;transition:filter .13s,transform .13s;box-shadow:var(--sombra);
}
.boton:hover{filter:brightness(1.08);transform:translateY(-1px)}

/* ---------- Móvil ---------- */
.abrir-menu{display:none}
@media (max-width:920px){
  :root{--lateral:288px}
  .lateral{position:fixed;z-index:60;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--sombra-fuerte)}

  .abrir-menu{display:grid}

  .velo{position:fixed;inset:0;background:rgba(8,11,20,.5);z-index:55;display:none;backdrop-filter:blur(2px)}
  .velo.visible{display:block}
}

  .contenido tbody tr:nth-child(even){background:none}
}

3ch3\u003eTrabajar sin sustos\u003c/h3\u003e\n      \u003cp\u003ePedir bien, verificar y conocer los límites.\u003c/p\u003e\n      \u003cspan class=\"num-lecciones\"\u003e · 5 lecciones\u003c/span\u003e\n    \u003c/a\u003e\n\u003ca class=\"modulo\" href=\"#quiz-final\"\u003e\n      \u003cspan class=\"modulo-icono\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M8.5 12.3l2.4 2.4 4.8-5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n      \u003ch3\u003eEvaluación final\u003c/h3\u003e\n      \u003cp\u003eComprueba qué se ha quedado, con corrección al momento.\u003c/p\u003e\n      \u003cspan class=\"num-lecciones\"\u003e · 1 lección\u003c/span\u003e\n    \u003c/a\u003e\n\u003ca class=\"modulo\" href=\"#recursos\"\u003e\n      \u003cspan class=\"modulo-icono\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M3 12h18\"/\u003e\u003cpath d=\"M12 3a13.5 13.5 0 0 1 0 18 13.5 13.5 0 0 1 0-18z\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n      \u003ch3\u003eRecursos oficiales\u003c/h3\u003e\n      \u003cp\u003eDocumentación, seguridad y comunidad del proyecto.\u003c/p\u003e\n      \u003cspan class=\"num-lecciones\"\u003e · 1 lección\u003c/span\u003e\n    \u003c/a\u003e\u003c/div\u003e\n\n  \u003cp class=\"pista\"\u003eMuévete con el menú de la izquierda. Tu progreso se guarda \u003cb\u003een este navegador\u003c/b\u003e y nada sale de tu ordenador.\n  Pulsa \u003ckbd\u003e/\u003c/kbd\u003e para buscar y \u003ckbd\u003e←\u003c/kbd\u003e \u003ckbd\u003e→\u003c/kbd\u003e para pasar de sección. Cuando termines una sección, márcala como leída y el medidor de arriba avanzará.\u003c/p\u003e\n\u003c/div\u003e","texto":"Curso interactivo · 150 minutos Del chat al agente Qué es un harness , cómo se usa un agente de IA y, sobre todo, qué permisos le das y por qué . Pensado para quien ya usa un chat de IA y nunca ha programado. Empezar el curso Ver recursos Modelo el motor HARNESS el coche completo Archivos Terminal Web Chat Permisos El modelo piensa; el harness ejecuta, conecta herramientas y pone los frenos. 3 Módulos De los conceptos a un encargo real, más una preparación previa. 5 + 1 Prácticas guiadas Con un agente de verdad, en tu portátil; la sexta es avanzada y opcional. 18 Preguntas con clave Diagnóstico y evaluación comentados. Offline Sin conexión Un solo archivo; puedes publicarlo donde quieras. Empieza por aquí Antes de empezar Instala lo necesario, gratis, y elige tu carril. · 2 lecciones Del chat al agente Qué cambia respecto a un chat y las piezas del harness. · 8 lecciones Manos a la obra Cinco prácticas con un agente de verdad, y una sexta de datos y modelos. · 8 lecciones Trabajar sin sustos Pedir bien, verificar y conocer los límites. · 5 lecciones Evaluación final Comprueba qué se ha quedado, con corrección al momento. · 1 lección Recursos oficiales Documentación, seguridad y comunidad del proyecto. · 1 lección Muévete con el menú de la izquierda. Tu progreso se guarda en este navegador y nada sale de tu ordenador. Pulsa / para buscar y ← → para pasar de sección. Cuando termines una sección, márcala como leída y el medidor de arriba avanzará."},{"id":"quiz-diagnostico","grupo":"inicio","titulo":"Diagnóstico inicial","tipo":"quiz","quiz":"diagnostico","html":"","texto":"Diagnóstico inicial"},{"id":"preparacion","grupo":"preparacion","titulo":"Prepara tu ordenador","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M6 3h8l4 4v14H6z\"/\u003e\u003cpath d=\"M14 3v5h5\"/\u003e\u003cpath d=\"M9 13h6M9 17h6\"/\u003e\u003c/svg\u003e Antes de empezar\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 4 min de lectura\u003c/span\u003e\u003c/div\u003e\u003ch1 id=\"antes-de-empezar-prepara-tu-ordenador\"\u003eAntes de empezar: prepara tu ordenador\u003c/h1\u003e\n\u003cp\u003eUnos 15 minutos. Hazlo antes del Módulo 2: las prácticas usan un agente de verdad en tu ordenador, \u003cstrong\u003eopencode\u003c/strong\u003e, y sin esta preparación no podrás arrancarlo. Los módulos 1 y 3 y la evaluación se pueden seguir sin instalar nada.\u003c/p\u003e\n\u003ch2 id=\"que-vas-a-necesitar\"\u003eQué vas a necesitar\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eQUÉ\u003c/th\u003e\n\u003cth\u003ePARA QUÉ\u003c/th\u003e\n\u003cth\u003eCUESTA\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eUn ordenador con Windows o macOS en el que puedas instalar programas\u003c/td\u003e\n\u003ctd\u003eEjecutar el agente\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eNode.js\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEs el programa con el que se instala opencode\u003c/td\u003e\n\u003ctd\u003eGratis\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eopencode\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEl harness del curso: un agente de código abierto con interfaz web en español\u003c/td\u003e\n\u003ctd\u003eGratis\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLos \u003cstrong\u003emodelos gratuitos\u003c/strong\u003e de opencode\u003c/td\u003e\n\u003ctd\u003eEs lo que permite al agente «pensar». Vienen incluidos: \u003cstrong\u003eno necesitas cuenta ni clave de API\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eGratis\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLa \u003cstrong\u003ecarpeta de práctica\u003c/strong\u003e del curso\u003c/td\u003e\n\u003ctd\u003eTrabajar con archivos ficticios, nunca con los tuyos\u003c/td\u003e\n\u003ctd\u003eGratis\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eGratis no quiere decir privado.\u003c/strong\u003e Lo que el agente lee de tu carpeta se envía al proveedor del modelo para que lo procese, y algunos modelos gratuitos usan esos datos para mejorar. En la Práctica 1 verás cuál elegir. Usa solo la carpeta de práctica, nunca datos reales, de clientes ni confidenciales.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"paso-1-abre-la-terminal\"\u003ePaso 1. Abre la terminal\u003c/h2\u003e\n\u003cp\u003eLa \u003cstrong\u003eterminal\u003c/strong\u003e es una ventana donde escribes órdenes en texto en lugar de hacer clic en botones. No hace falta saber nada más que lo que pone aquí.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eWindows:\u003c/strong\u003e pulsa la tecla Windows, escribe \u003ccode\u003ePowerShell\u003c/code\u003e (o \u003ccode\u003eTerminal\u003c/code\u003e) y ábrelo. Verás un texto que acaba en \u003ccode\u003e&gt;\u003c/code\u003e: significa «escríbeme».\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003emacOS:\u003c/strong\u003e pulsa \u003cstrong\u003eCmd + Espacio\u003c/strong\u003e, escribe \u003ccode\u003eTerminal\u003c/code\u003e y pulsa Intro. El texto acaba en \u003ccode\u003e$\u003c/code\u003e o \u003ccode\u003e%\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"paso-2-instala-nodejs\"\u003ePaso 2. Instala Node.js\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eEscribe \u003ccode\u003enode -v\u003c/code\u003e en la terminal y pulsa Intro.\u003c/li\u003e\n\u003cli\u003eSi aparece un número (por ejemplo \u003ccode\u003ev24.11.0\u003c/code\u003e; sirve la versión 22 o superior), ya lo tienes: pasa al paso 3.\u003c/li\u003e\n\u003cli\u003eSi dice que \u003ccode\u003enode\u003c/code\u003e no se reconoce, entra en la web oficial, \u003ca href=\"https://nodejs.org/\"\u003enodejs.org\u003c/a\u003e, y descarga la versión marcada como \u003cstrong\u003eLTS\u003c/strong\u003e (la estable, no la «Current»).\u003c/li\u003e\n\u003cli\u003eInstálala con las opciones por defecto.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCierra la terminal y ábrela otra vez\u003c/strong\u003e (si no, no se entera de la instalación) y repite \u003ccode\u003enode -v\u003c/code\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"paso-3-instala-opencode\"\u003ePaso 3. Instala opencode\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003eEn la terminal, escribe y pulsa Intro:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003enpm install -g opencode-ai\n\u003c/code\u003e\u003c/pre\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eEspera a que termine (unos segundos o un par de minutos). Verás un mensaje como \u003ccode\u003eadded 3 packages\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCierra la terminal y ábrela otra vez.\u003c/strong\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eComprueba que está instalado:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eopencode --version\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDebe aparecer un número de versión, por ejemplo \u003ccode\u003e1.19.5\u003c/code\u003e.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003ccode\u003enpm\u003c/code\u003e viene con Node.js. La orden instala opencode \u003cstrong\u003een tu usuario\u003c/strong\u003e, de forma permanente; para quitarlo más adelante, \u003ccode\u003enpm uninstall -g opencode-ai\u003c/code\u003e.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"paso-4-descarga-la-carpeta-de-practica\"\u003ePaso 4. Descarga la carpeta de práctica\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eVe a la página \u003ca href=\"../practica_ejemplo/LEEME.html\"\u003eEntorno de práctica\u003c/a\u003e y descarga \u003ccode\u003edescarga_entorno.zip\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eDescomprímelo en \u003cstrong\u003eDocumentos\u003c/strong\u003e y llama a la carpeta \u003ccode\u003epractica_agente\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eGuarda el ZIP aparte: es tu copia limpia para empezar de nuevo si algo sale mal.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"paso-5-prueba-que-arranca-y-apagalo\"\u003ePaso 5. Prueba que arranca (y apágalo)\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003eEntra en la carpeta de práctica y arranca opencode:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ecd Documents\\practica_agente\nopencode web\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e(En macOS: \u003ccode\u003ecd ~/Documents/practica_agente\u003c/code\u003e y después \u003ccode\u003eopencode web\u003c/code\u003e.)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eSe abrirá sola una página en tu navegador con la interfaz de opencode. Si no, copia la dirección que aparece en la terminal (algo como \u003ccode\u003ehttp://127.0.0.1:4096\u003c/code\u003e) y pégala en el navegador.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eSi ves la interfaz, está todo listo. \u003cstrong\u003eNo hace falta configurar nada más\u003c/strong\u003e: la carpeta se abre en la Práctica 1.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cp\u003ePara apagarlo, haz clic en la terminal y pulsa \u003cstrong\u003eCtrl + C\u003c/strong\u003e (o cierra la ventana). Cerrar solo la pestaña del navegador no lo apaga.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"si-algo-no-funciona\"\u003eSi algo no funciona\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eUn error casi nunca significa que hayas roto algo\u003c/strong\u003e: suele faltar un paso. Cerrar la terminal y volver a abrirla arregla la mayoría.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e«npm», «node» u «opencode» no se reconoce:\u003c/strong\u003e falta instalar algo o la terminal se abrió antes de instalarlo. Vuelve al paso 2 o al 3.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEn Windows sale un error rojo sobre «ejecución de scripts deshabilitada»:\u003c/strong\u003e usa la terminal \u003cstrong\u003eSímbolo del sistema\u003c/strong\u003e (\u003ccode\u003ecmd\u003c/code\u003e) en lugar de PowerShell para estas órdenes.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLa página no carga:\u003c/strong\u003e comprueba que la terminal sigue abierta y copia exactamente la dirección que aparece en ella.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo tienes permisos para instalar\u003c/strong\u003e (ordenador del trabajo): pide ayuda a tu departamento de informática o usa un ordenador personal.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTe has atascado más de diez minutos:\u003c/strong\u003e no te quedes ahí. Copia el texto del error y búscalo en la \u003ca href=\"https://opencode.ai/docs/\"\u003edocumentación oficial de opencode\u003c/a\u003e o pregunta en su comunidad (en \u003cem\u003eRecursos oficiales\u003c/em\u003e, al final del menú).\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"antes-de-seguir-comprueba\"\u003eAntes de seguir, comprueba\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e \u003ccode\u003enode -v\u003c/code\u003e muestra un número de versión.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e \u003ccode\u003eopencode --version\u003c/code\u003e muestra un número de versión.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e Tienes la carpeta \u003ccode\u003epractica_agente\u003c/code\u003e en Documentos y el ZIP guardado aparte.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"\u003e \u003ccode\u003eopencode web\u003c/code\u003e abre la interfaz en el navegador.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eCon los cuatro marcados, puedes seguir con el Módulo 1.\u003c/p\u003e\n","texto":"Antes de empezar 4 min de lectura Antes de empezar: prepara tu ordenador Unos 15 minutos. Hazlo antes del Módulo 2: las prácticas usan un agente de verdad en tu ordenador, opencode , y sin esta preparación no podrás arrancarlo. Los módulos 1 y 3 y la evaluación se pueden seguir sin instalar nada. Qué vas a necesitar QUÉ PARA QUÉ CUESTA Un ordenador con Windows o macOS en el que puedas instalar programas Ejecutar el agente — Node.js Es el programa con el que se instala opencode Gratis opencode El harness del curso: un agente de código abierto con interfaz web en español Gratis Los modelos gratuitos de opencode Es lo que permite al agente «pensar». Vienen incluidos: no necesitas cuenta ni clave de API Gratis La carpeta de práctica del curso Trabajar con archivos ficticios, nunca con los tuyos Gratis Gratis no quiere decir privado. Lo que el agente lee de tu carpeta se envía al proveedor del modelo para que lo procese, y algunos modelos gratuitos usan esos datos para mejorar. En la Práctica 1 verás cuál elegir. Usa solo la carpeta de práctica, nunca datos reales, de clientes ni confidenciales. Paso 1. Abre la terminal La terminal es una ventana donde escribes órdenes en texto en lugar de hacer clic en botones. No hace falta saber nada más que lo que pone aquí. Windows: pulsa la tecla Windows, escribe PowerShell (o Terminal ) y ábrelo. Verás un texto que acaba en : significa «escríbeme». macOS: pulsa Cmd + Espacio , escribe Terminal y pulsa Intro. El texto acaba en $ o % . Paso 2. Instala Node.js Escribe node -v en la terminal y pulsa Intro. Si aparece un número (por ejemplo v24.11.0 ; sirve la versión 22 o superior), ya lo tienes: pasa al paso 3. Si dice que node no se reconoce, entra en la web oficial, nodejs.org , y descarga la versión marcada como LTS (la estable, no la «Current»). Instálala con las opciones por defecto. Cierra la terminal y ábrela otra vez (si no, no se entera de la instalación) y repite node -v . Paso 3. Instala opencode En la terminal, escribe y pulsa Intro: npm install -g opencode-ai Espera a que termine (unos segundos o un par de minutos). Verás un mensaje como added 3 packages . Cierra la terminal y ábrela otra vez. Comprueba que está instalado: opencode --version Debe aparecer un número de versión, por ejemplo 1.19.5 . npm viene con Node.js. La orden instala opencode en tu usuario , de forma permanente; para quitarlo más adelante, npm uninstall -g opencode-ai . Paso 4. Descarga la carpeta de práctica Ve a la página Entorno de práctica y descarga descarga_entorno.zip . Descomprímelo en Documentos y llama a la carpeta practica_agente . Guarda el ZIP aparte: es tu copia limpia para empezar de nuevo si algo sale mal. Paso 5. Prueba que arranca (y apágalo) Entra en la carpeta de práctica y arranca opencode: cd Documents\\practica_agente opencode web (En macOS: cd ~/Documents/practica_agente y después opencode web .) Se abrirá sola una página en tu navegador con la interfaz de opencode. Si no, copia la dirección que aparece en la terminal (algo como http://127.0.0.1:4096 ) y pégala en el navegador. Si ves la interfaz, está todo listo. No hace falta configurar nada más : la carpeta se abre en la Práctica 1. Para apagarlo, haz clic en la terminal y pulsa Ctrl + C (o cierra la ventana). Cerrar solo la pestaña del navegador no lo apaga. Si algo no funciona Un error casi nunca significa que hayas roto algo : suele faltar un paso. Cerrar la terminal y volver a abrirla arregla la mayoría. «npm», «node» u «opencode» no se reconoce: falta instalar algo o la terminal se abrió antes de instalarlo. Vuelve al paso 2 o al 3. En Windows sale un error rojo sobre «ejecución de scripts deshabilitada»: usa la terminal Símbolo del sistema ( cmd ) en lugar de PowerShell para estas órdenes. La página no carga: comprueba que la terminal sigue abierta y copia exactamente la dirección que aparece en ella. No tienes permisos para instalar (ordenador del trabajo): pide ayuda a tu departamento de informática o usa un ordenador personal. Te has atascado más de diez minutos: no te quedes ahí. Copia el texto del error y búscalo en la documentación oficial de opencode o pregunta en su comunidad (en Recursos oficiales , al final del menú). Antes de seguir, comprueba node -v muestra un número de versión. opencode --version muestra un número de versión. Tienes la carpeta practica_agente en Documentos y el ZIP guardado aparte. opencode web abre la interfaz en el navegador. Con los cuatro marcados, puedes seguir con el Módulo 1."},{"id":"carriles","grupo":"preparacion","titulo":"Elige tu carril","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M6 3h8l4 4v14H6z\"/\u003e\u003cpath d=\"M14 3v5h5\"/\u003e\u003cpath d=\"M9 13h6M9 17h6\"/\u003e\u003c/svg\u003e Antes de empezar\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 3 min de lectura\u003c/span\u003e\u003c/div\u003e\u003ch1 id=\"elige-tu-carril\"\u003eElige tu carril\u003c/h1\u003e\n\u003cp\u003eEste curso se puede hacer \u003cstrong\u003eentero sin pagar nada\u003c/strong\u003e: con opencode y sus modelos gratuitos. Si ya pagas una suscripción a Claude o a ChatGPT, también puedes hacerlo con su agente. Lo que aprendes es lo mismo en los dos casos: la carpeta, los permisos, las notas, los procedimientos guardados y la verificación existen en todos los agentes.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eNo necesitas una suscripción para este curso. Si ya tienes una, aprovéchala.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"la-escalera-sube-un-peldano\"\u003eLa escalera: sube un peldaño\u003c/h2\u003e\n\u003cp\u003eNo hace falta llegar arriba del todo. El objetivo es que salgas del curso \u003cstrong\u003eun peldaño por encima\u003c/strong\u003e de donde estás hoy.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePeldaño\u003c/th\u003e\n\u003cth\u003eQué cambia\u003c/th\u003e\n\u003cth\u003eSin pagar\u003c/th\u003e\n\u003cth\u003eCon suscripción\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e1. Chat con instrucciones fijas\u003c/td\u003e\n\u003ctd\u003eDejas de repetir tus reglas en cada conversación\u003c/td\u003e\n\u003ctd\u003eProyectos o instrucciones personalizadas del chat gratuito\u003c/td\u003e\n\u003ctd\u003eProyectos de Claude, GPT personalizados\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2. El chat ejecuta código\u003c/td\u003e\n\u003ctd\u003eLa IA calcula con un programa en vez de «leer» tu tabla\u003c/td\u003e\n\u003ctd\u003eLimitado en las versiones gratuitas\u003c/td\u003e\n\u003ctd\u003eAnálisis de archivos en Claude o ChatGPT\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e3. Un agente en tu carpeta\u003c/td\u003e\n\u003ctd\u003eTrabaja sobre tus archivos y tú apruebas\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eopencode con modelos gratuitos\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eClaude Code (Claude Pro o Max), Codex (ChatGPT Plus o Pro)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e4. Un agente con método\u003c/td\u003e\n\u003ctd\u003eNotas, procedimientos, política de permisos y verificación\u003c/td\u003e\n\u003ctd\u003eopencode\u003c/td\u003e\n\u003ctd\u003eLos mismos\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003eSi en tu ordenador del trabajo no puedes instalar nada, haz las prácticas en casa o quédate en los peldaños 1 y 2: con unas buenas instrucciones fijas ya habrás avanzado.\u003c/p\u003e\n\u003ch2 id=\"carril-a-sin-suscripcion-opencode-el-del-curso\"\u003eCarril A — Sin suscripción: opencode (el del curso)\u003c/h2\u003e\n\u003cp\u003eEs el carril por defecto y el que siguen todas las instrucciones. Lo dejaste instalado en «Prepara tu ordenador». No necesitas cuenta ni clave.\u003c/p\u003e\n\u003ch2 id=\"carril-b-ya-tengo-suscripcion\"\u003eCarril B — Ya tengo suscripción\u003c/h2\u003e\n\u003cp\u003ePuedes usar el agente que incluye tu plan. Las prácticas son las mismas; en las prácticas 1 a 4 verás recuadros \u003cstrong\u003e«Si usas Claude Code o Codex»\u003c/strong\u003e con lo poco que cambia.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003cth\u003eClaude Code\u003c/th\u003e\n\u003cth\u003eCodex\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003ePlan que lo incluye\u003c/td\u003e\n\u003ctd\u003eClaude Pro o Max\u003c/td\u003e\n\u003ctd\u003eChatGPT Plus o Pro (y planes de empresa o educación)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInstalación\u003c/td\u003e\n\u003ctd\u003eInstalador de claude.com/claude-code, o la pestaña \u003cstrong\u003eCode\u003c/strong\u003e de la aplicación de escritorio de Claude (sin terminal)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003enpm install -g @openai/codex\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eArranque\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eclaude\u003c/code\u003e dentro de tu carpeta, e inicias sesión con tu cuenta\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ecodex\u003c/code\u003e dentro de tu carpeta, e inicias sesión con tu cuenta de ChatGPT\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNotas permanentes\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCLAUDE.md\u003c/code\u003e (puede apuntar a tu \u003ccode\u003eAGENTS.md\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eAGENTS.md\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eProcedimientos (skills)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003e.claude/skills/&lt;nombre&gt;/SKILL.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003e.agents/skills/&lt;nombre&gt;/SKILL.md\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePolítica de permisos\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003e.claude/settings.json\u003c/code\u003e, o modos con Mayús + Tab\u003c/td\u003e\n\u003ctd\u003eOrden \u003ccode\u003e/permissions\u003c/code\u003e dentro de Codex\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cem\u003e(Datos a 30 de octubre de 2026. Estos programas cambian casi cada semana: si algo no coincide, mira su documentación.)\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e¿Y DeepSeek?\u003c/strong\u003e Su chat es gratuito, pero su suscripción no incluye un agente. Si tienes saldo en su API, puedes conectarla en opencode; para el curso no hace falta.\u003c/p\u003e\n\u003ch2 id=\"lo-que-te-llevas-sea-cual-sea-tu-carril\"\u003eLo que te llevas, sea cual sea tu carril\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003eAGENTS.md\u003c/code\u003e y \u003ccode\u003eSKILL.md\u003c/code\u003e son formatos abiertos.\u003c/strong\u003e Las notas y los procedimientos que escribas en opencode te sirven después en Claude Code o en Codex, casi sin cambios.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLas preguntas son las mismas en todas partes:\u003c/strong\u003e ¿dónde trabaja?, ¿qué puede hacer sin preguntarme?, ¿qué datos salen de mi ordenador?, ¿cómo compruebo el resultado?\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNingún carril te ahorra verificar.\u003c/strong\u003e Un modelo de pago se equivoca menos a menudo, pero también se equivoca.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"mide-lo-que-ganas\"\u003eMide lo que ganas\u003c/h2\u003e\n\u003cp\u003eEn la hoja de registro del cuaderno de laboratorio hay dos columnas nuevas: \u003cstrong\u003eminutos con chat\u003c/strong\u003e y \u003cstrong\u003eminutos con agente\u003c/strong\u003e. Apunta cuánto tardarías en hacer cada tarea copiando y pegando en un chat, y cuánto has tardado con el agente. Esa diferencia, con una tarea tuya de verdad, es el mejor motivo para seguir.\u003c/p\u003e\n","texto":"Antes de empezar 3 min de lectura Elige tu carril Este curso se puede hacer entero sin pagar nada : con opencode y sus modelos gratuitos. Si ya pagas una suscripción a Claude o a ChatGPT, también puedes hacerlo con su agente. Lo que aprendes es lo mismo en los dos casos: la carpeta, los permisos, las notas, los procedimientos guardados y la verificación existen en todos los agentes. No necesitas una suscripción para este curso. Si ya tienes una, aprovéchala. La escalera: sube un peldaño No hace falta llegar arriba del todo. El objetivo es que salgas del curso un peldaño por encima de donde estás hoy. Peldaño Qué cambia Sin pagar Con suscripción 1. Chat con instrucciones fijas Dejas de repetir tus reglas en cada conversación Proyectos o instrucciones personalizadas del chat gratuito Proyectos de Claude, GPT personalizados 2. El chat ejecuta código La IA calcula con un programa en vez de «leer» tu tabla Limitado en las versiones gratuitas Análisis de archivos en Claude o ChatGPT 3. Un agente en tu carpeta Trabaja sobre tus archivos y tú apruebas opencode con modelos gratuitos Claude Code (Claude Pro o Max), Codex (ChatGPT Plus o Pro) 4. Un agente con método Notas, procedimientos, política de permisos y verificación opencode Los mismos Si en tu ordenador del trabajo no puedes instalar nada, haz las prácticas en casa o quédate en los peldaños 1 y 2: con unas buenas instrucciones fijas ya habrás avanzado. Carril A — Sin suscripción: opencode (el del curso) Es el carril por defecto y el que siguen todas las instrucciones. Lo dejaste instalado en «Prepara tu ordenador». No necesitas cuenta ni clave. Carril B — Ya tengo suscripción Puedes usar el agente que incluye tu plan. Las prácticas son las mismas; en las prácticas 1 a 4 verás recuadros «Si usas Claude Code o Codex» con lo poco que cambia. Claude Code Codex Plan que lo incluye Claude Pro o Max ChatGPT Plus o Pro (y planes de empresa o educación) Instalación Instalador de claude.com/claude-code, o la pestaña Code de la aplicación de escritorio de Claude (sin terminal) npm install -g @openai/codex Arranque claude dentro de tu carpeta, e inicias sesión con tu cuenta codex dentro de tu carpeta, e inicias sesión con tu cuenta de ChatGPT Notas permanentes CLAUDE.md (puede apuntar a tu AGENTS.md ) AGENTS.md Procedimientos (skills) .claude/skills/ nombre /SKILL.md .agents/skills/ nombre /SKILL.md Política de permisos .claude/settings.json , o modos con Mayús + Tab Orden /permissions dentro de Codex (Datos a 30 de octubre de 2026. Estos programas cambian casi cada semana: si algo no coincide, mira su documentación.) ¿Y DeepSeek? Su chat es gratuito, pero su suscripción no incluye un agente. Si tienes saldo en su API, puedes conectarla en opencode; para el curso no hace falta. Lo que te llevas, sea cual sea tu carril AGENTS.md y SKILL.md son formatos abiertos. Las notas y los procedimientos que escribas en opencode te sirven después en Claude Code o en Codex, casi sin cambios. Las preguntas son las mismas en todas partes: ¿dónde trabaja?, ¿qué puede hacer sin preguntarme?, ¿qué datos salen de mi ordenador?, ¿cómo compruebo el resultado? Ningún carril te ahorra verificar. Un modelo de pago se equivoca menos a menudo, pero también se equivoca. Mide lo que ganas En la hoja de registro del cuaderno de laboratorio hay dos columnas nuevas: minutos con chat y minutos con agente . Apunta cuánto tardarías en hacer cada tarea copiando y pegando en un chat, y cuánto has tardado con el agente. Esa diferencia, con una tarea tuya de verdad, es el mejor motivo para seguir."},{"id":"02-de-que-va-todo-esto-en-cinco-lineas","grupo":"modulo1","titulo":"De qué va todo esto, en cinco líneas","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M9 18h6\"/\u003e\u003cpath d=\"M10 21h4\"/\u003e\u003cpath d=\"M12 3a6 6 0 0 1 3.6 10.8c-.8.7-1.1 1.2-1.1 2.2h-5c0-1-.3-1.5-1.1-2.2A6 6 0 0 1 12 3z\"/\u003e\u003c/svg\u003e Del chat al agente\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 1 min de lectura\u003c/span\u003e\n      \u003c/div\u003e\u003ch2 id=\"1-de-que-va-todo-esto-en-cinco-lineas\"\u003e1. De qué va todo esto, en cinco líneas\u003c/h2\u003e\n\u003cp\u003eHas usado chats de IA: escribes una pregunta, te llega una respuesta de texto, y el trabajo lo haces tú. Un \u003cstrong\u003eagente\u003c/strong\u003e es distinto. Además de responderte, \u003cstrong\u003epuede actuar\u003c/strong\u003e: leer tus archivos, escribir archivos nuevos, ejecutar cosas en tu ordenador. Y el \u003cstrong\u003eharness\u003c/strong\u003e es el programa que hace posible esa parte: el que le da las manos, le pone los límites y te deja ver lo que hace.\u003c/p\u003e\n\u003cp\u003eLa buena noticia: hace mucho más que un chat.\nLa noticia que hay que tomarse en serio: \u003cstrong\u003ehace mucho más que un chat, en tu ordenador, a toda velocidad.\u003c/strong\u003e Estos apuntes van sobre todo de eso.\u003c/p\u003e\n\u003chr\u003e\n","texto":"Del chat al agente 1 min de lectura 1. De qué va todo esto, en cinco líneas Has usado chats de IA: escribes una pregunta, te llega una respuesta de texto, y el trabajo lo haces tú. Un agente es distinto. Además de responderte, puede actuar : leer tus archivos, escribir archivos nuevos, ejecutar cosas en tu ordenador. Y el harness es el programa que hace posible esa parte: el que le da las manos, le pone los límites y te deja ver lo que hace. La buena noticia: hace mucho más que un chat. La noticia que hay que tomarse en serio: hace mucho más que un chat, en tu ordenador, a toda velocidad. Estos apuntes van sobre todo de eso."},{"id":"02-del-chat-al-agente","grupo":"modulo1","titulo":"Del chat al agente","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M9 18h6\"/\u003e\u003cpath d=\"M10 21h4\"/\u003e\u003cpath d=\"M12 3a6 6 0 0 1 3.6 10.8c-.8.7-1.1 1.2-1.1 2.2h-5c0-1-.3-1.5-1.1-2.2A6 6 0 0 1 12 3z\"/\u003e\u003c/svg\u003e Del chat al agente\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 3 min de lectura\u003c/span\u003e\n      \u003c/div\u003e\u003cfigure class=\"figura\" style=\"--ar:640/230\"\u003e\u003csvg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"El modelo es el motor; el harness es el coche completo\"\u003e\n\u003crect width=\"640\" height=\"230\" rx=\"20\" fill=\"#f4f6fd\"/\u003e\n\u003cg font-family=\"ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif\"\u003e\n\u003c!-- motor --\u003e\n\u003crect x=\"40\" y=\"72\" width=\"120\" height=\"86\" rx=\"14\" fill=\"#dfe4f4\"/\u003e\n\u003crect x=\"62\" y=\"52\" width=\"76\" height=\"26\" rx=\"9\" fill=\"#8a93ac\"/\u003e\n\u003ccircle cx=\"80\" cy=\"108\" r=\"13\" fill=\"#5b6579\"/\u003e\u003ccircle cx=\"120\" cy=\"108\" r=\"13\" fill=\"#5b6579\"/\u003e\n\u003ccircle cx=\"80\" cy=\"144\" r=\"13\" fill=\"#5b6579\"/\u003e\u003ccircle cx=\"120\" cy=\"144\" r=\"13\" fill=\"#5b6579\"/\u003e\n\u003ctext x=\"100\" y=\"184\" text-anchor=\"middle\" fill=\"#33406b\" font-size=\"14\" font-weight=\"700\"\u003eEl modelo\u003c/text\u003e\n\u003ctext x=\"100\" y=\"200\" text-anchor=\"middle\" fill=\"#6a7388\" font-size=\"12\"\u003ees solo el motor\u003c/text\u003e\n\u003c!-- flecha --\u003e\n\u003cpath d=\"M172 115 h44\" stroke=\"#8a93ac\" stroke-width=\"2.6\" marker-end=\"url(#fB2)\"/\u003e\n\u003cdefs\u003e\u003cmarker id=\"fB2\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L6,3 L0,6 Z\" fill=\"#8a93ac\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\n\u003c!-- coche --\u003e\n\u003cg transform=\"translate(232 96)\"\u003e\n\u003cpath d=\"M28 60 C14 60 10 50 10 40 L10 26 C10 14 22 10 46 10 L150 10 C180 10 190 20 192 32 L196 52 C198 60 194 64 186 64 L184 64 C178 64 174 60 174 52 L174 44 L34 44 L34 52 C34 60 30 64 24 64 Z\" fill=\"#2f4bd8\"/\u003e\n\u003crect x=\"26\" y=\"14\" width=\"48\" height=\"14\" rx=\"7\" fill=\"#ffffff\" opacity=\".35\"/\u003e\n\u003crect x=\"80\" y=\"14\" width=\"64\" height=\"14\" rx=\"7\" fill=\"#ffffff\" opacity=\".35\"/\u003e\n\u003ccircle cx=\"56\" cy=\"64\" r=\"12\" fill=\"#1b2233\"/\u003e\u003ccircle cx=\"56\" cy=\"64\" r=\"5\" fill=\"#ffffff\"/\u003e\n\u003ccircle cx=\"146\" cy=\"64\" r=\"12\" fill=\"#1b2233\"/\u003e\u003ccircle cx=\"146\" cy=\"64\" r=\"5\" fill=\"#ffffff\"/\u003e\n\u003crect x=\"34\" y=\"44\" width=\"30\" height=\"9\" rx=\"4.5\" fill=\"#0f8a7e\"/\u003e\n\u003crect x=\"144\" y=\"44\" width=\"30\" height=\"9\" rx=\"4.5\" fill=\"#e0a23a\"/\u003e\n\u003c/g\u003e\n\u003ctext x=\"340\" y=\"182\" text-anchor=\"middle\" fill=\"#33406b\" font-size=\"14\" font-weight=\"700\"\u003eEl harness\u003c/text\u003e\n\u003ctext x=\"340\" y=\"199\" text-anchor=\"middle\" fill=\"#6a7388\" font-size=\"12\"\u003ees el coche completo: volante, frenos y salpicadero\u003c/text\u003e\n\u003c/g\u003e\n\u003c/svg\u003e\u003cfigcaption\u003eUn chat también es un coche, pero muy sencillo: motor, un volante y nada más.\u003c/figcaption\u003e\u003c/figure\u003e\u003ch2 id=\"2-del-chat-al-agente\"\u003e2. Del chat al agente\u003c/h2\u003e\n\u003ch3 id=\"21-lo-que-ya-sabes-hacer\"\u003e2.1 Lo que ya sabes hacer\u003c/h3\u003e\n\u003cp\u003eCon un chat normal: preguntas, te responde, y después tú copias, pegas, abres el archivo y cambias el dato. \u003cstrong\u003eEl chat aconseja; el trabajo lo pones tú.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"22-la-idea-que-hay-que-llevarse\"\u003e2.2 La idea que hay que llevarse\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eUn chat es un consultor por teléfono: te dice qué hacer y lo haces tú.\u003c/strong\u003e\n\u003cstrong\u003eUn agente es un becario con acceso a tu ordenador: lo hace y tú revisas.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eSi al final del curso recuerdas una sola frase, que sea esta.\u003c/p\u003e\n\u003ch3 id=\"23-las-tres-diferencias-y-solo-tres\"\u003e2.3 Las tres diferencias, y solo tres\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e\u003c/th\u003e\n\u003cth\u003eUn chat\u003c/th\u003e\n\u003cth\u003eUn agente\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eQué puede hacer\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEscribir texto\u003c/td\u003e\n\u003ctd\u003eEscribir texto \u003cstrong\u003ey usar herramientas\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eCómo trabaja\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eUna respuesta y se calla\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eEn bucle\u003c/strong\u003e: paso, mira el resultado, siguiente paso\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eQué deja detrás\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eNada. Cero efectos.\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eArchivos cambiados, cosas instaladas, trabajo hecho\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003eLa tercera es la importante. Cuando terminas de hablar con un agente, \u003cstrong\u003een tu ordenador ha pasado algo\u003c/strong\u003e. Eso es exactamente lo que lo hace útil y lo que obliga a ponerle frenos.\u003c/p\u003e\n\u003ch3 id=\"24-el-motor-y-el-coche\"\u003e2.4 El motor y el coche\u003c/h3\u003e\n\u003cp\u003eLa palabra del título, explicada de una vez:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eEl modelo es el motor. El harness es el coche completo: el volante, los frenos, el salpicadero y las ruedas.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eEl modelo es lo que «piensa». Pero un motor suelto sobre el suelo no te lleva a ningún sitio. El harness es todo lo demás: la parte que le da manos, la que decide qué puede tocar, la que te enseña por dónde va.\u003c/p\u003e\n\u003cp\u003eFíjate en un detalle: \u003cstrong\u003eun chat también es un coche, pero muy sencillo.\u003c/strong\u003e Motor, un volante y nada más. Un agente es un coche con frenos, espejos y cinturón. Esa es toda la diferencia.\u003c/p\u003e\n\u003ch3 id=\"25-el-mismo-encargo-de-dos-maneras\"\u003e2.5 El mismo encargo, de dos maneras\u003c/h3\u003e\n\u003cp\u003eTienes un informe de veinte páginas en una carpeta.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCon un chat:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eAbres el documento.\u003c/li\u003e\n\u003cli\u003eCopias todo el texto.\u003c/li\u003e\n\u003cli\u003eLo pegas en el chat.\u003c/li\u003e\n\u003cli\u003eEscribes «resúmeme esto».\u003c/li\u003e\n\u003cli\u003eEsperas.\u003c/li\u003e\n\u003cli\u003eCopias el resumen.\u003c/li\u003e\n\u003cli\u003eLo pegas en un archivo nuevo.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eCon un agente:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eEscribes: \u003cem\u003e«Resume el informe que está en esta carpeta y guárdame el resumen al lado, en un archivo nuevo.»\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003eEl agente abre el archivo, lo lee, escribe el resumen y te dice dónde lo ha dejado.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eCero pasos tuyos, y un archivo que antes no existía.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"26-la-consecuencia-incomoda\"\u003e2.6 La consecuencia incómoda\u003c/h3\u003e\n\u003cp\u003eEsto hay que decirlo claro, porque es la base de todo lo demás:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eUn agente es como un becario muy motivado: trabaja a gran velocidad y no sabe lo que no sabe.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eVa a hacer lo que le pidas \u003cstrong\u003econ una seguridad total\u003c/strong\u003e, aunque se esté equivocando. Va a tocar archivos en segundos. Y si le has pedido algo mal, hará mal la cosa mala, rapidísimo, sin dudar. No te va a avisar de que no estaba seguro.\u003c/p\u003e\n\u003cp\u003eDe ahí salen los frenos. Y por eso la parte más importante de estos apuntes es la de permisos.\u003c/p\u003e\n\u003chr\u003e\n","texto":"Del chat al agente 3 min de lectura El modelo es solo el motor El harness es el coche completo: volante, frenos y salpicadero Un chat también es un coche, pero muy sencillo: motor, un volante y nada más. 2. Del chat al agente 2.1 Lo que ya sabes hacer Con un chat normal: preguntas, te responde, y después tú copias, pegas, abres el archivo y cambias el dato. El chat aconseja; el trabajo lo pones tú. 2.2 La idea que hay que llevarse Un chat es un consultor por teléfono: te dice qué hacer y lo haces tú. Un agente es un becario con acceso a tu ordenador: lo hace y tú revisas. Si al final del curso recuerdas una sola frase, que sea esta. 2.3 Las tres diferencias, y solo tres Un chat Un agente Qué puede hacer Escribir texto Escribir texto y usar herramientas Cómo trabaja Una respuesta y se calla En bucle : paso, mira el resultado, siguiente paso Qué deja detrás Nada. Cero efectos. Archivos cambiados, cosas instaladas, trabajo hecho La tercera es la importante. Cuando terminas de hablar con un agente, en tu ordenador ha pasado algo . Eso es exactamente lo que lo hace útil y lo que obliga a ponerle frenos. 2.4 El motor y el coche La palabra del título, explicada de una vez: El modelo es el motor. El harness es el coche completo: el volante, los frenos, el salpicadero y las ruedas. El modelo es lo que «piensa». Pero un motor suelto sobre el suelo no te lleva a ningún sitio. El harness es todo lo demás: la parte que le da manos, la que decide qué puede tocar, la que te enseña por dónde va. Fíjate en un detalle: un chat también es un coche, pero muy sencillo. Motor, un volante y nada más. Un agente es un coche con frenos, espejos y cinturón. Esa es toda la diferencia. 2.5 El mismo encargo, de dos maneras Tienes un informe de veinte páginas en una carpeta. Con un chat: Abres el documento. Copias todo el texto. Lo pegas en el chat. Escribes «resúmeme esto». Esperas. Copias el resumen. Lo pegas en un archivo nuevo. Con un agente: Escribes: «Resume el informe que está en esta carpeta y guárdame el resumen al lado, en un archivo nuevo.» El agente abre el archivo, lo lee, escribe el resumen y te dice dónde lo ha dejado. Cero pasos tuyos, y un archivo que antes no existía. 2.6 La consecuencia incómoda Esto hay que decirlo claro, porque es la base de todo lo demás: Un agente es como un becario muy motivado: trabaja a gran velocidad y no sabe lo que no sabe. Va a hacer lo que le pidas con una seguridad total , aunque se esté equivocando. Va a tocar archivos en segundos. Y si le has pedido algo mal, hará mal la cosa mala, rapidísimo, sin dudar. No te va a avisar de que no estaba seguro. De ahí salen los frenos. Y por eso la parte más importante de estos apuntes es la de permisos."},{"id":"02-las-piezas-de-un-harness","grupo":"modulo1","titulo":"Las piezas de un harness","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \u003cspan class=\"chip modulo\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M9 18h6\"/\u003e\u003cpath d=\"M10 21h4\"/\u003e\u003cpath d=\"M12 3a6 6 0 0 1 3.6 10.8c-.8.7-1.1 1.2-1.1 2.2h-5c0-1-.3-1.5-1.1-2.2A6 6 0 0 1 12 3z\"/\u003e\u003c/svg\u003e Del chat al agente\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 4 min de lectura\u003c/span\u003e\n      \u003c/div\u003e\u003cfigure class=\"figura\" style=\"--ar:560/250\"\u003e\u003csvg viewBox=\"0 0 560 250\" role=\"img\" aria-label=\"Bucle del agente: piensa, actúa, observa y repite\"\u003e\n\u003crect width=\"560\" height=\"250\" rx=\"20\" fill=\"#f4f6fd\"/\u003e\n\u003cdefs\u003e\n\u003cmarker id=\"fB\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"\u003e\u003cpath d=\"M0,0 L6,3 L0,6 Z\" fill=\"#8a93ac\"/\u003e\u003c/marker\u003e\n\u003c/defs\u003e\n\u003cg font-family=\"ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif\" text-anchor=\"middle\"\u003e\n\u003crect x=\"200\" y=\"26\" width=\"160\" height=\"62\" rx=\"14\" fill=\"#2f4bd8\"/\u003e\n\u003ctext x=\"280\" y=\"52\" fill=\"#fff\" font-size=\"16\" font-weight=\"700\"\u003ePIENSA\u003c/text\u003e\n\u003ctext x=\"280\" y=\"72\" fill=\"#fff\" opacity=\".75\" font-size=\"11.5\"\u003eel modelo decide\u003c/text\u003e\n\u003crect x=\"36\" y=\"168\" width=\"160\" height=\"62\" rx=\"14\" fill=\"#0f8a7e\"/\u003e\n\u003ctext x=\"116\" y=\"194\" fill=\"#fff\" font-size=\"16\" font-weight=\"700\"\u003eACTÚA\u003c/text\u003e\n\u003ctext x=\"116\" y=\"214\" fill=\"#fff\" opacity=\".75\" font-size=\"11.5\"\u003eel harness ejecuta\u003c/text\u003e\n\u003crect x=\"364\" y=\"168\" width=\"160\" height=\"62\" rx=\"14\" fill=\"#0f8a7e\"/\u003e\n\u003ctext x=\"444\" y=\"194\" fill=\"#fff\" font-size=\"16\" font-weight=\"700\"\u003eOBSERVA\u003c/text\u003e\n\u003ctext x=\"444\" y=\"214\" fill=\"#fff\" opacity=\".75\" font-size=\"11.5\"\u003elee el resultado\u003c/text\u003e\n\u003c/g\u003e\n\u003cpath d=\"M280 88 C 280 130, 140 130, 116 168\" fill=\"none\" stroke=\"#8a93ac\" stroke-width=\"2.4\" marker-end=\"url(#fB)\"/\u003e\n\u003cpath d=\"M276 88 C 420 110, 440 130, 444 168\" fill=\"none\" stroke=\"#8a93ac\" stroke-width=\"2.4\" marker-end=\"url(#fB)\"/\u003e\n\u003cpath d=\"M196 199 C 80 220, 120 88, 224 62\" fill=\"none\" stroke=\"#8a93ac\" stroke-width=\"2.4\" marker-end=\"url(#fB)\"/\u003e\n\u003c/svg\u003e\u003cfigcaption\u003eEl bucle se repite hasta terminar: el modelo nunca ejecuta nada por sí mismo.\u003c/figcaption\u003e\u003c/figure\u003e\u003ch2 id=\"3-las-piezas-de-un-harness\"\u003e3. Las piezas de un harness\u003c/h2\u003e\n\u003cp\u003eSeis piezas. No hace falta memorizarlas, hace falta reconocerlas en la pantalla.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePieza\u003c/th\u003e\n\u003cth\u003eQué es, en palabras llanas\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eModelo\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEl motor. El que piensa y decide.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eHerramientas\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eLas manos. Lo que puede hacer de verdad.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eBucle\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEl ritmo de trabajo: piensa, actúa, mira el resultado, repite.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eContexto\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eLa mesa de trabajo. Todo lo que tiene delante ahora mismo.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003ePermisos\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eLos frenos. Qué puede hacer sin preguntar y qué no.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eInterfaz\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eEl salpicadero. Donde tú ves lo que está pasando.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch3 id=\"31-el-bucle-piensa-actua-observa-repite\"\u003e3.1 El bucle: piensa, actúa, observa, repite\u003c/h3\u003e\n\u003cpre\u003e\u003ccode\u003e   ┌──────────────────────────────────────────┐\n   │                                          │\n   ▼                                          │\nPIENSA ──► ACTÚA ──► OBSERVA ──► (¿ya está?) ─┘\n(el modelo  (el harness  (el harness\n decide)     ejecuta)     devuelve\n                          el resultado)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eEl detalle que casi nadie sabe: el modelo no ejecuta nada. El modelo propone.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eEl modelo piensa «para resumir esto tengo que leer el archivo» y \u003cstrong\u003epide\u003c/strong\u003e que se lea. El harness lo lee y le devuelve el contenido. El modelo lo mira, piensa el resumen y \u003cstrong\u003epide\u003c/strong\u003e que se escriba un archivo. El harness lo escribe. Y así, cien veces si hace falta.\u003c/p\u003e\n\u003cp\u003e¿Por qué te importa esto? Porque significa que \u003cstrong\u003eel harness está en medio de todo\u003c/strong\u003e: es quien decide qué se le permite al modelo y es quien ejecuta de verdad. El modelo nunca toca tu disco directamente: solo ve lo que el harness le enseña.\u003c/p\u003e\n\u003ch3 id=\"32-las-herramientas-las-manos\"\u003e3.2 Las herramientas: las manos\u003c/h3\u003e\n\u003cp\u003eNo hace falta memorizar la lista. Lo que hace falta es saber \u003cstrong\u003eque existe y que puedes mirarla\u003c/strong\u003e:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eLeer archivos\u003c/strong\u003e de la carpeta de trabajo.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEscribir y modificar archivos.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEjecutar comandos\u003c/strong\u003e en la terminal. ← \u003cstrong\u003ela más potente de todas\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBuscar y leer en internet.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLanzar tareas en segundo plano\u003c/strong\u003e mientras sigue con otra cosa.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePreguntarte a ti\u003c/strong\u003e cuando necesita que decidas algo.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDelegar\u003c/strong\u003e una parte del trabajo en otro agente.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLlevar una lista de tareas\u003c/strong\u003e y marcar lo que va terminando.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ \u003cstrong\u003eLa herramienta de terminal merece un respeto especial.\u003c/strong\u003e Es la que permite instalar programas, mover cosas y cambiar el sistema. Con ella, el agente puede hacer mucho bien y también mucho daño en muy poco tiempo. Cuando la use, mira más despacio que cuando simplemente lee un archivo.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"33-el-contexto-la-mesa-de-trabajo\"\u003e3.3 El contexto: la mesa de trabajo\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eImagina una mesa. Todo lo que el agente sabe en este momento está encima de la mesa:\u003c/strong\u003e tu petición, los archivos que ha leído, lo que ha ido averiguando.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eLa mesa tiene un tamaño limitado. Cuando se llena de papeles, alguien tiene que recoger: se resume lo importante y se tira el resto. Los harnesses actuales lo hacen solos y lo llaman \u003cstrong\u003ecompactación\u003c/strong\u003e: es útil, pero un resumen siempre pierde detalles.\u003c/p\u003e\n\u003cp\u003eLas mesas son hoy mucho más grandes que hace un par de años (caben libros enteros), pero \u003cstrong\u003euna mesa más grande no es una mesa ordenada\u003c/strong\u003e: cuanto más amontonas, más fácil es que algo importante quede debajo. Y cada papel encima de la mesa \u003cstrong\u003ecuesta dinero\u003c/strong\u003e (se paga por \u003cem\u003etokens\u003c/em\u003e, los trocitos de texto que el modelo lee y escribe).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eConsecuencia práctica: en tareas muy largas, el agente puede «olvidar» cosas que le dijiste al principio.\u003c/strong\u003e No es que sea tonto: es que eso ya no está encima de la mesa.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSeñales de que la mesa se ha llenado:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRepite cosas que ya había hecho.\u003c/li\u003e\n\u003cli\u003eOlvida instrucciones que le diste al principio.\u003c/li\u003e\n\u003cli\u003eDa vueltas sobre el mismo problema sin avanzar.\u003c/li\u003e\n\u003cli\u003eLas respuestas se vuelven más vagas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eQué hacer:\u003c/strong\u003e cerrar y abrir una conversación nueva, diciéndole en el primer mensaje \u003cstrong\u003equé ya está hecho y dónde\u003c/strong\u003e. Es más rápido que insistir. Y no arrastres una conversación larga para una tarea nueva y distinta: \u003cstrong\u003ecada tarea, su conversación.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"34-los-permisos-los-frenos\"\u003e3.4 Los permisos: los frenos\u003c/h3\u003e\n\u003cp\u003eTienen sección propia, la 4. Es la más importante.\u003c/p\u003e\n\u003ch3 id=\"35-la-interfaz-el-salpicadero\"\u003e3.5 La interfaz: el salpicadero\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eLa interfaz no te enseña solo la respuesta final: te enseña los pasos.\u003c/strong\u003e Cada vez que el agente usa una herramienta, lo ves pasar.\u003c/p\u003e\n\u003cp\u003eEso es tu ventana para darte cuenta \u003cstrong\u003ea tiempo\u003c/strong\u003e de que va por donde no debe. Y de ahí una advertencia:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eSi no miras los pasos, te enteras de los errores cuando ya están hechos.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n","texto":"Del chat al agente 4 min de lectura PIENSA el modelo decide ACTÚA el harness ejecuta OBSERVA lee el resultado El bucle se repite hasta terminar: el modelo nunca ejecuta nada por sí mismo. 3. Las piezas de un harness Seis piezas. No hace falta memorizarlas, hace falta reconocerlas en la pantalla. Pieza Qué es, en palabras llanas Modelo El motor. El que piensa y decide. Herramientas Las manos. Lo que puede hacer de verdad. Bucle El ritmo de trabajo: piensa, actúa, mira el resultado, repite. Contexto La mesa de trabajo. Todo lo que tiene delante ahora mismo. Permisos Los frenos. Qué puede hacer sin preguntar y qué no. Interfaz El salpicadero. Donde tú ves lo que está pasando. 3.1 El bucle: piensa, actúa, observa, repite ┌──────────────────────────────────────────┐ │ │ ▼ │ PIENSA ──► ACTÚA ──► OBSERVA ──► (¿ya está?) ─┘ (el modelo (el harness (el harness decide) ejecuta) devuelve el resultado) El detalle que casi nadie sabe: el modelo no ejecuta nada. El modelo propone. El modelo piensa «para resumir esto tengo que leer el archivo» y pide que se lea. El harness lo lee y le devuelve el contenido. El modelo lo mira, piensa el resumen y pide que se escriba un archivo. El harness lo escribe. Y así, cien veces si hace falta. ¿Por qué te importa esto? Porque significa que el harness está en medio de todo : es quien decide qué se le permite al modelo y es quien ejecuta de verdad. El modelo nunca toca tu disco directamente: solo ve lo que el harness le enseña. 3.2 Las herramientas: las manos No hace falta memorizar la lista. Lo que hace falta es saber que existe y que puedes mirarla : Leer archivos de la carpeta de trabajo. Escribir y modificar archivos. Ejecutar comandos en la terminal. ← la más potente de todas . Buscar y leer en internet. Lanzar tareas en segundo plano mientras sigue con otra cosa. Preguntarte a ti cuando necesita que decidas algo. Delegar una parte del trabajo en otro agente. Llevar una lista de tareas y marcar lo que va terminando. ⚠️ La herramienta de terminal merece un respeto especial. Es la que permite instalar programas, mover cosas y cambiar el sistema. Con ella, el agente puede hacer mucho bien y también mucho daño en muy poco tiempo. Cuando la use, mira más despacio que cuando simplemente lee un archivo. 3.3 El contexto: la mesa de trabajo Imagina una mesa. Todo lo que el agente sabe en este momento está encima de la mesa: tu petición, los archivos que ha leído, lo que ha ido averiguando. La mesa tiene un tamaño limitado. Cuando se llena de papeles, alguien tiene que recoger: se resume lo importante y se tira el resto. Los harnesses actuales lo hacen solos y lo llaman compactación : es útil, pero un resumen siempre pierde detalles. Las mesas son hoy mucho más grandes que hace un par de años (caben libros enteros), pero una mesa más grande no es una mesa ordenad
