span class=\"recurso-titulo\"\u003eComunidad en Discord\u003c/span\u003e\n    \u003cspan class=\"recurso-detalle\"\u003eAyuda y novedades de la comunidad del proyecto.\u003c/span\u003e\n  \u003c/span\u003e\n  \u003cspan class=\"recurso-abrir\"\u003e↗\u003c/span\u003e\n\u003c/a\u003e\n\u003c/div\u003e\n\u003cp class=\"pista\"\u003eTodos los enlaces se abren en una pestaña nueva. Si algo del curso ya no coincide con lo que ves en la herramienta,\nmira primero aquí: la documentación oficial manda.\u003c/p\u003e","texto":"Recursos y enlaces oficiales Para profundizar, estas son las fuentes del propio proyecto. El resto del curso es material de elaboración propia, pero aquí está siempre la verdad de referencia, sobre todo porque la herramienta y sus modelos gratuitos cambian muy rápido . Docs Documentación oficial Instalación, uso y configuración de opencode. ↗ GitHub Repositorio en GitHub Código abierto, novedades y avisos de cada versión. ↗ Seguridad Permisos Qué puede hacer sin preguntar y cómo cambiarlo con opencode.json. ↗ Guía Interfaz web Arrancar opencode web, abrir proyectos y sesiones. ↗ Modelos Modelos y privacidad Qué modelos son gratuitos y qué hace cada proveedor con tus datos. ↗ Comunidad Comunidad en Discord Ayuda y novedades de la comunidad del proyecto. ↗ Todos los enlaces se abren en una pestaña nueva. Si algo del curso ya no coincide con lo que ves en la herramienta, mira primero aquí: la documentación oficial manda."},{"id":"doc-05","grupo":"consulta","titulo":"Glosario y chuleta","tipo":"doc","html":"\u003cdiv class=\"leccion-meta\"\u003e\n        \n        \u003cspan class=\"chip\"\u003e\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 7v5l3 2\"/\u003e\u003c/svg\u003e 22 min de lectura\u003c/span\u003e\n      \u003c/div\u003e\u003ch1 id=\"glosario-y-chuleta-del-chat-al-agente-que-es-un-harness-y-co\"\u003eGlosario y chuleta — «Del chat al agente: qué es un harness y cómo se usa»\u003c/h1\u003e\n\u003cp\u003eCurso práctico con \u003cstrong\u003eopencode\u003c/strong\u003e. La \u003cstrong\u003eParte 1\u003c/strong\u003e es el glosario; la \u003cstrong\u003eParte 2\u003c/strong\u003e, la chuleta para tener al lado del portátil.\u003c/p\u003e\n\u003ch2 id=\"parte-1-glosario\"\u003eParte 1 — Glosario\u003c/h2\u003e\n\u003cp\u003eTérminos en orden alfabético, explicados en lenguaje llano y con un ejemplo corto. Cuando un concepto se apoya en otro, aparece marcado como \u003cstrong\u003e(ver …)\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eA2A (Agent2Agent)\u003c/strong\u003e — Estándar abierto para que agentes de distintos fabricantes se hablen entre sí y se repartan trabajo. MCP conecta un agente con herramientas; A2A conecta un agente con otro agente.\n\u003cem\u003eEn la práctica:\u003c/em\u003e el agente de tu empresa encarga a otro agente, de otro proveedor, que consulte un catálogo y le devuelva el resultado.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAcceso total\u003c/strong\u003e — El nivel de sandbox más permisivo: el agente puede leer y escribir en todo el ordenador. Se elige a conciencia, nunca por comodidad.\n\u003cem\u003eEn la práctica:\u003c/em\u003e tiene sentido en una máquina de pruebas o desechable; en tu ordenador de diario, casi nunca.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAgente\u003c/strong\u003e — Programa que, además de responderte, puede hacer cosas por su cuenta en tu ordenador: leer y escribir archivos, ejecutar comandos, buscar en internet.\n\u003cem\u003eEn la práctica:\u003c/em\u003e le dices «ordena las facturas de esta carpeta» y las ordena él; tú revisas el resultado después.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAgente de navegador (uso del ordenador)\u003c/strong\u003e — Agente que maneja un navegador o el escritorio como lo harías tú: mira la pantalla, hace clic y escribe en formularios.\n\u003cem\u003eEn la práctica:\u003c/em\u003e «busca tres vuelos y déjame la comparativa». Útil, pero cada web que visita es contenido de fuera (ver \u003cstrong\u003eInyección de instrucciones\u003c/strong\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAgente en segundo plano (en la nube)\u003c/strong\u003e — Agente que trabaja solo, sin que estés mirando, a menudo en un ordenador remoto, y te avisa cuando acaba con un resultado para revisar.\n\u003cem\u003eEn la práctica:\u003c/em\u003e le dejas un encargo largo por la tarde y por la mañana revisas lo que propone. Revisar sigue siendo cosa tuya.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAGENTS.md\u003c/strong\u003e — Archivo de texto con las normas que quieres que el agente siga siempre. Puede ser global (en tu carpeta de configuración) o de un proyecto concreto (en la raíz del proyecto).\n\u003cem\u003eEn la práctica:\u003c/em\u003e «no borres archivos nunca; avísame antes de instalar nada».\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAlucinación\u003c/strong\u003e — Cuando el modelo se inventa un dato, una cita o un comando con total seguridad. No miente a propósito: rellena huecos.\n\u003cem\u003eEn la práctica:\u003c/em\u003e te da un enlace que no existe. Por eso se piden fuentes y se comprueba todo (ver \u003cstrong\u003eVerificación\u003c/strong\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAPI\u003c/strong\u003e — La puerta que usan los programas para hablar con un servicio por internet, sin pasar por una web ni por una persona.\n\u003cem\u003eEn la práctica:\u003c/em\u003e el harness usa la API del proveedor del modelo para pedirle respuestas.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAprobación\u003c/strong\u003e — El aviso que aparece cuando el agente quiere hacer algo que no tiene permitido hacer solo, para que tú digas sí o no antes de que lo haga.\n\u003cem\u003eEn la práctica:\u003c/em\u003e quiere escribir en una carpeta que está fuera de su zona y te pide permiso (ver \u003cstrong\u003eSandbox\u003c/strong\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBucle agéntico\u003c/strong\u003e — El ciclo de trabajo del agente: piensa un paso, usa una herramienta, mira el resultado y repite hasta acabar.\n\u003cem\u003eEn la práctica:\u003c/em\u003e buscar → leer → corregir → volver a buscar. Por eso tarda y da varios pasos aunque tú escribas una sola frase.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChat\u003c/strong\u003e — Conversación en la que el modelo solo escribe texto y el trabajo lo haces tú después. Es un consultor por teléfono.\n\u003cem\u003eEn la práctica:\u003c/em\u003e te explica cómo ordenar tus fotos; las ordenas tú.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eClave de API\u003c/strong\u003e — Contraseña larga que identifica tu cuenta y autoriza el uso del servicio. No se comparte con nadie. En el curso no hace falta: los modelos gratuitos de opencode funcionan sin clave.\n\u003cem\u003eEn la práctica:\u003c/em\u003e funciona como la llave de tu casa: quien la tenga, entra (y gasta tu saldo).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eComando\u003c/strong\u003e — Orden que se le da al ordenador escribiéndola, casi siempre en la terminal.\n\u003cem\u003eEn la práctica:\u003c/em\u003e \u003ccode\u003eopencode web\u003c/code\u003e es un comando. Se copia, se pega y se pulsa Intro.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCompactación\u003c/strong\u003e — Cuando la conversación llena la ventana de contexto, el harness resume lo anterior para hacer sitio y seguir trabajando.\n\u003cem\u003eEn la práctica:\u003c/em\u003e tras una tarea muy larga, el agente puede haber perdido un detalle que le diste al principio. Si es importante, repítelo o déjalo escrito en \u003ccode\u003eAGENTS.md\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContenedor\u003c/strong\u003e — Entorno aislado y desechable donde puedes ejecutar el agente sin tocar tu ordenador de verdad.\n\u003cem\u003eEn la práctica:\u003c/em\u003e si algo se rompe dentro, tu equipo no se entera. Es una de las formas recomendadas de probar.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContexto\u003c/strong\u003e — Todo lo que el agente tiene delante en ese momento: tu petición, la conversación, los archivos que ha leído y las respuestas de las herramientas. Es su mesa de trabajo.\n\u003cem\u003eEn la práctica:\u003c/em\u003e si la mesa se llena de papeles, se pierde; conviene empezar una sesión nueva (ver \u003cstrong\u003eSesión\u003c/strong\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCopia de seguridad\u003c/strong\u003e — Duplicado de tus archivos, guardado aparte, para poder volver atrás si algo sale mal.\n\u003cem\u003eEn la práctica:\u003c/em\u003e antes de dejar que el agente toque 200 archivos, haz una copia. Es tu red de seguridad.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCredencial\u003c/strong\u003e — Cualquier dato que da acceso a algo tuyo: contraseñas, claves de API, tokens de acceso, datos de tarjeta.\n\u003cem\u003eEn la práctica:\u003c/em\u003e no las pegues en una petición si no son imprescindibles. Lo que escribes viaja al servicio.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eopencode\u003c/strong\u003e — El programa de este curso: un harness de código abierto que convierte un modelo en un agente, con interfaz web, herramientas y permisos. Trae modelos gratuitos. Se instala con \u003ccode\u003enpm install -g opencode-ai\u003c/code\u003e y se arranca con \u003ccode\u003eopencode web\u003c/code\u003e.\n\u003cem\u003eEn la práctica:\u003c/em\u003e es el coche completo; el modelo es solo el motor (ver \u003cstrong\u003eHarness\u003c/strong\u003e, ver \u003cstrong\u003eLLM\u003c/strong\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDelegación\u003c/strong\u003e — Pedirle al agente que encargue una parte del trabajo a otro agente y te devuelva el resultado.\n\u003cem\u003eEn la práctica:\u003c/em\u003e «que otro agente revise estos 40 archivos y me traiga un resumen». Tú sigues hablando con el primero.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDetener (interrumpir)\u003c/strong\u003e — Cortar el trabajo que el agente está haciendo ahora mismo. Lo que ya ha hecho se queda hecho.\n\u003cem\u003eEn la práctica:\u003c/em\u003e tras detenerlo, pídele la lista de archivos que ha tocado y revísalos.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEspacio de trabajo (proyecto)\u003c/strong\u003e — La carpeta que le entregas al agente como su zona de trabajo. Lo que haga dentro es lo normal; lo de fuera pide permiso.\n\u003cem\u003eEn la práctica:\u003c/em\u003e en opencode es el \u003cstrong\u003eproyecto\u003c/strong\u003e que abres con «Añadir proyecto»; lo más cómodo es arrancar \u003ccode\u003eopencode web\u003c/code\u003e desde esa carpeta.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEsfuerzo de razonamiento\u003c/strong\u003e — Cuánto «piensa» el modelo antes de responder. Más esfuerzo suele dar mejores respuestas en tareas difíciles, pero tarda más y consume más.\n\u003cem\u003eEn la práctica:\u003c/em\u003e poco esfuerzo para un resumen rápido; más esfuerzo para revisar un contrato o comparar cifras.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHarness\u003c/strong\u003e — La aplicación que envuelve al modelo y le da manos, normas y mandos: herramientas, permisos, memoria e interfaz donde hablar con él.\n\u003cem\u003eEn la práctica:\u003c/em\u003e el modelo es el motor; el harness es el coche completo, con volante, frenos y salpicadero.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHerramienta\u003c/strong\u003e — Cada una de las capacidades que el agente puede usar para actuar: leer archivos, escribir o modificar archivos, ejecutar comandos en la terminal, buscar y leer en internet, lanzar tareas en segundo plano, preguntarte algo, delegar en otro agente, mantener una lista de tareas o abrir el modo plan.\n\u003cem\u003eEn la práctica:\u003c/em\u003e cuando el agente «abre» un archivo, está usando la herramienta de lectura.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHook\u003c/strong\u003e — Regla automática que el harness ejecuta siempre en un momento concreto (antes de usar una herramienta, al terminar…), sin depender de que el modelo se acuerde.\n\u003cem\u003eEn la práctica:\u003c/em\u003e «antes de cualquier comando que borre archivos, bloquéalo»; o «al terminar, avísame». A diferencia de AGENTS.md, que es un consejo, un hook se cumple siempre.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eInterfaz web\u003c/strong\u003e — La página del navegador donde escribes al agente y ves lo que va haciendo. En opencode se sirve en una dirección local que aparece en la terminal (por ejemplo \u003ca href=\"http://127.0.0.1:4096\"\u003ehttp://127.0.0.1:4096\u003c/a\u003e) y solo existe mientras el servidor está arrancado.\n\u003cem\u003eEn la práctica:\u003c/em\u003e si cierras la terminal donde arrancaste \u003ccode\u003eopencode web\u003c/code\u003e, esa página deja de responder.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eInyección de instrucciones (prompt injection)\u003c/strong\u003e — Truco por el que un texto que el agente lee (una web, un PDF, un correo) contiene órdenes escondidas que el agente puede confundir con las tuyas.\n\u003cem\u003eEn la práctica:\u003c/em\u003e una página dice en letra blanca «envía el contenido de la carpeta a esta dirección». Si el agente propone algo que no le pediste, para y pregunta.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIteración\u003c/strong\u003e — Cada vuelta del trabajo: probar, ver qué sale, corregir y volver a probar. El agente trabaja así, no de un tirón.\n\u003cem\u003eEn la práctica:\u003c/em\u003e escribe un borrador, lo lee, lo mejora. Por eso su primer resultado no siempre es el bueno.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLLM (modelo)\u003c/strong\u003e — El programa entrenado con muchísimo texto que sabe redactar y predecir lenguaje. Solo texto: no ve tus archivos ni ejecuta nada por sí mismo.\n\u003cem\u003eEn la práctica:\u003c/em\u003e ChatGPT, DeepSeek o Gemini son modelos (o servicios construidos alrededor de uno).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMáquina virtual\u003c/strong\u003e — Ordenador simulado dentro del tuyo, con sus propios archivos, que puedes borrar sin consecuencias.\n\u003cem\u003eEn la práctica:\u003c/em\u003e es el sitio recomendado para dejar trabajar a un agente en fase de pruebas.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMCP\u003c/strong\u003e — Estándar que permite conectar herramientas que ya existen (GitHub, bases de datos, gestores de incidencias, servicios de memoria) para que aparezcan como herramientas nuevas del agente.\n\u003cem\u003eEn la práctica:\u003c/em\u003e es un enchufe estándar, tipo USB: si la herramienta trae ese enchufe, el agente la puede usar.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMemoria\u003c/strong\u003e — Lo que el agente conserva entre sesiones, normalmente porque está escrito en un archivo que vuelve a leer al empezar.\n\u003cem\u003eEn la práctica:\u003c/em\u003e lo que pongas en AGENTS.md sigue ahí mañana; lo hablado en el chat, no (ver \u003cstrong\u003eContexto\u003c/strong\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eModo Auto\u003c/strong\u003e — Modo de algunos agentes (por ejemplo, Claude Code) en el que no te pregunta antes de cada acción: un clasificador, otra IA, decide qué es arriesgado y lo bloquea; el resto lo hace sin avisar.\n\u003cem\u003eEn la práctica:\u003c/em\u003e reduce avisos, no riesgos. En formación y con datos delicados, usa el modo manual.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eModo plan (plan)\u003c/strong\u003e — Forma de trabajar en la que el agente primero te cuenta qué piensa hacer y no toca nada hasta que le das el visto bueno.\n\u003cem\u003eEn la práctica:\u003c/em\u003e imprescindible antes de dejarle modificar 200 archivos.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eNode.js\u003c/strong\u003e — Programa que hay que tener instalado en el ordenador para poder arrancar el harness. Es el requisito previo.\n\u003cem\u003eEn la práctica:\u003c/em\u003e si el comando de arranque se queja de que no encuentra Node, es justo esto lo que falta.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePermiso\u003c/strong\u003e — La regla que decide qué puede hacer el agente sin preguntar y qué no. Lo que queda fuera de lo permitido dispara un aviso de aprobación.\n\u003cem\u003eEn la práctica:\u003c/em\u003e puede leer en toda la carpeta de trabajo, pero escribir solo en una parte.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePlugin\u003c/strong\u003e — Pieza que se añade al harness para darle capacidades nuevas, a veces conectando servicios externos.\n\u003cem\u003eEn la práctica:\u003c/em\u003e un plugin puede añadir una herramienta que no venía de serie. No es lo mismo que el harness (ver \u003cstrong\u003eHarness\u003c/strong\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePolítica de permisos\u003c/strong\u003e — El conjunto de ajustes que fija hasta dónde llega el agente y cuándo tiene que preguntar. En opencode, de serie, no pregunta dentro de la carpeta y sí para salir de ella; se cambia en \u003ccode\u003eopencode.json\u003c/code\u003e.\n\u003cem\u003eEn la práctica:\u003c/em\u003e combina el nivel de acceso del sandbox con la política de aprobaciones (por defecto: preguntar).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePrompt\u003c/strong\u003e — El texto que le escribes al agente: tu petición, el encargo. Cuanto más claro el encargo, mejor el resultado.\n\u003cem\u003eEn la práctica:\u003c/em\u003e «resume este PDF en cinco puntos» funciona mucho mejor que «mírame esto».\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eProveedor\u003c/strong\u003e — La empresa o servicio que pone el modelo a disposición de los programas.\n\u003cem\u003eEn la práctica:\u003c/em\u003e en este curso, OpenCode, que ofrece modelos gratuitos sin registro. Cada uno tiene su política de datos: mírala antes de usarlo.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eRuta (ruta de archivo)\u003c/strong\u003e — La dirección que indica dónde está un archivo o una carpeta dentro del ordenador.\n\u003cem\u003eEn la práctica:\u003c/em\u003e \u003ccode\u003eC:\\Users\\&lt;tu_usuario&gt;\\.config\\opencode\u003c/code\u003e es una ruta: la carpeta de configuración de opencode en Windows.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSandbox\u003c/strong\u003e — Zona de trabajo delimitada donde el agente puede moverse. Hay niveles: solo lectura; escritura limitada al espacio de trabajo; acceso total. opencode no tiene sandbox: limita con permisos.\n\u003cem\u003eEn la práctica:\u003c/em\u003e dentro de la zona trabaja sin molestarte; fuera, salta el «¿seguro?».\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSesión\u003c/strong\u003e — Cada conversación con el agente, con su propio hilo y su propio contexto. Se guardan y puedes volver a ellas.\n\u003cem\u003eEn la práctica:\u003c/em\u003e si el contexto se llena, abres una sesión nueva y arrastras solo lo importante.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSkill\u003c/strong\u003e — Procedimiento guardado que el agente puede repetir cuando se lo pides. Es una carpeta con un archivo \u003ccode\u003eSKILL.md\u003c/code\u003e, un formato abierto que entienden muchos harnesses (Claude, Codex, opencode…). En opencode vive en \u003ccode\u003e.opencode/skills/&lt;nombre&gt;/SKILL.md\u003c/code\u003e dentro del proyecto y se carga al arrancar.\n\u003cem\u003eEn la práctica:\u003c/em\u003e son recetas de cocina: los pasos ya escritos, para no explicarlos cada vez. En la Práctica 4 creas \u003ccode\u003e.opencode/skills/resumen-informes/SKILL.md\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSubagente\u003c/strong\u003e — Agente auxiliar al que el agente principal encarga una parte del trabajo. Trabaja con su propia mesa (su propio contexto) y solo devuelve el resultado.\n\u003cem\u003eEn la práctica:\u003c/em\u003e «revisa estos cuarenta documentos y dime cuáles hablan de garantías»: el subagente lee los cuarenta y al agente principal solo le llega la lista (ver \u003cstrong\u003eDelegación\u003c/strong\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTarea en segundo plano\u003c/strong\u003e — Trabajo largo que el agente lanza y deja corriendo mientras sigue hablando contigo. Te avisa cuando termina.\n\u003cem\u003eEn la práctica:\u003c/em\u003e procesar 300 archivos mientras tú preparas el siguiente encargo.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTerminal\u003c/strong\u003e — La ventana de texto donde se le dan órdenes al ordenador escribiendo, en vez de haciendo clic. Es donde se arranca el harness.\n\u003cem\u003eEn la práctica:\u003c/em\u003e ahí escribes \u003ccode\u003eopencode web\u003c/code\u003e y pulsas Intro.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eToken\u003c/strong\u003e — Trozo pequeño de texto (una palabra, media palabra, un signo) con el que el modelo cuenta y procesa. El precio y los límites se miden en tokens.\n\u003cem\u003eEn la práctica:\u003c/em\u003e «gasolineras» puede ser dos o tres tokens. No son letras ni palabras exactas.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrifecta letal\u003c/strong\u003e — Combinación peligrosa de tres capacidades en un mismo agente: acceso a datos privados, lectura de contenido de fuera y capacidad de comunicarse hacia fuera. Con las tres juntas, una inyección de instrucciones puede sacar tus datos.\n\u003cem\u003eEn la práctica:\u003c/em\u003e si trabajas con datos confidenciales, quítale al menos una de las tres (por ejemplo, el acceso a internet).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVentana de contexto\u003c/strong\u003e — El tamaño máximo de contexto que cabe de una vez. Cuando se supera, lo más antiguo se cae o se resume.\n\u003cem\u003eEn la práctica:\u003c/em\u003e hilos muy largos con muchos archivos pegados acaban empujando fuera lo del principio.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVerificación\u003c/strong\u003e — Comprobar el resultado en lugar de creértelo: abrir el archivo, mirar la fuente, contar las filas, repetir el cálculo.\n\u003cem\u003eEn la práctica:\u003c/em\u003e el agente dice «he actualizado 12 filas»; tú abres el archivo y las cuentas.\u003c/p\u003e\n\u003ch3 id=\"palabras-que-se-confunden\"\u003ePalabras que se confunden\u003c/h3\u003e\n\u003cp\u003eSe parecen, pero no son lo mismo. Una frase para cada pareja:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eModelo vs. harness\u003c/strong\u003e — El modelo es el motor que redacta; el harness es el coche entero, con volante, frenos y salpicadero.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChat vs. agente\u003c/strong\u003e — El chat es un consultor por teléfono (te dice qué hacer y lo haces tú); el agente es un becario con acceso a tu ordenador (lo hace y tú revisas).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContexto vs. memoria\u003c/strong\u003e — El contexto es lo que tiene delante ahora mismo (la mesa de trabajo); la memoria es lo que queda guardado para la próxima vez.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePermiso vs. aprobación\u003c/strong\u003e — El permiso es la regla escrita; la aprobación es el «¿seguro?» que te llega cuando algo se sale de esa regla.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eHarness vs. plugin\u003c/strong\u003e — El harness es la aplicación completa; un plugin es una pieza que le añades para darle una capacidad nueva.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSandbox vs. espacio de trabajo\u003c/strong\u003e — El sandbox es el nivel de libertad (leer, escribir, acceso total); el espacio de trabajo es la carpeta concreta donde ese nivel se aplica.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAGENTS.md vs. skill vs. hook\u003c/strong\u003e — AGENTS.md son notas que el agente lee siempre; una skill es una receta que solo saca cuando la tarea la necesita; un hook es una regla que el harness hace cumplir aunque el modelo no se acuerde.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMCP vs. A2A\u003c/strong\u003e — MCP enchufa herramientas y datos a un agente; A2A pone a dos agentes a hablar entre ellos.\u003c/p\u003e\n\u003ch2 id=\"parte-2-chuleta-de-una-pagina\"\u003eParte 2 — Chuleta de una página\u003c/h2\u003e\n\u003ch3 id=\"antes-de-empezar-cinco-minutos\"\u003eAntes de empezar (cinco minutos)\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eNode.js y opencode instalados\u003c/strong\u003e (\u003ccode\u003enpm install -g opencode-ai\u003c/code\u003e). No necesitas clave de API.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDecide la carpeta de trabajo\u003c/strong\u003e y comprueba que tiene dentro lo que necesitas. No trabajes sobre tu carpeta personal entera.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eElige un modelo gratuito que no use tus datos para entrenar\u003c/strong\u003e (mira la política de privacidad de opencode).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHaz una copia de seguridad\u003c/strong\u003e de lo que el agente vaya a tocar.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAsume que cambia rápido:\u003c/strong\u003e versiones casi semanales y modelos gratuitos «por tiempo limitado».\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"puesta-en-marcha-5-pasos\"\u003ePuesta en marcha (5 pasos)\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eInstala Node.js\u003c/strong\u003e si no lo tienes, y después opencode: \u003ccode\u003enpm install -g opencode-ai\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAbre la terminal en la carpeta que quieras usar como espacio de trabajo\u003c/strong\u003e y arranca: \u003ccode\u003eopencode web\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEspera a que se abra el navegador.\u003c/strong\u003e Si no se abre solo, copia la dirección que aparece en la terminal (por ejemplo \u003ca href=\"http://127.0.0.1:4096\"\u003ehttp://127.0.0.1:4096\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAbre la carpeta:\u003c/strong\u003e «Añadir proyecto» → escribe la ruta (por ejemplo \u003ccode\u003eDocuments/practica_agente\u003c/code\u003e) → elígela → «Nueva sesión».\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eElige el modelo:\u003c/strong\u003e pulsa su nombre bajo el cuadro de mensajes y escoge uno marcado como \u003cstrong\u003eGratis\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cem\u003eLa configuración (\u003ccode\u003eopencode.json\u003c/code\u003e) y las skills se leen al arrancar: si las cambias, apaga con Ctrl + C y vuelve a lanzar \u003ccode\u003eopencode web\u003c/code\u003e.\u003c/em\u003e\u003c/p\u003e\n\u003ch3 id=\"como-pedir-bien\"\u003eCómo pedir bien\u003c/h3\u003e\n\u003cp\u003eUna petición vaga se convierte en una petición con \u003cstrong\u003eobjetivo\u003c/strong\u003e, \u003cstrong\u003ealcance\u003c/strong\u003e y \u003cstrong\u003ecriterio de éxito\u003c/strong\u003e.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eEn vez de esto\u003c/th\u003e\n\u003cth\u003ePide esto\u003c/th\u003e\n\u003cth\u003ePor qué\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003e«Resúmeme esto»\u003c/td\u003e\n\u003ctd\u003e«Lee los tres PDF de la carpeta \u003cem\u003efacturas\u003c/em\u003e y hazme una tabla con fecha, proveedor e importe total»\u003c/td\u003e\n\u003ctd\u003eLe das el objetivo, dónde mirar y en qué formato quieres la respuesta.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Arréglame la web»\u003c/td\u003e\n\u003ctd\u003e«En la carpeta \u003cem\u003eweb\u003c/em\u003e, dime primero qué enlaces del menú están rotos. No cambies nada todavía»\u003c/td\u003e\n\u003ctd\u003eSeparas el diagnóstico del cambio: primero información, luego decisiones.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Ordena mis archivos»\u003c/td\u003e\n\u003ctd\u003e«Mueve los \u003ccode\u003e.jpg\u003c/code\u003e de \u003cem\u003eDescargas\u003c/em\u003e a \u003cem\u003eFotos\u003c/em\u003e, no borres nada y dime cuántos has movido»\u003c/td\u003e\n\u003ctd\u003eAlcance cerrado y un número al final que puedes comprobar.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Hazme un informe de ventas»\u003c/td\u003e\n\u003ctd\u003e«Con \u003ccode\u003eventas.csv\u003c/code\u003e, escribe un informe de una página con tres conclusiones. No modifiques el csv»\u003c/td\u003e\n\u003ctd\u003eQueda claro qué debe entregar y qué no debe tocar.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Busca información sobre MCP»\u003c/td\u003e\n\u003ctd\u003e«Busca en internet qué es MCP y dame tres enlaces con la fecha de cada uno»\u003c/td\u003e\n\u003ctd\u003ePides fuentes: así puedes verificar de dónde sale cada dato.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Limpia este código»\u003c/td\u003e\n\u003ctd\u003e«Revisa el archivo y propón tres mejoras. Espera mi OK antes de editar»\u003c/td\u003e\n\u003ctd\u003eSi el trabajo toca lo tuyo, mejor ver el plan antes de que actúe.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Hazlo rápido y bien»\u003c/td\u003e\n\u003ctd\u003e«Antes de empezar, resúmeme en cinco líneas qué vas a hacer y qué necesitas de mí»\u003c/td\u003e\n\u003ctd\u003eUn plan corto evita media hora de trabajo en la dirección equivocada.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Revisa la hoja de cálculo»\u003c/td\u003e\n\u003ctd\u003e«Comprueba si el total de cada fila cuadra con sus importes y dime en qué filas no cuadra»\u003c/td\u003e\n\u003ctd\u003eLe das un criterio de éxito comprobable, no una opinión.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«Cada semana quiero lo mismo»\u003c/td\u003e\n\u003ctd\u003e«Guarda este procedimiento como skill y repítelo tal cual cuando te lo pida»\u003c/td\u003e\n\u003ctd\u003eLo que se repite se escribe una vez y se reutiliza (ver \u003cstrong\u003eSkill\u003c/strong\u003e).\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e«No sé, haz algo con esta carpeta»\u003c/td\u003e\n\u003ctd\u003e«Dime qué hay en la carpeta y tres cosas útiles que se podrían hacer. No cambies nada»\u003c/td\u003e\n\u003ctd\u003eExplorar primero, decidir después.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch3 id=\"frases-que-puedes-copiar-tal-cual\"\u003eFrases que puedes copiar tal cual\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e«Antes de tocar nada, dime qué has entendido y qué piensas hacer.»\u003c/li\u003e\n\u003cli\u003e«Trabaja solo dentro de esta carpeta. Si necesitas algo de fuera, pídemelo.»\u003c/li\u003e\n\u003cli\u003e«No borres ni sobrescribas nada sin avisarme antes.»\u003c/li\u003e\n\u003cli\u003e«Cuando termines, dime exactamente qué archivos has creado o modificado.»\u003c/li\u003e\n\u003cli\u003e«Cita la fuente de cada dato que me des.»\u003c/li\u003e\n\u003cli\u003e«Si algo no lo sabes con seguridad, dilo en vez de inventártelo.»\u003c/li\u003e\n\u003cli\u003e«Termina con un resumen de cinco líneas: qué has hecho y qué queda pendiente.»\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"que-hacer-cuando-pasa-esto\"\u003eQué hacer cuando pasa esto\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eSituación\u003c/th\u003e\n\u003cth\u003eQué significa\u003c/th\u003e\n\u003cth\u003eQué haces\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\u003ctr\u003e\n\u003ctd\u003eAparece un aviso de aprobación\u003c/td\u003e\n\u003ctd\u003eEl agente quiere hacer algo que su política de permisos no le deja hacer solo. «Permitir una vez» es \u003cstrong\u003esolo esa vez\u003c/strong\u003e: no concede permiso permanente.\u003c/td\u003e\n\u003ctd\u003eLee con calma qué te pide. Si lo entiendes y tiene sentido, permite; si no, deniega y pídele otra vía. Es incómodo a propósito.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eQuiere escribir fuera de la carpeta\u003c/td\u003e\n\u003ctd\u003eopencode pide permiso para todo lo que esté fuera del proyecto.\u003c/td\u003e\n\u003ctd\u003eMueve o copia lo necesario dentro de la carpeta de trabajo, o cambia de espacio de trabajo. No le des acceso total por comodidad.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl modelo da error o dice que está saturado\u003c/td\u003e\n\u003ctd\u003eLos modelos gratuitos a veces se saturan o desaparecen.\u003c/td\u003e\n\u003ctd\u003ePulsa el nombre del modelo y elige otro marcado como \u003cstrong\u003eGratis\u003c/strong\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl agente lleva mucho rato\u003c/td\u003e\n\u003ctd\u003eEstá encadenando pasos, esperando una aprobación tuya o tiene una tarea en segundo plano en marcha.\u003c/td\u003e\n\u003ctd\u003ePídele un resumen de en qué punto está. Si no avanza, deténlo y parte la tarea en trozos más pequeños.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSe equivoca y va a peor\u003c/td\u003e\n\u003ctd\u003eEstá iterando sobre un error y cada intento toca más cosas.\u003c/td\u003e\n\u003ctd\u003eDeténlo ya. Pídele que explique qué ha cambiado y cómo deshacerlo, y restaura desde tu copia de seguridad si hace falta.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eQuieres pararlo\u003c/td\u003e\n\u003ctd\u003eSe corta el trabajo en curso, pero lo que ya ha hecho se queda hecho.\u003c/td\u003e\n\u003ctd\u003eUsa el control de detener de la interfaz. Si no lo encuentras, escríbele «para» y espera a que termine el paso actual. Luego revisa lo que haya tocado.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eQuieres que recuerde algo para siempre\u003c/td\u003e\n\u003ctd\u003eEl contexto de la conversación no se conserva entre sesiones; la memoria escrita sí.\u003c/td\u003e\n\u003ctd\u003eEscríbelo en AGENTS.md: el global (en tu carpeta de configuración del usuario) vale para todo; el de la raíz del proyecto, solo para ese proyecto.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eQuieres que repita una tarea igual cada semana\u003c/td\u003e\n\u003ctd\u003eNecesitas un procedimiento guardado, no volver a explicarlo cada vez.\u003c/td\u003e\n\u003ctd\u003eConviértelo en skill: \u003ccode\u003e.opencode/skills/&lt;nombre&gt;/SKILL.md\u003c/code\u003e dentro del proyecto. Reinicia opencode y pídeselo por su nombre.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEl resultado parece correcto, pero quieres comprobarlo\u003c/td\u003e\n\u003ctd\u003e«Parece» no es «está»: el agente puede equivocarse con total seguridad.\u003c/td\u003e\n\u003ctd\u003ePídele las fuentes, el archivo exacto que ha tocado o el comando que ha usado, y compruébalo tú: abre el archivo y cuenta.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTe preocupa la privacidad de unos datos\u003c/td\u003e\n\u003ctd\u003eEl agente trabaja con lo que le des y con las herramientas que tengas conectadas.\u003c/td\u003e\n\u003ctd\u003eNo pegues credenciales ni datos personales si no hacen falta: usa datos de ejemplo o trabaja en local. Revisa qué servicios tienes conectados antes de empezar.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003ch3 id=\"checklist-de-30-segundos-antes-de-aprobar\"\u003eChecklist de 30 segundos antes de aprobar\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e¿Entiendo \u003cstrong\u003equé\u003c/strong\u003e quiere hacer exactamente?\u003c/li\u003e\n\u003cli\u003e¿Sobre \u003cstrong\u003equé carpeta o archivo\u003c/strong\u003e lo va a hacer, y está dentro de mi espacio de trabajo?\u003c/li\u003e\n\u003cli\u003e¿Podría \u003cstrong\u003edeshacerlo\u003c/strong\u003e si sale mal? ¿Tengo copia?\u003c/li\u003e\n\u003cli\u003e¿Hay \u003cstrong\u003ecredenciales o datos personales\u003c/strong\u003e de por medio?\u003c/li\u003e\n\u003cli\u003e¿Me lo ha pedido \u003cstrong\u003eyo\u003c/strong\u003e, o viene de algo que ha \u003cstrong\u003eleído\u003c/strong\u003e (una web, un PDF, un correo)? Si no lo pedí, sospecha.\u003c/li\u003e\n\u003cli\u003eSi dudo: \u003cstrong\u003edeniego\u003c/strong\u003e y le pido otra vía. «Permitir una vez» es solo esa vez.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"las-7-reglas-de-oro\"\u003eLas 7 reglas de oro\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eTrabaja dentro de tu espacio de trabajo.\u003c/strong\u003e Lo de fuera es la excepción, no la norma.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo apruebes lo que no entiendes.\u003c/strong\u003e El aviso de aprobación existe para que lo leas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePide el plan antes del cambio\u003c/strong\u003e cuando vaya a tocar tus archivos (modo plan).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCopia de seguridad antes\u003c/strong\u003e de cualquier cambio masivo. Sin copia no hay marcha atrás.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eExige pruebas:\u003c/strong\u003e fuente, archivo tocado y cómo comprobarlo. Y compruébalo tú.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePermiso mínimo:\u003c/strong\u003e ni acceso total ni credenciales que no hagan falta.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLa última palabra es tuya.\u003c/strong\u003e Revisa el resultado antes de darlo por bueno.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"limites-que-conviene-recordar\"\u003eLímites que conviene recordar\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eEl agente \u003cstrong\u003ese equivoca con seguridad\u003c/strong\u003e y puede \u003cstrong\u003eactuar rápido sobre cosas reales\u003c/strong\u003e: archivos de verdad, carpetas de verdad, datos de verdad.\u003c/li\u003e\n\u003cli\u003eEl \u003cstrong\u003esandbox y las aprobaciones reducen el riesgo, pero no lo eliminan\u003c/strong\u003e: no garantizan aislamiento y no deben ser tu único control de seguridad.\u003c/li\u003e\n\u003cli\u003eopencode \u003cstrong\u003ecambia muy rápido\u003c/strong\u003e y de serie \u003cstrong\u003econfía mucho\u003c/strong\u003e: dentro de la carpeta lee, escribe y ejecuta órdenes sin preguntar, y no tiene sandbox.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGratis no es privado:\u003c/strong\u003e algunos modelos gratuitos usan lo que les envías para mejorar.\u003c/li\u003e\n\u003cli\u003ePor eso: \u003cstrong\u003emínimo privilegio\u003c/strong\u003e, mejor una \u003cstrong\u003emáquina virtual o un contenedor desechable\u003c/strong\u003e, \u003cstrong\u003ecopias de seguridad\u003c/strong\u003e, \u003cstrong\u003enada de credenciales a la vista\u003c/strong\u003e y \u003cstrong\u003erevisar plugins y comandos antes de permitirlos\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eLo que el agente \u003cstrong\u003elee de fuera puede traer órdenes escondidas\u003c/strong\u003e (inyección de instrucciones). Nunca juntes datos confidenciales, contenido de origen dudoso y salida a internet en la misma tarea.\u003c/li\u003e\n\u003cli\u003eY recuerda: \u003cstrong\u003ela responsabilidad de revisar es tuya\u003c/strong\u003e, no del agente.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"datos-de-referencia\"\u003eDatos de referencia\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eInstalación: \u003ccode\u003enpm install -g opencode-ai\u003c/code\u003e; comprobar con \u003ccode\u003eopencode --version\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eArranque con interfaz web: \u003ccode\u003eopencode web\u003c/code\u003e (desde la carpeta de trabajo)\u003c/li\u003e\n\u003cli\u003eInterfaz web: la dirección que aparece en la terminal, por ejemplo \u003ca href=\"http://127.0.0.1:4096\"\u003ehttp://127.0.0.1:4096\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eConfiguración del usuario en Windows: \u003ccode\u003eC:\\Users\\&lt;tu_usuario&gt;\\.config\\opencode\u003c/code\u003e, con el \u003ccode\u003eopencode.json\u003c/code\u003e y el AGENTS.md globales\u003c/li\u003e\n\u003cli\u003ePermisos del proyecto: \u003ccode\u003eopencode.json\u003c/code\u003e en la raíz (\u003ccode\u003e&quot;edit&quot;\u003c/code\u003e, \u003ccode\u003e&quot;bash&quot;\u003c/code\u003e, \u003ccode\u003e&quot;external_directory&quot;\u003c/code\u003e: \u003ccode\u003eallow\u003c/code\u003e, \u003ccode\u003eask\u003c/code\u003e o \u003ccode\u003edeny\u003c/code\u003e)\u003c/li\u003e\n\u003cli\u003eMemoria permanente: AGENTS.md global en la carpeta de configuración del usuario y AGENTS.md en la raíz del proyecto\u003c/li\u003e\n\u003cli\u003eSkills del proyecto: \u003ccode\u003e.opencode/skills/&lt;nombre&gt;/SKILL.md\u003c/code\u003e (ejemplo: \u003ccode\u003e.opencode/skills/resumen-informes/SKILL.md\u003c/code\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n","texto":"22 min de lectura Glosario y chuleta — «Del chat al agente: qué es un harness y cómo se usa» Curso práctico con opencode . La Parte 1 es el glosario; la Parte 2 , la chuleta para tener al lado del portátil. Parte 1 — Glosario Términos en orden alfabético, explicados en lenguaje llano y con un ejemplo corto. Cuando un concepto se apoya en otro, aparece marcado como (ver …) . A2A (Agent2Agent) — Estándar abierto para que agentes de distintos fabricantes se hablen entre sí y se repartan trabajo. MCP conecta un agente con herramientas; A2A conecta un agente con otro agente. En la práctica: el agente de tu empresa encarga a otro agente, de otro proveedor, que consulte un catálogo y le devuelva el resultado. Acceso total — El nivel de sandbox más permisivo: el agente puede leer y escribir en todo el ordenador. Se elige a conciencia, nunca por comodidad. En la práctica: tiene sentido en una máquina de pruebas o desechable; en tu ordenador de diario, casi nunca. Agente — Programa que, además de responderte, puede hacer cosas por su cuenta en tu ordenador: leer y escribir archivos, ejecutar comandos, buscar en internet. En la práctica: le dices «ordena las facturas de esta carpeta» y las ordena él; tú revisas el resultado después. Agente de navegador (uso del ordenador) — Agente que maneja un navegador o el escritorio como lo harías tú: mira la pantalla, hace clic y escribe en formularios. En la práctica: «busca tres vuelos y déjame la comparativa». Útil, pero cada web que visita es contenido de fuera (ver Inyección de instrucciones ). Agente en segundo plano (en la nube) — Agente que trabaja solo, sin que estés mirando, a menudo en un ordenador remoto, y te avisa cuando acaba con un resultado para revisar. En la práctica: le dejas un encargo largo por la tarde y por la mañana revisas lo que propone. Revisar sigue siendo cosa tuya. AGENTS.md — Archivo de texto con las normas que quieres que el agente siga siempre. Puede ser global (en tu carpeta de configuración) o de un proyecto concreto (en la raíz del proyecto). En la práctica: «no borres archivos nunca; avísame antes de instalar nada». Alucinación — Cuando el modelo se inventa un dato, una cita o un comando con total seguridad. No miente a propósito: rellena huecos. En la práctica: te da un enlace que no existe. Por eso se piden fuentes y se comprueba todo (ver Verificación ). API — La puerta que usan los programas para hablar con un servicio por internet, sin pasar por una web ni por una persona. En la práctica: el harness usa la API del proveedor del modelo para pedirle respuestas. Aprobación — El aviso que aparece cuando el agente quiere hacer algo que no tiene permitido hacer solo, para que tú digas sí o no antes de que lo haga. En la práctica: quiere escribir en una carpeta que está fuera de su zona y te pide permiso (ver Sandbox ). Bucle agéntico — El ciclo de trabajo del agente: piensa un paso, usa una herramienta, mira el resultado y repite hasta acabar. En la práctica: buscar → leer → corregir → volver a buscar. Por eso tarda y da varios pasos aunque tú escribas una sola frase. Chat — Conversación en la que el modelo solo escribe texto y el trabajo lo haces tú después. Es un consultor por teléfono. En la práctica: te explica cómo ordenar tus fotos; las ordenas tú. Clave de API — Contraseña larga que identifica tu cuenta y autoriza el uso del servicio. No se comparte con nadie. En el curso no hace falta: los modelos gratuitos de opencode funcionan sin clave. En la práctica: funciona como la llave de tu casa: quien la tenga, entra (y gasta tu saldo). Comando — Orden que se le da al ordenador escribiéndola, casi siempre en la terminal. En la práctica: opencode web es un comando. Se copia, se pega y se pulsa Intro. Compactación — Cuando la conversación llena la ventana de contexto, el harness resume lo anterior para hacer sitio y seguir trabajando. En la práctica: tras una tarea muy larga, el agente puede haber perdido un detalle que le diste al principio. Si es importante, repítelo o déjalo escrito en AGENTS.md . Contenedor — Entorno aislado y desechable donde puedes ejecutar el agente sin tocar tu ordenador de verdad. En la práctica: si algo se rompe dentro, tu equipo no se entera. Es una de las formas recomendadas de probar. Contexto — Todo lo que el agente tiene delante en ese momento: tu petición, la conversación, los archivos que ha leído y las respuestas de las herramientas. Es su mesa de trabajo. En la práctica: si la mesa se llena de papeles, se pierde; conviene empezar una sesión nueva (ver Sesión ). Copia de seguridad — Duplicado de tus archivos, guardado aparte, para poder volver atrás si algo sale mal. En la práctica: antes de dejar que el agente toque 200 archivos, haz una copia. Es tu red de seguridad. Credencial — Cualquier dato que da acceso a algo tuyo: contraseñas, claves de API, tokens de acceso, datos de tarjeta. En la práctica: no las pegues en una petición si no son imprescindibles. Lo que escribes viaja al servicio. opencode — El programa de este curso: un harness de código abierto que convierte un modelo en un agente, con interfaz web, herramientas y permisos. Trae modelos gratuitos. Se instala con npm install -g opencode-ai y se arranca con opencode web . En la práctica: es el coche completo; el modelo es solo el motor (ver Harness , ver LLM ). Delegación — Pedirle al agente que encargue una parte del trabajo a otro agente y te devuelva el resultado. En la práctica: «que otro agente revise estos 40 archivos y me traiga un resumen». Tú sigues hablando con el primero. Detener (interrumpir) — Cortar el trabajo que el agente está haciendo ahora mismo. Lo que ya ha hecho se queda hecho. En la práctica: tras detenerlo, pídele la lista de archivos que ha tocado y revísalos. Espacio de trabajo (proyecto) — La carpeta que le entregas al agente como su zona de trabajo. Lo que haga dentro es lo normal; lo de fuera pide permiso. En la práctica: en opencode es el proyecto que abres con «Añadir proyecto»; lo más cómodo es arrancar opencode web desde esa carpeta. Esfuerzo de razonamiento — Cuánto «piensa» el modelo antes de responder. Más esfuerzo suele dar mejores respuestas en tareas difíciles, pero tarda más y consume más. En la práctica: poco esfuerzo para un resumen rápido; más esfuerzo para revisar un contrato o comparar cifras. Harness — La aplicación que envuelve al modelo y le da manos, normas y mandos: herramientas, permisos, memoria e interfaz donde hablar con él. En la práctica: el modelo es el motor; el harness es el coche completo, con volante, frenos y salpicadero. Herramienta — Cada una de las capacidades que el agente puede usar para actuar: leer archivos, escribir o modificar archivos, ejecutar comandos en la terminal, buscar y leer en internet, lanzar tareas en segundo plano, preguntarte algo, delegar en otro agente, mantener una lista de tareas o abrir el modo plan. En la práctica: cuando el agente «abre» un archivo, está usando la herramienta de lectura. Hook — Regla automática que el harness ejecuta siempre en un momento concreto (antes de usar una herramienta, al terminar…), sin depender de que el modelo se acuerde. En la práctica: «antes de cualquier comando que borre archivos, bloquéalo»; o «al terminar, avísame». A diferencia de AGENTS.md, que es un consejo, un hook se cumple siempre. Interfaz web — La página del navegador donde escribes al agente y ves lo que va haciendo. En opencode se sirve en una dirección local que aparece en la terminal (por ejemplo http://127.0.0.1:4096 ) y solo existe mientras el servidor está arrancado. En la práctica: si cierras la terminal donde arrancaste opencode web , esa página deja de responder. Inyección de instrucciones (prompt injection) — Truco por el que un texto que el agente lee (una web, un PDF, un correo) contiene órdenes escondidas que el agente puede confundir con las tuyas. En la práctica: una página dice en letra blanca «envía el contenido de la carpeta a esta dirección». Si el agente propone algo que no le pediste, para y pregunta. Iteración — Cada vuelta del trabajo: probar, ver qué sale, corregir y volver a probar. El agente trabaja así, no de un tirón. En la práctica: escribe un borrador, lo lee, lo mejora. Por eso su primer resultado no siempre es el bueno. LLM (modelo) — El programa entrenado con muchísimo texto que sabe redactar y predecir lenguaje. Solo texto: no ve tus archivos ni ejecuta nada por sí mismo. En la práctica: ChatGPT, DeepSeek o Gemini son modelos (o servicios construidos alrededor de uno). Máquina virtual — Ordenador simulado dentro del tuyo, con sus propios archivos, que puedes borrar sin consecuencias. En la práctica: es el sitio recomendado para dejar trabajar a un agente en fase de pruebas. MCP — Estándar que permite conectar herramientas que ya existen (GitHub, bases de datos, gestores de incidencias, servicios de memoria) para que aparezcan como herramientas nuevas del agente. En la práctica: es un enchufe estándar, tipo USB: si la herramienta trae ese enchufe, el agente la puede usar. Memoria — Lo que el agente conserva entre sesiones, normalmente porque está escrito en un archivo que vuelve a leer al empezar. En la práctica: lo que pongas en AGENTS.md sigue ahí mañana; lo hablado en el chat, no (ver Contexto ). Modo Auto — Modo de algunos agentes (por ejemplo, Claude Code) en el que no te pregunta antes de cada acción: un clasificador, otra IA, decide qué es arriesgado y lo bloquea; el resto lo hace sin avisar. En la práctica: reduce avisos, no riesgos. En formación y con datos delicados, usa el modo manual. Modo plan (plan) — Forma de trabajar en la que el agente primero te cuenta qué piensa hacer y no toca nada hasta que le das el visto bueno. En la práctica: imprescindible antes de dejarle modificar 200 archivos. Node.js — Programa que hay que tener instalado en el ordenador para poder arrancar el harness. Es el requisito previo. En la práctica: si el comando de arranque se queja de que no encuentra Node, es justo esto lo que falta. Permiso — La regla que decide qué puede hacer el agente sin preguntar y qué no. Lo que queda fuera de lo permitido dispara un aviso de aprobación. En la práctica: puede leer en toda la carpeta de trabajo, pero escribir solo en una parte. Plugin — Pieza que se añade al harness para darle capacidades nuevas, a veces conectando servicios externos. En la práctica: un plugin puede añadir una herramienta que no venía de serie. No es lo mismo que el harness (ver Harness ). Política de permisos — El conjunto de ajustes que fija hasta dónde llega el agente y cuándo tiene que preguntar. En opencode, de serie, no pregunta dentro de la carpeta y sí para salir de ella; se cambia en opencode.json . En la práctica: combina el nivel de acceso del sandbox con la política de aprobaciones (por defecto: preguntar). Prompt — El texto que le escribes al agente: tu petición, el encargo. Cuanto más claro el encargo, mejor el resultado. En la práctica: «resume este PDF en cinco puntos» funciona mucho mejor que «mírame esto». Proveedor — La empresa o servicio que pone el modelo a disposición de los programas. En la práctica: en este curso, OpenCode, que ofrece modelos gratuitos sin registro. Cada uno tiene su política de datos: mírala antes de usarlo. Ruta (ruta de archivo) — La dirección que indica dónde está un archivo o una carpeta dentro del ordenador. En la práctica: C:\\Users\\ tu_usuario \\.config\\opencode es una ruta: la carpeta de configuración de opencode en Windows. Sandbox — Zona de trabajo delimitada donde el agente puede moverse. Hay niveles: solo lectura; escritura limitada al espacio de trabajo; acceso total. opencode no tiene sandbox: limita con permisos. En la práctica: dentro de la zona trabaja sin molestarte; fuera, salta el «¿seguro?». Sesión — Cada conversación con el agente, con su propio hilo y su propio contexto. Se guardan y puedes volver a ellas. En la práctica: si el contexto se llena, abres una sesión nueva y arrastras solo lo importante. Skill — Procedimiento guardado que el agente puede repetir cuando se lo pides. Es una carpeta con un archivo SKILL.md , un formato abierto que entienden muchos harnesses (Claude, Codex, opencode…). En opencode vive en .opencode/skills/ nombre /SKILL.md dentro del proyecto y se carga al arrancar. En la práctica: son recetas de cocina: los pasos ya escritos, para no explicarlos cada vez. En la Práctica 4 creas .opencode/skills/resumen-informes/SKILL.md . Subagente — Agente auxiliar al que el agente principal encarga una parte del trabajo. Trabaja con su propia mesa (su propio contexto) y solo devuelve el resultado. En la práctica: «revisa estos cuarenta documentos y dime cuáles hablan de garantías»: el subagente lee los cuarenta y al agente principal solo le llega la lista (ver Delegación ). Tarea en segundo plano — Trabajo largo que el agente lanza y deja corriendo mientras sigue hablando contigo. Te avisa cuando termina. En la práctica: procesar 300 archivos mientras tú preparas el siguiente encargo. Terminal — La ventana de texto donde se le dan órdenes al ordenador escribiendo, en vez de haciendo clic. Es donde se arranca el harness. En la práctica: ahí escribes opencode web y pulsas Intro. Token — Trozo pequeño de texto (una palabra, media palabra, un signo) con el que el modelo cuenta y procesa. El precio y los límites se miden en tokens. En la práctica: «gasolineras» puede ser dos o tres tokens. No son letras ni palabras exactas. Trifecta letal — Combinación peligrosa de tres capacidades en un mismo agente: acceso a datos privados, lectura de contenido de fuera y capacidad de comunicarse hacia fuera. Con las tres juntas, una inyección de instrucciones puede sacar tus datos. En la práctica: si trabajas con datos confidenciales, quítale al menos una de las tres (por ejemplo, el acceso a internet). Ventana de contexto — El tamaño máximo de contexto que cabe de una vez. Cuando se supera, lo más antiguo se cae o se resume. En la práctica: hilos muy largos con muchos archivos pegados acaban empujando fuera lo del principio. Verificación — Comprobar el resultado en lugar de creértelo: abrir el archivo, mirar la fuente, contar las filas, repetir el cálculo. En la práctica: el agente dice «he actualizado 12 filas»; tú abres el archivo y las cuentas. Palabras que se confunden Se parecen, pero no son lo mismo. Una frase para cada pareja: Modelo vs. harness — El modelo es el motor que redacta; el harness es el coche entero, con volante, frenos y salpicadero. Chat vs. agente — El chat es un consultor por teléfono (te dice qué hacer y lo haces tú); el agente es un becario con acceso a tu ordenador (lo hace y tú revisas). Contexto vs. memoria — El contexto es lo que tiene delante ahora mismo (la mesa de trabajo); la memoria es lo que queda guardado para la próxima vez. Permiso vs. aprobación — El permiso es la regla escrita; la aprobación es el «¿seguro?» que te llega cuando algo se sale de esa regla. Harness vs. plugin — El harness es la aplicación completa; un plugin es una pieza que le añades para darle una capacidad nueva. Sandbox vs. espacio de trabajo — El sandbox es el nivel de libertad (leer, escribir, acceso total); el espacio de trabajo es la carpeta concreta donde ese nivel se aplica. AGENTS.md vs. skill vs. hook — AGENTS.md son notas que el agente lee siempre; una skill es una receta que solo saca cuando la tarea la necesita; un hook es una regla que el harness hace cumplir aunque el modelo no se acuerde. MCP vs. A2A — MCP enchufa herramientas y datos a un agente; A2A pone a dos agentes a hablar entre ellos. Parte 2 — Chuleta de una página Antes de empezar (cinco minutos) Node.js y opencode instalados ( npm install -g opencode-ai ). No necesitas clave de API. Decide la carpeta de trabajo y comprueba que tiene dentro lo que necesitas. No trabajes sobre tu carpeta personal entera. Elige un modelo gratuito que no use tus datos para entrenar (mira la política de privacidad de opencode). Haz una copia de seguridad de lo que el agente vaya a tocar. Asume que cambia rápido: versiones casi semanales y modelos gratuitos «por tiempo limitado». Puesta en marcha (5 pasos) Instala Node.js si no lo tienes, y después opencode: npm install -g opencode-ai . Abre la terminal en la carpeta que quieras usar como espacio de trabajo y arranca: opencode web . Espera a que se abra el navegador. Si no se abre solo, copia la dirección que aparece en la terminal (por ejemplo http://127.0.0.1:4096 ). Abre la carpeta: «Añadir proyecto» → escribe la ruta (por ejemplo Documents/practica_agente ) → elígela → «Nueva sesión». Elige el modelo: pulsa su nombre bajo el cuadro de mensajes y escoge uno marcado como Gratis . La configuración ( opencode.json ) y las skills se leen al arrancar: si las cambias, apaga con Ctrl + C y vuelve a lanzar opencode web . Cómo pedir bien Una petición vaga se convierte en una petición con objetivo , alcance y criterio de éxito . En vez de esto Pide esto Por qué «Resúmeme esto» «Lee los tres PDF de la carpeta facturas y hazme una tabla con fecha, proveedor e importe total» Le das el objetivo, dónde mirar y en qué formato quieres la respuesta. «Arréglame la web» «En la carpeta web , dime primero qué enlaces del menú están rotos. No cambies nada todavía» Separas el diagnóstico del cambio: primero información, luego decisiones. «Ordena mis archivos» «Mueve los .jpg de Descargas a Fotos , no borres nada y dime cuántos has movido» Alcance cerrado y un número al final que puedes comprobar. «Hazme un informe de ventas» «Con ventas.csv , escribe un informe de una página con tres conclusiones. No modifiques el csv» Queda claro qué debe entregar y qué no debe tocar. «Busca información sobre MCP» «Busca en internet qué es MCP y dame tres enlaces con la fecha de cada uno» Pides fuentes: así puedes verificar de dónde sale cada dato. «Limpia este código» «Revisa el archivo y propón tres mejoras. Espera mi OK antes de editar» Si el trabajo toca lo tuyo, mejor ver el plan antes de que actúe. «Hazlo rápido y bien» «Antes de empezar, resúmeme en cinco líneas qué vas a hacer y qué necesitas de mí» Un plan corto evita media hora de trabajo en la dirección equivocada. «Revisa la hoja de cálculo» «Comprueba si el total de cada fila cuadra con sus importes y dime en qué filas no cuadra» Le das un criterio de éxito comprobable, no una opinión. «Cada semana quiero lo mismo» «Guarda este procedimiento como skill y repítelo tal cual cuando te lo pida» Lo que se repite se escribe una vez y se reutiliza (ver Skill ). «No sé, haz algo con esta carpeta» «Dime qué hay en la carpeta y tres cosas útiles que se podrían hacer. No cambies nada» Explorar primero, decidir después. Frases que puedes copiar tal cual «Antes de tocar nada, dime qué has entendido y qué piensas hacer.» «Trabaja solo dentro de esta carpeta. Si necesitas algo de fuera, pídemelo.» «No borres ni sobrescribas nada sin avisarme antes.» «Cuando termines, dime exactamente qué archivos has creado o modificado.» «Cita la fuente de cada dato que me des.» «Si algo no lo sabes con seguridad, dilo en vez de inventártelo.» «Termina con un resumen de cinco líneas: qué has hecho y qué queda pendiente.» Qué hacer cuando pasa esto Situación Qué significa Qué haces Aparece un aviso de aprobación El agente quiere hacer algo que su política de permisos no le deja hacer solo. «Permitir una vez» es solo esa vez : no concede permiso permanente. Lee con calma qué te pide. Si lo entiendes y tiene sentido, permite; si no, deniega y pídele otra vía. Es incómodo a propósito. Quiere escribir fuera de la carpeta opencode pide permiso para todo lo que esté fuera del proyecto. Mueve o copia lo necesario dentro de la carpeta de trabajo, o cambia de espacio de trabajo. No le des acceso total por comodidad. El modelo da error o dice que está saturado Los modelos gratuitos a veces se saturan o desaparecen. Pulsa el nombre del modelo y elige otro marcado como Gratis . El agente lleva mucho rato Está encadenando pasos, esperando una aprobación tuya o tiene una tarea en segundo plano en marcha. Pídele un resumen de en qué punto está. Si no avanza, deténlo y parte la tarea en trozos más pequeños. Se equivoca y va a peor Está iterando sobre un error y cada intento toca más cosas. Deténlo ya. Pídele que explique qué ha cambiado y cómo deshacerlo, y restaura desde tu copia de seguridad si hace falta. Quieres pararlo Se corta el trabajo en curso, pero lo que ya ha hecho se queda hecho. Usa el control de detener de la interfaz. Si no lo encuentras, escríbele «para» y espera a que termine el paso actual. Luego revisa lo que haya tocado. Quieres que recuerde algo para siempre El contexto de la conversación no se conserva entre sesiones; la memoria escrita sí. Escríbelo en AGENTS.md: el global (en tu carpeta de configuración del usuario) vale para todo; el de la raíz del proyecto, solo para ese proyecto. Quieres que repita una tarea igual cada semana Necesitas un procedimiento guardado, no volver a explicarlo cada vez. Conviértelo en skill: .opencode/skills/ nombre /SKILL.md dentro del proyecto. Reinicia opencode y pídeselo por su nombre. El resultado parece correcto, pero quieres comprobarlo «Parece» no es «está»: el agente puede equivocarse con total seguridad. Pídele las fuentes, el archivo exacto que ha tocado o el comando que ha usado, y compruébalo tú: abre el archivo y cuenta. Te preocupa la privacidad de unos datos El agente trabaja con lo que le des y con las herramientas que tengas conectadas. No pegues credenciales ni datos personales si no hacen falta: usa datos de ejemplo o trabaja en local. Revisa qué servicios tienes conectados antes de empezar. Checklist de 30 segundos antes de aprobar ¿Entiendo qué quiere hacer exactamente? ¿Sobre qué carpeta o archivo lo va a hacer, y está dentro de mi espacio de trabajo? ¿Podría deshacerlo si sale mal? ¿Tengo copia? ¿Hay credenciales o datos personales de por medio? ¿Me lo ha pedido yo , o viene de algo que ha leído (una web, un PDF, un correo)? Si no lo pedí, sospecha. Si dudo: deniego y le pido otra vía. «Permitir una vez» es solo esa vez. Las 7 reglas de oro Trabaja dentro de tu espacio de trabajo. Lo de fuera es la excepción, no la norma. No apruebes lo que no entiendes. El aviso de aprobación existe para que lo leas. Pide el plan antes del cambio cuando vaya a tocar tus archivos (modo plan). Copia de seguridad antes de cualquier cambio masivo. Sin copia no hay marcha atrás. Exige pruebas: fuente, archivo tocado y cómo comprobarlo. Y compruébalo tú. Permiso mínimo: ni acceso total ni credenciales que no hagan falta. La última palabra es tuya. Revisa el resultado antes de darlo por bueno. Límites que conviene recordar El agente se equivoca con seguridad y puede actuar rápido sobre cosas reales : archivos de verdad, carpetas de verdad, datos de verdad. El sandbox y las aprobaciones reducen el riesgo, pero no lo eliminan : no garantizan aislamiento y no deben ser tu único control de seguridad. opencode cambia muy rápido y de serie confía mucho : dentro de la carpeta lee, escribe y ejecuta órdenes sin preguntar, y no tiene sandbox. Gratis no es privado: algunos modelos gratuitos usan lo que les envías para mejorar. Por eso: mínimo privilegio , mejor una máquina virtual o un contenedor desechable , copias de seguridad , nada de credenciales a la vista y revisar plugins y comandos antes de permitirlos . Lo que el agente lee de fuera puede traer órdenes escondidas (inyección de instrucciones). Nunca juntes datos confidenciales, contenido de origen dudoso y salida a internet en la misma tarea. Y recuerda: la responsabilidad de revisar es tuya , no del agente. Datos de referencia Instalación: npm install -g opencode-ai ; comprobar con opencode --version Arranque con interfaz web: opencode web (desde la carpeta de trabajo) Interfaz web: la dirección que aparece en la terminal, por ejemplo http://127.0.0.1:4096 Configuración del usuario en Windows: C:\\Users\\ tu_usuario \\.config\\opencode , con el opencode.json y el AGENTS.md globales Permisos del proyecto: opencode.json en la raíz ( edit , bash , external_directory : allow , ask o deny ) Memoria permanente: AGENTS.md global en la carpeta de configuración del usuario y AGENTS.md en la raíz del proyecto Skills del proyecto: .opencode/skills/ nombre /SKILL.md (ejemplo: .opencode/skills/resumen-informes/SKILL.md )"}],"diagnostico":[{"id":"I1","pregunta":"Cuando hablamos del «modelo» y del «harness», ¿cómo lo describirías?","opciones":["Son lo mismo: el programa que instalas y la inteligencia que responde.","El modelo piensa y escribe; el harness es el programa que lo rodea y le da herramientas.","El modelo es la interfaz web; el harness es el servidor donde se ejecuta.","El modelo es de pago y el harness es gratis."],"correcta":1,"porque":"El modelo es el motor; el harness es el coche completo: volante, frenos y salpicadero."},{"id":"I2","pregunta":"¿Qué crees que puede hacer un agente que un chat normal no hace?","opciones":["Escribir textos más largos y con mejor estilo.","Actuar sobre tu ordenador: leer y modificar archivos, ejecutar comandos, y tú revisas.","Contestarte sin conexión a internet.","Saber ya todo lo que hay en tu ordenador sin que se lo indiques."],"correcta":1,"porque":"La diferencia de fondo no es la calidad del texto, sino que actúa sobre tus archivos. La opción D confunde la memoria del modelo con leer archivos: el agente solo ve lo que lee con herramientas y con permisos."},{"id":"I3","pregunta":"Cuando el agente te pide un permiso, ¿qué crees que está pasando?","opciones":["Va a hacer algo fuera de la zona delimitada y te pregunta antes de tocarlo.","Se ha quedado sin saldo en tu cuenta.","Ha encontrado un problema de seguridad en tu ordenador.","Te está pidiendo que escribas tú el comando en la terminal."],"correcta":0,"porque":"Es el «¿seguro?» en la puerta: el agente quiere salir de su sala y te pide permiso antes de hacerlo."},{"id":"I4","pregunta":"Si el agente se equivoca y cambia algo que no querías, ¿qué crees que ocurre?","opciones":["El harness lo revierte solo: no hay nada de lo que preocuparse.","Los cambios pueden ser difíciles de recuperar; conviene trabajar con copias de seguridad y permisos limitados.","Con la política de aprobaciones que viene por defecto es imposible que pase.","El agente detecta el error y lo corrige sin avisarte."],"correcta":1,"porque":"No hay red de seguridad automática. De ahí las cuatro reglas: copia de seguridad, carpeta específica, nada confidencial y revisar siempre."}],"final":[{"id":"F1","pregunta":"¿Qué aporta el harness frente al modelo por sí solo?","opciones":["Un modelo más potente y más rápido que el que usa el chat.","Un programa que rodea al modelo y le da herramientas, permisos, memoria y control sobre lo que hace.","Un traductor que pasa tus mensajes a un idioma que el modelo entiende.","Un intermediario que responde por el modelo cuando no hay conexión."],"correcta":1,"porque":"El modelo es el motor; el harness es el coche completo. La opción A es tentadora porque el modelo es lo único que «se ve» en un chat, pero el modelo no tiene herramientas, permisos ni memoria de proyecto."},{"id":"F2","pregunta":"El agente trabaja en un bucle de pensar, actuar y observar. ¿Qué significa «observar»?","opciones":["Que te pregunta a ti si el resultado le parece bien.","Que lee el resultado de lo que acaba de hacer y decide el siguiente paso.","Que guarda la conversación para que no se te olvide nada.","Que comprueba si tiene permiso de administrador en tu ordenador."],"correcta":1,"porque":"El bucle es pensar, actuar y mirar el resultado para decidir el paso siguiente. La opción A es tentadora porque el agente a veces pregunta al usuario, pero eso es otra herramienta, no el paso de observar."},{"id":"F3","pregunta":"¿Qué es una «herramienta» para el agente?","opciones":["Un complemento que hay que comprar aparte.","Una capacidad concreta que puede usar: leer archivos, escribir archivos, ejecutar comandos, buscar en internet.","Un atajo de teclado de la interfaz web.","El menú de Ajustes donde se configura la clave de API."],"correcta":1,"porque":"Las herramientas son capacidades concretas que el agente puede invocar. La opción D confunde «herramienta» con la configuración, y la A porque muchos complementos de otros programas se pagan aparte."},{"id":"F4","pregunta":"El contexto es la mesa de trabajo del agente. ¿Qué pasa cuando se llena de papeles?","opciones":["Nada: el contexto no tiene límite.","El agente se para y hay que reiniciar la aplicación.","Pierde precisión y olvida detalles anteriores; conviene resumir, dividir la tarea o empezar de nuevo.","Se borran los archivos que ya había creado en el espacio de trabajo."],"correcta":2,"porque":"Si la mesa se llena de papeles, hay que recoger: resumir, dividir o empezar una tarea nueva. La opción A es tentadora porque el chat parece recordar siempre, pero se le escapan los detalles."},{"id":"F5","pregunta":"Ante un aviso de aprobación eliges «Permitir una vez». ¿Qué implica?","opciones":["Que autorizas esa acción concreta ahora; la próxima vez volverá a preguntar.","Que autorizas esa acción para siempre en este proyecto.","Que autorizas todas las acciones del agente durante el resto de la sesión.","Que el agente ya no necesita permisos para nada."],"correcta":0,"porque":"Vale solo para esa vez: no concede permiso permanente, y esa incomodidad es intencionada. La opción B es el error más típico: creer que aprobar una vez vale para siempre."},{"id":"F6","pregunta":"Sobre el sandbox, ¿qué afirmación es correcta?","opciones":["Garantiza un aislamiento total: nada de lo que haga el agente puede afectar a tu ordenador.","Delimita dónde puede trabajar el agente y reduce el riesgo, pero no garantiza aislamiento.","Es una copia de seguridad automática de tus archivos.","Solo hace falta si trabajas con datos muy sensibles."],"correcta":1,"porque":"El sandbox delimita la zona de trabajo y las aprobaciones son el «¿seguro?» antes de salir de ella, pero eso reduce el riesgo, no garantiza aislamiento. La opción A es tentadora porque suena a «modo seguro» y no lo es."},{"id":"F7","pregunta":"¿Qué es una skill y para qué sirve?","opciones":["Un procedimiento guardado que el agente sigue cuando la tarea encaja, como una receta de cocina.","Un permiso permanente que le das al agente.","Un modelo más rápido y más barato que el habitual.","Una carpeta donde el agente va dejando los resultados."],"correcta":0,"porque":"Las skills son procedimientos guardados, como recetas: se escriben una vez y se reutilizan. La opción B la confunde con los permisos y la D con la carpeta de resultados."},{"id":"F8","pregunta":"¿Para qué sirve el archivo AGENTS.md?","opciones":["Para guardar las conversaciones anteriores y poder volver a ellas.","Para indicar qué modelo y qué clave de API debe usar el agente.","Para dejarle por escrito lo que debe saber siempre: cómo trabajas, tus normas y las rutas importantes.","Para declarar qué herramientas de terceros tiene permitidas."],"correcta":2,"porque":"AGENTS.md son las notas que dejas al becario antes de que empiece; hay uno global y otro por proyecto. La opción A lo confunde con el historial de sesiones y la B con los ajustes de modelo."},{"id":"F9","pregunta":"¿Qué es MCP?","opciones":["Un modelo de lenguaje especializado en programación.","Un estándar que permite conectar herramientas que ya existen (GitHub, bases de datos, gestores de incidencias) para que aparezcan como herramientas nuevas del agente.","Un modo de seguridad que bloquea la conexión a internet.","El formato de los documentos que el agente puede leer."],"correcta":1,"porque":"MCP es un enchufe estándar, tipo USB, para conectar herramientas que ya existen sin escribir nada nuevo. La opción A lo confunde con un modelo y la D con un formato de archivo."},{"id":"F10","pregunta":"El agente se equivoca, lo corriges y empeora. ¿Qué es lo más sensato?","opciones":["Insistir con la misma instrucción y subir el tono.","Parar, revisar qué ha hecho, y si hace falta volver atrás o replantear la tarea en trozos más pequeños y con más contexto.","Darle acceso total para que se arregle solo.","Cerrar la aplicación: significa que el agente no sirve para esto."],"correcta":1,"porque":"Parar, revisar lo hecho y replantear la tarea en trozos pequeños suele resolverlo. La opción C es tentadora porque parece que más permisos dan más capacidad, pero normalmente agrandan el problema; la A solo repite el error."},{"id":"F11","pregunta":"Vas a instalar un plugin de terceros. ¿Cuál es el riesgo principal?","opciones":["Que ocupe mucho espacio en el disco.","Que cambie el idioma de la interfaz.","Que ejecute código con los mismos permisos que el agente y llegue a tus datos o a tus credenciales.","Que solo funcione con la versión de pago del modelo."],"correcta":2,"porque":"Un plugin corre con los permisos del agente, así que puede llegar a lo mismo que él. La opción A es tentadora porque es el riesgo fácil de imaginar, pero el daño real no es el espacio en disco."},{"id":"F12","pregunta":"Vas a usar uno de los modelos gratuitos de opencode. ¿Qué es lo más prudente?","opciones":["Usarlo con tus documentos de trabajo: si es gratis, no guarda nada.","Da igual cuál elijas: todos los modelos tratan tus datos de la misma forma.","Usarlo solo si no hay datos de clientes en las primeras páginas.","Usarlo con datos de práctica y mirar la política de privacidad del modelo: algunos gratuitos usan lo que envías para mejorar."],"correcta":3,"porque":"Gratis no quiere decir privado: lo que el agente lee se envía al proveedor, y algunos modelos gratuitos usan esos datos para mejorar. La opción A es tentadora porque «gratis» suena a «sin compromiso», pero el precio puede ser tus datos."},{"id":"F13","pregunta":"El agente está resumiendo una página web de un proveedor y, de repente, propone enviar por correo el contenido de tu carpeta de trabajo «porque la página lo indica». ¿Qué está pasando?","opciones":["Es un paso normal: los agentes envían los resultados por correo al terminar.","Probablemente una inyección de instrucciones: la página contiene órdenes escritas por otra persona. Deniegas y preguntas.","El agente ha perdido el contexto y hay que darle acceso total para que termine.","Es un error del proveedor del modelo y no tiene nada que ver con la seguridad."],"correcta":1,"porque":"Es el patrón típico de inyección de instrucciones: lo que el agente lee de fuera puede traer órdenes de otra persona. La A es tentadora porque enviar resultados es algo que los agentes hacen, pero nadie se lo ha pedido. Si no lo pediste tú, para y pregunta."},{"id":"F14","pregunta":"Le pides al agente el consumo eléctrico total del mes a partir de un CSV y te entrega un número y un gráfico impecables. ¿Cuál es la mejor comprobación?","opciones":["Si el gráfico es coherente, el número está bien.","Pedirle que lo repita: si sale el mismo número, es correcto.","Mirar el script que ha usado (qué filas descarta o corrige, qué unidades asume) y comprobar el total contra una fuente independiente.","Usar un modelo más potente para que revise el resultado."],"correcta":2,"porque":"El agente no da un número: da un programa que calcula el número, y hay que revisar el programa y cuadrar totales con la fuente. La B es tentadora, pero repetir un cálculo equivocado da el mismo error; la D delega la verificación en otra IA en lugar de hacerla tú."}],"bandas":[{"min":12,"titulo":"Conceptos sólidos","texto":"Incluidos permisos y límites. Profundiza en MCP y skills, y prueba un encargo real esta semana."},{"min":8,"titulo":"Base correcta","texto":"Con algún punto flojo. Repasa los fallos concretos: suele ser el «permitir una vez», el sandbox, qué hacer cuando el agente empeora o las instrucciones escondidas."},{"min":4,"titulo":"Ideas generales captadas","texto":"Faltan los detalles. Repite las prácticas 2 y 3 con calma y vuelve a la analogía del motor y el coche."},{"min":0,"titulo":"Conviene repasar","texto":"Empieza por un caso muy pequeño y guiado. El ritmo, no la persona, es lo que hay que ajustar."}]};
/* Motor del curso: navegación, progreso, búsqueda, tema y cuestionarios.
   Se inserta en línea en el HTML final. No usa red ni dependencias externas. */
(function () {
  'use strict';

  var DATOS = window.__CURSO__;
  var CLAVE = 'seminario-harness-v1';

  var estado = {
    hechas: {},          // id de leccion -> true
    tema: 'claro',
    respuestas: {},      // id de pregunta -> indice elegido
    notaFinal: null
  };

  // ---------- Utilidades ----------
  function guardar() {
    try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch (e) { /* modo privado */ }
  }
  function cargar() {
    try {
      var bruto = localStorage.getItem(CLAVE);
      if (bruto) {
        var o = JSON.parse(bruto);
        if (o && typeof o === 'object') {
          estado.hechas = o.hechas || {};
          estado.tema = o.tema === 'oscuro' ? 'oscuro' : 'claro';
          estado.respuestas = o.respuestas || {};
          estado.notaFinal = typeof o.notaFinal === 'number' ? o.notaFinal : null;
        }
      }
    } catch (e) { /* sin persistencia */ }
  }
  function sinTildes(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }
  function el(tag, clase, texto) {
    var n = document.createElement(tag);
    if (clase) n.className = clase;
    if (texto !== undefined && texto !== null) n.textContent = texto;
    return n;
  }

  var lecciones = DATOS.lecciones;
  var indice = {};
  lecciones.forEach(function (l, i) { l._i = i; indice[l.id] = l; });

  var actual = null;

  // ---------- Navegación lateral ----------
  function pintarNav(filtro) {
    var nav = document.getElementById('nav');
    nav.textContent = '';
    var q = sinTildes(filtro || '');
    var visibles = 0;

    DATOS.grupos.forEach(function (g) {
      var dentro = lecciones.filter(function (l) {
        if (l.grupo !== g.id) return false;
        if (!q) return true;
        return sinTildes(l.titulo).indexOf(q) >= 0 || sinTildes(l.texto).indexOf(q) >= 0;
      });
      if (!dentro.length) return;
      visibles += dentro.length;

      var caja = el('div', 'grupo');
      caja.appendChild(el('div', 'grupo-titulo', g.titulo));
      dentro.forEach(function (l) {
        var b = el('button');
        b.type = 'button';
        b.setAttribute('data-id', l.id);
        if (actual && actual.id === l.id) b.setAttribute('aria-current', 'true');
        if (estado.hechas[l.id]) b.className = 'hecho';

        var num = el('span', 'num');
        num.textContent = l.tipo === 'quiz' ? '?' : (l._i + 1);
        b.appendChild(num);
        b.appendChild(el('span', 'texto', l.titulo));
        b.appendChild(el('span', 'marca-ok', '\u2713'));
        b.addEventListener('click', function () {
          ir(l.id);
          cerrarMenu();
        });
        caja.appendChild(b);
      });
      nav.appendChild(caja);
    });

    if (!visibles) {
      var v = el('div', 'vacio');
      v.appendChild(el('b', null, 'Sin resultados'));
      v.appendChild(el('span', null, 'Prueba con otra palabra.'));
      nav.appendChild(v);
    }
  }

  // ---------- Medidor de progreso ----------
