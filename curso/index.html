code></pre>\n<p>La primera vez puede tardar un poco: está descargando lo que necesita. Verás varias líneas pasando por la pantalla. <strong>Es normal.</strong></p>\n<p>Cuando termine, se abrirá <strong>sola</strong> una página en tu navegador. Si no se abre, ábrela tú y escribe esta dirección:</p>\n<pre><code>http://127.0.0.1:3080\n</code></pre>\n<p><strong>No cierres la ventana de la terminal.</strong> Si la cierras, se apaga el agente.</p>\n<h3 id=\"paso-4-configura-el-modelo\">Paso 4 — Configura el modelo</h3>\n<p>Sin esto, el agente no puede pensar.</p>\n<ol>\n<li>Busca <strong>Ajustes</strong> (o <em>Settings</em>).</li>\n<li>Entra en <strong>Modelos</strong> (o <em>Models</em>).</li>\n<li>Pega tu <strong>clave de API</strong> de DeepSeek.</li>\n<li>Guarda.</li>\n</ol>\n<p>Se aplica al momento, <strong>no hace falta reiniciar nada</strong>.</p>\n<h3 id=\"paso-5-elige-tu-espacio-de-trabajo\">Paso 5 — Elige tu espacio de trabajo</h3>\n<ol>\n<li>Pulsa el botón <strong>Elegir espacio de trabajo</strong> (o <em>Choose workspace</em>).</li>\n<li>Añade la carpeta <code>practica_agente</code> que has creado.</li>\n<li>Selecciónala.</li>\n</ol>\n<blockquote>\n<p>🔎 <strong>Si el cuadro donde se escriben los mensajes está deshabilitado y no te deja escribir nada, es casi seguro esto: no has elegido espacio de trabajo.</strong> El agente no sabe dónde trabajar, así que no te deja empezar. Vuelve al paso 5.</p>\n</blockquote>\n<h3 id=\"paso-6-tu-primer-encargo\">Paso 6 — Tu primer encargo</h3>\n<p>Escribe esto tal cual, cambiando lo que haga falta para que encaje con tu carpeta:</p>\n<blockquote>\n<p>Mira qué hay en la carpeta <code>informes</code> y hazme un índice de los archivos, agrupados por tipo, en un archivo nuevo llamado <code>INDICE.md</code>. No modifiques ningún archivo original.</p>\n</blockquote>\n<h3 id=\"que-deberias-ver\">Qué deberías ver</h3>\n<ul>\n<li>Que el agente <strong>no responde de golpe</strong>: va dando pasos.</li>\n<li>Que cada paso aparece en pantalla, indicando qué está haciendo.</li>\n<li>Que al final te dice <strong>dónde ha dejado</strong> el archivo nuevo.</li>\n</ul>\n<h3 id=\"comprobacion\">✅ Comprobación</h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> Hay un archivo nuevo, <code>INDICE.md</code>, dentro de tu carpeta.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Lo has abierto y el contenido tiene sentido.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Los archivos originales siguen ahí, intactos.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Sabrías decir <strong>qué herramientas</strong> ha usado el agente para hacerlo (mirar la carpeta, leer, escribir...).</li>\n</ul>\n<h3 id=\"si-algo-falla\">Si algo falla</h3>\n<table>\n<thead>\n<tr>\n<th>Lo que ves</th>\n<th>Qué hacer</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>«<code>npx</code> no se reconoce como una orden»</td>\n<td>Node.js no está instalado o la terminal se abrió antes de instalarlo. Cierra la terminal, ábrela otra vez. Si sigue, revisa la guía de instalación previa.</td>\n</tr>\n<tr>\n<td>La página no carga</td>\n<td>Comprueba que la terminal sigue abierta y que la dirección es exactamente <code>http://127.0.0.1:3080</code>.</td>\n</tr>\n<tr>\n<td>El cuadro de mensajes está gris</td>\n<td>No has elegido espacio de trabajo. Paso 5.</td>\n</tr>\n<tr>\n<td>Dice que la clave no es válida</td>\n<td>Revisa que has copiado la clave entera, sin espacios, y que la cuenta tiene saldo.</td>\n</tr>\n<tr>\n<td>El agente tarda mucho</td>\n<td>Está trabajando. Mira el panel de pasos: si avanza, déjalo.</td>\n</tr>\n</tbody></table>\n<hr>\n","texto":"Manos a la obra 3 min de lectura Documento 03 Práctica 1 — Primer arranque y primer encargo Tiempo: unos 20 minutos. Objetivo: tener el harness funcionando y haber completado un encargo de principio a fin. Paso 1 — Abre una terminal Windows: menú Inicio → escribe PowerShell o Terminal → ábrelo. macOS: Cmd + Espacio → escribe Terminal → Enter. Es una ventana negra o azul donde se escriben órdenes. No pasa nada, no vas a romper nada. Paso 2 — Comprueba que tienes Node.js El harness necesita un programa que se llama Node.js . Seguramente lo dejaste instalado al hacer la preparación previa; compruébalo en un segundo escribiendo esto y pulsando Enter: node -v Si aparece un número (por ejemplo v22.14.0 ), todo bien: pasa al siguiente paso. Si no aparece nada, o dice que node no se reconoce , hay que instalarlo: Entra en la web oficial de Node.js y descarga el instalador. Elige la versión marcada como LTS (la estable; no la que pone «Current»). Instala con las opciones por defecto. Cierra la terminal y ábrela otra vez , y repite node -v . La orden npx , que usaremos en el paso siguiente, viene incluida con Node.js . Por eso, si node -v funciona, lo demás ya está listo. Paso 3 — Arranca el harness Escribe esta orden y pulsa Enter: npx @deepseek-ai/dsh web La primera vez puede tardar un poco: está descargando lo que necesita. Verás varias líneas pasando por la pantalla. Es normal. Cuando termine, se abrirá sola una página en tu navegador. Si no se abre, ábrela tú y escribe esta dirección: http://127.0.0.1:3080 No cierres la ventana de la terminal. Si la cierras, se apaga el agente. Paso 4 — Configura el modelo Sin esto, el agente no puede pensar. Busca Ajustes (o Settings ). Entra en Modelos (o Models ). Pega tu clave de API de DeepSeek. Guarda. Se aplica al momento, no hace falta reiniciar nada . Paso 5 — Elige tu espacio de trabajo Pulsa el botón Elegir espacio de trabajo (o Choose workspace ). Añade la carpeta practica_agente que has creado. Selecciónala. 🔎 Si el cuadro donde se escriben los mensajes está deshabilitado y no te deja escribir nada, es casi seguro esto: no has elegido espacio de trabajo. El agente no sabe dónde trabajar, así que no te deja empezar. Vuelve al paso 5. Paso 6 — Tu primer encargo Escribe esto tal cual, cambiando lo que haga falta para que encaje con tu carpeta: Mira qué hay en la carpeta informes y hazme un índice de los archivos, agrupados por tipo, en un archivo nuevo llamado INDICE.md . No modifiques ningún archivo original. Qué deberías ver Que el agente no responde de golpe : va dando pasos. Que cada paso aparece en pantalla, indicando qué está haciendo. Que al final te dice dónde ha dejado el archivo nuevo. ✅ Comprobación Hay un archivo nuevo, INDICE.md , dentro de tu carpeta. Lo has abierto y el contenido tiene sentido. Los archivos originales siguen ahí, intactos. Sabrías decir qué herramientas ha usado el agente para hacerlo (mirar la carpeta, leer, escribir...). Si algo falla Lo que ves Qué hacer « npx no se reconoce como una orden» Node.js no está instalado o la terminal se abrió antes de instalarlo. Cierra la terminal, ábrela otra vez. Si sigue, revisa la guía de instalación previa. La página no carga Comprueba que la terminal sigue abierta y que la dirección es exactamente http://127.0.0.1:3080 . El cuadro de mensajes está gris No has elegido espacio de trabajo. Paso 5. Dice que la clave no es válida Revisa que has copiado la clave entera, sin espacios, y que la cuenta tiene saldo. El agente tarda mucho Está trabajando. Mira el panel de pasos: si avanza, déjalo."},{"id":"03-practica-2-provocar-una-aprobacion","grupo":"modulo2","titulo":"Práctica 2 — Provocar una aprobación","tipo":"doc","html":"<div class=\"leccion-meta\">\n        <span class=\"chip modulo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 5.5v13l11-6.5z\"/></svg> Manos a la obra</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/></svg> 2 min de lectura</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6z\"/><path d=\"M14 3v5h5\"/><path d=\"M9 13h6M9 17h6\"/></svg> Documento 03</span>\n      </div><h2 id=\"practica-2-provocar-una-aprobacion\">Práctica 2 — Provocar una aprobación</h2>\n<p><strong>Tiempo:</strong> unos 10 minutos.\n<strong>Objetivo:</strong> ver con tus ojos qué pasa cuando el agente intenta salir de su zona, y entender qué te está pidiendo exactamente.</p>\n<p>Esta es la práctica más importante del seminario. Léela entera antes de empezar.</p>\n<h3 id=\"paso-1-pidele-algo-que-esta-fuera-de-su-zona\">Paso 1 — Pídele algo que está fuera de su zona</h3>\n<p><strong>Asegúrate de que tienes la carpeta <code>practica_agente</code> seleccionada como espacio de trabajo.</strong> Ahora pídele algo que ocurra <strong>fuera</strong> de ella, por ejemplo en el escritorio:</p>\n<blockquote>\n<p>Crea un archivo llamado <code>prueba_agente.txt</code> en el escritorio de mi usuario, con el texto «prueba».</p>\n</blockquote>\n<h3 id=\"paso-2-para-y-mira\">Paso 2 — Para y mira</h3>\n<p><strong>No apruebes nada todavía.</strong> Va a aparecer un <strong>aviso de aprobación</strong>. Lee el aviso entero, despacio, antes de tocar nada.</p>\n<h3 id=\"paso-3-hazte-las-tres-preguntas\">Paso 3 — Hazte las tres preguntas</h3>\n<p>Antes de decidir, contesta por escrito:</p>\n<ol>\n<li><p><strong>¿Qué me está pidiendo exactamente?</strong>\n(¿leer un archivo? ¿escribir uno nuevo? ¿ejecutar una orden? ¿dónde?)</p>\n<hr>\n</li>\n<li><p><strong>¿Qué pasaría si digo que sí?</strong>\n(Piensa en algo concreto: qué archivo aparecería, dónde, y qué cambiaría en tu ordenador.)</p>\n<hr>\n</li>\n<li><p><strong>¿Puedo acotarlo?</strong>\n(¿Podrías pedirle que lo haga dentro de la carpeta de trabajo en vez de en el escritorio?)</p>\n<hr>\n</li>\n</ol>\n<h3 id=\"paso-4-decide-conscientemente\">Paso 4 — Decide, conscientemente</h3>\n<p>Ahora sí: <strong>permite una vez</strong>. Y observa lo que pasa.</p>\n<h3 id=\"paso-5-el-detalle-que-hay-que-entender\">Paso 5 — El detalle que hay que entender</h3>\n<p>Repite la petición otra vez:</p>\n<blockquote>\n<p>Crea un archivo llamado <code>prueba_agente2.txt</code> en el escritorio.</p>\n</blockquote>\n<p><strong>Te va a volver a preguntar.</strong></p>\n<blockquote>\n<p><strong>«Permitir una vez» es permitir esa vez. No vale para siempre.</strong></p>\n</blockquote>\n<p>Es incómodo <strong>a propósito</strong>: ese pequeño fastidio es lo que te obliga a pensar si de verdad quieres que el agente salga de su zona. Un permiso que se diera «para siempre» con un clic sería más cómodo y mucho más peligroso.</p>\n<h3 id=\"paso-6-limpia\">Paso 6 — Limpia</h3>\n<p>Borra los archivos de prueba que hayas creado en el escritorio. Se llaman <code>prueba_agente.txt</code> y <code>prueba_agente2.txt</code>.</p>\n<h3 id=\"comprobacion\">✅ Comprobación</h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> He visto aparecer un aviso de aprobación.</li>\n<li><input disabled=\"\" type=\"checkbox\"> He leído el aviso <strong>antes</strong> de aprobarlo.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Sé explicar con mis palabras qué me estaba pidiendo.</li>\n<li><input disabled=\"\" type=\"checkbox\"> He comprobado que al repetir la petición <strong>vuelve a preguntar</strong>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> He borrado los archivos de prueba.</li>\n</ul>\n<h3 id=\"los-dos-malos-habitos-que-ya-puedes-reconocer\">Los dos malos hábitos que ya puedes reconocer</h3>\n<ul>\n<li><strong>Aprobar por inercia:</strong> después del aviso número veinte, pulsas «permitir» sin leer. En ese momento el aviso ha dejado de protegerte.</li>\n<li><strong>Subir el nivel de permiso para que deje de preguntar:</strong> es como quitar el freno porque el coche hace ruido al frenar.</li>\n</ul>\n<blockquote>\n<p><strong>Regla de oro:</strong> si no entiendes qué te está pidiendo, <strong>no lo apruebes</strong>. Pídele que te lo explique con palabras o que te diga qué va a tocar antes de tocarlo.</p>\n</blockquote>\n<hr>\n","texto":"Manos a la obra 2 min de lectura Documento 03 Práctica 2 — Provocar una aprobación Tiempo: unos 10 minutos. Objetivo: ver con tus ojos qué pasa cuando el agente intenta salir de su zona, y entender qué te está pidiendo exactamente. Esta es la práctica más importante del seminario. Léela entera antes de empezar. Paso 1 — Pídele algo que está fuera de su zona Asegúrate de que tienes la carpeta practica_agente seleccionada como espacio de trabajo. Ahora pídele algo que ocurra fuera de ella, por ejemplo en el escritorio: Crea un archivo llamado prueba_agente.txt en el escritorio de mi usuario, con el texto «prueba». Paso 2 — Para y mira No apruebes nada todavía. Va a aparecer un aviso de aprobación . Lee el aviso entero, despacio, antes de tocar nada. Paso 3 — Hazte las tres preguntas Antes de decidir, contesta por escrito: ¿Qué me está pidiendo exactamente? (¿leer un archivo? ¿escribir uno nuevo? ¿ejecutar una orden? ¿dónde?) ¿Qué pasaría si digo que sí? (Piensa en algo concreto: qué archivo aparecería, dónde, y qué cambiaría en tu ordenador.) ¿Puedo acotarlo? (¿Podrías pedirle que lo haga dentro de la carpeta de trabajo en vez de en el escritorio?) Paso 4 — Decide, conscientemente Ahora sí: permite una vez . Y observa lo que pasa. Paso 5 — El detalle que hay que entender Repite la petición otra vez: Crea un archivo llamado prueba_agente2.txt en el escritorio. Te va a volver a preguntar. «Permitir una vez» es permitir esa vez. No vale para siempre. Es incómodo a propósito : ese pequeño fastidio es lo que te obliga a pensar si de verdad quieres que el agente salga de su zona. Un permiso que se diera «para siempre» con un clic sería más cómodo y mucho más peligroso. Paso 6 — Limpia Borra los archivos de prueba que hayas creado en el escritorio. Se llaman prueba_agente.txt y prueba_agente2.txt . ✅ Comprobación He visto aparecer un aviso de aprobación. He leído el aviso antes de aprobarlo. Sé explicar con mis palabras qué me estaba pidiendo. He comprobado que al repetir la petición vuelve a preguntar . He borrado los archivos de prueba. Los dos malos hábitos que ya puedes reconocer Aprobar por inercia: después del aviso número veinte, pulsas «permitir» sin leer. En ese momento el aviso ha dejado de protegerte. Subir el nivel de permiso para que deje de preguntar: es como quitar el freno porque el coche hace ruido al frenar. Regla de oro: si no entiendes qué te está pidiendo, no lo apruebes . Pídele que te lo explique con palabras o que te diga qué va a tocar antes de tocarlo."},{"id":"03-practica-3-cambiar-de-politica","grupo":"modulo2","titulo":"Práctica 3 — Cambiar de política","tipo":"doc","html":"<div class=\"leccion-meta\">\n        <span class=\"chip modulo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 5.5v13l11-6.5z\"/></svg> Manos a la obra</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/></svg> 1 min de lectura</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6z\"/><path d=\"M14 3v5h5\"/><path d=\"M9 13h6M9 17h6\"/></svg> Documento 03</span>\n      </div><h2 id=\"practica-3-cambiar-de-politica\">Práctica 3 — Cambiar de política</h2>\n<p><strong>Tiempo:</strong> unos 8 minutos.\n<strong>Objetivo:</strong> comprobar que tú decides el tamaño de la sala, y que eso cambia las reglas del juego.</p>\n<h3 id=\"paso-1-la-misma-tarea-pero-dentro\">Paso 1 — La misma tarea, pero dentro</h3>\n<p>Pide lo mismo que antes, esta vez <strong>dentro</strong> de tu carpeta de trabajo:</p>\n<blockquote>\n<p>Crea un archivo llamado <code>prueba_dentro.txt</code> en la carpeta <code>practica_agente</code>, con el texto «prueba».</p>\n</blockquote>\n<h3 id=\"paso-2-observa\">Paso 2 — Observa</h3>\n<p><strong>No ha preguntado nada.</strong> Lo ha hecho y punto.</p>\n<h3 id=\"paso-3-saca-la-conclusion\">Paso 3 — Saca la conclusión</h3>\n<blockquote>\n<p><strong>El agente no es más listo ni más tonto. Has cambiado dónde trabaja.</strong></p>\n</blockquote>\n<p>Al mover el trabajo dentro de la carpeta de trabajo:</p>\n<ul>\n<li><strong>Desaparecen los avisos</strong>, porque ya no necesita salir de su zona.</li>\n<li><strong>Baja el riesgo</strong>, porque está trabajando en un sitio acotado que tú controlas.</li>\n</ul>\n<p>Por eso, cuando una tarea te obligue a aprobar cien avisos, <strong>la solución no es aprobarlos todos</strong>:</p>\n<blockquote>\n<p><strong>Si una tarea te obliga a aprobar cien avisos, el problema no es el agente: es dónde está trabajando. Mueve el trabajo dentro de la carpeta y los avisos desaparecen solos.</strong></p>\n</blockquote>\n<h3 id=\"comprobacion\">✅ Comprobación</h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> El archivo <code>prueba_dentro.txt</code> existe dentro de <code>practica_agente</code>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>No ha pedido ninguna aprobación.</strong></li>\n<li><input disabled=\"\" type=\"checkbox\"> Sé explicar la diferencia con la Práctica 2 en una frase.</li>\n</ul>\n<h3 id=\"y-no-lo-olvides\">Y no lo olvides</h3>\n<blockquote>\n<p><strong>El sandbox reduce el riesgo, no lo elimina.</strong> Todo lo que está <strong>dentro</strong> de la carpeta autorizada, el agente lo puede tocar sin preguntar. Si dentro hay algo que no debería tocarse, el problema es lo que hay en la carpeta.</p>\n</blockquote>\n<hr>\n","texto":"Manos a la obra 1 min de lectura Documento 03 Práctica 3 — Cambiar de política Tiempo: unos 8 minutos. Objetivo: comprobar que tú decides el tamaño de la sala, y que eso cambia las reglas del juego. Paso 1 — La misma tarea, pero dentro Pide lo mismo que antes, esta vez dentro de tu carpeta de trabajo: Crea un archivo llamado prueba_dentro.txt en la carpeta practica_agente , con el texto «prueba». Paso 2 — Observa No ha preguntado nada. Lo ha hecho y punto. Paso 3 — Saca la conclusión El agente no es más listo ni más tonto. Has cambiado dónde trabaja. Al mover el trabajo dentro de la carpeta de trabajo: Desaparecen los avisos , porque ya no necesita salir de su zona. Baja el riesgo , porque está trabajando en un sitio acotado que tú controlas. Por eso, cuando una tarea te obligue a aprobar cien avisos, la solución no es aprobarlos todos : Si una tarea te obliga a aprobar cien avisos, el problema no es el agente: es dónde está trabajando. Mueve el trabajo dentro de la carpeta y los avisos desaparecen solos. ✅ Comprobación El archivo prueba_dentro.txt existe dentro de practica_agente . No ha pedido ninguna aprobación. Sé explicar la diferencia con la Práctica 2 en una frase. Y no lo olvides El sandbox reduce el riesgo, no lo elimina. Todo lo que está dentro de la carpeta autorizada, el agente lo puede tocar sin preguntar. Si dentro hay algo que no debería tocarse, el problema es lo que hay en la carpeta."},{"id":"03-practica-4-ensenarle-un-procedimiento","grupo":"modulo2","titulo":"Práctica 4 — Enseñarle un procedimiento","tipo":"doc","html":"<div class=\"leccion-meta\">\n        <span class=\"chip modulo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 5.5v13l11-6.5z\"/></svg> Manos a la obra</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/></svg> 2 min de lectura</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6z\"/><path d=\"M14 3v5h5\"/><path d=\"M9 13h6M9 17h6\"/></svg> Documento 03</span>\n      </div><h2 id=\"practica-4-ensenarle-un-procedimiento\">Práctica 4 — Enseñarle un procedimiento</h2>\n<p><strong>Tiempo:</strong> unos 5 minutos (más si te animas).\n<strong>Objetivo:</strong> dejar una instrucción permanente y comprobar que sobrevive a cerrar la conversación.</p>\n<h3 id=\"la-idea\">La idea</h3>\n<p>Hasta ahora, cada vez que quieres algo tienes que explicárselo. Si tienes una preferencia que se repite, <strong>no la repitas cada día: escríbela una vez.</strong></p>\n<blockquote>\n<p><strong><code>AGENTS.md</code> son las notas que dejas al becario antes de que empiece.</strong></p>\n</blockquote>\n<h3 id=\"paso-1-pide-que-cree-sus-propias-notas\">Paso 1 — Pide que cree sus propias notas</h3>\n<p>Lo más fácil es pedírselo al propio agente:</p>\n<blockquote>\n<p>Crea en la raíz de esta carpeta de trabajo un archivo <code>AGENTS.md</code> con estas instrucciones para ti:</p>\n<ul>\n<li>Responde siempre en español.</li>\n<li>Cuando crees un informe, guárdalo siempre en la carpeta <code>informes</code>.</li>\n<li>Nunca modifiques ni borres los archivos originales: si necesitas cambiarlos, crea una copia.</li>\n<li>Al terminar cualquier tarea, dime qué archivos has tocado.</li>\n</ul>\n</blockquote>\n<p><em>(Si prefieres escribirlo tú a mano, crea el archivo <code>AGENTS.md</code> en la raíz de la carpeta de trabajo y pega esas mismas líneas.)</em></p>\n<h3 id=\"paso-2-el-detalle-que-hace-que-esto-sea-una-prueba-de-verdad\">Paso 2 — El detalle que hace que esto sea una prueba de verdad</h3>\n<p><strong>Abre una conversación nueva.</strong> No sigas en la misma.</p>\n<p>En la misma conversación no demuestra nada: el agente se acuerda de lo que le has dicho porque lo tiene delante, en su mesa de trabajo. <strong>La prueba de verdad es empezar de cero.</strong></p>\n<h3 id=\"paso-3-comprueba-que-las-respeta\">Paso 3 — Comprueba que las respeta</h3>\n<p>En la conversación nueva, pídele algo normal, por ejemplo:</p>\n<blockquote>\n<p>Hazme un resumen de los archivos de la carpeta <code>informes</code>.</p>\n</blockquote>\n<p>Y observa si cumple las notas: ¿responde en español?, ¿guarda el resultado en <code>informes</code>?, ¿te dice qué archivos ha tocado?</p>\n<h3 id=\"comprobacion\">✅ Comprobación</h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> Existe el archivo <code>AGENTS.md</code> en la raíz de mi carpeta de trabajo.</li>\n<li><input disabled=\"\" type=\"checkbox\"> He abierto una <strong>conversación nueva</strong>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> El agente ha respetado las instrucciones <strong>sin que se las repita</strong>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Sé explicar la diferencia entre lo que dura una conversación y lo que es permanente.</li>\n</ul>\n<h3 id=\"si-te-sobra-tiempo-un-procedimiento-guardado-skill\">Si te sobra tiempo: un procedimiento guardado (skill)</h3>\n<p>Las notas son preferencias. Los <strong>procedimientos guardados</strong> (skills) son para tareas que repites siempre igual:</p>\n<blockquote>\n<p><strong>Las skills son procedimientos guardados, como recetas de cocina.</strong></p>\n</blockquote>\n<p>Pídele al agente que te cree una:</p>\n<blockquote>\n<p>Crea una skill llamada <code>resumen-informes</code> que consista en: leer todos los archivos de la carpeta <code>informes</code>, crear un archivo <code>resumen_general.md</code> con una tabla de tres columnas (archivo, tema, conclusión) y no modificar los originales.</p>\n</blockquote>\n<p>Después, en una conversación nueva, pídele «hazme el resumen de informes» y comprueba que sigue la receta.</p>\n<h3 id=\"la-leccion-para-llevartela\">La lección, para llevártela</h3>\n<blockquote>\n<p><strong>Si te descubres explicando lo mismo por tercera vez, el problema no es el agente: es que no le has dejado notas.</strong></p>\n</blockquote>\n<hr>\n","texto":"Manos a la obra 2 min de lectura Documento 03 Práctica 4 — Enseñarle un procedimiento Tiempo: unos 5 minutos (más si te animas). Objetivo: dejar una instrucción permanente y comprobar que sobrevive a cerrar la conversación. La idea Hasta ahora, cada vez que quieres algo tienes que explicárselo. Si tienes una preferencia que se repite, no la repitas cada día: escríbela una vez. AGENTS.md son las notas que dejas al becario antes de que empiece. Paso 1 — Pide que cree sus propias notas Lo más fácil es pedírselo al propio agente: Crea en la raíz de esta carpeta de trabajo un archivo AGENTS.md con estas instrucciones para ti: Responde siempre en español. Cuando crees un informe, guárdalo siempre en la carpeta informes . Nunca modifiques ni borres los archivos originales: si necesitas cambiarlos, crea una copia. Al terminar cualquier tarea, dime qué archivos has tocado. (Si prefieres escribirlo tú a mano, crea el archivo AGENTS.md en la raíz de la carpeta de trabajo y pega esas mismas líneas.) Paso 2 — El detalle que hace que esto sea una prueba de verdad Abre una conversación nueva. No sigas en la misma. En la misma conversación no demuestra nada: el agente se acuerda de lo que le has dicho porque lo tiene delante, en su mesa de trabajo. La prueba de verdad es empezar de cero. Paso 3 — Comprueba que las respeta En la conversación nueva, pídele algo normal, por ejemplo: Hazme un resumen de los archivos de la carpeta informes . Y observa si cumple las notas: ¿responde en español?, ¿guarda el resultado en informes ?, ¿te dice qué archivos ha tocado? ✅ Comprobación Existe el archivo AGENTS.md en la raíz de mi carpeta de trabajo. He abierto una conversación nueva . El agente ha respetado las instrucciones sin que se las repita . Sé explicar la diferencia entre lo que dura una conversación y lo que es permanente. Si te sobra tiempo: un procedimiento guardado (skill) Las notas son preferencias. Los procedimientos guardados (skills) son para tareas que repites siempre igual: Las skills son procedimientos guardados, como recetas de cocina. Pídele al agente que te cree una: Crea una skill llamada resumen-informes que consista en: leer todos los archivos de la carpeta informes , crear un archivo resumen_general.md con una tabla de tres columnas (archivo, tema, conclusión) y no modificar los originales. Después, en una conversación nueva, pídele «hazme el resumen de informes» y comprueba que sigue la receta. La lección, para llevártela Si te descubres explicando lo mismo por tercera vez, el problema no es el agente: es que no le has dejado notas."},{"id":"03-practica-5-encargo-integrador","grupo":"modulo2","titulo":"Práctica 5 — Encargo integrador","tipo":"doc","html":"<div class=\"leccion-meta\">\n        <span class=\"chip modulo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 5.5v13l11-6.5z\"/></svg> Manos a la obra</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/></svg> 2 min de lectura</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6z\"/><path d=\"M14 3v5h5\"/><path d=\"M9 13h6M9 17h6\"/></svg> Documento 03</span>\n      </div><h2 id=\"practica-5-encargo-integrador\">Práctica 5 — Encargo integrador</h2>\n<p><strong>Tiempo:</strong> unos 13 minutos.\n<strong>Objetivo:</strong> hacer un encargo completo tú solo, y <strong>verificarlo</strong>. Aquí ya no hay instrucciones que copiar.</p>\n<h3 id=\"paso-1-piensa-una-tarea-real-tuya\">Paso 1 — Piensa una tarea real tuya</h3>\n<p>Pequeña, que tenga que ver con archivos, y que puedas comprobar en dos minutos. Por ejemplo: ordenar archivos por tipo, sacar un listado, resumir varios documentos, extraer datos repetidos, unificar notas sueltas.</p>\n<h3 id=\"paso-2-redacta-el-encargo-con-las-cuatro-partes\">Paso 2 — Redacta el encargo con las cuatro partes</h3>\n<p>Este patrón es lo más útil que te llevas hoy. Cópialo de aquí en adelante:</p>\n<blockquote>\n<p><strong>1. Qué quiero</strong> — el objetivo, con un resultado concreto.\n<strong>2. Dónde</strong> — la carpeta exacta.\n<strong>3. Qué NO tocar</strong> — los límites, dichos explícitamente.\n<strong>4. Cómo sabré que está bien</strong> — tu criterio de éxito.</p>\n</blockquote>\n<p><strong>Ejemplo completo:</strong></p>\n<blockquote>\n<p>«En la carpeta <code>practica_agente/informes</code> hay cinco informes en texto. Léelos y créame <code>resumen_general.md</code> con una tabla de tres columnas: tema, conclusión y nivel de urgencia.\n<strong>No modifiques ninguno de los cinco archivos originales.</strong>\nAl terminar, dime qué archivos has leído y cuántas filas tiene la tabla.»</p>\n</blockquote>\n<p><strong>Mi encargo:</strong></p>\n<pre><code>1. Qué quiero: ______________________________________________\n2. Dónde: ___________________________________________________\n3. Qué NO tocar: ____________________________________________\n4. Cómo lo comprobaré: ______________________________________\n</code></pre>\n<h3 id=\"paso-3-lanzalo-y-mira-los-pasos\">Paso 3 — Lánzalo y mira los pasos</h3>\n<p>No te vayas a por un café. <strong>Mira cómo trabaja.</strong> Cada paso te dice qué herramienta está usando. Ahí es donde te darás cuenta si va por donde no debe.</p>\n<h3 id=\"paso-4-verifica-esta-es-la-parte-importante\">Paso 4 — Verifica. Esta es la parte importante</h3>\n<p>Cuando diga «hecho», <strong>no está hecho: está propuesto.</strong></p>\n<blockquote>\n<p><strong>El agente no firma su trabajo. Lo firmas tú cuando dices que está bien.</strong></p>\n</blockquote>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> He <strong>abierto</strong> el archivo resultante (no vale «tiene buena pinta»).</li>\n<li><input disabled=\"\" type=\"checkbox\"> He <strong>contado</strong>: ¿están todos los elementos?, ¿las filas que debería?</li>\n<li><input disabled=\"\" type=\"checkbox\"> He comprobado que <strong>los archivos que no debía tocar siguen intactos</strong>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Le he preguntado <strong>qué archivos ha tocado</strong>, y la respuesta cuadra con lo que veo.</li>\n</ul>\n<h3 id=\"comprobacion\">✅ Comprobación</h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> He escrito un encargo con las cuatro partes.</li>\n<li><input disabled=\"\" type=\"checkbox\"> El agente ha producido un resultado.</li>\n<li><input disabled=\"\" type=\"checkbox\"> He verificado el resultado abriéndolo y contando.</li>\n<li><input disabled=\"\" type=\"checkbox\"> He comprobado que lo que no debía tocarse no se ha tocado.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Sé decir <strong>una cosa que revisaría mejor la próxima vez</strong>.</li>\n</ul>\n<blockquote>\n<p>⚠️ <strong>Cuidado con esta trampa:</strong> el resultado llega <strong>bien escrito, bien maquetado y con tono seguro</strong>. Eso no significa que sea correcto. Un agente puede equivocarse con una seguridad perfecta.</p>\n</blockquote>\n<hr>\n","texto":"Manos a la obra 2 min de lectura Documento 03 Práctica 5 — Encargo integrador Tiempo: unos 13 minutos. Objetivo: hacer un encargo completo tú solo, y verificarlo . Aquí ya no hay instrucciones que copiar. Paso 1 — Piensa una tarea real tuya Pequeña, que tenga que ver con archivos, y que puedas comprobar en dos minutos. Por ejemplo: ordenar archivos por tipo, sacar un listado, resumir varios documentos, extraer datos repetidos, unificar notas sueltas. Paso 2 — Redacta el encargo con las cuatro partes Este patrón es lo más útil que te llevas hoy. Cópialo de aquí en adelante: 1. Qué quiero — el objetivo, con un resultado concreto. 2. Dónde — la carpeta exacta. 3. Qué NO tocar — los límites, dichos explícitamente. 4. Cómo sabré que está bien — tu criterio de éxito. Ejemplo completo: «En la carpeta practica_agente/informes hay cinco informes en texto. Léelos y créame resumen_general.md con una tabla de tres columnas: tema, conclusión y nivel de urgencia. No modifiques ninguno de los cinco archivos originales. Al terminar, dime qué archivos has leído y cuántas filas tiene la tabla.» Mi encargo: 1. Qué quiero: ______________________________________________ 2. Dónde: ___________________________________________________ 3. Qué NO tocar: ____________________________________________ 4. Cómo lo comprobaré: ______________________________________ Paso 3 — Lánzalo y mira los pasos No te vayas a por un café. Mira cómo trabaja. Cada paso te dice qué herramienta está usando. Ahí es donde te darás cuenta si va por donde no debe. Paso 4 — Verifica. Esta es la parte importante Cuando diga «hecho», no está hecho: está propuesto. El agente no firma su trabajo. Lo firmas tú cuando dices que está bien. He abierto el archivo resultante (no vale «tiene buena pinta»). He contado : ¿están todos los elementos?, ¿las filas que debería? He comprobado que los archivos que no debía tocar siguen intactos . Le he preguntado qué archivos ha tocado , y la respuesta cuadra con lo que veo. ✅ Comprobación He escrito un encargo con las cuatro partes. El agente ha producido un resultado. He verificado el resultado abriéndolo y contando. He comprobado que lo que no debía tocarse no se ha tocado. Sé decir una cosa que revisaría mejor la próxima vez . ⚠️ Cuidado con esta trampa: el resultado llega bien escrito, bien maquetado y con tono seguro . Eso no significa que sea correcto. Un agente puede equivocarse con una seguridad perfecta."},{"id":"03-hoja-de-registro","grupo":"modulo2","titulo":"Hoja de registro","tipo":"doc","html":"<div class=\"leccion-meta\">\n        <span class=\"chip modulo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 5.5v13l11-6.5z\"/></svg> Manos a la obra</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/></svg> 1 min de lectura</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6z\"/><path d=\"M14 3v5h5\"/><path d=\"M9 13h6M9 17h6\"/></svg> Documento 03</span>\n      </div><h2 id=\"hoja-de-registro\">Hoja de registro</h2>\n<p>Rellénala sobre la marcha. Te sirve para el cuestionario final y para acordarte de lo que has hecho.</p>\n<table>\n<thead>\n<tr>\n<th>Práctica</th>\n<th>Qué pedí</th>\n<th>Qué pasó</th>\n<th>Qué comprobé</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1 — Primer arranque</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>2 — Provocar una aprobación</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>3 — Cambiar de política</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>4 — Enseñarle un procedimiento</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>5 — Encargo integrador</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table>\n<p><strong>Lo que me ha sorprendido:</strong></p>\n<hr>\n<p><strong>Lo que no dejaría que hiciera sin mirar:</strong></p>\n<hr>\n<p><strong>La primera tarea que le voy a encargar el lunes:</strong></p>\n<hr>\n<hr>\n","texto":"Manos a la obra 1 min de lectura Documento 03 Hoja de registro Rellénala sobre la marcha. Te sirve para el cuestionario final y para acordarte de lo que has hecho. Práctica Qué pedí Qué pasó Qué comprobé 1 — Primer arranque 2 — Provocar una aprobación 3 — Cambiar de política 4 — Enseñarle un procedimiento 5 — Encargo integrador Lo que me ha sorprendido: Lo que no dejaría que hiciera sin mirar: La primera tarea que le voy a encargar el lunes:"},{"id":"02-como-pedir-bien","grupo":"modulo3","titulo":"Cómo pedir bien","tipo":"doc","html":"<div class=\"leccion-meta\">\n        <span class=\"chip modulo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 3 8l9 5 9-5z\"/><path d=\"M3 12l9 5 9-5\"/><path d=\"M3 16l9 5 9-5\"/></svg> Trabajar sin sustos</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/></svg> 1 min de lectura</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6z\"/><path d=\"M14 3v5h5\"/><path d=\"M9 13h6M9 17h6\"/></svg> Documento 02</span>\n      </div><h2 id=\"7-como-pedir-bien\">7. Cómo pedir bien</h2>\n<p>Un buen encargo tiene cuatro partes. Cópialas, funcionan:</p>\n<blockquote>\n<p><strong>1. Qué quiero</strong> — el objetivo, con un resultado concreto.\n<strong>2. Dónde</strong> — la carpeta exacta.\n<strong>3. Qué NO tocar</strong> — los límites, dichos explícitamente.\n<strong>4. Cómo sabré que está bien</strong> — tu criterio de éxito.</p>\n</blockquote>\n<p><strong>Comparación real:</strong></p>\n<table>\n<thead>\n<tr>\n<th>❌ Así no</th>\n<th>✅ Así sí</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>«Ordena mis archivos»</td>\n<td>«En la carpeta <code>practica/informes</code> hay archivos sueltos. Muévelos a subcarpetas por año. <strong>No borres nada</strong> y dime cuántos has movido.»</td>\n</tr>\n<tr>\n<td>«Resume esto»</td>\n<td>«Lee los cinco archivos de esta carpeta y créame <code>resumen.md</code> con una tabla: tema, conclusión, urgencia. <strong>No modifiques los originales.</strong>»</td>\n</tr>\n</tbody></table>\n<p><strong>El cuarto punto es el que todo el mundo se salta y es el más útil.</strong> Si tú no sabes cómo vas a comprobar que el resultado está bien, el agente tampoco.</p>\n<hr>\n","texto":"Trabajar sin sustos 1 min de lectura Documento 02 7. Cómo pedir bien Un buen encargo tiene cuatro partes. Cópialas, funcionan: 1. Qué quiero — el objetivo, con un resultado concreto. 2. Dónde — la carpeta exacta. 3. Qué NO tocar — los límites, dichos explícitamente. 4. Cómo sabré que está bien — tu criterio de éxito. Comparación real: ❌ Así no ✅ Así sí «Ordena mis archivos» «En la carpeta practica/informes hay archivos sueltos. Muévelos a subcarpetas por año. No borres nada y dime cuántos has movido.» «Resume esto» «Lee los cinco archivos de esta carpeta y créame resumen.md con una tabla: tema, conclusión, urgencia. No modifiques los originales. » El cuarto punto es el que todo el mundo se salta y es el más útil. Si tú no sabes cómo vas a comprobar que el resultado está bien, el agente tampoco."},{"id":"02-verificar-tu-trabajo-no-acaba-cuando-el-agente-termina","grupo":"modulo3","titulo":"Verificar: tu trabajo no acaba cuando el agente termina","tipo":"doc","html":"<div class=\"leccion-meta\">\n        <span class=\"chip modulo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 3 8l9 5 9-5z\"/><path d=\"M3 12l9 5 9-5\"/><path d=\"M3 16l9 5 9-5\"/></svg> Trabajar sin sustos</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/></svg> 1 min de lectura</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6z\"/><path d=\"M14 3v5h5\"/><path d=\"M9 13h6M9 17h6\"/></svg> Documento 02</span>\n      </div><h2 id=\"8-verificar-tu-trabajo-no-acaba-cuando-el-agente-termina\">8. Verificar: tu trabajo no acaba cuando el agente termina</h2>\n<p>Cuando el agente dice «hecho», <strong>no está hecho</strong>. Está <em>propuesto</em>.</p>\n<blockquote>\n<p><strong>El agente no firma su trabajo. Lo firmas tú cuando dices que está bien.</strong></p>\n</blockquote>\n<p>Y ojo con esto, porque es una trampa real: el resultado llega <strong>bien escrito, bien maquetado y con tono seguro</strong>. Eso no significa que sea correcto. Un agente puede equivocarse con una seguridad perfecta.</p>\n<p><strong>Cómo verificar en dos minutos:</strong></p>\n<ul>\n<li>Abre el archivo y <strong>míralo</strong>. No «tiene buena pinta»: ábrelo.</li>\n<li><strong>Cuenta:</strong> ¿están todos los elementos? ¿las filas que debería?</li>\n<li><strong>Comprueba que lo que no debía tocarse sigue intacto.</strong></li>\n<li>Pregúntale al agente <strong>qué ha hecho y qué archivos ha tocado</strong>. Te lo dirá, y a veces la respuesta te sorprende.</li>\n</ul>\n<hr>\n","texto":"Trabajar sin sustos 1 min de lectura Documento 02 8. Verificar: tu trabajo no acaba cuando el agente termina Cuando el agente dice «hecho», no está hecho . Está propuesto . El agente no firma su trabajo. Lo firmas tú cuando dices que está bien. Y ojo con esto, porque es una trampa real: el resultado llega bien escrito, bien maquetado y con tono seguro . Eso no significa que sea correcto. Un agente puede equivocarse con una seguridad perfecta. Cómo verificar en dos minutos: Abre el archivo y míralo . No «tiene buena pinta»: ábrelo. Cuenta: ¿están todos los elementos? ¿las filas que debería? Comprueba que lo que no debía tocarse sigue intacto. Pregúntale al agente qué ha hecho y qué archivos ha tocado . Te lo dirá, y a veces la respuesta te sorprende."},{"id":"02-limites-dichos-con-honestidad","grupo":"modulo3","titulo":"Límites, dichos con honestidad","tipo":"doc","html":"<div class=\"leccion-meta\">\n        <span class=\"chip modulo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 3 8l9 5 9-5z\"/><path d=\"M3 12l9 5 9-5\"/><path d=\"M3 16l9 5 9-5\"/></svg> Trabajar sin sustos</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/></svg> 1 min de lectura</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6z\"/><path d=\"M14 3v5h5\"/><path d=\"M9 13h6M9 17h6\"/></svg> Documento 02</span>\n      </div><h2 id=\"9-limites-dichos-con-honestidad\">9. Límites, dichos con honestidad</h2>\n<p>Esto no es para asustarte: es para que no te lleves un susto.</p>\n<ul>\n<li><strong>Es software experimental.</strong> Está en fase de vistas previas de desarrollo, cambia rápido y habrá novedades que rompan lo anterior. No construyas nada crítico encima sin un plan B.</li>\n<li><strong>No ha pasado una auditoría de seguridad.</strong> No está diseñado para ser seguro de fábrica.</li>\n<li><strong>El sandbox y las aprobaciones reducen el riesgo, pero no garantizan aislamiento</strong>, y no deberían ser tu único control de seguridad. Si el trabajo es delicado, lo recomendable es usar una máquina virtual o un entorno dedicado y desechable.</li>\n<li><strong>La responsabilidad de revisar es tuya.</strong> Es la contrapartida de la comodidad.</li>\n</ul>\n<p><strong>Lo que sí está en tu mano:</strong></p>\n<ul>\n<li>Trabajar con <strong>el mínimo privilegio necesario</strong>. Ni uno más.</li>\n<li>Tener <strong>copias de seguridad</strong> de todo lo que el agente puede tocar.</li>\n<li><strong>No exponer credenciales</strong> ni datos sensibles.</li>\n<li><strong>Revisar plugins y comandos</strong> antes de permitirlos.</li>\n</ul>\n<hr>\n","texto":"Trabajar sin sustos 1 min de lectura Documento 02 9. Límites, dichos con honestidad Esto no es para asustarte: es para que no te lleves un susto. Es software experimental. Está en fase de vistas previas de desarrollo, cambia rápido y habrá novedades que rompan lo anterior. No construyas nada crítico encima sin un plan B. No ha pasado una auditoría de seguridad. No está diseñado para ser seguro de fábrica. El sandbox y las aprobaciones reducen el riesgo, pero no garantizan aislamiento , y no deberían ser tu único control de seguridad. Si el trabajo es delicado, lo recomendable es usar una máquina virtual o un entorno dedicado y desechable. La responsabilidad de revisar es tuya. Es la contrapartida de la comodidad. Lo que sí está en tu mano: Trabajar con el mínimo privilegio necesario . Ni uno más. Tener copias de seguridad de todo lo que el agente puede tocar. No exponer credenciales ni datos sensibles. Revisar plugins y comandos antes de permitirlos."},{"id":"02-las-cuatro-reglas-para-el-lunes","grupo":"modulo3","titulo":"Las cuatro reglas para el lunes","tipo":"doc","html":"<div class=\"leccion-meta\">\n        <span class=\"chip modulo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 3 8l9 5 9-5z\"/><path d=\"M3 12l9 5 9-5\"/><path d=\"M3 16l9 5 9-5\"/></svg> Trabajar sin sustos</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/></svg> 1 min de lectura</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6z\"/><path d=\"M14 3v5h5\"/><path d=\"M9 13h6M9 17h6\"/></svg> Documento 02</span>\n      </div><h2 id=\"10-las-cuatro-reglas-para-el-lunes\">10. Las cuatro reglas para el lunes</h2>\n<ol>\n<li><strong>Copia de seguridad</strong> de la carpeta antes de empezar.</li>\n<li><strong>Una carpeta específica</strong> para cada trabajo. Ni el escritorio entero ni, mucho menos, todo el disco.</li>\n<li><strong>Nada confidencial</strong> en la carpeta de trabajo, salvo que aceptes el riesgo a conciencia.</li>\n<li><strong>Revisa antes de aprobar y verifica al terminar.</strong> Las dos cosas, siempre.</li>\n</ol>\n<hr>\n","texto":"Trabajar sin sustos 1 min de lectura Documento 02 10. Las cuatro reglas para el lunes Copia de seguridad de la carpeta antes de empezar. Una carpeta específica para cada trabajo. Ni el escritorio entero ni, mucho menos, todo el disco. Nada confidencial en la carpeta de trabajo, salvo que aceptes el riesgo a conciencia. Revisa antes de aprobar y verifica al terminar. Las dos cosas, siempre."},{"id":"02-resumen-de-una-pagina","grupo":"modulo3","titulo":"Resumen de una página","tipo":"doc","html":"<div class=\"leccion-meta\">\n        <span class=\"chip modulo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 3 8l9 5 9-5z\"/><path d=\"M3 12l9 5 9-5\"/><path d=\"M3 16l9 5 9-5\"/></svg> Trabajar sin sustos</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/></svg> 1 min de lectura</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6z\"/><path d=\"M14 3v5h5\"/><path d=\"M9 13h6M9 17h6\"/></svg> Documento 02</span>\n      </div><h2 id=\"11-resumen-de-una-pagina\">11. Resumen de una página</h2>\n<p><strong>El cambio de fondo</strong></p>\n<ul>\n<li>Chat: te dice qué hacer y lo haces tú.</li>\n<li>Agente: un becario con acceso a tu ordenador. Lo hace y tú revisas.</li>\n<li>Modelo = motor. Harness = el coche completo.</li>\n</ul>\n<p><strong>Las piezas</strong></p>\n<ul>\n<li>Herramientas (las manos), bucle (piensa-actúa-observa), contexto (la mesa de trabajo), permisos (los frenos), interfaz (el salpicadero).</li>\n</ul>\n<p><strong>Los permisos</strong></p>\n<ul>\n<li>Dentro de la sala, libertad. Para salir, te pide permiso.</li>\n<li>Tú eliges el tamaño de la sala. Cuanto más pequeña, mejor.</li>\n<li>«Permitir una vez» = una vez.</li>\n<li>Si no lo entiendes, no lo apruebes.</li>\n<li>El sandbox reduce el riesgo; no lo elimina.</li>\n</ul>\n<p><strong>El trabajo diario</strong></p>\n<ul>\n<li>Un buen encargo dice: qué, dónde, qué no tocar, y cómo se comprueba.</li>\n<li>Verifica siempre. El agente no firma su trabajo.</li>\n<li>Si repites una explicación por tercera vez, escríbela (<code>AGENTS.md</code> o una skill).</li>\n<li>Si la conversación se degrada, abre una nueva y resume lo hecho.</li>\n</ul>\n<p><strong>Las cuatro reglas</strong></p>\n<ol>\n<li>Copia de seguridad.</li>\n<li>Una carpeta específica por trabajo.</li>\n<li>Nada confidencial dentro.</li>\n<li>Revisa antes de aprobar; verifica al terminar.</li>\n</ol>\n<blockquote>\n<p><strong>Hoy no has aprendido a usar un programa. Has aprendido a dirigir a alguien que trabaja muy rápido, que no sabe lo que no sabe, y que tiene acceso a tus archivos. La herramienta te va a servir; los frenos te van a proteger.</strong></p>\n</blockquote>\n","texto":"Trabajar sin sustos 1 min de lectura Documento 02 11. Resumen de una página El cambio de fondo Chat: te dice qué hacer y lo haces tú. Agente: un becario con acceso a tu ordenador. Lo hace y tú revisas. Modelo = motor. Harness = el coche completo. Las piezas Herramientas (las manos), bucle (piensa-actúa-observa), contexto (la mesa de trabajo), permisos (los frenos), interfaz (el salpicadero). Los permisos Dentro de la sala, libertad. Para salir, te pide permiso. Tú eliges el tamaño de la sala. Cuanto más pequeña, mejor. «Permitir una vez» = una vez. Si no lo entiendes, no lo apruebes. El sandbox reduce el riesgo; no lo elimina. El trabajo diario Un buen encargo dice: qué, dónde, qué no tocar, y cómo se comprueba. Verifica siempre. El agente no firma su trabajo. Si repites una explicación por tercera vez, escríbela ( AGENTS.md o una skill). Si la conversación se degrada, abre una nueva y resume lo hecho. Las cuatro reglas Copia de seguridad. Una carpeta específica por trabajo. Nada confidencial dentro. Revisa antes de aprobar; verifica al terminar. Hoy no has aprendido a usar un programa. Has aprendido a dirigir a alguien que trabaja muy rápido, que no sabe lo que no sabe, y que tiene acceso a tus archivos. La herramienta te va a servir; los frenos te van a proteger."},{"id":"doc-07","grupo":"modulo4","titulo":"Preparación previa","tipo":"doc","html":"<div class=\"leccion-meta\">\n        <span class=\"chip modulo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6z\"/><path d=\"M14 3v5h5\"/><path d=\"M9 13h6M9 17h6\"/></svg> Antes de venir</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/></svg> 14 min de lectura</span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6z\"/><path d=\"M14 3v5h5\"/><path d=\"M9 13h6M9 17h6\"/></svg> Documento 07</span>\n      </div><h1 id=\"preparacion-previa-y-logistica-seminario-del-chat-al-agente-\">Preparación previa y logística — Seminario «Del chat al agente: qué es un harness y cómo se usa»</h1>\n<p>Este documento tiene <strong>tres partes</strong> y cada una es para un público distinto:</p>\n<ul>\n<li><strong>Parte A</strong> — Mensaje listo para copiar y enviar a los alumnos 3-5 días antes.</li>\n<li><strong>Parte B</strong> — Guía de instalación paso a paso, para tener a mano durante el seminario.</li>\n<li><strong>Parte C</strong> — Lista de comprobación del instructor (día anterior y día del seminario).</li>\n</ul>\n<p>La herramienta del seminario es <strong>DeepSeek Harness</strong> (<code>dsh</code>), un <em>harness</em> de agentes de DeepSeek AI.\nUn <strong>harness</strong> es la pieza que convierte un chat en un agente: le da herramientas, permisos, memoria y una carpeta de trabajo.\nEstá en fase <strong>developer preview</strong>: funciona, pero es software experimental y cambia a menudo.</p>\n<hr>\n<h1 id=\"parte-a-mensaje-para-enviar-a-los-alumnos-3-5-dias-antes\">Parte A — Mensaje para enviar a los alumnos (3-5 días antes)</h1>\n<h2 id=\"asunto\">Asunto</h2>\n<p><strong>Seminario «Del chat al agente»: trae el portátil listo (unos 15 minutos de preparación)</strong></p>\n<h2 id=\"cuerpo-del-mensaje\">Cuerpo del mensaje</h2>\n<p>Hola:</p>\n<p>El <strong>[día]</strong> hacemos el seminario <strong>«Del chat al agente: qué es un harness y cómo se usa»</strong>, de 2-3 horas, en <strong>[lugar]</strong>.\nVamos a pasar de usar la IA como un chat que solo responde texto a usarla como un <strong>agente</strong> que trabaja dentro de una carpeta de tu ordenador: lee archivos, los modifica y ejecuta comandos.\nNo hace falta saber programar: todo se hace desde una interfaz web, como una página del navegador.\nTe pedimos que llegues con la preparación hecha, porque son unos 15 minutos y así los dedicamos a practicar en vez de a instalar cosas.</p>\n<h3 id=\"1-requisitos-previos-hazlo-antes-de-venir\">1. Requisitos previos (hazlo antes de venir)</h3>\n<p>Vas a necesitar dos cosas: <strong>Node.js</strong> instalado y una <strong>clave de API de DeepSeek</strong>.\nNode.js es el programa que hace falta para poder arrancar la herramienta.</p>\n<p><strong>En Windows:</strong></p>\n<ol>\n<li>Entra en la web oficial de Node.js y descarga el instalador para Windows.</li>\n<li>Elige la versión marcada como <strong>LTS</strong> (es la versión estable y recomendada; evita la que pone «Current»).</li>\n<li>Ejecuta el instalador y ve dándole a <strong>Siguiente</strong> con las opciones que vienen por defecto.</li>\n<li>Abre el <strong>menú Inicio</strong>, escribe <code>PowerShell</code> o <code>Terminal</code> y ábrelo.</li>\n<li>Escribe <code>node -v</code> y pulsa <strong>Intro</strong>. Si aparece un número de versión, está bien instalado.</li>\n</ol>\n<p><strong>En macOS:</strong></p>\n<ol>\n<li>Entra en la web oficial de Node.js y descarga el instalador para macOS.</li>\n<li>Elige la versión marcada como <strong>LTS</strong> (la estable; no la «Current»).</li>\n<li>Abre el archivo descargado y completa el instalador con las opciones por defecto.</li>\n<li>Pulsa <strong>Cmd + Espacio</strong>, escribe <code>Terminal</code> y ábrelo.</li>\n<li>Escribe <code>node -v</code> y pulsa <strong>Intro</strong>. Si aparece un número de versión, está bien instalado.</li>\n</ol>\n<p><strong>Si el paso 5 no muestra ninguna versión</strong>, cierra la terminal, ábrela otra vez y repite. Si sigue sin funcionar, escríbeme antes del seminario.</p>\n<h3 id=\"2-consigue-tu-clave-de-api-de-deepseek\">2. Consigue tu clave de API de DeepSeek</h3>\n<ol>\n<li>Entra en <a href=\"https://platform.deepseek.com/\">https://platform.deepseek.com/</a> y <strong>regístrate</strong> con tu correo.</li>\n<li>Crea una <strong>clave de API</strong> desde tu cuenta y cópiala en un sitio seguro.</li>\n<li>Ten en cuenta que el uso de la API <strong>tiene coste</strong> (suele ser pequeño para una práctica, pero es de pago, no es gratis).</li>\n<li>Hazlo <strong>con antelación</strong>: a veces la plataforma pide verificar la cuenta y eso puede tardar un rato.</li>\n</ol>\n<blockquote>\n<p>Una <strong>clave de API</strong> es como una contraseña larga que identifica tu cuenta. No la compartas con nadie ni la subas a internet.</p>\n</blockquote>\n<h3 id=\"3-comprobacion-final-arranca-el-harness-y-cierralo\">3. Comprobación final: arranca el harness y ciérralo</h3>\n<p>Hazlo tú solo antes de venir. Sirve para confirmar que todo está en su sitio y para que no sea la primera vez delante del grupo.</p>\n<ol>\n<li><p>Abre la terminal (los pasos de arriba).</p>\n</li>\n<li><p>Escribe este comando y pulsa <strong>Intro</strong>:</p>\n<pre><code>npx @deepseek-ai/dsh web\n</code></pre>\n</li>\n<li><p>La primera vez tardará un poco: está <strong>descargando</strong> la herramienta. Es normal.</p>\n</li>\n<li><p>Cuando termine, <strong>la interfaz se abre sola en tu navegador</strong>, en la dirección <strong><a href=\"http://127.0.0.1:3080\">http://127.0.0.1:3080</a></strong>.</p>\n</li>\n<li><p>Si no se abre sola, copia esa dirección en el navegador y pulsa Intro.</p>\n</li>\n<li><p><strong>Para parar el servidor</strong>, cierra la ventana de la terminal o pulsa <strong>Ctrl + C</strong> en la terminal.\nSi cierras solo la pestaña del navegador, el servidor <strong>sigue funcionando</strong> en segundo plano.</p>\n</li>\n</ol>\n<h3 id=\"que-traer\">Qué traer</h3>\n<ul>\n<li><strong>Portátil con su cargador</strong> (el seminario es práctico, no hay equipos de sobra).</li>\n<li><strong>Permisos de administrador</strong> en el portátil, por si hay que instalar algo.</li>\n<li><strong>Una carpeta con archivos de ejemplo</strong> con los que practicar: notas, textos, hojas de cálculo, algún PDF… lo que uses normalmente.</li>\n<li><strong>Sin datos confidenciales</strong> en esa carpeta. Nada de documentos de clientes, nóminas, historiales médicos ni cosas parecidas.</li>\n<li><strong>La clave de API a mano</strong>, para no perder tiempo buscándola.</li>\n<li>Si puedes, <strong>una copia de seguridad</strong> de la carpeta de práctica (una copia en el pendrive o en la nube).</li>\n</ul>\n<h3 id=\"si-algo-no-funciona\">Si algo no funciona</h3>\n<ul>\n<li><strong>Respira: es lo más normal del mundo.</strong> Un mensaje de error en la terminal casi nunca significa que hayas roto nada; significa que falta un paso o que hay que repetirlo.</li>\n<li><strong>Casi todo se arregla cerrando la terminal y volviendo a abrirla.</strong> Si el comando no se reconoce, suele ser que Node.js no quedó bien instalado o que la terminal es la de antes de instalarlo.</li>\n<li><strong>El primer arranque tarda.</strong> Si parece que no pasa nada, espera un poco antes de tocar nada. La primera vez tiene que descargar la herramienta.</li>\n<li><strong>No te quedes atascado en silencio.</strong> Escríbeme antes del seminario con lo que ves en pantalla (una foto o el texto del error vale) y lo miramos entre los dos. Es mucho mejor resolverlo por correo que perder la primera media hora del taller.</li>\n</ul>\n<h3 id=\"aviso-importante-sobre-seguridad-leelo-en-serio\">Aviso importante sobre seguridad (léelo, en serio)</h3>\n<p>La herramienta es <strong>software experimental, en fase de desarrollo</strong>. Eso tiene consecuencias prácticas:</p>\n<ul>\n<li>El agente <strong>va a poder leer y modificar archivos de la carpeta de trabajo</strong> que le indiques.</li>\n<li>También <strong>va a poder ejecutar comandos</strong> en tu ordenador, dentro de los límites que le pongamos.</li>\n<li>Hay opciones de <strong>permisos</strong>: se puede limitar a solo leer, a escribir únicamente en la carpeta de trabajo, o darle acceso total; y por defecto <strong>te pregunta antes</strong> de hacer cosas sensibles. Lo veremos en el seminario.</li>\n<li>Aun así, <strong>esas barreras reducen el riesgo, pero no lo eliminan</strong>. No son una garantía de aislamiento.</li>\n<li>Por eso: <strong>haz copia de seguridad de todo lo que uses en la práctica</strong> y <strong>no uses documentos confidenciales ni datos de clientes</strong>.</li>\n</ul>\n<p>Nos vemos el <strong>[día]</strong>. Si tienes cualquier duda, escríbeme sin problema.</p>\n<p>Un saludo,\n<strong>[nombre del instructor]</strong></p>\n<hr>\n<h1 id=\"parte-b-guia-de-instalacion-paso-a-paso\">Parte B — Guía de instalación paso a paso</h1>\n<p>Para usar durante el seminario. Sigue los pasos en orden. Si algo falla, no pasa nada: repite el paso y, si sigue fallando, avisa.</p>\n<h2 id=\"paso-0-que-es-la-terminal-en-una-frase\">Paso 0. Qué es «la terminal» (en una frase)</h2>\n<p>La <strong>terminal</strong> es una ventana donde escribes órdenes en texto en lugar de hacer clic en botones. Se usa porque muchas herramientas se arrancan escribiendo un comando. No hay que saber nada más que lo que pone aquí.</p>\n<h2 id=\"paso-1-abrir-la-terminal\">Paso 1. Abrir la terminal</h2>\n<p><strong>En Windows:</strong></p>\n<ol>\n<li>Pulsa la tecla <strong>Windows</strong> o haz clic en <strong>Inicio</strong>.</li>\n<li>Escribe <code>PowerShell</code> (o <code>Terminal</code>).</li>\n<li>Haz clic en el resultado para abrirla.</li>\n<li>Se abre una ventana con fondo oscuro y un texto que acaba en <code>&gt;</code>. Ese texto se llama <strong>indicador</strong> y significa «escríbeme».</li>\n</ol>\n<p><strong>En macOS:</strong></p>\n<ol>\n<li>Pulsa <strong>Cmd + Espacio</strong> para abrir Spotlight.</li>\n<li>Escribe <code>Terminal</code>.</li>\n<li>Pulsa <strong>Intro</strong> para abrirla.</li>\n<li>Se abre una ventana con fondo blanco o negro y un texto que acaba en <code>$</code> o <code>%</code>.</li>\n</ol>\n<h2 id=\"paso-2-comprobar-que-nodejs-esta-instalado\">Paso 2. Comprobar que Node.js está instalado</h2>\n<ol>\n<li><p>En la terminal, escribe:</p>\n<pre><code>node -v\n</code></pre>\n<p>Pulsa <strong>Intro</strong>.</p>\n</li>\n<li><p>Debe aparecer un número de versión (algo como <code>v22.</code> seguido de más números). <strong>Si aparece el número, Node.js está listo.</strong></p>\n</li>\n<li><p>Si en su lugar sale un mensaje diciendo que el comando no se reconoce o no se encuentra, Node.js <strong>no está instalado</strong> o la terminal es antigua:</p>\n<ul>\n<li>Cierra la terminal.</li>\n<li>Instala Node.js desde la web oficial eligiendo la versión <strong>LTS</strong>.</li>\n<li>Vuelve a abrir la terminal y repite <code>node -v</code>.</li>\n</ul>\n</li>\n</ol>\n<h2 id=\"paso-3-arrancar-el-harness\">Paso 3. Arrancar el harness</h2>\n<ol>\n<li><p>Decide desde qué <strong>carpeta</strong> vas a lanzarlo. Esa carpeta será el <strong>espacio de trabajo propuesto</strong> por defecto, así que lo más cómodo es situarse en la carpeta de práctica.</p>\n</li>\n<li><p>Escribe el comando:</p>\n<pre><code>npx @deepseek-ai/dsh web\n</code></pre>\n</li>\n<li><p>Pulsa <strong>Intro</strong>.</p>\n</li>\n<li><p><strong>La primera vez tarda</strong>: está descargando la herramienta. Verás movimiento en pantalla. Espera.</p>\n</li>\n<li><p>Cuando termina, <strong>se abre sola una pestaña del navegador</strong> con la interfaz.</p>\n</li>\n</ol>\n<h2 id=\"paso-4-elegir-el-espacio-de-trabajo-el-primer-tropiezo\">Paso 4. Elegir el espacio de trabajo (el primer tropiezo)</h2>\n<p>Este es el punto donde casi todo el mundo se atasca, así que ve con calma.</p>\n<ol>\n<li>En la interfaz, busca el botón <strong>«Elegir espacio de trabajo»</strong> (Choose workspace).</li>\n<li>Pulsa <strong>añadir</strong> y selecciona la <strong>carpeta del proyecto</strong> con la que quieras trabajar.</li>\n<li>Selecciona esa carpeta para dejarla activa.</li>\n<li><strong>Importante:</strong> hasta que no elijas un espacio de trabajo, <strong>el cuadro donde se escriben los mensajes está deshabilitado</strong>. No es un fallo: es que el agente todavía no sabe en qué carpeta trabajar.</li>\n</ol>\n<h2 id=\"paso-5-configurar-el-modelo-y-la-clave-de-api\">Paso 5. Configurar el modelo y la clave de API</h2>\n<ol>\n<li>Abre <strong>Ajustes</strong> (Settings).</li>\n<li>Entra en <strong>Modelos</strong> (Models).</li>\n<li>Introduce tu <strong>clave de API de DeepSeek</strong>.</li>\n<li><strong>Guarda</strong>.</li>\n<li>No hace falta reiniciar nada: queda usable al momento.</li>\n</ol>\n<h2 id=\"paso-6-primer-mensaje-de-prueba\">Paso 6. Primer mensaje de prueba</h2>\n<ol>\n<li>Comprueba que el <strong>cuadro de mensajes está habilitado</strong> (si no lo está, vuelve al Paso 4).</li>\n<li>Escribe algo sencillo y sin riesgo, por ejemplo: <em>«Dime qué archivos hay en esta carpeta y resúmelos»</em>.</li>\n<li>Envía y observa qué pasa. Si el agente pide permiso para algo, decide tú si lo autorizas.</li>\n</ol>\n<h2 id=\"paso-7-parar-el-harness\">Paso 7. Parar el harness</h2>\n<ul>\n<li><strong>Opción 1:</strong> cierra la ventana de la terminal.</li>\n<li><strong>Opción 2:</strong> haz clic en la terminal y pulsa <strong>Ctrl + C</strong>.</li>\n</ul>\n<p>Cerrar solo la pestaña del navegador <strong>no</strong> para el servidor.</p>\n<h2 id=\"paso-8-volver-a-arrancarlo-si-se-cerro\">Paso 8. Volver a arrancarlo si se cerró</h2>\n<ol>\n<li><p>Abre la terminal.</p>\n</li>\n<li><p>Vuelve a escribir:</p>\n<pre><code>npx @deepseek-ai/dsh web\n</code></pre>\n</li>\n<li><p>Pulsa <strong>Intro</strong>. La segunda vez arranca mucho más rápido, porque ya está descargado.</p>\n</li>\n<li><p>Si el navegador no se abre solo, entra en <strong><a href=\"http://127.0.0.1:3080\">http://127.0.0.1:3080</a></strong>.</p>\n</li>\n</ol>\n<h2 id=\"como-saber-que-esta-funcionando\">Cómo saber que está funcionando</h2>\n<ul>\n<li>En la terminal aparece la <strong>dirección local</strong> (<code>127.0.0.1:3080</code>).</li>\n<li>El navegador muestra la <strong>interfaz</strong> del harness.</li>\n<li>Puedes <strong>escribir en el cuadro de mensajes</strong> (después de elegir espacio de trabajo).</li>\n<li>Si el agente responde, el modelo está bien configurado.</li>\n</ul>\n<p>Con esos cuatro puntos, todo está en orden.</p>\n<h2 id=\"que-significa-lo-que-ves-en-pantalla\">Qué significa lo que ves en pantalla</h2>\n<p>Al arrancar aparecen varias líneas que asustan a quien no está acostumbrado. Traducción al lenguaje llano:</p>\n<table>\n<thead>\n<tr>\n<th>Lo que ves</th>\n<th>Qué significa de verdad</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Líneas que van apareciendo al principio</td>\n<td>Está <strong>descargando</strong> la herramienta porque es la primera vez. Es normal, solo pasa la primera vez.</td>\n</tr>\n<tr>\n<td>Avisos y mensajes de advertencia</td>\n<td>Suelen ser <strong>informativos</strong>. No son errores y no hay que hacer nada.</td>\n</tr>\n<tr>\n<td>La dirección <code>http://127.0.0.1:3080</code></td>\n<td>Es la <strong>dirección local</strong>: <code>127.0.0.1</code> significa «este mismo ordenador». Es la página que acabas de abrir.</td>\n</tr>\n<tr>\n<td>La terminal se queda «parada», sin devolverte el indicador</td>\n<td>Es lo correcto: el servidor está <strong>funcionando</strong> y ocupando esa ventana.</td>\n</tr>\n<tr>\n<td>Aparece un texto en rojo</td>\n<td>Puede ser un error real, pero normalmente dice <strong>qué falta</strong>. Cópialo y avisa.</td>\n</tr>\n</tbody></table>\n<p><strong>Idea clave:</strong> mientras la terminal esté ocupada con el servidor, no puedes escribir otros comandos ahí. Abre otra ventana de terminal si necesitas una.</p>\n<h2 id=\"alternativa-instalacion-permanente\">Alternativa: instalación permanente</h2>\n<p>En lugar de usar <code>npx</code> cada vez, puedes instalar la herramienta en el ordenador:</p>\n<ol>\n<li><p>Escribe:</p>\n<pre><code>npm install -g @deepseek-ai/dsh\n</code></pre>\n</li>\n<li><p>Pulsa <strong>Intro</strong> y espera a que termine.</p>\n</li>\n<li><p>A partir de ahí, para arrancar basta con:</p>\n<pre><code>dsh web\n</code></pre>\n</li>\n</ol>\n<p><strong>Diferencias entre las dos formas:</strong></p>\n<ul>\n<li>Con <strong><code>npx @deepseek-ai/dsh web</code></strong> no instalas nada de forma permanente: se descarga y se ejecuta cuando lo pides. Es lo recomendado para el seminario, porque no toca tu sistema.</li>\n<li>Con <strong><code>npm install -g</code></strong> la instalación se queda en el ordenador, así que arrancar después es más rápido y el comando es más corto (<code>dsh web</code>). A cambio, actualizarla luego es cosa tuya.</li>\n<li>En un equipo <strong>ajeno o prestado</strong>, usa <code>npx</code>.</li>\n</ul>\n<h2 id=\"verificacion-final-antes-de-seguir\">Verificación final antes de seguir</h2>\n<p>Confirma estos seis puntos antes de continuar con la práctica:</p>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Node.js presente</strong>: <code>node -v</code> muestra un número de versión.</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Servidor arrancado</strong>: el comando ha terminado y la terminal está ocupada con el servidor.</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Interfaz abierta</strong>: ves la interfaz en el navegador, en <a href=\"http://127.0.0.1:3080\">http://127.0.0.1:3080</a>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Clave de API guardada</strong>: Ajustes → Modelos, con la clave introducida y guardada.</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Espacio de trabajo elegido</strong>: has añadido y seleccionado tu carpeta.</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Cuadro de mensajes habilitado</strong>: puedes escribir y enviar.</li>\n</ul>\n<p>Si los seis están marcados, estás listo. Si falla el quinto, es el tropiezo habitual: vuelve al Paso 4.</p>\n<hr>\n<h1 id=\"parte-c-lista-de-comprobacion-del-instructor\">Parte C — Lista de comprobación del instructor</h1>\n<h2 id=\"el-dia-anterior\">El día anterior</h2>\n<table>\n<thead>\n<tr>\n<th>Tarea</th>\n<th>Hecho</th>\n<th>Notas</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Confirmar asistentes y la versión de sistema operativo de cada uno (Windows o macOS)</td>\n<td>☐</td>\n<td>Saber cuántos son de cada sistema cambia las explicaciones.</td>\n</tr>\n<tr>\n<td>Enviar el mensaje de la Parte A a todos los asistentes</td>\n<td>☐</td>\n<td>Idealmente 3-5 días antes; nunca más tarde del día anterior.</td>\n</tr>\n<tr>\n<td>Preparar una carpeta de práctica de ejemplo, con archivos de prueba y sin datos sensibles</td>\n<td>☐</td>\n<td>Textos, notas y algún documento sin información real.</td>\n</tr>\n<tr>\n<td>Hacer una copia de seguridad de esa carpeta</td>\n<td>☐</td>\n<td>Es la red de seguridad si el agente modifica algo en la demo.</td>\n</tr>\n<tr>\n<td>Comprobar la red de la sala y si hay proxy o cortafuegos corporativo</td>\n<td>☐</td>\n<td>Un proxy puede impedir la descarga inicial de la herramienta.</td>\n</tr>\n<tr>\n<td>Reservar y probar el puerto <strong>3080</strong> en el equipo del instructor</td>\n<td>☐</td>\n<td>Si está ocupado por otro programa, el arranque falla.</td>\n</tr>\n<tr>\n<td>Tener una clave de API propia de reserva para las demos</td>\n<td>☐</td>\n<td>Evita que una demo dependa de la clave de un alumno.</td>\n</tr>\n<tr>\n<td>Preparar el plan B sin conexión: capturas de pantalla o un vídeo corto</td>\n<td>☐</td>\n<td>Cubre el caso de que la red de la sala falle.</td>\n</tr>\n<tr>\n<td>Preparar la encuesta de satisfacción (enlace o papel)</td>\n<td>☐</td>\n<td>Mejor tenerla lista que improvisarla al final.</td>\n</tr>\n</tbody></table>\n<h2 id=\"el-dia-del-seminario\">El día del seminario</h2>\n<table>\n<thead>\n<tr>\n<th>Tarea</th>\n<th>Hecho</th>\n<th>Notas</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Probar la demo completa de principio a fin en el equipo que se va a usar</td>\n<td>☐</td>\n<td>Con la clave de reserva, no con la tuya personal.</td>\n</tr>\n<tr>\n<td>Llevar alargadores y regletas</td>\n<td>☐</td>\n<td>Los portátiles no aguantan 3 horas sin corriente.</td>\n</tr>\n<tr>\n<td>Comprobar el proyector y el tamaño de letra</td>\n<td>☐</td>\n<td>Sube el tamaño: en la terminal pequeña nadie lee nada.</td>\n</tr>\n<tr>\n<td>Tener el material y los ejercicios en la nube o en un pendrive</td>\n<td>☐</td>\n<td>Dos vías, no una.</td>\n</tr>\n<tr>\n<td>Decidir qué hacer con quien no consiga arrancar: emparejarlo con alguien que sí</td>\n<td>☐</td>\n<td>No dejar a nadie parado media hora mirando la pantalla.</td>\n</tr>\n</tbody></table>\n<h2 id=\"plan-b-si-la-sala-se-cae\">Plan B: si la sala se cae</h2>\n<p>Ordenado de menos a más grave. Se aplica el primero que resuelva el problema:</p>\n<ol>\n<li><strong>Un alumno no arranca, los demás sí.</strong> Se le empareja con un compañero que ya lo tiene funcionando y sigue mirando por encima del hombro. Tú no te paras.</li>\n<li><strong>La red de la sala falla o va muy lenta.</strong> Se pasa a <strong>demo guiada por el instructor</strong>: tú haces los pasos en tu equipo y el grupo sigue y pregunta; la práctica se hace después en casa.</li>\n<li><strong>Nadie consigue arrancar</strong> (red caída, proxy, cortafuegos). Se usa el <strong>plan B sin conexión</strong>: capturas o el vídeo preparado, y se dedica el tiempo a entender <strong>qué es un harness</strong>, sus permisos, sus herramientas y el MCP.</li>\n<li><strong>Fallo total</strong> (sin proyector, sin red, sin equipos). Se convierte en <strong>sesión de conceptos</strong>: qué cambia entre un chat y un agente, qué son los permisos y los modos de sandbox, y qué se conecta con MCP. La instalación y la práctica quedan como <strong>tarea para casa</strong>, con el mensaje de la Parte A y esta guía.</li>\n</ol>\n","texto":"Antes de venir 14 min de lectura Documento 07 Preparación previa y logística — Seminario «Del chat al agente: qué es un harness y cómo se usa» Este documento tiene tres partes y cada una es para un público distinto: Parte A — Mensaje listo para copiar y enviar a los alumnos 3-5 días antes. Parte B — Guía de instalación paso a paso, para tener a mano durante el seminario. Parte C — Lista de comprobación del instructor (día anterior y día del seminario). La herramienta del seminario es DeepSeek Harness ( dsh ), un harness de agentes de DeepSeek AI. Un harness es la pieza que convierte un chat en un agente: le da herramientas, permisos, memoria y una carpeta de trabajo. Está en fase developer preview : funciona, pero es software experimental y cambia a menudo. Parte A — Mensaje para enviar a los alumnos (3-5 días antes) Asunto Seminario «Del chat al agente»: trae el portátil listo (unos 15 minutos de preparación) Cuerpo del mensaje Hola: El [día] hacemos el seminario «Del chat al agente: qué es un harness y cómo se usa» , de 2-3 horas, en [lugar] . Vamos a pasar de usar la IA como un chat que solo responde texto a usarla como un agente que trabaja dentro de una carpeta de tu ordenador: lee archivos, los modifica y ejecuta comandos. No hace falta saber programar: todo se hace desde una interfaz web, como una página del navegador. Te pedimos que llegues con la preparación hecha, porque son unos 15 minutos y así los dedicamos a practicar en vez de a instalar cosas. 1. Requisitos previos (hazlo antes de venir) Vas a necesitar dos cosas: Node.js instalado y una clave de API de DeepSeek . Node.js es el programa que hace falta para poder arrancar la herramienta. En Windows: Entra en la web oficial de Node.js y descarga el instalador para Windows. Elige la versión marcada como LTS (es la versión estable y recomendada; evita la que pone «Current»). Ejecuta el instalador y ve dándole a Siguiente con las opciones que vienen por defecto. Abre el menú Inicio , escribe PowerShell o Terminal y ábrelo. Escribe node -v y pulsa Intro . Si aparece un número de versión, está bien instalado. En macOS: Entra en la web oficial de Node.js y descarga el instalador para macOS. Elige la versión marcada como LTS (la estable; no la «Current»). Abre el archivo descargado y completa el instalador con las opciones por defecto. Pulsa Cmd + Espacio , escribe Terminal y ábrelo. Escribe node -v y pulsa Intro . Si aparece un número de versión, está bien instalado. Si el paso 5 no muestra ninguna versión , cierra la terminal, ábrela otra vez y repite. Si sigue sin funcionar, escríbeme antes del seminario. 2. Consigue tu clave de API de DeepSeek Entra en https://platform.deepseek.com/ y regístrate con tu correo. Crea una clave de API desde tu cuenta y cópiala en un sitio seguro. Ten en cuenta que el uso de la API tiene coste (suele ser pequeño para una práctica, pero es de pago, no es gratis). Hazlo con antelación : a veces la plataforma pide verificar la cuenta y eso puede tardar un rato. Una clave de API es como una contraseña larga que identifica tu cuenta. No la compartas con nadie ni la subas a internet. 3. Comprobación final: arranca el harness y ciérralo Hazlo tú solo antes de venir. Sirve para confirmar que todo está en su sitio y para que no sea la primera vez delante del grupo. Abre la terminal (los pasos de arriba). Escribe este comando y pulsa Intro : npx @deepseek-ai/dsh web La primera vez tardará un poco: está descargando la herramienta. Es normal. Cuando termine, la interfaz se abre sola en tu navegador , en la dirección http://127.0.0.1:3080 . Si no se abre sola, copia esa dirección en el navegador y pulsa Intro. Para parar el servidor , cierra la ventana de la terminal o pulsa Ctrl + C en la terminal. Si cierras solo la pestaña del navegador, el servidor sigue funcionando en segundo plano. Qué traer Portátil con su cargador (el seminario es práctico, no hay equipos de sobra). Permisos de administrador en el portátil, por si hay que instalar algo. Una carpeta con archivos de ejemplo con los que practicar: notas, textos, hojas de cálculo, algún PDF… lo que uses normalmente. Sin datos confidenciales en esa carpeta. Nada de documentos de clientes, nóminas, historiales médicos ni cosas parecidas. La clave de API a mano , para no perder tiempo buscándola. Si puedes, una copia de seguridad de la carpeta de práctica (una copia en el pendrive o en la nube). Si algo no funciona Respira: es lo más normal del mundo. Un mensaje de error en la terminal casi nunca significa que hayas roto nada; significa que falta un paso o que hay que repetirlo. Casi todo se arregla cerrando la terminal y volviendo a abrirla. Si el comando no se reconoce, suele ser que Node.js no quedó bien instalado o que la terminal es la de antes de instalarlo. El primer arranque tarda. Si parece que no pasa nada, espera un poco antes de tocar nada. La primera vez tiene que descargar la herramienta. No te quedes atascado en silencio. Escríbeme antes del seminario con lo que ves en pantalla (una foto o el texto del error vale) y lo miramos entre los dos. Es mucho mejor resolverlo por correo que perder la primera media hora del taller. Aviso importante sobre seguridad (léelo, en serio) La herramienta es software experimental, en fase de desarrollo . Eso tiene consecuencias prácticas: El agente va a poder leer y modificar archivos de la carpeta de trabajo que le indiques. También va a poder ejecutar comandos en tu ordenador, dentro de los límites que le pongamos. Hay opciones de permisos : se puede limitar a solo leer, a escribir únicamente en la carpeta de trabajo, o darle acceso total; y por defecto te pregunta antes de hacer cosas sensibles. Lo veremos en el seminario. Aun así, esas barreras reducen el riesgo, pero no lo eliminan . No son una garantía de aislamiento. Por eso: haz copia de seguridad de todo lo que uses
